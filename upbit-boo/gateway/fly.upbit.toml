# Dedicated Upbit Boo gateway. Deploy as a separate Fly app with its own static egress IP.
# Secrets (Upbit keys, Supabase keys, gateway token) must be set through the deployment secret store.

primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  UPBIT_BASE_URL = "https://api.upbit.com"
  SCHEDULER_ENABLED = "true"
  AUTO_SCAN_INTERVAL_SECONDS = "12"
  AUTO_MONITOR_INTERVAL_SECONDS = "2"
  LOB_COLD_START_SCAN_SECONDS = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
