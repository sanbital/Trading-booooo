# fly.toml app configuration file generated for trading-booooo on 2026-07-25T10:14:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trading-booooo'
primary_region = 'cdg'

[build]

[env]
  PORT = '8080'

[processes]
  app = 'run -A ./main.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
