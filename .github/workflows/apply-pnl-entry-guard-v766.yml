name: Apply v7.6.6 PnL and entry guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-pnl-entry-guard-v766.yml"
      - "scripts/apply_pnl_entry_guard_v766.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pnl-entry-guard-v766
  cancel-in-progress: false

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Apply minimal accounting and entry patch
        run: |
          set -euo pipefail
          python3 scripts/apply_pnl_entry_guard_v766.py
          deno fmt \
            supabase/functions/market-autotrader/exposure-ledger.ts \
            supabase/functions/market-autotrader/exposure-ledger.test.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/entry.ts

      - name: Review 1 - source and policy isolation
        run: |
          set -euo pipefail
          grep -q 'markPrice?: number | null' supabase/functions/market-autotrader/exposure-ledger.ts
          grep -q 'markedCostBasisQuote' supabase/functions/market-autotrader/exposure-ledger.ts
          grep -q 'liveMark.markedCostBasisQuote' supabase/functions/market-autotrader/index.ts
          grep -q 'DEFAULT_BLOCKED_LOB_PATTERNS: string\[\] = \["MOMENTUM_CONTINUATION"\]' supabase/functions/_shared/lob/entry.ts
          grep -q 'firstTakeProfitRoePct: 15' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'firstStopLossRoePct: -12' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualProfitFloorRoePct: 9' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualTrailingDrawdownRoePct: 4.5' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'firstTakeProfitFraction: 0.5' supabase/functions/market-autotrader/futures-exit-policy.ts

      - name: Review 2 - tests and static checks
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/market-autotrader/exposure-ledger.ts \
            supabase/functions/market-autotrader/exposure-ledger.test.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/entry.ts
          deno test supabase/functions/market-autotrader/exposure-ledger.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno test supabase/functions/market-autotrader/spot-exit-policy.test.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts

      - name: Commit canonical production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/market-autotrader/exposure-ledger.ts \
            supabase/functions/market-autotrader/exposure-ledger.test.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/entry.ts
          if git diff --cached --quiet; then
            echo "Canonical source already contains v7.6.6 guard"
          else
            git commit -m "fix: correct futures marked pnl and block weak momentum entries"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve entry state and pause new entries during rollout
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          previous=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c \
            "select coalesce(pause_new_entries,false)::text from public.trading_settings where id=1")
          previous=${previous:-true}
          echo "PREVIOUS_PAUSE_NEW_ENTRIES=${previous}" >> "${GITHUB_ENV}"
          echo "ROLLOUT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=true, updated_at=now() where id=1"

      - name: Deploy scanner and autotrader atomically under entry pause
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          supabase functions deploy market-scanner \
            --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api

      - name: Review 3 - production accounting and runtime health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Existing positions are monitored while new entries are paused. Wait until at
          # least one post-rollout monitor cycle refreshes their marked PnL.
          refreshed=false
          for attempt in $(seq 1 24); do
            latest_monitor=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c \
              "select coalesce(max(started_at)::text,'') from public.trading_cycle_runs where kind='MONITOR' and started_at >= '${ROLLOUT_STARTED_AT}'::timestamptz")
            bad_futures=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select count(*)
              from public.trading_positions
              where exchange='binance_futures'
                and state in ('OPEN','EXITING','RECONCILING')
                and coalesce(initial_quantity,0) > 0
                and coalesce(average_entry_price,0) > 0
                and abs(coalesce(marked_pnl_quote,0)) > greatest(10, initial_quantity * average_entry_price * 0.25);")
            if [ -n "${latest_monitor}" ] && [ "${bad_futures}" = "0" ]; then
              refreshed=true
              break
            fi
            sleep 5
          done
          test "${refreshed}" = "true"

          failures=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
            select count(*) from public.trading_cycle_runs
            where started_at >= '${ROLLOUT_STARTED_AT}'::timestamptz
              and status='FAILED';")
          test "${failures}" = "0"

          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c "
            select market, exchange, state, leverage,
                   round(marked_pnl_quote::numeric,6) as marked_pnl_quote,
                   round((metadata->'live_mark'->>'fee_net_return_pct')::numeric,4) as fee_net_return_pct
            from public.trading_positions
            where exchange='binance_futures' and state in ('OPEN','EXITING','RECONCILING')
            order by opened_at desc nulls last limit 5;"

      - name: Restore prior entry-pause state
        if: always() && env.PREVIOUS_PAUSE_NEW_ENTRIES != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          case "${PREVIOUS_PAUSE_NEW_ENTRIES}" in
            true|t|1) restore=true ;;
            false|f|0) restore=false ;;
            *) restore=true ;;
          esac
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=${restore}, updated_at=now() where id=1"
          echo "Restored pause_new_entries=${restore}"
