name: One-shot readonly postpatch performance audit 1758
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-postpatch-performance-1758.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only performance audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -P pager=off -F '|' -A <<'SQL'
          \echo '===SCHEMA===' 
          select column_name from information_schema.columns where table_schema='public' and table_name='trading_positions' order by ordinal_position;

          \echo '===POST_RAW===' 
          select id,exchange,market,opened_at,closed_at,close_reason,realized_pnl_quote,realized_return_pct,peak_return_pct,mfe_capture_ratio,profit_giveback_pct
          from public.trading_positions
          where is_paper=false
            and closed_at >= timestamptz '2026-08-16 10:16:42+00'
            and closed_at <  timestamptz '2026-08-17 08:58:28+00'
          order by closed_at;

          \echo '===PRE_RAW===' 
          select id,exchange,market,opened_at,closed_at,close_reason,realized_pnl_quote,realized_return_pct,peak_return_pct,mfe_capture_ratio,profit_giveback_pct
          from public.trading_positions
          where is_paper=false
            and closed_at >= timestamptz '2026-08-15 11:34:56+00'
            and closed_at <  timestamptz '2026-08-16 10:16:42+00'
          order by closed_at;

          \echo '===POST_AGG===' 
          with x as (
            select case when exchange='binance_futures' then 'FUTURES' else 'SPOT' end as kind,
                   realized_pnl_quote::numeric pnl,
                   realized_return_pct::numeric ret,
                   mfe_capture_ratio::numeric mfe,
                   profit_giveback_pct::numeric giveback,
                   close_reason
            from public.trading_positions
            where is_paper=false
              and closed_at >= timestamptz '2026-08-16 10:16:42+00'
              and closed_at <  timestamptz '2026-08-17 08:58:28+00'
          )
          select kind,
                 count(*) as trades,
                 count(*) filter (where pnl>0) wins,
                 count(*) filter (where pnl<0) losses,
                 round(sum(pnl),6) pnl,
                 round(avg(ret),6) avg_ret,
                 round(avg(ret) filter(where ret>0),6) avg_win_ret,
                 round(avg(ret) filter(where ret<0),6) avg_loss_ret,
                 count(*) filter(where close_reason in ('HARD_STOP','STOP')) recorded_stops,
                 round(100.0*count(*) filter(where close_reason in ('HARD_STOP','STOP'))/nullif(count(*),0),2) recorded_stop_pct,
                 round(avg(mfe) filter(where mfe is not null),6) avg_mfe_capture,
                 round(avg(giveback) filter(where giveback is not null),6) avg_profit_giveback
          from x group by kind order by kind;

          \echo '===PRE_AGG===' 
          with x as (
            select case when exchange='binance_futures' then 'FUTURES' else 'SPOT' end as kind,
                   realized_pnl_quote::numeric pnl,
                   realized_return_pct::numeric ret,
                   mfe_capture_ratio::numeric mfe,
                   profit_giveback_pct::numeric giveback,
                   close_reason
            from public.trading_positions
            where is_paper=false
              and closed_at >= timestamptz '2026-08-15 11:34:56+00'
              and closed_at <  timestamptz '2026-08-16 10:16:42+00'
          )
          select kind,
                 count(*) as trades,
                 count(*) filter (where pnl>0) wins,
                 count(*) filter (where pnl<0) losses,
                 round(sum(pnl),6) pnl,
                 round(avg(ret),6) avg_ret,
                 round(avg(ret) filter(where ret>0),6) avg_win_ret,
                 round(avg(ret) filter(where ret<0),6) avg_loss_ret,
                 count(*) filter(where close_reason in ('HARD_STOP','STOP')) recorded_stops,
                 round(100.0*count(*) filter(where close_reason in ('HARD_STOP','STOP'))/nullif(count(*),0),2) recorded_stop_pct,
                 round(avg(mfe) filter(where mfe is not null),6) avg_mfe_capture,
                 round(avg(giveback) filter(where giveback is not null),6) avg_profit_giveback
          from x group by kind order by kind;

          \echo '===POST_REASONS===' 
          select case when exchange='binance_futures' then 'FUTURES' else 'SPOT' end kind, close_reason, count(*), round(sum(realized_pnl_quote::numeric),6)
          from public.trading_positions
          where is_paper=false and closed_at >= timestamptz '2026-08-16 10:16:42+00' and closed_at < timestamptz '2026-08-17 08:58:28+00'
          group by 1,2 order by 1,2;
          SQL