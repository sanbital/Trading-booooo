name: One-shot readonly postpatch performance audit 1758
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-postpatch-performance-1758.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect EPIC timeout anomaly read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -P pager=off -F '|' -A <<'SQL'
          \echo '===EPIC_POSITION===' 
          select id,exchange,market,state,average_entry_price,stop_price,target_1,target_2,leverage,opened_at,max_holding_at,absolute_max_holding_at,closed_at,close_reason,realized_pnl_quote,realized_return_pct,peak_return_pct,mfe_capture_ratio,profit_giveback_pct,metadata::text
          from public.trading_positions
          where id='38d4e2af-c838-4633-b3af-17b70b6d5f69';

          \echo '===EPIC_ORDERS===' 
          select id,side,purpose,order_type,requested_price,average_fill_price,executed_volume,executed_funds_quote,paid_fee_quote,requested_at,completed_at,state,error_code,raw_response::text
          from public.trading_orders
          where position_id='38d4e2af-c838-4633-b3af-17b70b6d5f69'
          order by created_at;

          \echo '===EPIC_EVENTS===' 
          select level,code,message,details::text,created_at
          from public.trading_events
          where position_id='38d4e2af-c838-4633-b3af-17b70b6d5f69'
          order by created_at;
          SQL