name: signal-bar-time-parity

on:
  pull_request:
    paths:
      - "supabase/functions/v10-lane-signal-generator/**"
      - "supabase/functions/v14-bear-live/**"
      - "supabase/functions/v14-bear-final-candidate-audit/**"
      - "supabase/functions/v15-range-live/**"
      - "supabase/functions/v15-range-r7-preflight/**"
      - "supabase/functions/signal-bar-time-parity.test.ts"
      - ".github/workflows/signal-bar-time-parity.yml"

permissions:
  contents: read

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Parse Edge Functions
        run: |
          deno check supabase/functions/v10-lane-signal-generator/index.ts
          deno check supabase/functions/v14-bear-live/index.ts
          deno check supabase/functions/v14-bear-final-candidate-audit/index.ts
          deno check supabase/functions/v15-range-live/index.ts
          deno check supabase/functions/v15-range-r7-preflight/index.ts
      - name: Run signal-time regression tests
        run: deno test --allow-read supabase/functions/signal-bar-time-parity.test.ts
