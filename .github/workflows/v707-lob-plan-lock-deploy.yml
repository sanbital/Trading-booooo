name: Apply and deploy v7.0.7 LOB plan lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v707-lob-plan-lock-deploy.yml"

permissions:
  contents: write

jobs:
  patch-verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded patch
        run: python3 scripts/apply_v707_lob_plan_lock.py

      - name: Verify patch and type safety
        run: |
          git diff --check
          deno check supabase/functions/_shared/lob/entry.ts
          deno check supabase/functions/market-autotrader/index.ts
          grep -q '7.0.7-LOB-SCAN-PLAN-LOCK' supabase/functions/market-autotrader/index.ts
          grep -q 'FIXED_SCAN_PLAN_GEOMETRY' supabase/functions/_shared/lob/entry.ts
          grep -q 'fixedTargetBps: fixedPlanTargetBps' supabase/functions/market-autotrader/index.ts

      - name: Commit verified source patch
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-autotrader/index.ts
          git commit -m "fix: lock autotrader to scanner LOB plan geometry"
          git push origin main

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy market-autotrader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy market-autotrader \
            --project-ref etaajwpernzrcdrifdnw \
            --no-verify-jwt
