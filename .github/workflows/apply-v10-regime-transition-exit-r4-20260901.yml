name: Apply V10 Regime Transition Exit R4

on:
  push:
    branches: [main]
    paths:
      - "research/v10-regime-transition-exit-retry-r4.txt"

permissions:
  contents: write

concurrency:
  group: v10-regime-transition-exit-r4-20260901
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded V10 transition-exit patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-v10-regime-transition-exit-20260901.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          payload = workflow[start:end]
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in payload.splitlines()
          )
          exec(compile(payload, '<v10-transition-patch>', 'exec'))
          PY

          deno fmt \
            supabase/functions/_shared/v10_regime_transition.ts \
            supabase/functions/_shared/v10_regime_transition.test.ts \
            supabase/functions/v10-lane-executor/index.ts
          deno test supabase/functions/_shared/v10_regime_transition.test.ts
          deno test supabase/functions/_shared/v10_lane_exit.test.ts

          python3 - <<'PY'
          from pathlib import Path
          source = Path('supabase/functions/v10-lane-executor/index.ts').read_text()
          transition = source.rfind('evaluateV10RegimeTransition')
          assert transition >= 0
          lane_exit = source.find('evaluateV10ExitBar', transition)
          assert lane_exit > transition
          for token in (
              'REGIME_TRANSITION_EXIT',
              'position_effect: "CLOSE"',
              'V10_REGIME_UNKNOWN_ENTRY_BLOCK',
              'V10_REGIME_TRANSITION_REENTRY_COOLDOWN',
              'regimeTransitionExitTriggered',
              'loadV10RegimeSource',
          ):
              assert token in source, token
          helper = Path('supabase/functions/_shared/v10_regime_transition.ts').read_text()
          for token in (
              'V10_REGIME_TRANSITION_LIVE_EXIT_COMPILED',
              'count >= 2',
              'REGIME_UNKNOWN_ENTRY_BLOCK_ONLY',
              'BEAR_REBREAK',
              'BULL_DECELERATING',
          ):
              assert token in helper, token
          PY

      - name: Commit verified production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/v10_regime_transition.ts \
            supabase/functions/_shared/v10_regime_transition.test.ts \
            supabase/functions/v10-lane-executor/index.ts
          git diff --cached --exit-code && { echo "No patch produced"; exit 1; } || true
          git commit -m "Deploy V10 regime transition exit"
          git push origin HEAD:main

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Validate production deploy secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"

      - name: Deploy V10 lane executor to production
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy v10-lane-executor \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api
          supabase functions list --project-ref "${SUPABASE_PROJECT_REF}" | tee /tmp/functions.txt
          grep -q "v10-lane-executor" /tmp/functions.txt
