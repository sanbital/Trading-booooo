name: V26 Binance 30d validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v26-parity-risk-replay-20260919
    paths:
      - 'research/v26-validated/runner-parts/**'
      - '.github/workflows/v26-binance-30d-validation.yml'

permissions:
  contents: write

concurrency:
  group: v26-binance-30d-validation
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BINANCE_FAPI: https://fapi.binance.com
      REPLAY_DAYS: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v26-parity-risk-replay-20260919
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct pinned validator
        shell: bash
        run: |
          set -euo pipefail
          cat research/v26-validated/runner-parts/part*.b64 | base64 --decode             > research/v26-validated/binance-30d-validation.mjs
          node --check research/v26-validated/binance-30d-validation.mjs
          sha256sum research/v26-validated/binance-30d-validation.mjs             | tee research/v26-validated/VALIDATOR_SHA256.txt

      - name: Fresh Binance 30-day replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/v26-validated/results-30d
          node research/v26-validated/binance-30d-validation.mjs             2>&1 | tee research/v26-validated/results-30d/run.log

      - name: Persist compact reproducible result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v26-validated/binance-30d-validation.mjs                   research/v26-validated/VALIDATOR_SHA256.txt                   research/v26-validated/results-30d
          if ! git diff --cached --quiet; then
            git commit -m 'research(v26): save fresh Binance 30d validation results'
            git push origin HEAD:fix/v26-parity-risk-replay-20260919
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-binance-30d-validation
          path: |
            research/v26-validated/VALIDATOR_SHA256.txt
            research/v26-validated/results-30d
          if-no-files-found: warn
          retention-days: 30
