name: Resume RANGE V6 Missing Shards

on:
  push:
    branches:
      - research/range-v6-resume-20260829
    paths:
      - ops/range-v6-resume-trigger.txt

permissions:
  contents: read

concurrency:
  group: range-v6-resume-5261a817
  cancel-in-progress: false

env:
  EDGE_URL: https://etaajwpernzrcdrifdnw.supabase.co/functions/v1/regime-router-v5-research
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  JOB_ID: 5261a817-70ef-4e9c-9902-2c8a5506dc91
  EXPECTED_REVISION: REGIME_ROUTER_V6_RANGE_EDGE_SCORE_15M_120D_RSWF

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resume only missing checkpoints and finalize
        shell: bash
        run: |
          set -euo pipefail
          token=$(psql "$SUPABASE_DB_URL" -XAt -v ON_ERROR_STOP=1 <<'SQL'
          select token from edge_internal_tokens where name = 'market-v2-research';
          SQL
          )
          test "$(printf '%s\n' "$token" | sed '/^$/d' | wc -l)" = "1"
          export RESEARCH_TOKEN="$token"

          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          edge_url = os.environ['EDGE_URL']
          token = os.environ['RESEARCH_TOKEN'].strip()
          job_id = os.environ['JOB_ID']
          expected_revision = os.environ['EXPECTED_REVISION']
          regions = [
              'ap-northeast-2', 'ap-south-1', 'sa-east-1', 'eu-central-1',
              'ap-southeast-2', 'eu-west-1', 'ap-southeast-1',
              'ap-northeast-1', 'ca-central-1', 'eu-west-2', 'eu-west-3',
          ]
          missing = [4, 55, 220, 257, 281, 358, 363, 378, 413, 455, 484, 490, 495, 501, 535, 539, 550]

          def request(payload, region, attempts=8):
              raw = json.dumps(payload, separators=(',', ':')).encode()
              last = None
              for attempt in range(attempts):
                  req = urllib.request.Request(
                      edge_url,
                      data=raw,
                      method='POST',
                      headers={
                          'content-type': 'application/json',
                          'x-v2-research-token': token,
                          'x-region': region,
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=430) as resp:
                          status = resp.status
                          body = resp.read().decode()
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      body = exc.read().decode(errors='replace')
                  except Exception as exc:
                      last = f'{type(exc).__name__}: {exc}'
                      time.sleep(min(45, 3 * (2 ** attempt)))
                      continue
                  try:
                      parsed = json.loads(body)
                  except Exception:
                      parsed = {'ok': False, 'error': body[:1000]}
                  if status == 200 and parsed.get('ok') is True:
                      revision = parsed.get('revision')
                      if revision and revision != expected_revision:
                          raise RuntimeError(f'revision mismatch: {revision}')
                      return parsed
                  last = f'HTTP {status}: {body[:1200]}'
                  time.sleep(min(45, 3 * (2 ** attempt)))
              raise RuntimeError(last or 'edge request failed')

          def run_parallel(label, indices, action, field, workers):
              failures = []
              completed = 0

              def one(index):
                  payload = {'action': action, 'job_id': job_id, field: index}
                  if action == 'backtest_shard_v5':
                      payload['shard_count'] = 600
                  elif action == 'backtest_rollup_v5':
                      payload['rollup_count'] = 60
                  return request(payload, regions[index % len(regions)])

              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
                  futures = {pool.submit(one, index): index for index in indices}
                  for future in concurrent.futures.as_completed(futures):
                      index = futures[future]
                      try:
                          future.result()
                          completed += 1
                          print(f'{label} {completed}/{len(indices)} index={index}', flush=True)
                      except Exception as exc:
                          failures.append((index, str(exc)))
                          print(f'{label} failed index={index}: {exc}', file=sys.stderr, flush=True)
              if failures:
                  raise RuntimeError(f'{label} failures: {failures}')

          initial = request({'action': 'status_v5', 'job_id': job_id}, regions[0], attempts=3)
          if initial.get('complete') is True:
              final = initial
          else:
              run_parallel('backtest-resume', missing, 'backtest_shard_v5', 'shard_index', 2)
              run_parallel('rollup', list(range(60)), 'backtest_rollup_v5', 'rollup_index', 3)
              final = request(
                  {'action': 'status_v5', 'job_id': job_id, 'assert_complete': True},
                  regions[0],
                  attempts=5,
              )

          with open('/tmp/range-v6-resume-final.json', 'w') as output:
              json.dump(final, output)
          print('RANGE_V6_RESUME_FINAL=' + json.dumps({
              'job_id': job_id,
              'complete': final.get('complete'),
              'status': final.get('status'),
              'checkpoint_rows': final.get('checkpoint_rows'),
              'checkpoint_failures': final.get('checkpoint_failures'),
              'robust_candidates': final.get('robust_candidates'),
              'validation_reports': final.get('validation_reports'),
          }, separators=(',', ':')), flush=True)
          PY

      - name: Upload final status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-v6-resume-final
          path: /tmp/range-v6-resume-final.json
          if-no-files-found: warn
          retention-days: 30
