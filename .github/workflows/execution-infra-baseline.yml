name: Verify preserved production v183 baseline
on:
  pull_request:
    branches: [main]
    paths: [deployment-evidence/production-v183-baseline.json, .github/workflows/execution-infra-baseline.yml]
  push:
    branches: [main]
    paths: [deployment-evidence/production-v183-baseline.json]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Match the entire preserved production dependency graph
        run: node ops/execution-infra/verify-baseline.mjs
      - name: Run execution, attribution, protection, dispatch and review integration tests
        run: |
          npm install --prefix "$RUNNER_TEMP/infra-tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/infra-tests/node_modules/@electric-sql/pglite/dist/index.js"
          node --test --test-reporter=tap supabase/functions/v10-lane-executor/*.test.mjs test-support/v17-entry/*.test.mjs test-support/v17-exit/entry-queue.test.mjs test-support/v18-ops/*.test.mjs tests/execution-infrastructure.test.mjs tests/leader20-campaign-lifecycle.test.mjs development/gpt-final-review/tests/reviewer.test.mjs
      - name: Check the exact production graph
        run: deno check --no-config supabase/functions/v10-lane-executor/index.ts
