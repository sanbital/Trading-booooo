name: Execution infrastructure encrypted audit
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      deterministic_preflight:
        description: Read signed account truth and deterministic cutover gates only
        type: boolean
        default: false
      expected_commit:
        description: Required exact source SHA for deterministic preflight
        type: string
        required: false
concurrency:
  group: execution-infrastructure-read-only-observation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'sanbital/Trading-booooo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read production through independent paths and encrypt rollback evidence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
          DETERMINISTIC_PREFLIGHT: ${{ inputs.deterministic_preflight }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if [ "$DETERMINISTIC_PREFLIGHT" = true ]; then
            node ops/deterministic/preflight.mjs
          else
            node ops/execution-infra/audit.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-infra-audit-${{ github.run_id }}
          path: infra-evidence/*.encrypted.json
          retention-days: 7
          if-no-files-found: error
