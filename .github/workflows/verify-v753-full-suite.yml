name: Verify full v7.5.3 trading suite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v753-full-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Full repository validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          deno task check
          deno task test
          node validation/v700-deploy-validation.mjs
          node --check gateway/server.mjs
          node --test gateway/server.test.mjs
