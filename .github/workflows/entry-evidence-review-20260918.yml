name: Entry evidence isolated review
on:
  push:
    branches: [fix/entry-evidence-20260918]
    paths: [tools/entry_evidence_repair_20260918.py]
permissions:
  contents: write
jobs:
  offline-review:
    if: github.ref == 'refs/heads/fix/entry-evidence-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_ENABLED: 'false'
      V17_SHADOW_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply hash-checked source repair
        run: python3 tools/entry_evidence_repair_20260918.py
      - name: Offline regression tests only
        shell: bash
        run: |
          set -euo pipefail
          node --test supabase/functions/v10-lane-executor/entry-evidence.test.mjs gateway/*.test.mjs | tee /tmp/entry-evidence-tests.tap
          deno task test:entry | tee /tmp/entry-existing-tests.tap
          deno test --allow-read supabase/functions/v10-lane-executor/margin-config.test.ts supabase/functions/_shared/boo/*.test.ts | tee /tmp/entry-deno-tests.txt
          git diff --check
      - name: Commit source to review branch only; never modify workflows, merge or deploy
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          target='refs/heads/fix/entry-evidence-20260918'
          test "$GITHUB_REF" = "$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$EXPECTED_HEAD"
          git add -- gateway/server.mjs gateway/futures-mode-evidence.mjs gateway/futures-mode-evidence.test.mjs supabase/functions/v10-lane-executor/index.ts supabase/functions/v10-lane-executor/boo-entry-adapter.mjs supabase/functions/v10-lane-executor/entry-evidence.mjs supabase/functions/v10-lane-executor/entry-evidence.test.mjs docs/entry-evidence-repair-20260918.md test-support/v18-ops/harness.mjs test-support/v17-exit/entry-margin-skip.test.mjs test-support/v17-exit/entry-queue.test.mjs
          git rm -- tools/entry_evidence_repair_20260918.py tools/entry_evidence_payload_1.txt tools/entry_evidence_payload_2.txt tools/entry_evidence_payload_3.txt
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(entry): align trigger deadlines, gateway evidence and final rejection diagnostics'
          git push origin "HEAD:$target"
      - name: Collect reviewed source and test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/entry-evidence-result
          cp /tmp/entry-evidence-tests.tap /tmp/entry-existing-tests.tap /tmp/entry-deno-tests.txt /tmp/entry-evidence-result/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/entry-evidence-result/commit.txt
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('/tmp/entry-evidence-result/source.tar.gz','w:gz') as archive:
              for root in ['gateway','test-support','supabase/functions','.github/workflows']:
                  for p in pathlib.Path(root).rglob('*'):
                      if p.is_file() and p.suffix in {'.mjs','.js','.ts','.json','.yml','.yaml'}:
                          archive.add(p,arcname=str(p),recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-evidence-result
          path: /tmp/entry-evidence-result
          retention-days: 3
