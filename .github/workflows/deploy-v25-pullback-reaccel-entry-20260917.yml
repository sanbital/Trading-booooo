# Release: V17 entry timing -> V17_PULLBACK_REACCEL_ENTRY_1, plus the 30 USDT
# sizing contract that has not reached production yet.
#
# Written for THIS release. The previous workflow
# (deploy-boo-entry-gate-margin30-20260916.yml) correctly REFUSES this change --
# it pins `const MARGIN=30,LEV=3`, asserts no _shared file outside boo/ moved, and
# asserts the signal generator is untouched. All three are false here by design, so
# reusing it would either fail or, worse, have to be weakened to pass.
#
# What this release actually does:
#   - v10-lane-executor stops buying a confirmed leader on sight. It arms a setup,
#     watches up to 15 minutes for a >=0.25% pullback and a +0.25% re-acceleration on
#     COMPLETED 1m candles, and only then places the IOC -- inside 60 seconds of that
#     candle's close. A setup that never triggers creates no order intent at all.
#   - QV3's two-bearish-candle EXIT becomes shadow-only, for NEW positions only.
#     Positions already open keep their stamp and their behaviour.
#   - The 30 USDT / 3x sizing contract lands (it is in the repo but not in prod), and
#     v10-lane-signal-generator is deployed with it so signals stop carrying
#     targetMarginUsdt=40.
#
# TWO functions are deployed. The generator carries the sizing contract version onto
# every signal it writes; deploying the executor alone leaves the two disagreeing
# about what a slot is.
#
# Unchanged, and asserted below: leverage 3x, MAX_SLOTS, maxEntryAgeMs 120s,
# maxEntryDriftPct 1%, E1 maxQuoteAgeMs 1000ms, R5, BOO enforcement, and every
# already-open position.
name: Deploy V25 pullback/re-acceleration entry timing

on:
  workflow_dispatch:
    inputs:
      expected_version_before:
        description: >-
          The v10-lane-executor version this release expects to find in
          production. Pinning it makes a concurrent or unexpected deploy fail
          the release instead of silently landing on top of one.
        required: true
      expected_enforcement:
        description: >-
          The boo_entry_gate_control.enforcement value the operator intends to
          run with (ENFORCE or OBSERVE). The release fails if production
          disagrees, so the trading posture is never a surprise.
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the scope of THIS release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          mkdir -p release-evidence

          # The change this release exists to make: a leader signal cannot buy on sight.
          grep -Fq "import {SETUP_POLICY,SETUP_POLICY_VERSION" \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const armed=startPullbackSetup(' supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'if(state.state!==SETUP_STATE.TRIGGERED)' supabase/functions/v10-lane-executor/index.ts
          # Slot geometry is a view onto the one contract, not a literal.
          grep -Fq 'const MARGIN=SLOT_SIZING_CONTRACT.targetMarginUsdt,LEV=SLOT_SIZING_CONTRACT.leverage,NOTIONAL=MARGIN*LEV;' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'sizingContractVersion:POLICY.sizingContractVersion' \
            supabase/functions/v10-lane-signal-generator/index.ts
          # No literal 40 may survive anywhere in the slot contract.
          # shellcheck disable=SC2251  # the leading ! is a deliberate expected-failure probe; the result is asserted below
          ! grep -Fq 'marginUsdt: 40' supabase/functions/_shared/leader-momentum-v17.mjs
          grep -Fq 'import {BOO_ADAPTER_VERSION,ENFORCEMENT as BOO_ENFORCEMENT' \
            supabase/functions/v10-lane-executor/index.ts
          # Both gate checkpoints must be wired, not just the first.
          grep -Fq 'const booAdmission=await booGate(db,s,"ADMISSION"' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const booPredispatch=await booGate(db,s,"PRE_DISPATCH"' \
            supabase/functions/v10-lane-executor/index.ts
          # The code-vs-DB margin guard must survive this release.
          grep -Fq 'V17_MARGIN_CONFIG_MISMATCH' supabase/functions/v10-lane-executor/index.ts

          # Policies that must NOT change here.
          grep -Fq "policyVersion: 'V17_EXIT_R5_TAIL'" supabase/functions/_shared/leader-exit-review.mjs
          grep -Fq "export const QV3_VERSION='QV3_ENTRY_EXIT_TWO_1'" \
            supabase/functions/_shared/leader-qv3-runtime.mjs
          # QV3's exit is withheld for new positions, not deleted: the rule must still
          # be evaluated, and the shadow must never be able to send a SELL.
          grep -Fq 'async function qv3ShadowOnly(' supabase/functions/v10-lane-executor/index.ts
          python - <<'PY2'
          import re,sys
          src=open('supabase/functions/v10-lane-executor/index.ts').read()
          shadow=src[src.index('async function qv3ShadowOnly('):src.index('async function qv3AfterProtection(')]
          if 'closePos(' in shadow: sys.exit('the QV3 shadow path can close a position')
          for needed in ('wouldClose:','hypotheticalPnlUsdt:','executed:false'):
              if needed not in shadow: sys.exit(f'the QV3 shadow no longer records {needed}')
          PY2
          # An already-open position must not be reachable by the new policy.
          grep -Fq 'entryTiming=rec(intent.request_payload?.entry_timing_policy)' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq "export const ENTRY_EXECUTION_POLICY_VERSION = 'V21_POST_FILL_DRIFT_GUARD_1'" \
            supabase/functions/_shared/leader-momentum-v17.mjs
          # The V24 gate stays present and inert by construction.
          grep -Fq 'return{enabled:false,edge:null,reason:"V24_CONTROL_UNREADABLE"}' \
            supabase/functions/v10-lane-executor/index.ts

          # Blast radius is measured against WHAT IS ACTUALLY RUNNING, not against
          # origin/main. Releases here are cut from main, so once main is advanced to
          # the release SHA a diff against origin/main compares a commit to itself and
          # silently stops guarding anything. PRODUCTION_SOURCE_SHA is the source of
          # executor v48, the revision live in the project right now.
          PRODUCTION_SOURCE_SHA=2666aca9687b4f86a48027984c7834c763b3916d
          git cat-file -e "$PRODUCTION_SOURCE_SHA^{commit}" \
            || { echo "the recorded production source SHA is not in this history"; exit 1; }

          # This release touches a known, closed set of _shared files. Anything else
          # moving there is unreviewed blast radius and fails the release.
          git diff --name-only "$PRODUCTION_SOURCE_SHA" "$GITHUB_SHA" -- supabase/functions/_shared \
            | grep -vE '^supabase/functions/_shared/(boo/|leader-slot-sizing|leader-pullback-reaccel|leader-momentum-v17\.mjs$|leader-exit-r5-contract)' \
            > /tmp/shared-changed.txt || true
          if [ -s /tmp/shared-changed.txt ]; then
            echo "unexpected _shared changes:"; cat /tmp/shared-changed.txt; exit 1
          fi
          # The exit path is explicitly NOT part of this release.
          git diff --quiet "$PRODUCTION_SOURCE_SHA" "$GITHUB_SHA" -- gateway \
            supabase/functions/_shared/leader-exit-review.mjs \
            supabase/functions/_shared/leader-native-protection.mjs \
            supabase/functions/_shared/leader-qv3-rules.mjs \
            supabase/functions/_shared/leader-qv3-runtime.mjs

          git rev-parse HEAD > release-evidence/release-sha.txt
          sha256sum supabase/functions/v10-lane-executor/*.ts \
            supabase/functions/v10-lane-executor/*.mjs \
            supabase/functions/v10-lane-signal-generator/index.ts \
            supabase/functions/_shared/leader-slot-sizing.mjs \
            supabase/functions/_shared/leader-pullback-reaccel.mjs \
            supabase/functions/_shared/leader-momentum-v17.mjs \
            supabase/functions/_shared/boo/*.mjs > release-evidence/source-sha256.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test and type-check the exact graph
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=deno@2.5.6 -- deno test --allow-read \
            supabase/functions/_shared/*.test.ts \
            supabase/functions/_shared/boo/*.test.ts \
            supabase/functions/exchange-trade-sync/*.test.ts \
            supabase/functions/v10-lane-executor/margin-config.test.ts \
            2>&1 | tee release-evidence/tests.txt
          npm exec --yes --package=deno@2.5.6 -- deno check \
            supabase/functions/v10-lane-executor/index.ts

      # The executor's own entry path: the queue scheduling, the openBull gates, and
      # the offline replay of the rejections v48 actually wrote in production. These
      # run the real source rather than a copy of it.
      - name: Replay the entry path against the recorded production rejections
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test-support/v17-entry/*.test.mjs \
            test-support/v17-exit/entry-queue.test.mjs \
            test-support/v17-exit/entry-margin-skip.test.mjs \
            test-support/v17-exit/module-load.test.mjs \
            2>&1 | tee release-evidence/entry-replay.txt

      # The entry-timing policy's own invariants.
      #
      # A leader signal must not be able to buy on sight any more, and the window it
      # is watched for must not have become a longer EXECUTION lifetime. Both are
      # checkable without a market.
      - name: Prove the entry timing replaces the age rule rather than extending it
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # single quotes are deliberate here: the payload is JS/deno source, not shell
          npm exec --yes --package=deno@2.5.6 -- deno eval --quiet '
            import {SETUP_POLICY, SETUP_STATE, startPullbackSetup, advancePullbackSetup,
              entryTriggerFresh, isTerminal}
              from "./supabase/functions/_shared/leader-pullback-reaccel.mjs";
            import {POLICY} from "./supabase/functions/_shared/leader-momentum-v17.mjs";
            const fail = (m) => { console.error("RELEASE_GATE_FAIL: " + m); Deno.exit(1); };
            const MIN = 60000, T0 = Date.parse("2026-09-17T12:00:00.000Z"), REF = 100;
            const bar = (t,o,h,l,c) => [t,String(o),String(h),String(l),String(c),"0",t+MIN-1,"0",0,"0","0","0"];
            const sig = {id:"g",symbol:"TESTUSDT",features:{referenceClose:REF,signal5Close:T0}};

            // 1. The executable window is the TRIGGER TTL, and it is stricter than the
            //    signal age rule it replaces. If this ever inverts, the change has
            //    become a stale-signal extension and must not ship.
            if (!(SETUP_POLICY.entryTriggerTtlMs < POLICY.maxEntryAgeMs))
              fail("the trigger TTL " + SETUP_POLICY.entryTriggerTtlMs + "ms is not stricter than "
                + "the signal age rule " + POLICY.maxEntryAgeMs + "ms it replaces");
            if (SETUP_POLICY.setupTtlMs <= POLICY.maxEntryAgeMs)
              fail("the setup window must be longer than the age rule, or it is pointless");

            // 2. An armed setup is not executable. This is the whole change.
            const armed = startPullbackSetup(sig, T0);
            if (entryTriggerFresh(armed.state, T0 + 1000, REF, POLICY.maxEntryDriftPct) === null)
              fail("an ARMED setup must never be executable");

            // 3. A dip alone is not executable either.
            let st = advancePullbackSetup(armed.state, bar(T0,100,100.1,99.7,99.9), null, T0+MIN).state;
            if (st.state !== SETUP_STATE.PULLBACK_OBSERVED) fail("0.3% dip must be a pullback");
            if (entryTriggerFresh(st, T0 + MIN, REF, POLICY.maxEntryDriftPct) === null)
              fail("a PULLBACK_OBSERVED setup must never be executable");

            // 4. A re-acceleration is, for exactly 60 seconds and no longer.
            st = advancePullbackSetup(st, bar(T0+MIN,99.95,100.3,99.9,100.25),
              bar(T0,100,100.1,99.7,99.9), T0+2*MIN).state;
            if (st.state !== SETUP_STATE.TRIGGERED) fail("the re-acceleration did not trigger");
            if (entryTriggerFresh(st, st.triggerAt, 100.3, POLICY.maxEntryDriftPct) !== null)
              fail("a fresh trigger must be executable");
            if (entryTriggerFresh(st, st.triggerAt + SETUP_POLICY.entryTriggerTtlMs + 1, 100.3,
                POLICY.maxEntryDriftPct) !== "V17_TRIGGER_STALE")
              fail("the trigger must expire exactly at its TTL");

            // 5. The chase ceiling, against the ORIGINAL reference.
            if (entryTriggerFresh(st, st.triggerAt, REF * 1.0101, POLICY.maxEntryDriftPct)
                !== "V17_ENTRY_DRIFT")
              fail("a fill beyond 1% of the original reference must be refused");
            const chased = advancePullbackSetup(armed.state, bar(T0,100,101.5,99.99,101.2), null, T0+MIN).state;
            if (!isTerminal(chased) || chased.state !== "CHASE_EXPIRED")
              fail("a close beyond the chase ceiling must end the setup");

            // 6. The frozen parameters are the researched ones, not re-tuned.
            const frozen = {minPullbackPct:0.0025, minReaccelPct:0.0025, maxChasePct:0.01,
              setupTtlMs:900000, entryTriggerTtlMs:60000};
            for (const [k,v] of Object.entries(frozen))
              if (SETUP_POLICY[k] !== v)
                fail(`${k} is ${SETUP_POLICY[k]}, expected the researched ${v}`);
            if (POLICY.maxEntryDriftPct !== 0.01) fail("the 1% drift ceiling moved");
            if (POLICY.maxEntryAgeMs !== 120000) fail("the legacy signal age rule moved");
            console.log("entry timing " + SETUP_POLICY.version + ": watched window "
              + SETUP_POLICY.setupTtlMs/1000 + "s, executable window "
              + SETUP_POLICY.entryTriggerTtlMs/1000 + "s, chase ceiling "
              + SETUP_POLICY.maxChasePct*100 + "%");
          ' 2>&1 | tee release-evidence/entry-timing-invariants.txt

      # The invariant this release exists to restore.
      #
      # v48 shipped a FIXED 0.12 USDT notional buffer funded by RAISING the limit
      # price, under a RELATIVE 12 bps cap. At a 120 USDT notional that buffer cost
      # 10 bps and never fired. At 90 it costs 13.33 bps, so ordinary candidates were
      # refused by arithmetic: 20 ENTRY_GRANULARITY_BPS rejections at 12.479-13.199
      # bps, and zero entries, on a runtime that reported itself healthy the whole
      # time. Version, circuit and last_error could not see it. This can.
      - name: Prove the sizing contract cannot refuse itself
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=deno@2.5.6 -- deno eval --quiet '
            import {SLOT_SIZING_CONTRACT, assertSlotSizingContract, planSlotEntry,
              sizingPriceUpliftBps, slotSizingBounds}
              from "./supabase/functions/_shared/leader-slot-sizing.mjs";
            import {POLICY} from "./supabase/functions/_shared/leader-momentum-v17.mjs";
            const fail = (m) => { console.error("RELEASE_GATE_FAIL: " + m); Deno.exit(1); };

            // 1. The structural invariants, including: sizing demands no price uplift.
            for (const c of assertSlotSizingContract()) if (!c.ok) fail(c.name + " " + c.detail);
            if (sizingPriceUpliftBps() > SLOT_SIZING_CONTRACT.iocMaxBps)
              fail("a sizing decision can demand more price uplift than IOC_MAX_BPS allows");

            // 2. One contract, read by the generator and the executor alike.
            if (POLICY.marginUsdt !== SLOT_SIZING_CONTRACT.targetMarginUsdt)
              fail("POLICY.marginUsdt " + POLICY.marginUsdt + " != contract "
                + SLOT_SIZING_CONTRACT.targetMarginUsdt);
            if (POLICY.sizingContractVersion !== SLOT_SIZING_CONTRACT.version)
              fail("the policy and the contract name different sizing versions");

            // 3. A representative 30 USDT / 3x candidate on a fine-step symbol must be
            //    sizeable. This is the check that would have failed the v48 release.
            const bounds = slotSizingBounds(SLOT_SIZING_CONTRACT);
            let refused = 0, checked = 0;
            for (const step of [1, 0.1, 0.01, 0.001]) {
              for (let i = 0; i < 500; i++) {
                const ask = 0.0009 * (1 + i / 61) + step * 1e-6;
                checked++;
                try {
                  const plan = planSlotEntry({ask, quantityStep: step, priceTick: 0,
                    minNotionalUsdt: 5});
                  if (plan.iocBps > SLOT_SIZING_CONTRACT.iocMaxBps) refused++;
                  if (plan.referenceNotionalUsdt + 1e-9 < bounds.targetNotionalUsdt) refused++;
                } catch (e) { if (e.code === "IOC_PRICE_CAP_EXCEEDED") refused++; }
              }
            }
            if (refused > 0)
              fail(refused + " of " + checked + " fine-step candidates are refused by the "
                + "sizing arithmetic alone");
            console.log("sizing contract " + SLOT_SIZING_CONTRACT.version
              + ": " + checked + " representative candidates, 0 self-refusals, target "
              + bounds.targetNotionalUsdt + " USDT, max order margin "
              + bounds.maxOrderMarginUsdt.toFixed(4) + " USDT");
          ' 2>&1 | tee release-evidence/sizing-invariants.txt

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Capture production state and prove the cutover is consistent
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          # Read the function inventory from the Management API, not the CLI.
          # `supabase functions list --output json` on the pinned 2.34.3 IGNORES
          # the flag and prints a human table, and it writes an upgrade notice to
          # stdout on top of that. The API returns real JSON and is what the
          # version pin actually needs to be trustworthy.
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
            > release-evidence/functions-before.json
          python - <<'PY'
          import json,os
          rows=json.load(open('release-evidence/functions-before.json'))
          rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
          row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
          assert row.get('status')=='ACTIVE' and row.get('verify_jwt') is False, row
          expected=int("${{ inputs.expected_version_before }}")
          assert int(row['version'])==expected, f"expected production v{expected}, found {row['version']}"
          open('release-evidence/version-before.txt','w').write(str(row['version'])+'\n')
          PY

          # The DB must ALREADY carry the 30 USDT allocation. Deploying MARGIN=30
          # against a 40 row would refuse every entry with V17_MARGIN_CONFIG_MISMATCH.
          alloc="$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select binance_futures_allocation_usdt from public.trading_settings where id=1")"
          test "$alloc" = "30" || { echo "allocation is $alloc, expected 30"; exit 1; }
          lev="$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select binance_futures_leverage from public.trading_settings where id=1")"
          test "$lev" = "3" || { echo "leverage is $lev, expected 3"; exit 1; }

          # The trading posture must be the one the operator asked for.
          enf="$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select enforcement from public.boo_entry_gate_control where singleton")"
          test "$enf" = "${{ inputs.expected_enforcement }}" \
            || { echo "gate enforcement is $enf, operator expected ${{ inputs.expected_enforcement }}"; exit 1; }

          # A release must never be the thing that turns the V24 gate on.
          test "$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled from public.v24_operator_control where singleton")" = f

          psql "$SUPABASE_DB_URL" -XAt -F '|' --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled,legacy_entries_retired from public.v17_operator_control where singleton" \
            > release-evidence/operator-before.txt
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'entry_at',entry_at,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','entry_execution_policy',metadata->>'entryExecutionPolicyVersion') order by entry_at),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-before.json

      # The generator goes FIRST. It only changes what is stamped on a signal, so a
      # brief window where the new generator feeds the old executor is harmless; the
      # reverse -- a new executor reading signals that still claim a 40 USDT slot --
      # is the mismatch this ordering avoids.
      - name: Deploy the signal generator, then the executor
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > release-evidence/deployed-at.txt
          supabase functions deploy v10-lane-signal-generator --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api

      - name: Verify the deployed version moved by exactly one
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
              > release-evidence/functions-after.json || true
            if python - <<'PY'
          import json,sys
          try:
              rows=json.load(open('release-evidence/functions-after.json'))
          except Exception:
              sys.exit(1)
          rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
          row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
          before=int(open('release-evidence/version-before.txt').read().strip())
          sys.exit(0 if int(row['version'])==before+1 and row.get('status')=='ACTIVE' else 1)
          PY
            then echo "deployed version confirmed"; break; fi
            test "$i" -lt 20 || { echo "version did not advance"; exit 1; }
            sleep 15
          done

      - name: Observe three genuine scheduler cycles
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          deployed=open('release-evidence/deployed-at.txt').read().strip()
          lit="'"+deployed.replace("'","''")+"'::timestamptz"
          q=("select jsonb_build_object("
             "'cycle_completed_at',r.last_cycle_completed_at,"
             "'last_error',r.last_error,"
             "'cycle_ms',round(extract(epoch from (r.last_cycle_completed_at-r.last_cycle_started_at))*1000),"
             "'entry_block_reason',r.entry_block_reason,"
             "'circuit_open',r.circuit_open,"
             "'open_position_count',(select count(*) from public.v11_long_regime_positions where state='OPEN'),"
             # coalesce, because NULL LIKE '...' is NULL, not false -- and a NULL
             # last_error is the HEALTHY case. Comparing that to False failed the
             # observation on a perfectly good cycle the first time this ran.
             "'margin_mismatch',(coalesce(r.last_error,'') like '%V17_MARGIN_CONFIG_MISMATCH%'),"
             "'gate_decisions',(select count(*) from public.boo_entry_gate_decisions where created_at>=__D__),"
             "'gate_blocked',(select count(*) from public.boo_entry_gate_decisions where created_at>=__D__ and allowed=false)"
             ") from public.v11_long_regime_runtime r where singleton").replace('__D__',lit)
          seen,rows={},[]
          for _ in range(40):
              s=json.loads(subprocess.check_output(
                  ['psql',os.environ['SUPABASE_DB_URL'],'-XAt','--set=ON_ERROR_STOP=1','-c',q],text=True).strip())
              k=s['cycle_completed_at']
              if k and k>deployed and k not in seen:
                  seen[k]=1; rows.append(s); print(json.dumps(s))
                  # cycle_ms can read NEGATIVE mid-cycle: last_cycle_started_at is
                  # stamped when the next cycle begins, before that cycle writes its
                  # own completed_at. Only an implausibly LONG cycle is a problem.
                  assert s['cycle_ms'] is None or s['cycle_ms']<=60000, s
                  assert s['circuit_open'] is False, s
                  # The cutover's own failure mode. If this fires, code and DB
                  # disagree on the per-slot margin and every entry is refused.
                  assert s['margin_mismatch'] is False, s
                  if len(rows)==3: break
              time.sleep(20)
          json.dump(rows,open('release-evidence/cycles.json','w'),indent=2)
          assert len(rows)==3, f'only {len(rows)} post-deploy cycles observed'
          PY

      # The check that was missing when v48 went out.
      #
      # v48 deployed cleanly: version advanced, circuit closed, last_error null,
      # cycles completing in time. Every one of those was true for fourteen hours
      # while 144 of 144 signals were refused and not one entry opened. Liveness of
      # the process says nothing about liveness of the ENTRY PATH, so this looks at
      # the refusals themselves.
      #
      # It fails the release only on a DETERMINISTIC EXECUTION error -- a refusal
      # that is a property of our own arithmetic rather than of the market. A quiet
      # market, a drifted price or a refusing risk gate are all legitimate reasons to
      # open nothing, and none of them fail here.
      - name: Fail the release if fresh candidates are dying on execution arithmetic
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          deployed=open('release-evidence/deployed-at.txt').read().strip()
          lit="'"+deployed.replace("'","''")+"'::timestamptz"
          # Refusals produced by THIS executor's sizing and scheduling. Everything
          # else -- ENTRY_DRIFT, ENTRY_SPREAD, a BOO verdict, a quiet market -- is a
          # market or policy answer and is deliberately not counted.
          execution = ("MIN_NOTIONAL_EXCEEDS_MARGIN_BUDGET|QTY_STEP_EXCEEDS_MARGIN_BUDGET|"
                       "IOC_PRICE_CAP_EXCEEDED|ENTRY_GRANULARITY_BPS|"
                       "ENTRY_SLOT_GRANULARITY_MARGIN|ENTRY_NOTIONAL_UNDERSIZED|"
                       "V17_LIMIT_PRICE_MARGIN_OVERFLOW|SIGNAL_STALE_OR_FUTURE")
          q=("select jsonb_build_object("
             "'candidates',count(*),"
             "'entered',count(*) filter (where status in ('ORDERED','FILLED','CLOSED')),"
             "'execution_refusals',count(*) filter (where reject_reason ~ ('^('||__E__||')')),"
             "'stale',count(*) filter (where reject_reason like 'SIGNAL_STALE%'),"
             "'by_reason',coalesce(jsonb_object_agg(code,n) filter (where code is not null),'{}'::jsonb)"
             ") from (select status,reject_reason,split_part(reject_reason,':',1) code,"
             "count(*) over () n from public.v11_long_regime_signals "
             "where created_at>=__D__) t"
             ).replace('__D__',lit).replace('__E__',"'"+execution+"'")
          # Only the most recent candidates matter: an older backlog is not evidence
          # about the code that just shipped.
          q=q.replace("where created_at>=__D__","where created_at>=__D__ order by created_at desc limit 20")
          row=json.loads(subprocess.check_output(
              ['psql',os.environ['SUPABASE_DB_URL'],'-XAt','--set=ON_ERROR_STOP=1','-c',q],text=True).strip())
          json.dump(row,open('release-evidence/entry-health.json','w'),indent=2)
          print(json.dumps(row,indent=2))
          n=row['candidates']
          if n==0:
              # No signals is a quiet market, not a broken release.
              print('no fresh candidates in the window; entry health not asserted')
              raise SystemExit(0)
          bad=row['execution_refusals']
          if bad*2 > n and row['entered']==0:
              raise SystemExit(
                  f"RELEASE_GATE_FAIL: {bad} of the last {n} candidates were refused by this "
                  f"executor's own sizing or scheduling and none entered: {row['by_reason']}")
          print(f"{bad} of {n} recent candidates refused on execution arithmetic; "
                f"{row['entered']} entered")
          PY

      - name: Verify open positions were preserved
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'entry_at',entry_at,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','entry_execution_policy',metadata->>'entryExecutionPolicyVersion') order by entry_at),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-after.json
          psql "$SUPABASE_DB_URL" -XAt -F '|' --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled,legacy_entries_retired from public.v17_operator_control where singleton" \
            > release-evidence/operator-after.txt
          cmp release-evidence/operator-before.txt release-evidence/operator-after.txt
          python - <<'PY'
          import json
          before={x['id']:x for x in json.load(open('release-evidence/open-positions-before.json'))}
          after={x['id']:x for x in json.load(open('release-evidence/open-positions-after.json'))}
          for pid,old in before.items():
              new=after.get(pid)
              if new is None: continue          # closed naturally during observation
              assert new['entry_at']==old['entry_at']
              assert new['exit_policy']==old['exit_policy']
              # A position opened under the old policy keeps it. This release must
              # not retro-apply anything to positions already open.
              assert new['entry_execution_policy']==old['entry_execution_policy']
              # A protective stop may ratchet up; it must never move down.
              assert float(new['hard_stop_price'])+1e-12>=float(old['hard_stop_price']), (pid,old,new)
          print('open positions preserved:',len(before))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boo-entry-gate-margin30-release
          path: release-evidence
