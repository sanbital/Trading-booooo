name: Emergency disable Trading Boo database jobs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restart unavailable Trading Boo project database
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw/restart"
      - name: Disable every pg_cron job in the dedicated Trading Boo project
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: '10'
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          for attempt in $(seq 1 36); do
            if psql -X -At -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -c 'select 1' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then echo "Database remained unavailable"; exit 1; fi
            sleep 10
          done
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" <<'SQL'
          begin;
          set local statement_timeout = '60s';
          do $block$
          declare job record;
          begin
            for job in select jobid from cron.job where active loop
              perform cron.alter_job(job.jobid, active := false);
            end loop;
          end
          $block$;
          commit;
          select count(*) as active_jobs_remaining from cron.job where active;
          SQL
