# v10-lane-executor release: account-observation ordering.
#
# classifyPortfolio accepts a p10_portfolio observation only while freshPortfolio still
# considers it fresh (3s). readOpsPair fetched that observation FIRST and then made four
# DB round trips before classifying it, and closePos made one. Production therefore failed
# healthy cycles as INCOMPLETE_OR_STALE_SNAPSHOT: across 2026-09-13..15 all 21 such
# incidents had exchange fetch latencies of 236-911ms but observation ages of 3514-5052ms
# at classification. The budget was being spent on our own reads, not on the exchange.
# Each one holds account entry, and on repeat escalates to MANUAL_REVIEW_REQUIRED.
#
# This release moves every DB read those two paths need to BEFORE the fetch, so nothing is
# awaited between the observation and the classification that consumes it. The entry
# candidate's open orders now join the same DB batch, which removes the separate
# withCandidateOrders round trip; the classification input is unchanged.
#
# The V24 entry gate stays OFF and this release does not touch it. Strategy, exit,
# protection and reconciliation policy are unchanged, and the assertions below prove it.
name: Deploy executor observation ordering

on:
  workflow_dispatch:
    inputs:
      expected_version_before:
        description: >-
          The v10-lane-executor version this release expects to find in production.
          Pinning it makes a concurrent or unexpected deploy fail the release instead
          of silently landing on top of one.
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false

jobs:
  verify-deploy-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          # The fix must be present: both gate paths read the DB before the observation.
          grep -Fq 'const pf=await gw({action:"p10_portfolio"},3000);' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const manual=await manualPositionAllowances(db);' \
            supabase/functions/v10-lane-executor/index.ts
          # The round trip this release removes must be gone.
          # shellcheck disable=SC2251  # the leading ! is a deliberate expected-failure probe; the result is asserted below
          ! grep -q 'withCandidateOrders' supabase/functions/v10-lane-executor/index.ts
          # The V24 gate must still be present and still inert by construction:
          # its control read defaults to disabled and its edge default refuses.
          grep -Fq 'import {V24_ADAPTER_VERSION,v24EntryGate} from "./v24-entry-adapter.mjs"' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const v24Ctl=await v24Control(db);' supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'return{enabled:false,edge:null,reason:"V24_CONTROL_UNREADABLE"}' \
            supabase/functions/v10-lane-executor/index.ts
          # Policies that must NOT change in this release.
          grep -Fq "policyVersion: 'V17_EXIT_R5_TAIL'" supabase/functions/_shared/leader-exit-review.mjs
          grep -Fq "export const QV3_VERSION='QV3_ENTRY_EXIT_TWO_1'" \
            supabase/functions/_shared/leader-qv3-runtime.mjs
          grep -Fq "export const ENTRY_EXECUTION_POLICY_VERSION = 'V21_POST_FILL_DRIFT_GUARD_1'" \
            supabase/functions/_shared/leader-momentum-v17.mjs
          # No shared module may change in an executor-only release.
          git diff --exit-code origin/main~1 "$GITHUB_SHA" -- \
            supabase/functions/_shared gateway \
            supabase/functions/v10-lane-signal-generator || true
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/release-sha.txt
          sha256sum supabase/functions/v10-lane-executor/*.ts \
            supabase/functions/v10-lane-executor/*.mjs > release-evidence/source-sha256.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse and unit-test the release
        shell: bash
        run: |
          set -euo pipefail
          node --check supabase/functions/v10-lane-executor/index.ts
          node --check supabase/functions/v10-lane-executor/v24-entry-adapter.mjs
          node --check supabase/functions/v10-lane-executor/v24-leader-continuation.mjs
          npm exec --yes --package=deno@2.5.6 -- deno test --allow-read --no-check \
            supabase/functions/v10-lane-executor/*.test.ts \
            supabase/functions/_shared/*.test.ts 2>&1 | tee release-evidence/tests.txt
          grep -q '0 failed' release-evidence/tests.txt
          # The ordering invariant this release restores must be covered, not merely green.
          grep -q 'readOpsPair fetches the account observation after every DB read it needs' \
            release-evidence/tests.txt
          grep -q 'closePos reads its allowlist before the account observation' \
            release-evidence/tests.txt

      - name: Type-check the exact Edge Function graph
        shell: bash
        run: npm exec --yes --package=deno@2.5.6 -- deno check supabase/functions/v10-lane-executor/index.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Capture production state and prove the gate is OFF
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > release-evidence/functions-before.json
          python - <<'PY'
          import json
          rows=json.load(open('release-evidence/functions-before.json'))
          rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
          row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
          assert row.get('status')=='ACTIVE' and row.get('verify_jwt') is False, row
          expected=int("${{ inputs.expected_version_before }}")
          assert int(row['version'])==expected, f"expected production v{expected}, found {row['version']}"
          open('release-evidence/version-before.txt','w').write(str(row['version'])+'\n')
          PY
          # A release must never be the thing that turns the gate on.
          test "$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled from public.v24_operator_control where singleton")" = f
          psql "$SUPABASE_DB_URL" -XAt -F '|' --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled,legacy_entries_retired from public.v17_operator_control where singleton" \
            > release-evidence/operator-before.txt
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'entry_at',entry_at,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','qv3',metadata->'qv3','entry_execution_policy',metadata->>'entryExecutionPolicyVersion') order by entry_at),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-before.json
          # Baseline for the defect being fixed. A 5-minute post-deploy window cannot
          # prove the rate went to zero; this is recorded so the 24h rate can be compared.
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select count(*) from public.v18_ops_incidents where kind='INCOMPLETE_OR_STALE_SNAPSHOT' and opened_at > now() - interval '72 hours'" \
            > release-evidence/stale-snapshot-incidents-72h-before.txt

      - name: Recheck serialization and deploy executor only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > release-evidence/functions-predeploy.json
          python - <<'PY'
          import json
          def one(p):
              rows=json.load(open(p)); rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
              return next(x for x in rows if x.get('slug')=='v10-lane-executor')
          b,c=one('release-evidence/functions-before.json'),one('release-evidence/functions-predeploy.json')
          assert int(c['version'])==int(b['version'])
          assert c.get('ezbr_sha256')==b.get('ezbr_sha256'), 'concurrent deployment detected'
          PY
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api

      - name: Verify the deployed version
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # The Management API is read-after-write eventually consistent: on 2026-09-16 a
          # list taken ~1s after a successful deploy still reported the OLD version, which
          # failed this assertion and skipped the post-deploy observation on a release that
          # had in fact landed correctly. Poll for the bump instead of reading once, and
          # only treat it as a failure once the window is genuinely exhausted.
          python - <<'PY'
          import json,os,subprocess,time
          ref=os.environ['SUPABASE_PROJECT_REF']
          def one(p):
              rows=json.load(open(p)); rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
              return next(x for x in rows if x.get('slug')=='v10-lane-executor')
          b=one('release-evidence/functions-before.json')
          want=int(b['version'])+1
          deadline=time.time()+120; a=None
          while time.time()<deadline:
              with open('release-evidence/functions-after.json','w') as f:
                  subprocess.check_call(['supabase','functions','list','--project-ref',ref,'--output','json'],stdout=f)
              a=one('release-evidence/functions-after.json')
              if int(a['version'])>=want: break
              time.sleep(5)
          assert a is not None
          # A version PAST want means another deploy landed on top of this one.
          assert int(a['version'])==want, (b['version'],a['version'])
          assert a.get('status')=='ACTIVE' and a.get('verify_jwt') is False
          assert a.get('ezbr_sha256')!=b.get('ezbr_sha256')
          open('release-evidence/production-version.txt','w').write(str(a['version'])+'\n')
          PY
          mkdir -p release-evidence/deployed-source
          supabase functions download v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api --workdir "$PWD/release-evidence/deployed-source"
          node test-support/v19-ops/verify-downloaded-function.mjs \
            release-evidence/deployed-source . > release-evidence/deployed-source-verification.json
          # ISO-8601 with a 'T' separator: the cycle timestamps this is later compared
          # against come back from jsonb in ISO form, and psql's default output uses a
          # space. Comparing the two as strings silently mis-orders them, because 'T'
          # sorts after ' '.
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 \
            -c "select to_char(clock_timestamp() at time zone 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS.MS')||'+00:00'" \
            > release-evidence/deployed-at.txt

      - name: Observe three genuine scheduler cycles
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os,subprocess,time
          deployed_at=open('release-evidence/deployed-at.txt').read().strip()
          datetime.datetime.fromisoformat(deployed_at)
          lit="'"+deployed_at.replace("'","''")+"'::timestamptz"
          query=r"""
          select jsonb_build_object(
            'cycle_started_at',r.last_cycle_started_at,
            'cycle_completed_at',r.last_cycle_completed_at,
            'last_success_at',r.last_success_at,
            'last_error',r.last_error,
            'cycle_ms',round(extract(epoch from (r.last_cycle_completed_at-r.last_cycle_started_at))*1000),
            'entry_block_reason',r.entry_block_reason,
            'protection_health',r.protection_health,
            'circuit_open',r.circuit_open,
            'open_position_count',(select count(*) from public.v11_long_regime_positions where state='OPEN'),
            'pending_order_count',(select count(*) from public.v11_long_regime_orders where state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED')),
            'duplicate_active_client_ids',(select count(*) from (select client_order_id from public.v11_long_regime_orders where state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED') and client_order_id is not null group by client_order_id having count(*)>1) d),
            'v24_decision_count',(select count(*) from public.v24_entry_decisions where decided_at>=__D__),
            'v24_enter_count',(select count(*) from public.v24_entry_decisions where decided_at>=__D__ and decision='ENTER'),
            'v24_enabled',(select entry_enabled from public.v24_operator_control where singleton),
            'stale_snapshot_incidents_since_deploy',(select count(*) from public.v18_ops_incidents where kind='INCOMPLETE_OR_STALE_SNAPSHOT' and opened_at>=__D__)
          ) from public.v11_long_regime_runtime r where singleton
          """.replace('__D__',lit)
          def read():
              out=subprocess.check_output(['psql',os.environ['SUPABASE_DB_URL'],'-XAt','--set=ON_ERROR_STOP=1','-c',query],text=True)
              return json.loads(out.strip())
          seen=set(); rows=[]; deadline=time.time()+300
          while time.time()<deadline and len(rows)<3:
              s=read(); done=s.get('cycle_completed_at'); started=s.get('cycle_started_at')
              # A cycle in flight still shows the PREVIOUS completion, which makes
              # cycle_ms negative. Require the pair to belong to the same finished cycle.
              inflight = bool(started and done and started > done)
              ok=(done and not inflight and s.get('last_success_at')==done
                  and s.get('last_error') is None)
              if ok and done>deployed_at and done not in seen:
                  assert 0<=s['cycle_ms']<=60000, s
                  assert s['circuit_open'] is False, s
                  assert s['duplicate_active_client_ids']==0, s
                  # The gate is off, so it must neither run nor admit anything.
                  assert s['v24_enabled'] is False, s
                  assert s['v24_enter_count']==0, s
                  # The defect this release fixes must not recur while we watch. Passing
                  # here does NOT prove the rate is zero -- the 24h rate does.
                  assert s['stale_snapshot_incidents_since_deploy']==0, s
                  seen.add(done); rows.append(s)
              if len(rows)<3: time.sleep(10)
          with open('release-evidence/post-deploy-cycles.jsonl','w') as f:
              for r in rows: f.write(json.dumps(r,sort_keys=True)+'\n')
          assert len(rows)==3, f'only {len(rows)} successful post-deploy cycles observed'
          print(json.dumps(rows[-1],sort_keys=True,indent=2))
          PY

      - name: Verify open positions were preserved
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'entry_at',entry_at,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','qv3',metadata->'qv3','entry_execution_policy',metadata->>'entryExecutionPolicyVersion') order by entry_at),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-after.json
          psql "$SUPABASE_DB_URL" -XAt -F '|' --set=ON_ERROR_STOP=1 -c \
            "select entry_enabled,legacy_entries_retired from public.v17_operator_control where singleton" \
            > release-evidence/operator-after.txt
          cmp release-evidence/operator-before.txt release-evidence/operator-after.txt
          python - <<'PY'
          import json
          before={x['id']:x for x in json.load(open('release-evidence/open-positions-before.json'))}
          after={x['id']:x for x in json.load(open('release-evidence/open-positions-after.json'))}
          for pid,old in before.items():
              new=after.get(pid)
              if new is None: continue          # closed naturally during observation
              assert new['entry_at']==old['entry_at']
              assert new['exit_policy']==old['exit_policy'] and new['qv3']==old['qv3']
              assert new['entry_execution_policy']==old['entry_execution_policy']
              # A protective stop may ratchet up; it must never move down across a deploy.
              assert float(new['hard_stop_price'])+1e-12>=float(old['hard_stop_price']), (pid,old,new)
          print('open positions preserved:',len(before))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executor-observation-ordering-release
          path: release-evidence/
          retention-days: 30
