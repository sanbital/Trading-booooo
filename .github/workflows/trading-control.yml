name: Auto Trading Control

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Trading control command"
        required: true
        type: choice
        options:
          - status
          - start_paper
          - start_live_limited
          - pause_new_entries
          - resume_new_entries
          - emergency_liquidate
      confirmation:
        description: "For LIVE type ENABLE_LIVE; for emergency type LIQUIDATE_NOW"
        required: false
        type: string

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets and confirmation
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          COMMAND: ${{ inputs.command }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF missing"; exit 1; }
          test "${#LEARNING_ACCESS_TOKEN}" -ge 32 || { echo "::error::LEARNING_ACCESS_TOKEN missing/short"; exit 1; }
          if [ "$COMMAND" = "start_live_limited" ] && [ "$CONFIRMATION" != "ENABLE_LIVE" ]; then
            echo "::error::Type ENABLE_LIVE in confirmation."
            exit 1
          fi
          if [ "$COMMAND" = "emergency_liquidate" ] && [ "$CONFIRMATION" != "LIQUIDATE_NOW" ]; then
            echo "::error::Type LIQUIDATE_NOW in confirmation."
            exit 1
          fi

      - name: Call private control endpoint
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          COMMAND: ${{ inputs.command }}
        run: |
          autotrade_token="$(printf 'autotrade:%s' "$LEARNING_ACCESS_TOKEN" | sha256sum | awk '{print $1}')"
          case "$COMMAND" in
            status) body='{"action":"status"}' ;;
            start_paper) body='{"action":"control","mode":"PAPER","pause_new_entries":false,"emergency_liquidation":false}' ;;
            start_live_limited) body='{"action":"control","mode":"LIVE_LIMITED","pause_new_entries":false,"emergency_liquidation":false}' ;;
            pause_new_entries) body='{"action":"control","pause_new_entries":true}' ;;
            resume_new_entries) body='{"action":"control","pause_new_entries":false,"emergency_liquidation":false}' ;;
            emergency_liquidate) body='{"action":"control","pause_new_entries":true,"emergency_liquidation":true}' ;;
            *) echo "unsupported command"; exit 1 ;;
          esac
          curl --fail-with-body --retry 2 --retry-delay 3 --max-time 60 \
            -X POST \
            -H "content-type: application/json" \
            -H "x-autotrade-token: ${autotrade_token}" \
            -d "$body" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-autotrader" | jq .
          if [ "$COMMAND" = "emergency_liquidate" ]; then
            curl --fail-with-body --retry 2 --retry-delay 3 --max-time 60 \
              -X POST \
              -H "content-type: application/json" \
              -H "x-autotrade-token: ${autotrade_token}" \
              -d '{"action":"monitor"}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-autotrader" | jq .
          fi
