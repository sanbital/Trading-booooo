name: Scalp Calibration

# v6.4: this workflow did not exist.
#
# v5.9 built the shadow-sample measurement, cut the calibration interval from 6 hours to
# 1 hour, and dropped the Platt minimum sample count from 200 to 60. The function was
# added to the deploy list and then never called by anything — there was no schedule and
# no manual trigger. The interval was a design decision that never reached production, so
# the pWin calibration has been running on its prior since v5.9 no matter how many samples
# accumulated.
#
# lob-calibration runs at :42. This runs at :12 so the two never contend for the same
# window of closed positions.

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the proposal without applying it (true = yes)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: scalp-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
        run: |
          for name in SUPABASE_PROJECT_REF LEARNING_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret ${name}"
              exit 1
            fi
          done
          if [ "${#LEARNING_ACCESS_TOKEN}" -lt 32 ]; then
            echo "::error::LEARNING_ACCESS_TOKEN must be at least 32 characters"
            exit 1
          fi

      - name: Recalibrate pWin and the measured edge budget
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
            -X POST \
            -H "x-learning-token: ${LEARNING_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": ${DRY_RUN}}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/scalp-calibration"
