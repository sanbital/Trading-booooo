name: FD1 arbitration fix validation
on:
  push:
    branches: [fix/fd1-arbitration-evidence-20260927]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/fd1-arbitration.test.mjs tests/fd1-exit-authority-arbitration.test.mjs
