name: Collector watchdog
# Third survival layer: outside the worker and outside Fly. A brief Edge API outage must never
# be able to end real-time market surveillance, and a machine that is gone or wedged must be
# recovered without waiting for a human. Trading state is never touched.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      stale_ms:
        description: Heartbeat age that counts as an outage (ms, minimum 120000)
        required: false
        default: '180000'
permissions:
  contents: read
concurrency:
  group: collector-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover the collector if its heartbeat stopped
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Independent read path. The management API returned 544 for over an hour on 2026-09-29
          # while the project itself served normally, which left the heartbeat unreadable and the
          # collector down. Either path answering is enough to judge.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WATCHDOG_STALE_MS: ${{ github.event.inputs.stale_ms || '180000' }}
        # pipefail is mandatory: without it `| tee` returns tee's status and a failed watchdog
        # reports success -- which is exactly how the first run hid SUPABASE_QUERY_544.
        shell: bash
        run: |
          set -euo pipefail
          node ops/leader20/collector-watchdog.mjs | tee watchdog.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-watchdog
          path: watchdog.json
          retention-days: 14
