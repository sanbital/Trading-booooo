name: Patch P10 pre-order latch ownership

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-p10-preorder-latch-ownership.yml"

permissions:
  contents: write

concurrency:
  group: patch-p10-preorder-latch-ownership
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Patch pre-order classification and latch ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          module_path = root / 'supabase/functions/market-autotrader/p10-entry-reconciliation.ts'
          test_path = root / 'supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts'
          index_path = root / 'supabase/functions/market-autotrader/index.ts'
          ownership_test_path = root / 'supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts'
          migration_path = root / 'supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql'
          hardening_migration_path = root / 'supabase/migrations/20260827001000_p10_entry_latch_evidence_guard.sql'
          deploy_path = root / '.github/workflows/deploy-market-autotrader-v707.yml'

          # 1) Shared classifier: only the canonical DB policy prefix is a routine pre-order block.
          text = module_path.read_text()
          marker = 'export type P10PreOrderEntryDisposition'
          if marker not in text:
              anchor = '''const finite = (value: unknown, fallback = 0) => {\n  const parsed = Number(value);\n  return Number.isFinite(parsed) ? parsed : fallback;\n};\n\n'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'module anchor count={text.count(anchor)}')
              addition = '''export type P10PreOrderEntryDisposition =\n  | { kind: "POLICY_BLOCK"; reason: string }\n  | { kind: "PREORDER_ERROR"; reason: string };\n\nconst P10_ENTRY_BLOCK_PATTERN = /P10_ENTRY_BLOCKED:[A-Z0-9_.:+-]+/i;\n\n/**\n * A database policy rejection happens before any exchange order is submitted. It must\n * never be promoted into entry-result uncertainty or a global reconciliation latch.\n */\nexport function p10PreOrderEntryDisposition(error: unknown): P10PreOrderEntryDisposition {\n  const message = error instanceof Error ? error.message : String(error ?? "");\n  const match = message.match(P10_ENTRY_BLOCK_PATTERN);\n  return match\n    ? { kind: "POLICY_BLOCK", reason: match[0] }\n    : { kind: "PREORDER_ERROR", reason: message };\n}\n\n'''
              text = text.replace(anchor, anchor + addition, 1)
              module_path.write_text(text)

          # 2) Unit coverage for every P10_ENTRY_BLOCKED:* shape, plus negative controls.
          text = test_path.read_text()
          if 'p10PreOrderEntryDisposition,' not in text:
              old = '''  p10EntryFailureDisposition,\n  p10EntryOrderDisposition,\n'''
              new = '''  p10EntryFailureDisposition,\n  p10EntryOrderDisposition,\n  p10PreOrderEntryDisposition,\n'''
              if text.count(old) != 1:
                  raise SystemExit('test import anchor missing')
              text = text.replace(old, new, 1)
          test_marker = 'pre-order anti-chase DB rejection is a routine policy block'
          if test_marker not in text:
              tests = r'''

Deno.test("pre-order anti-chase DB rejection is a routine policy block", () => {
  assertEquals(
    p10PreOrderEntryDisposition(
      'database 400: {"code":"P0001","message":"P10_ENTRY_BLOCKED:LONG_OVERBOUGHT_RSI:70.69"}',
    ),
    { kind: "POLICY_BLOCK", reason: "P10_ENTRY_BLOCKED:LONG_OVERBOUGHT_RSI:70.69" },
  );
});

Deno.test("all canonical P10 entry-block reasons classify without enumerating each guard", () => {
  assertEquals(
    p10PreOrderEntryDisposition(
      'P10_ENTRY_BLOCKED:SHORT_OPPOSING_MARKET_FORECAST:STRONG_BULL',
    ),
    {
      kind: "POLICY_BLOCK",
      reason: "P10_ENTRY_BLOCKED:SHORT_OPPOSING_MARKET_FORECAST:STRONG_BULL",
    },
  );
  assertEquals(
    p10PreOrderEntryDisposition('P10_ENTRY_BLOCKED:MARKET_OBSERVATION_UNAVAILABLE'),
    { kind: "POLICY_BLOCK", reason: "P10_ENTRY_BLOCKED:MARKET_OBSERVATION_UNAVAILABLE" },
  );
});

Deno.test("ordinary pre-order failure is not mislabeled as policy or reconciliation", () => {
  assertEquals(
    p10PreOrderEntryDisposition('database 500: connection unavailable'),
    { kind: "PREORDER_ERROR", reason: 'database 500: connection unavailable' },
  );
});

Deno.test("post-submit lookup ambiguity is not a pre-order policy block", () => {
  assertEquals(
    p10PreOrderEntryDisposition('Order does not exist.'),
    { kind: "PREORDER_ERROR", reason: 'Order does not exist.' },
  );
});
'''
              text += tests
          test_path.write_text(text)

          # 3) Executor: handle the DB block at the exact pre-order insert boundary.
          text = index_path.read_text()
          import_old = '''  p10EntryFailureDisposition,\n  p10EntryOrderDisposition,\n  summarizeP10LinkedEntryFills,\n'''
          import_new = '''  p10EntryFailureDisposition,\n  p10EntryOrderDisposition,\n  p10PreOrderEntryDisposition,\n  summarizeP10LinkedEntryFills,\n'''
          if 'p10PreOrderEntryDisposition,' not in text:
              if text.count(import_old) != 1:
                  raise SystemExit(f'index import anchor count={text.count(import_old)}')
              text = text.replace(import_old, import_new, 1)

          catch_old = '''  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    await rejectP10Claim(claimId, message);\n    throw error;\n  }\n  await patch("p10_signal_claims", `id=eq.${claimId}`, {\n'''
          catch_new = '''  } catch (error) {\n    const disposition = p10PreOrderEntryDisposition(error);\n    await rejectP10Claim(claimId, disposition.reason);\n    if (disposition.kind === "POLICY_BLOCK") {\n      try {\n        await event("P10_ENTRY_POLICY_BLOCK", disposition.reason, {\n          strategy_key: P10_STRATEGY_KEY,\n          venue: signal.venue,\n          market: signal.market,\n          side,\n          signal_time: signal.signal_time,\n          order_submitted: false,\n        }, { cycleId, level: "INFO" });\n      } catch (eventError) {\n        console.error("P10_ENTRY_POLICY_BLOCK_EVENT_FAILED", eventError);\n      }\n      return {\n        entered: false,\n        exchange,\n        market: signal.market,\n        side,\n        policy_blocked: true,\n        reason: disposition.reason,\n      };\n    }\n    throw error;\n  }\n  await patch("p10_signal_claims", `id=eq.${claimId}`, {\n'''
          if 'order_submitted: false' not in text:
              if text.count(catch_old) != 1:
                  raise SystemExit(f'position-insert catch anchor count={text.count(catch_old)}')
              text = text.replace(catch_old, catch_new, 1)

          # The scan-level catch owns no exchange submission. It may stop this scan for a real
          # pre-order failure, but it can never claim that an exchange result needs reconciliation.
          legacy_marker = 'P10 entry failed and safety latch could not be persisted'
          if legacy_marker in text:
              marker_idx = text.index(legacy_marker)
              start = text.rfind('    } catch (error) {\n', 0, marker_idx)
              end_token = '      break;\n    }\n  }\n  const heartbeatAt'
              end = text.find(end_token, marker_idx)
              if start < 0 or end < 0:
                  raise SystemExit('scan catch boundaries not found')
              end += len('      break;\n    }\n')
              replacement = '''    } catch (error) {\n      const disposition = p10PreOrderEntryDisposition(error);\n      if (disposition.kind === "POLICY_BLOCK") {\n        entries.push({\n          entered: false,\n          exchange,\n          market: signal.market,\n          side: signal.side,\n          policy_blocked: true,\n          reason: disposition.reason,\n        });\n        try {\n          await event("P10_ENTRY_POLICY_BLOCK", disposition.reason, {\n            strategy_key: P10_STRATEGY_KEY,\n            venue: signal.venue,\n            market: signal.market,\n            side: signal.side,\n            signal_time: signal.signal_time,\n            order_submitted: false,\n            caught_at: "P10_SCAN",\n          }, { cycleId, level: "INFO" });\n        } catch (eventError) {\n          console.error("P10_ENTRY_POLICY_BLOCK_EVENT_FAILED", eventError);\n        }\n        continue;\n      }\n      entries.push({\n        entered: false,\n        exchange,\n        market: signal.market,\n        side: signal.side,\n        pre_order_error: true,\n        error: disposition.reason,\n      });\n      try {\n        await event("P10_ENTRY_PREORDER_ERROR", disposition.reason, {\n          strategy_key: P10_STRATEGY_KEY,\n          venue: signal.venue,\n          market: signal.market,\n          side: signal.side,\n          signal_time: signal.signal_time,\n          order_submitted: false,\n        }, { cycleId, level: "CRITICAL" });\n      } catch (eventError) {\n        console.error("P10_ENTRY_PREORDER_ERROR_EVENT_FAILED", eventError);\n      }\n      // Post-submit ambiguity is handled inside enterP10Signal, where a durable order row\n      // exists. This catch is pre-order only and must never own the reconciliation latch.\n      break;\n    }\n'''
              text = text[:start] + replacement + text[end:]

          # Routine anti-chase/claim rejections are healthy scan outcomes, not warning incidents.
          if 'const routinePolicyOnly =' not in text:
              summary_anchor = '''  await event(\n    "P10_SCAN_SUMMARY",\n'''
              if text.count(summary_anchor) != 1:
                  raise SystemExit(f'summary anchor count={text.count(summary_anchor)}')
              summary_prefix = '''  const routinePolicyOnly = entries.length > 0 &&\n    entries.every((row) => row.policy_blocked === true || row.reason === "signal already claimed");\n'''
              text = text.replace(summary_anchor, summary_prefix + summary_anchor, 1)
              level_old = '''    { cycleId, level: entries.some((row) => row.entered || row.reserved) ? "INFO" : "WARNING" },\n'''
              level_new = '''    {\n      cycleId,\n      level: entries.some((row) => row.entered || row.reserved) || routinePolicyOnly\n        ? "INFO"\n        : "WARNING",\n    },\n'''
              if text.count(level_old) != 1:
                  raise SystemExit(f'summary level anchor count={text.count(level_old)}')
              text = text.replace(level_old, level_new, 1)
          index_path.write_text(text)

          # 4) DB defense in depth: reconciliation latch requires durable order/execution evidence.
          text = migration_path.read_text()
          evidence_marker = 'NO_ENTRY_RECONCILIATION_EVIDENCE'
          if evidence_marker not in text:
              fn_start = text.index('create or replace function public.latch_p10_entry_safety')
              fn_end = text.index('\n$function$;', fn_start)
              anchor = '  v_next_lock := case\n'
              anchor_idx = text.index(anchor, fn_start, fn_end)
              guard = '''  -- Defense in depth: this reason means an exchange submission may have an unknown\n  -- result. A pre-order policy/validation error has no durable entry order and may not\n  -- pause every venue. Persistent post-submit ambiguity still latches exactly as before.\n  if v_reason = 'P10_ENTRY_RECONCILIATION_REQUIRED'\n     and not exists (\n       select 1\n       from public.trading_orders o\n       join public.trading_positions p on p.id = o.position_id\n       where p.strategy_key = 'P10_DONCHIAN_BREAKOUT_E10_SLOW_4R'\n         and coalesce(p.is_paper, false) is false\n         and upper(coalesce(o.purpose, '')) = 'ENTRY'\n         and (\n           (\n             p.state in (\n               'ENTRY_PENDING', 'RECONCILING', 'RECONCILIATION_FAILED',\n               'MANUAL_INTERVENTION_REQUIRED'\n             )\n             and o.state in (\n               'REQUESTED', 'UNKNOWN', 'EXCHANGE_OPEN', 'EXCHANGE_PARTIAL',\n               'EXCHANGE_DONE', 'EXCHANGE_PARTIAL_CANCELLED'\n             )\n           )\n           or coalesce(o.executed_volume, 0) > 0\n           or exists (\n             select 1 from public.exchange_trade_fills f\n             where f.bot_order_id = o.id and coalesce(f.quantity, 0) > 0\n           )\n           or exists (\n             select 1 from public.trading_fills f\n             where f.order_id = o.id and coalesce(f.volume, 0) > 0\n           )\n         )\n     ) then\n    return jsonb_build_object(\n      'changed', false,\n      'deferred', true,\n      'defer_reason', 'NO_ENTRY_RECONCILIATION_EVIDENCE',\n      'settings', to_jsonb(v_before)\n    );\n  end if;\n\n'''
              text = text[:anchor_idx] + guard + text[anchor_idx:]
              migration_path.write_text(text)

          # Standalone migration records the hardening independently of canonical replay.
          canonical = migration_path.read_text()
          fn_start = canonical.index('create or replace function public.latch_p10_entry_safety')
          fn_end = canonical.index('\n$function$;', fn_start) + len('\n$function$;')
          hardening_migration_path.write_text(
              '-- P10 reconciliation latch ownership hardening.\n'
              '-- Canonical replay carries the same definition so later deploys cannot regress it.\n\n'
              + canonical[fn_start:fn_end] + '\n'
          )

          # 5) Permanent source-ownership regression test.
          ownership_test_path.write_text(r'''import { assert, assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";

const source = await Deno.readTextFile(new URL("./index.ts", import.meta.url));
const entryStart = source.indexOf("async function enterP10Signal(");
const scanStart = source.indexOf("async function p10ScanCycle(");
const scanEnd = source.indexOf("async function p10FetchJson(");

Deno.test("scan-level entry catch never owns post-submit reconciliation latch", () => {
  assert(entryStart >= 0 && scanStart > entryStart && scanEnd > scanStart);
  const scanSource = source.slice(scanStart, scanEnd);
  assertEquals(
    scanSource.includes('latchP10EntrySafety("P10_ENTRY_RECONCILIATION_REQUIRED")'),
    false,
  );
  assert(scanSource.includes("P10_ENTRY_PREORDER_ERROR"));
  assert(scanSource.includes("P10_ENTRY_POLICY_BLOCK"));
});

Deno.test("post-submit entry path retains reconciliation latch ownership", () => {
  const entrySource = source.slice(entryStart, scanStart);
  const needle = 'latchP10EntrySafety("P10_ENTRY_RECONCILIATION_REQUIRED")';
  const count = entrySource.split(needle).length - 1;
  assert(count >= 2, `expected at least two post-submit reconciliation latch paths, got ${count}`);
  assert(entrySource.includes("p10EntryFailureDisposition"));
  assert(entrySource.includes("p10EntryOrderDisposition"));
});
''')

          # 6) Make the official production workflow enforce the ownership test forever.
          text = deploy_path.read_text()
          if 'p10-entry-latch-ownership.test.ts' not in text:
              fmt_anchor = '''            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \\\n            supabase/functions/market-autotrader/emergency-liquidation-safety.test.ts \\\n'''
              fmt_repl = '''            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \\\n            supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts \\\n            supabase/functions/market-autotrader/emergency-liquidation-safety.test.ts \\\n'''
              if text.count(fmt_anchor) != 1:
                  raise SystemExit(f'deploy fmt anchor count={text.count(fmt_anchor)}')
              text = text.replace(fmt_anchor, fmt_repl, 1)
              test_anchor = '''          deno test supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts\n'''
              test_repl = '''          deno test supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts\n          deno test --allow-read \\\n            supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts\n'''
              if text.count(test_anchor) != 1:
                  raise SystemExit(f'deploy test anchor count={text.count(test_anchor)}')
              text = text.replace(test_anchor, test_repl, 1)
          deploy_path.write_text(text)
          PY

      - name: Format and focused verification
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts \
            supabase/functions/market-autotrader/index.ts
          deno fmt --check \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts \
            supabase/functions/market-autotrader/index.ts
          deno test supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts
          deno test --allow-read supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          python - <<'PY'
          from pathlib import Path
          src = Path('supabase/functions/market-autotrader/index.ts').read_text()
          scan = src[src.index('async function p10ScanCycle('):src.index('async function p10FetchJson(')]
          entry = src[src.index('async function enterP10Signal('):src.index('async function p10ScanCycle(')]
          needle = 'latchP10EntrySafety("P10_ENTRY_RECONCILIATION_REQUIRED")'
          assert needle not in scan, 'scan-level catch still owns reconciliation latch'
          assert entry.count(needle) >= 2, 'post-submit reconciliation ownership was lost'
          assert 'P10_ENTRY_POLICY_BLOCK' in src
          assert 'P10_ENTRY_PREORDER_ERROR' in src
          sql = Path('supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql').read_text()
          assert 'NO_ENTRY_RECONCILIATION_EVIDENCE' in sql
          assert 'RECENT_FUTURES_CLOSE_GRACE' in sql
          PY
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts \
            supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql \
            supabase/migrations/20260827001000_p10_entry_latch_evidence_guard.sql \
            .github/workflows/deploy-market-autotrader-v707.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: separate P10 policy blocks from reconciliation"
          git push origin HEAD:main
