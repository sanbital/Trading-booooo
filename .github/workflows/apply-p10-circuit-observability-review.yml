name: Apply P10 Circuit Observability Review Patch

on:
  push:
    branches:
      - review/p10-circuit-observability-prod-safety-20260821
    paths:
      - '.github/workflows/apply-p10-circuit-observability-review.yml'

permissions:
  contents: write

concurrency:
  group: p10-circuit-observability-review
  cancel-in-progress: false

jobs:
  patch-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: review/p10-circuit-observability-prod-safety-20260821
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply observability-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/market-autotrader/index.ts')
          text = path.read_text()

          anchor1 = '''  const circuits = {} as Record<Exchange, any>;
          const positionSlots = clamp(finite((settings as any).scalp_position_slots, 3), 1, 20);
          for (const exchange of exchanges) {
          '''
          replacement1 = '''  const circuits = {} as Record<Exchange, any>;
          const circuitDiagnostics = {} as Record<Exchange, JsonRecord>;
          const positionSlots = clamp(finite((settings as any).scalp_position_slots, 3), 1, 20);
          const diagnosticNumber = (value: unknown): JsonRecord => {
            const isNull = value === null;
            const isEmptyString = typeof value === "string" && value.trim() === "";
            const numeric = Number(value);
            const isFiniteNumber = !isNull && !isEmptyString && Number.isFinite(numeric);
            return {
              present: value !== undefined,
              is_null: isNull,
              is_empty_string: isEmptyString,
              type: typeof value,
              finite: isFiniteNumber,
              value: isFiniteNumber ? numeric : null,
            };
          };
          for (const exchange of exchanges) {
          '''

          anchor2 = '''    const limits = exchangeLimits(settings, exchange);
              circuits[exchange] = evaluateCircuit({
          '''
          replacement2 = '''    const limits = exchangeLimits(settings, exchange);
              const managedState = managed.managed || {};
              const managedCapitalQuote = finite(managedState.managedCapitalQuote);
              const bookedExposureQuote = finite(managedState.openCostQuote);
              circuitDiagnostics[exchange] = {
                raw_total_equity_quote: diagnosticNumber(raw?.total_equity_quote),
                raw_available_quote: diagnosticNumber(raw?.available_quote),
                raw_locked_quote: diagnosticNumber(raw?.locked_quote),
                capital_base_quote: finite(managedState.capitalBaseQuote),
                booked_exposure_quote: bookedExposureQuote,
                bot_position_value_quote: finite(managedState.botPositionValueQuote),
                reserved_exposure_quote: finite(managedState.reservedExposureQuote),
                managed_capital_quote: managedCapitalQuote,
                unallocated_within_cap_quote: Math.max(0, managedCapitalQuote - bookedExposureQuote),
                managed_available_quote: finite(managedState.managedAvailableQuote),
                circuit_min_order_quote: limits.minOrder,
              };
              circuits[exchange] = evaluateCircuit({
          '''

          anchor3 = '''      strategy_key: P10_STRATEGY_KEY,
                circuits,
                stats,
          '''
          replacement3 = '''      strategy_key: P10_STRATEGY_KEY,
                circuits,
                circuit_diagnostics: circuitDiagnostics,
                stats,
          '''

          for name, anchor, replacement in [
              ('scan diagnostic declaration', anchor1, replacement1),
              ('circuit operand capture', anchor2, replacement2),
              ('blocked event diagnostics', anchor3, replacement3),
          ]:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one anchor, found {count}')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY

      - name: Format and typecheck only
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          grep -F 'circuit_diagnostics: circuitDiagnostics' supabase/functions/market-autotrader/index.ts
          grep -F 'raw_total_equity_quote: diagnosticNumber' supabase/functions/market-autotrader/index.ts
          grep -F 'booked_exposure_quote: bookedExposureQuote' supabase/functions/market-autotrader/index.ts

      - name: Commit only reviewed observability change
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "review/p10-circuit-observability-prod-safety-20260821"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/market-autotrader/index.ts
          git rm .github/workflows/apply-p10-circuit-observability-review.yml
          git diff --cached --check
          git commit -m 'diag: expose P10 circuit balance operands'
          git push origin HEAD:review/p10-circuit-observability-prod-safety-20260821
