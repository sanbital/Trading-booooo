name: Forensic ZRO compact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forensic-zro-compact.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - name: Query compact state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          POS='111c5f48-27bf-4c26-9819-4f4ed7714577'
          ORD='76b87951-0409-4c5b-b211-df54a2c88384'
          {
            echo "audited_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'POSITION'
            psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
              select id,state,market,initial_quantity,remaining_quantity,average_entry_price,
                     realized_cost_quote,realized_proceeds_quote,paid_fees_quote,realized_pnl_quote,
                     coalesce(close_reason,''),coalesce(closed_at::text,''),updated_at,
                     coalesce(metadata->>'pending_exit_action',''),coalesce(metadata->>'pending_exit_reason',''),
                     coalesce(metadata->>'reconciliation_phase',''),coalesce(metadata->>'display_data_status','')
              from public.trading_positions where id='${POS}'::uuid;"
            echo 'ORDERS'
            psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
              select id,created_at,side,purpose,state,identifier,requested_volume,executed_volume,
                     average_fill_price,executed_funds_quote,paid_fee_quote,coalesce(fee_asset,''),coalesce(completed_at::text,''),coalesce(error_message,'')
              from public.trading_orders where position_id='${POS}'::uuid order by created_at;"
            echo 'FILLS'
            psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
              select id,trade_id,price,volume,funds_quote,fee_amount,fee_asset,fee_quote_estimate,executed_at
              from public.trading_fills where order_id='${ORD}'::uuid order by executed_at;"
            echo 'RECONCILE_DETAILS'
            psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
              select created_at,code,details::text
              from public.trading_events where position_id='${POS}'::uuid and code='EXIT_RECONCILE_INCOMPLETE'
              order by created_at desc limit 3;"
            echo 'PARTIAL_DETAILS'
            psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
              select created_at,code,details::text
              from public.trading_events where position_id='${POS}'::uuid and code='PARTIAL_EXIT'
              order by created_at desc limit 3;"
          } > .github/zro-compact.txt
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/zro-compact.txt
          git commit -m "chore: record compact ZRO accounting state" || true
          git pull --rebase origin main
          git push origin HEAD:main
