name: Read-only platform resource timeline
on:
  workflow_dispatch:
    inputs:
      sample_count:
        description: "15s samples: 40=10m, 280=70m, 480=2h"
        type: number
        required: true
        default: 40
permissions:
  contents: read
concurrency:
  group: execution-platform-timeline
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'sanbital/Trading-booooo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe without DB scan or trading requests
        env:
          PLATFORM_SAMPLE_COUNT: ${{ inputs.sample_count }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ops/execution-infra/platform-sampler.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-timeline-${{ github.run_id }}
          path: infra-evidence/platform-timeline.encrypted.json
          retention-days: 7
          if-no-files-found: error
