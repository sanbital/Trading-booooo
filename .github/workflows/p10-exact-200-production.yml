name: P10 Exact 200 Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Exact commit SHA from main to deploy"
        required: true
        type: string
      confirm_production:
        description: "Type DEPLOY to confirm a production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-trading-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0

      - name: Verify immutable main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.deploy_sha }}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Validate exact-200 source contract without mutation
        run: |
          set -euo pipefail
          python3 scripts/p10_exact_200_hotfix.py --validate-only
          deno fmt --check supabase/functions/market-autotrader/index.ts supabase/functions/_shared/p10-policy.ts supabase/functions/_shared/p10-policy.test.ts

      - name: Typecheck and regression tests
        run: |
          set -euo pipefail
          deno check supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/_shared/p10-policy.test.ts
          deno test supabase/functions/_shared/p10-policy.test.ts
          deno task check
          deno task test

      - name: Verify required production secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"

      - name: Deploy exact tested production function bundle
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "deploy_sha=$(git rev-parse HEAD)"
          supabase functions deploy market-autotrader --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          supabase functions list --project-ref "${SUPABASE_PROJECT_REF}"
