name: Validate autotrader executable-stop policy

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/engine.ts"
      - "supabase/functions/market-scanner/forward-learning.ts"
      - "supabase/functions/_shared/lob/entry.ts"
      - "gateway/**"
      - ".github/workflows/patch-autotrader-v714.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/engine.ts"
      - "supabase/functions/market-scanner/forward-learning.ts"
      - "supabase/functions/_shared/lob/entry.ts"
      - "gateway/**"
      - ".github/workflows/patch-autotrader-v714.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-autotrader-executable-stop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate executable-stop and recovery invariants
        run: |
          set -euo pipefail
          # Runtime version parity is an invariant; no historical release literal is pinned.
          engine_version="$(sed -n 's/.*ENGINE_VERSION = "\([^"]*\)".*/\1/p' \
            supabase/functions/market-scanner/engine.ts)"
          test -n "$engine_version"
          grep -q "const VERSION = \"${engine_version}\";" \
            supabase/functions/market-autotrader/index.ts
          grep -q "const VERSION = \"${engine_version}\";" gateway/server.mjs
          grep -q 'time_in_force: "FOK"' supabase/functions/market-autotrader/index.ts
          grep -q 'expectedNetProfitQuote > 0' \
            supabase/functions/market-autotrader/executable-exit.ts

          # The order-time re-quote must preserve the policy's semantic approval reason.
          # POSITIVE_NET_AFTER_180S is now only the legacy/default spot reason; Futures
          # RECOVERY carries FUTURES_RECOVERY_NET_POSITIVE_EXIT through priorApprovedReason.
          grep -q 'orderTimeExitPolicyQuote' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'priorApprovedReason || "POSITIVE_NET_AFTER_180S"' \
            supabase/functions/market-autotrader/executable-exit.ts
          grep -q 'FUTURES_RECOVERY_NET_POSITIVE_EXIT' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES_STALE_GIVEBACK_EXIT_180M' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'ENGINE_VERSION_MISMATCH' gateway/server.mjs

          deno fmt --check \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/executable-exit.ts \
            supabase/functions/market-autotrader/entry-integrity.ts \
            supabase/functions/market-autotrader/heartbeat.ts \
            supabase/functions/market-autotrader/futures-exit-policy.ts \
            supabase/functions/market-autotrader/futures-exit-policy.test.ts \
            supabase/functions/market-autotrader/futures-recovery-state-machine.test.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/_shared/lob/entry.ts \
            gateway/server.mjs
          deno check supabase/functions/market-autotrader/index.ts
          deno test \
            supabase/functions/market-autotrader/executable-exit.test.ts \
            supabase/functions/market-autotrader/entry-integrity.test.ts \
            supabase/functions/market-autotrader/heartbeat.test.ts
          deno test --allow-read \
            supabase/functions/market-autotrader/futures-recovery-state-machine.test.ts
          git diff --exit-code
