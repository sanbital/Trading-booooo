name: Deterministic production cutover with entries staged disabled
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        type: string
        required: true
      operation:
        type: choice
        required: true
        options: [stage, repair-capture, repair-entry, verify, verify-resume, activate]
      entry_repair_confirmation:
        type: string
        required: false
        description: 'repair-entry only: PLANNED_ENTRY_REPAIR_1'
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'sanbital/Trading-booooo' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - name: Verify exact source and auth, recovery, release gates before mutation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          git diff --check
          supabase functions deploy --help > /dev/null
          supabase functions download --help > /dev/null
          npm ci --prefix test-support/deterministic
          npm test --prefix test-support/deterministic
          node --test tests/deterministic-release.test.mjs
      - name: Run the reviewed stage or activation through normal production credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CUTOVER_OPERATION: ${{ inputs.operation }}
          ENTRY_REPAIR_CONFIRMATION: ${{ inputs.entry_repair_confirmation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: node ops/deterministic/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-cutover-${{ inputs.operation }}-${{ github.run_id }}
          path: infra-evidence/deterministic-*
          retention-days: 7
          if-no-files-found: error
