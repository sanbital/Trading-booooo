name: Collector production evidence
# Read-only by default. The only place that can reach api.machines.dev and the Supabase paths at
# once, so this is where production evidence for the 2026-09-29 collector recovery is collected.
# Recovery is opt-in via the `mode` input and is limited to the collector process lifecycle:
# it never touches capacity, admission, orders, TTLs, deadlines or sizing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: observe (read-only) or recover (may start/restart the collector machine)
        required: true
        default: observe
        type: choice
        options: [observe, recover]
permissions:
  contents: read
concurrency:
  group: collector-watchdog
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Collect production evidence
        env:
          MODE: ${{ github.event.inputs.mode }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # pipefail so a failing probe can never be reported as a green job.
        shell: bash
        run: |
          set -euo pipefail
          node ops/leader20/production-evidence.mjs | tee evidence.json
      # The worker's own log is the only place that says WHY it exited. Read-only, and it runs
      # even when the evidence step failed, because that is exactly when it is needed.
      - name: Capture recent collector logs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          flyctl logs --app sanbital-doa-capture-20260925 --no-tail 2>&1 | tail -120 | tee collector.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-production-evidence-${{ github.run_number }}
          path: |
            evidence.json
            collector.log
          retention-days: 30
