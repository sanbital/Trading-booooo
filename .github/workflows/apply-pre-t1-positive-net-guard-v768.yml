name: Apply pre-T1 positive-net exit guard v7.6.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-pre-t1-positive-net-guard-v768.yml"
      - "scripts/apply_pre_t1_positive_net_guard_v768.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pre-t1-positive-net-guard-v768
  cancel-in-progress: false

jobs:
  patch-test-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out canonical main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Freeze new entries and disable legacy pre-T1 arming
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          previous_pause=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c \
            "select coalesce(pause_new_entries,false)::text from public.trading_settings where id=1")
          previous_profit=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c \
            "select coalesce(lob_profit_protect_enabled,false)::text from public.trading_settings where id=1")
          echo "PREVIOUS_PAUSE_NEW_ENTRIES=${previous_pause:-true}" >> "${GITHUB_ENV}"
          echo "PREVIOUS_PROFIT_PROTECT=${previous_profit:-false}" >> "${GITHUB_ENV}"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=true, lob_profit_protect_enabled=false, updated_at=now() where id=1"

      - name: Apply minimal exit patch
        run: |
          set -euo pipefail
          python3 scripts/apply_pre_t1_positive_net_guard_v768.py
          deno fmt \
            supabase/functions/market-autotrader/live-guards.ts \
            supabase/functions/market-autotrader/live-guards.test.ts \
            supabase/functions/market-autotrader/index.ts

      - name: Prove patch isolation and policy invariants
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^(supabase/functions/market-autotrader/(live-guards\.ts|live-guards\.test\.ts|index\.ts)|supabase/migrations/20260813081500_pre_t1_positive_net_exit_guard_v768\.sql)$' || true)
          if [ -n "${unexpected}" ]; then
            echo "Unexpected modified files:"
            echo "${unexpected}"
            exit 1
          fi
          grep -q 'executableNetAllowed: executableQuote.allowed' supabase/functions/market-autotrader/index.ts
          grep -q 'executableNetProfitQuote: guardedNetProfitQuote' supabase/functions/market-autotrader/index.ts
          grep -q 'executableNetProfit > 0' supabase/functions/market-autotrader/live-guards.ts
          grep -q 'firstTakeProfitPct: 5' supabase/functions/market-autotrader/spot-exit-policy.ts
          grep -q 'firstStopLossPct: -4' supabase/functions/market-autotrader/spot-exit-policy.ts
          grep -q 'firstTakeProfitRoePct: 15' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'firstStopLossRoePct: -12' supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'RETROACTIVE_PROFIT_PROTECTION_BLOCKED' supabase/migrations/20260813081500_pre_t1_positive_net_exit_guard_v768.sql
          grep -q 'PRE_T1_PROFIT_PROTECTION_REQUIRES_POSITIVE_NET' supabase/migrations/20260813081500_pre_t1_positive_net_exit_guard_v768.sql

      - name: Full repository verification pass 1
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Full repository verification pass 2
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Full repository verification pass 3
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Commit canonical production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/market-autotrader/live-guards.ts \
            supabase/functions/market-autotrader/live-guards.test.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/migrations/20260813081500_pre_t1_positive_net_exit_guard_v768.sql
          if git diff --cached --quiet; then
            echo "Canonical source already contains v7.6.8 pre-T1 guard"
          else
            git commit -m "fix: require positive net for pre-T1 protection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Apply database defense-in-depth migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 \
            -f supabase/migrations/20260813081500_pre_t1_positive_net_exit_guard_v768.sql
          guard_count=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
            select count(*) from pg_trigger t
            join pg_class c on c.oid=t.tgrelid
            where not t.tgisinternal and t.tgname in (
              'ab_trading_positions_pre_t1_profit_net_guard_v768',
              'zzzzzz_trading_orders_pre_t1_net_guard_v768'
            );")
          test "${guard_count}" = "2"
          psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
            select position('RETROACTIVE_PROFIT_PROTECTION_BLOCKED' in pg_get_functiondef(p.oid)) > 0
            from pg_proc p where p.proname='sanitize_pre_t1_profit_protection_v768';" | grep -qx t
          psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
            select position('PRE_T1_PROFIT_PROTECTION_REQUIRES_POSITIVE_NET' in pg_get_functiondef(p.oid)) > 0
            from pg_proc p where p.proname='guard_pre_t1_profit_exit_positive_net_v768';" | grep -qx t

      - name: Deploy patched autotrader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "ROLLOUT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api

      - name: Verify production monitor health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 18); do
            failed=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select count(*) from public.trading_cycle_runs
              where started_at >= '${ROLLOUT_STARTED_AT}'::timestamptz and status='FAILED';")
            latest=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select coalesce(max(started_at)::text,'') from public.trading_cycle_runs
              where kind='MONITOR' and started_at >= '${ROLLOUT_STARTED_AT}'::timestamptz;")
            if [ "${failed}" = "0" ] && [ -n "${latest}" ]; then
              healthy=true
              break
            fi
            sleep 5
          done
          test "${healthy}" = "true"

      - name: Restore protected trading state after successful rollout
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          case "${PREVIOUS_PAUSE_NEW_ENTRIES}" in true|t|1) restore_pause=true ;; *) restore_pause=false ;; esac
          case "${PREVIOUS_PROFIT_PROTECT}" in true|t|1) restore_profit=true ;; *) restore_profit=false ;; esac
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=${restore_pause}, lob_profit_protect_enabled=${restore_profit}, updated_at=now() where id=1"

      - name: Fail-safe restore entry state while keeping legacy arming disabled
        if: failure() && env.PREVIOUS_PAUSE_NEW_ENTRIES != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          case "${PREVIOUS_PAUSE_NEW_ENTRIES}" in true|t|1) restore_pause=true ;; *) restore_pause=false ;; esac
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=${restore_pause}, lob_profit_protect_enabled=false, updated_at=now() where id=1"
          echo "Rollout failed: new-entry state restored; legacy pre-T1 profit arming remains disabled for safety."
