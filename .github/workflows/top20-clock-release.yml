name: Top20 clock capture release
on:
  push:
    branches: [main]
    paths: [deployment-evidence/top20-clock-release.json]
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Verify fixed window and existing execution contracts
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          npm install --prefix "$RUNNER_TEMP/clock-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/clock-test/node_modules/@electric-sql/pglite/dist/index.js"
          node ops/dynamic-flow/run-tests.mjs > release-evidence/node.tap
          deno check --no-config supabase/functions/v10-lane-executor/index.ts supabase/functions/v10-lane-signal-generator/index.ts
          deno task test > release-evidence/deno.txt
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Build collector from this exact commit
        run: docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -t "registry.fly.io/sanbital-doa-capture-20260925:$GITHUB_SHA" collectors/doa-capture
      - name: Deploy compatible bundles, preserve machine settings, activate clock schedule
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ops/leader20/clock-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top20-clock-release
          path: release-evidence
          retention-days: 30
