    cfg.maxStopBps,
  );
''',
          )

          replace_once(
              'supabase/functions/_shared/lob/entry.ts',
              '''  const patternConfidence = primary?.confidence ?? 0;
  const activity = hotness.activityScore / 100;
''',
              '''  const patternConfidence = primary?.confidence ?? 0;
  const isMomentum = primary?.name === "MOMENTUM_CONTINUATION";
  const activity = hotness.activityScore / 100;
''',
