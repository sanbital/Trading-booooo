    ? momentumPulse * 0.45 + momentumChangeScore * 0.14
    : 0;
  const rawSignalEdge = (patternConfidence - 0.45) * 0.20 + signedPressure * 0.08 +
    signedMicroprice * 0.05 + signedBook * 0.05 + signedOfi * 0.04 + qualityEdge +
    trendAssist + clamp(features.fundingEdge, -0.03, 0.03) + momentumDirectionalEdge;
  const maxSignalEdge = isMomentum ? MAX_MOMENTUM_SIGNAL_EDGE : MAX_SIGNAL_EDGE;
  const signalEdge = clamp(
    rawSignalEdge * clamp(cfg.patternProbabilityMultiplier, 0.3, 2) * traps.confidenceMultiplier,
    -maxSignalEdge,
    maxSignalEdge,
  );
''',
          )

          replace_once(
              'supabase/functions/_shared/lob/entry.ts',
              '''  const resolveProbability = clamp(
    0.40 + activity * 0.22 + patternConfidence * 0.18 +
      clamp(features.tradeArrivalRate / 10, 0, 1) * 0.08 +
      clamp(features.dataQuality, 0, 1) * 0.12,
    0.25,
    0.95,
  );
''',
              '''  const resolveProbability = clamp(
    0.40 + activity * 0.22 + patternConfidence * 0.18 +
      clamp(features.tradeArrivalRate / 10, 0, 1) * 0.08 +
      clamp(features.dataQuality, 0, 1) * 0.12 +
      (isMomentum ? 0.10 + momentumPulse * 0.12 : 0),
    0.25,
    0.95,
  );
''',
          )

          replace_once(
              'supabase/functions/_shared/lob/entry.ts',
              '''    maxHoldingSeconds: Math.min(cfg.absoluteMaxHoldingSeconds, Math.max(1, cfg.maxHoldingSeconds)),
''',
              '''    maxHoldingSeconds: Math.min(
      cfg.absoluteMaxHoldingSeconds,
      Math.max(1, isMomentum ? Math.min(90, cfg.maxHoldingSeconds) : cfg.maxHoldingSeconds),
    ),
''',
          )

          replace_once(
              'supabase/functions/market-scanner/search-expansion.ts',
              '''export type LobRankedSearchRow = {
  market: string;
  liquidity_score?: number;
  turnover_24h_quote?: number;
};
''',
              '''export type LobRankedSearchRow = {
  market: string;
  liquidity_score?: number;
  turnover_24h_quote?: number;
  change_24h_pct?: number;
  market_heat_score?: number;
  notional_acceleration?: number;
};
''',
          )

          path = Path('supabase/functions/market-scanner/search-expansion.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('export function selectCostAwareLobRows')
          new_function = '''export function selectCostAwareLobRows<T extends LobRankedSearchRow>(
  rows: T[],
  expansion: LobSearchExpansion,
  nowMs = Date.now(),
): T[] {
  const source = Array.isArray(rows) ? rows : [];
  if (!source.length) return [];
  const limit = Math.min(source.length, expansion.finalistLimit);
  const liquidityReserve = Math.min(3, Math.max(1, Math.floor(expansion.baseFinalists / 4)));
  const momentumReserve = Math.min(4, Math.max(2, Math.floor(expansion.baseFinalists / 3)));
  const heatCoreCount = Math.max(
    1,
    Math.min(limit, expansion.baseFinalists - liquidityReserve - momentumReserve),
  );
  const selected: T[] = [];
  const seen = new Set<string>();
  const add = (row: T | undefined) => {
    if (!row || seen.has(row.market) || selected.length >= limit) return;
    seen.add(row.market);
    selected.push(row);
  };

  source.slice(0, heatCoreCount).forEach(add);

  // Force-observe large gainers only while the present whole-market pulse is still active.
  // A high 24h return with zero acceleration ranks below an earlier-stage 5–15% mover whose
  // turnover is currently accelerating, so the lane does not simply chase yesterday's pump.
  [...source]
    .filter((row) => finite(row.change_24h_pct, 0) >= 3 && finite(row.change_24h_pct, 0) <= 60)
    .sort((left, right) => {
      const score = (row: T) =>
        Math.min(30, finite(row.change_24h_pct, 0)) * 2 +
        finite(row.notional_acceleration, 0) * 35 +
        finite(row.market_heat_score, 0) * 0.25 +
        Math.log10(Math.max(1, finite(row.turnover_24h_quote, 0)));
      return score(right) - score(left);
    })
    .forEach((row) => {
      if (selected.length < heatCoreCount + momentumReserve) add(row);
    });

  [...source]
    .sort((left, right) =>
      finite(right.liquidity_score, 0) - finite(left.liquidity_score, 0) ||
      finite(right.turnover_24h_quote, 0) - finite(left.turnover_24h_quote, 0)
    )
    .forEach((row) => {
      if (selected.length < heatCoreCount + momentumReserve + liquidityReserve) add(row);
    });

  source.filter((row) => !seen.has(row.market))
    .slice(0, Math.max(0, expansion.baseFinalists - selected.length))
    .forEach(add);
  if (!expansion.enabled || selected.length >= limit) return selected.slice(0, limit);

  const extraCount = limit - selected.length;
  const pool = source
    .slice(heatCoreCount, Math.min(source.length, heatCoreCount + expansion.rotationPool))
    .filter((row) => !seen.has(row.market));
  if (pool.length <= extraCount) {
    pool.forEach(add);
    return selected.slice(0, limit);
  }
  const bucketMs = Math.max(1, expansion.rotationMinutes) * 60_000;
  const bucket = Math.floor(nowMs / bucketMs);
  const offset = (bucket * extraCount) % pool.length;
  for (let index = 0; index < extraCount; index++) add(pool[(offset + index) % pool.length]);
  return selected.slice(0, limit);
}
'''
          path.write_text(text[:start] + new_function, encoding='utf-8')

          replace_once(
