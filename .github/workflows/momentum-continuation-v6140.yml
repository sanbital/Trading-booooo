          PY

      - name: Add deterministic momentum tests
        run: |
          cat > supabase/functions/_shared/lob/momentum-continuation.test.ts <<'EOF'
          import { assert, assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";
          import { evaluateLobEntry } from "./entry.ts";
          import { detectLobPatterns } from "./patterns.ts";
          import type { LobCostEstimate, LobFeatureVector } from "./types.ts";

          const features: LobFeatureVector = {
            samples: 45, observationMs: 11000, bookAgeMs: 80, spreadBps: 1.2,
            bookImbalance: 0.12, imbalanceStability: 0.8, tradePressureFast: 0.68,
            tradeCount: 80, buyNotional: 90000, sellNotional: 18000,
            averageTradeNotional: 1350, bookUpdateRate: 15, tradeArrivalRate: 8,
            aggressiveNotionalPerSecond: 9000, micropriceDeviationBps: 2.4,
            bidDepthQuote: 800000, askDepthQuote: 500000, depthRatio: 1.6,
            spoofLikeScore: 0, askSpoofScore: 0, askAbsorptionScore: 0.08,
            askRefillRatio: 0.05, bidAbsorptionScore: 0.2, breakoutScore: 0.55,
            sweepReclaimScore: 0.3, ofiPersistence: 0.72, persistentBidWall: true,
            persistentAskWall: false, dynamicStatus: "BREAKOUT_CONFIRMED", dataQuality: 0.65,
            turnover24hQuote: 120000000, minActionableTurnover24h: 100000,
            trendContext: 0.03, marketHeatScore: 78, recentNotionalPerSecond: 200000,
            notionalAcceleration: 0.55, tradeCountPerSecond: 18, pathEfficiency: 0.82,
            reversalRate: 0.12, noiseBandBps: 5, quoteFlickerRate: 4,
            fundingPremiumBps: 0, fundingAttention: 0, fundingEdge: 0,
          };
          const costs: LobCostEstimate = {
            roundTripFeeBps: 20, entrySlippageBps: 1, targetExitSlippageBps: 1,
            stopExitSlippageBps: 2, spreadBps: 1.2, latencyPenaltyBps: 0.5,
            forecastBiasPenaltyBps: 0,
          };

          Deno.test("large gainer needs a live continuation pulse", () => {
            const pattern = detectLobPatterns(features).find((row) => row.name === "MOMENTUM_CONTINUATION");
            assert(pattern?.primary);
            const stale = detectLobPatterns({ ...features, notionalAcceleration: 0 })
              .find((row) => row.name === "MOMENTUM_CONTINUATION");
            assertEquals(stale?.primary, false);
          });

          Deno.test("momentum lane uses fee-meaningful target and short horizon", () => {
            const decision = evaluateLobEntry(features, costs);
            assertEquals(decision.pattern, "MOMENTUM_CONTINUATION");
            assert(decision.targetBps >= 60);
            assert(decision.targetBps <= 140);
            assert(decision.stopBps < decision.targetBps);
            assertEquals(decision.maxHoldingSeconds, 90);
            assert(decision.conditionalEvLowerBoundBps > 0);
          });
          EOF

