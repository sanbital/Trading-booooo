name: Momentum Continuation v6.14.0

on:
  push:
    branches: [main]
    paths:
      - .github/momentum-continuation-v6140.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-momentum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

