name: Verify pre-breakout runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-prebreakout-runtime.yml"
  issues:
    types: [opened]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.title == '[VERIFY] pre-breakout runtime') ||
      (github.event_name == 'pull_request' && github.event.pull_request.title == '[VERIFY] pre-breakout runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for scheduler cycles
        run: sleep 20

      - name: Check health and clear stale rollout pause
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_row jsonb;
            v_paused boolean;
            v_emergency boolean;
            v_monitor timestamptz;
            v_scan timestamptz;
            v_gateway timestamptz;
          begin
            select to_jsonb(t) into v_row
            from public.trading_settings t
            where t.id = 1;

            if v_row is null then
              raise exception 'trading_settings row 1 is missing';
            end if;

            v_paused := coalesce(nullif(v_row->>'pause_new_entries', '')::boolean, true);
            v_emergency := coalesce(nullif(v_row->>'emergency_liquidation', '')::boolean, false);
            v_monitor := nullif(v_row->>'last_monitor_at', '')::timestamptz;
            v_scan := nullif(v_row->>'last_full_scan_at', '')::timestamptz;
            v_gateway := nullif(v_row->>'last_gateway_heartbeat_at', '')::timestamptz;

            raise notice 'PREBREAKOUT_RUNTIME_STATE paused=% emergency=% monitor=% gateway=% full_scan=% gateway_errors=%',
              v_paused, v_emergency, v_monitor, v_gateway, v_scan,
              coalesce(v_row->>'gateway_error_count', 'unknown');

            if v_emergency then
              raise exception 'emergency liquidation is active; refusing to resume entries';
            end if;
            if v_monitor is null or now() - v_monitor > interval '3 minutes' then
              raise exception 'market-autotrader monitor heartbeat is stale: %', v_monitor;
            end if;
            if v_gateway is null or now() - v_gateway > interval '3 minutes' then
              raise exception 'gateway heartbeat is stale: %', v_gateway;
            end if;
            if v_scan is null or now() - v_scan > interval '10 minutes' then
              raise exception 'market-scanner full-scan heartbeat is stale: %', v_scan;
            end if;

            if v_paused then
              update public.trading_settings
              set pause_new_entries = false, updated_at = now()
              where id = 1 and pause_new_entries is true and emergency_liquidation is not true;
              raise notice 'STALE_ROLLOUT_PAUSE_CLEARED';
            end if;
          end
          $$;
          SQL

      - name: Confirm entries stay resumed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          sleep 30
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_row jsonb;
            v_paused boolean;
            v_monitor timestamptz;
            v_gateway timestamptz;
          begin
            select to_jsonb(t) into v_row
            from public.trading_settings t
            where t.id = 1;
            v_paused := coalesce(nullif(v_row->>'pause_new_entries', '')::boolean, true);
            v_monitor := nullif(v_row->>'last_monitor_at', '')::timestamptz;
            v_gateway := nullif(v_row->>'last_gateway_heartbeat_at', '')::timestamptz;

            if v_paused then
              raise exception 'pause_new_entries was re-enabled after health-checked resume';
            end if;
            if v_monitor is null or now() - v_monitor > interval '3 minutes' then
              raise exception 'monitor heartbeat became stale after resume: %', v_monitor;
            end if;
            if v_gateway is null or now() - v_gateway > interval '3 minutes' then
              raise exception 'gateway heartbeat became stale after resume: %', v_gateway;
            end if;

            raise notice 'PREBREAKOUT_RUNTIME_OK paused=% monitor=% gateway=%',
              v_paused, v_monitor, v_gateway;
          end
          $$;
          SQL
