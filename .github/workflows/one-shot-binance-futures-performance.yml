name: One-shot Binance futures performance integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-binance-futures-performance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch sync, performance and dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          sync_path = Path('supabase/functions/exchange-trade-sync/index.ts')
          perf_path = Path('supabase/functions/market-performance/index.ts')
          ui_path = Path('docs/realized-performance.js')

          # --- exchange-trade-sync: add a Futures userTrades pass -----------------
          s = sync_path.read_text()
          s = s.replace('  isMaker: boolean;\n};', '  isMaker: boolean;\n  realizedPnl?: string;\n};', 1)
          marker = '\nDeno.serve(async (req: Request) => {'
          if 'async function syncFuturesTrades(' not in s:
              helper = r'''

async function loadFuturesOrders(sb: ReturnType<typeof createClient>): Promise<BotOrder[]> {
  const rows: BotOrder[] = [];
  for (let page = 0; page < MAX_ORDER_PAGES; page++) {
    const from = page * PAGE_SIZE;
    const { data, error } = await sb
      .from("trading_orders")
      .select("id,position_id,market,exchange_order_id,identifier")
      .eq("exchange", "binance_futures")
      .not("exchange_order_id", "is", null)
      .order("created_at", { ascending: true })
      .range(from, from + PAGE_SIZE - 1);
    if (error) throw new Error(`FUTURES_ORDERS:${error.message}`);
    const batch = (data ?? []) as BotOrder[];
    rows.push(...batch);
    if (batch.length < PAGE_SIZE) break;
  }
  return rows;
}

function futuresPositionForTrade(positions: any[], market: string, tradeTime: number): any | null {
  const candidates = positions
    .filter((p) => String(p.market) === market && Date.parse(String(p.opened_at || p.created_at || 0)) <= tradeTime)
    .sort((a, b) => Date.parse(String(b.opened_at || b.created_at || 0)) - Date.parse(String(a.opened_at || a.created_at || 0)));
  return candidates[0] ?? null;
}

async function syncFuturesTrades(sb: ReturnType<typeof createClient>) {
  const [orders, posRes, stateRes] = await Promise.all([
    loadFuturesOrders(sb),
    sb.from("trading_positions")
      .select("id,market,base_asset,state,opened_at,closed_at,created_at,leverage")
      .eq("exchange", "binance_futures")
      .in("state", ["OPEN", "EXITING", "CLOSED"])
      .order("created_at", { ascending: true })
      .limit(1000),
    sb.from("exchange_trade_sync_state")
      .select("market,last_exchange_trade_id,last_synced_at,last_trade_at")
      .eq("exchange", "binance_futures")
      .eq("account_scope", "futures")
      .limit(1000),
  ]);
  if (posRes.error) throw new Error(`FUTURES_POSITIONS:${posRes.error.message}`);
  if (stateRes.error) throw new Error(`FUTURES_SYNC_STATE:${stateRes.error.message}`);
  const positions = posRes.data ?? [];
  const orderMap = new Map<string, BotOrder>();
  for (const o of orders) if (o.exchange_order_id) orderMap.set(`${o.market}:${o.exchange_order_id}`, o);
  const stateMap = new Map<string, SyncState>();
  for (const row of stateRes.data ?? []) stateMap.set(String(row.market), {
    lastId: row.last_exchange_trade_id == null ? null : Number(row.last_exchange_trade_id),
    lastSynced: row.last_synced_at ? Date.parse(String(row.last_synced_at)) : 0,
    lastTradeAt: row.last_trade_at ? String(row.last_trade_at) : null,
  });
  const markets = [...new Set([
    ...orders.map((o) => String(o.market || "")),
    ...positions.map((p: any) => String(p.market || "")),
  ].filter((m) => m.endsWith(QUOTE)))];
  let seen = 0, upserted = 0, settled = 0;
  const errors: Array<{ market: string; error: string }> = [];
  for (const market of markets) {
    try {
      const state = stateMap.get(market);
      const command: Json = { exchange: "binance_futures", action: "trade_history", market, limit: 1000 };
      if (state?.lastId != null) command.from_id = state.lastId + 1;
      const raw = await gateway(command) as Trade[];
      const trades = Array.isArray(raw) ? raw : [];
      seen += trades.length;
      let maxId = state?.lastId ?? null, maxAt = state?.lastTradeAt ?? null;
      const rows: Json[] = [], affected = new Set<string>();
      const a = assets(market);
      for (const t of trades) {
        const qty = num(t.qty), price = num(t.price), quoteAmount = num(t.quoteQty, qty * price);
        const feeAmount = num(t.commission), fq = await feeQuote(t.commissionAsset, feeAmount, a.base, price, t.time);
        const matched = orderMap.get(`${market}:${String(t.orderId)}`) ?? null;
        const fallbackPosition = matched?.position_id ? null : futuresPositionForTrade(positions, market, Number(t.time));
        const positionId = matched?.position_id ?? fallbackPosition?.id ?? null;
        if (positionId) affected.add(String(positionId));
        rows.push({
          exchange: "binance_futures", account_scope: "futures", market,
          exchange_trade_id: t.id, exchange_order_id: String(t.orderId),
          client_order_id: matched?.identifier ?? null,
          side: t.isBuyer ? "BUY" : "SELL",
          price, quantity: qty, quote_amount: quoteAmount,
          base_asset: a.base, quote_asset: a.quote,
          fee_asset: t.commissionAsset, fee_amount: feeAmount, fee_quote_amount: fq,
          is_maker: t.isMaker, source: matched ? "AUTOMATED" : "MANUAL",
          bot_order_id: matched?.id ?? null, position_id: positionId,
          realized_pnl_quote: t.realizedPnl == null ? null : num(t.realizedPnl),
          accounting_status: positionId ? "FUTURES_POSITION_LINKED" : "UNMATCHED",
          executed_at: new Date(t.time).toISOString(), raw_response: t as unknown as Json,
          updated_at: new Date().toISOString(),
        });
        if (maxId == null || t.id > maxId) { maxId = t.id; maxAt = new Date(t.time).toISOString(); }
      }
      if (rows.length) {
        const u = await sb.from("exchange_trade_fills").upsert(rows, {
          onConflict: "exchange,account_scope,market,exchange_trade_id", ignoreDuplicates: false,
        });
        if (u.error) throw new Error(`FUTURES_FILL_UPSERT:${u.error.message}`);
        upserted += rows.length;
        for (const positionId of affected) {
          const settle = await sb.rpc("settle_futures_position_from_exchange_fills", { p_position_id: positionId });
          if (settle.error) throw new Error(`FUTURES_SETTLE:${settle.error.message}`);
          settled++;
        }
      }
      const st = await sb.from("exchange_trade_sync_state").upsert({
        exchange: "binance_futures", account_scope: "futures", market,
        last_exchange_trade_id: maxId, last_trade_at: maxAt, last_synced_at: new Date().toISOString(),
        last_status: "SUCCESS", last_error: null, updated_at: new Date().toISOString(),
      }, { onConflict: "exchange,account_scope,market" });
      if (st.error) throw new Error(`FUTURES_STATE:${st.error.message}`);
    } catch (e) {
      errors.push({ market, error: (e instanceof Error ? e.message : String(e)).slice(0, 500) });
    }
  }
  return { markets: markets.length, seen, upserted, settled, errors };
}
'''
              if marker not in s: raise SystemExit('sync serve marker missing')
              s = s.replace(marker, helper + marker, 1)
          if 'const futuresSync = await syncFuturesTrades(sb)' not in s:
              needle = '      let refreshed = 0;\n'
              repl = '''      const futuresSync = await syncFuturesTrades(sb).catch((e) => ({
        markets: 0, seen: 0, upserted: 0, settled: 0,
        errors: [{ market: "__FUTURES__", error: e instanceof Error ? e.message : String(e) }],
      }));
      if (futuresSync.errors.length) {
        for (const row of futuresSync.errors.slice(0, 10)) errors.push({ market: `FUTURES:${row.market}`, error: row.error });
      }
      let refreshed = 0;
'''
              if needle not in s: raise SystemExit('sync refresh marker missing')
              s = s.replace(needle, repl, 1)
              s = s.replace('          source: "binance-static-ip-gateway",\n        },', '          futures_sync: futuresSync,\n          source: "binance-static-ip-gateway",\n        },', 1)
              s = s.replace('        scorecards_refreshed: refreshed, errors: errors.slice(0, 10),', '        scorecards_refreshed: refreshed, futures_sync: futuresSync, errors: errors.slice(0, 10),', 1)
          sync_path.write_text(s)

          # --- market-performance: BINANCE = spot + futures ------------------------
          p = perf_path.read_text()
          p = p.replace('type Exchange = "upbit" | "binance";', 'type Exchange = "upbit" | "binance" | "binance_futures";')
          p = p.replace('const result: Record<Exchange, JsonRecord | null> = { upbit: null, binance: null };', 'const result: Record<Exchange, JsonRecord | null> = { upbit: null, binance: null, binance_futures: null };')
          p = p.replace('if ((e === "upbit" || e === "binance") && !result[e]) result[e] = row;', 'if ((e === "upbit" || e === "binance" || e === "binance_futures") && !result[e]) result[e] = row;')
          p = p.replace('if (position.exchange === "binance" && market.endsWith("USDT"))', 'if ((position.exchange === "binance" || position.exchange === "binance_futures") && market.endsWith("USDT"))')
          p = p.replace('function buildBinanceRows(position: JsonRecord, fills: JsonRecord[], snapshot: JsonRecord | null): { rows: JsonRecord[]; quality: string } {', 'function buildBinanceRows(position: JsonRecord, fills: JsonRecord[], snapshot: JsonRecord | null): { rows: JsonRecord[]; quality: string } {\n  const venue = String(position.exchange) === "binance_futures" ? "binance_futures" : "binance";\n  const leverage = venue === "binance_futures" ? Math.max(1, num(position.leverage, 3)) : 1;')
          p = p.replace('row_type: "REALIZED_EXIT", exchange: "binance", quote_currency:', 'row_type: "REALIZED_EXIT", exchange: venue, quote_currency:')
          p = p.replace('entry_funds_quote: cost, exit_funds_quote: proceeds, invested_cost_quote: cost,\n      total_fees_quote: allocation.totalFeesQuote, net_pnl_quote: pnl,\n      return_pct: allocation.returnPct,', 'entry_funds_quote: cost, exit_funds_quote: proceeds, invested_cost_quote: venue === "binance_futures" ? cost / leverage : cost,\n      total_fees_quote: allocation.totalFeesQuote, net_pnl_quote: pnl,\n      return_pct: venue === "binance_futures" && cost > 0 ? pnl / (cost / leverage) * 100 : allocation.returnPct,')
          p = p.replace('exchange: "binance", quote_currency: position.quote_currency || "USDT", market: position.market,', 'exchange: venue, quote_currency: position.quote_currency || "USDT", market: position.market,')
          p = p.replace('entry_funds_quote: cost, exit_funds_quote: 0, invested_cost_quote: cost, current_value_quote: value,\n        total_fees_quote: fee, net_pnl_quote: pnl, return_pct: cost > 0 ? pnl / cost * 100 : 0,', 'entry_funds_quote: cost, exit_funds_quote: 0, invested_cost_quote: venue === "binance_futures" ? cost / leverage : cost, current_value_quote: value,\n        total_fees_quote: fee, net_pnl_quote: pnl, return_pct: cost > 0 ? pnl / (venue === "binance_futures" ? cost / leverage : cost) * 100 : 0,')
          p = p.replace('all("exchange_trade_fills?exchange=eq.binance&position_id=not.is.null&select=', 'all("exchange_trade_fills?exchange=in.(binance,binance_futures)&position_id=not.is.null&select=')
          p = p.replace('select=id,exchange,quote_currency,market,base_asset,state,close_reason,opened_at,closed_at,realized_proceeds_quote,realized_cost_quote,paid_fees_quote,realized_pnl_quote,realized_return_pct,remaining_quantity,created_at', 'select=id,exchange,quote_currency,market,base_asset,state,close_reason,opened_at,closed_at,realized_proceeds_quote,realized_cost_quote,paid_fees_quote,realized_pnl_quote,realized_return_pct,remaining_quantity,leverage,created_at')
          p = p.replace('const result = exchange === "binance"\n        ? buildBinanceRows(p, exchangeFillsByPosition.get(String(p.id)) || [], latestSnap.binance)\n        : buildUpbitRows(p, ordersByPosition.get(String(p.id)) || [], botFillsByOrder, latestSnap.upbit);', 'const result = (exchange === "binance" || exchange === "binance_futures")\n        ? buildBinanceRows(p, exchangeFillsByPosition.get(String(p.id)) || [], exchange === "binance_futures" ? latestSnap.binance_futures : latestSnap.binance)\n        : buildUpbitRows(p, ordersByPosition.get(String(p.id)) || [], botFillsByOrder, latestSnap.upbit);')
          # Add combined aggregate helper before Deno.serve.
          if 'function aggregateBinanceCombined(' not in p:
              agg_marker = '\nDeno.serve(async (req: Request) => {'
              helper = r'''

function aggregateBinanceCombined(rows: JsonRecord[], spotSnapshot: JsonRecord | null, futuresSnapshot: JsonRecord | null): JsonRecord {
  const xs = rows.filter(r => r.exchange === "binance" || r.exchange === "binance_futures");
  const realisedRows = xs.filter(r => r.row_type === "REALIZED_EXIT"), open = xs.filter(r => r.is_open);
  const s = (a: JsonRecord[], k: string) => a.reduce((z, r) => z + num(r[k]), 0);
  const realised = s(realisedRows, "net_pnl_quote"), unrealised = s(open, "net_pnl_quote"), total = realised + unrealised;
  const invested = s(realisedRows, "invested_cost_quote") + s(open, "invested_cost_quote"), investedOpen = s(open, "invested_cost_quote");
  const closedPositions = new Map<string, { pnl: number; cost: number }>();
  for (const row of realisedRows.filter(r => r.position_closed)) {
    const key = String(row.position_id), prev = closedPositions.get(key) || { pnl: 0, cost: 0 };
    prev.pnl += num(row.net_pnl_quote); prev.cost += Math.max(0, num(row.invested_cost_quote)); closedPositions.set(key, prev);
  }
  const closed = [...closedPositions.values()], wins = closed.filter(r => r.pnl > 0), losses = closed.filter(r => r.pnl < 0);
  const gp = wins.reduce((z, r) => z + r.pnl, 0), gl = Math.abs(losses.reduce((z, r) => z + r.pnl, 0));
  const today = kstDay(new Date().toISOString()), todayRows = realisedRows.filter(r => kstDay(r.exit_at) === today);
  return {
    exchange: "binance", venues: ["binance", "binance_futures"], quote_currency: "USDT",
    current_equity_quote: num(spotSnapshot?.total_equity_quote) + num(futuresSnapshot?.total_equity_quote),
    managed_capital_quote: num(spotSnapshot?.managed_capital_quote) + num(futuresSnapshot?.managed_capital_quote),
    realized_net_pnl_quote: realised, open_net_pnl_quote: unrealised, cumulative_net_pnl_quote: total,
    cumulative_return_pct: invested > 0 ? total / invested * 100 : 0,
    current_open_return_pct: investedOpen > 0 ? unrealised / investedOpen * 100 : 0,
    today_net_pnl_quote: s(todayRows, "net_pnl_quote"),
    today_return_pct: s(todayRows, "invested_cost_quote") > 0 ? s(todayRows, "net_pnl_quote") / s(todayRows, "invested_cost_quote") * 100 : 0,
    total_fees_quote: s(xs, "total_fees_quote"), realized_exit_count: realisedRows.length,
    closed_trade_count: closed.length, open_trade_count: open.length,
    win_count: wins.length, loss_count: losses.length, win_rate_pct: closed.length ? wins.length / closed.length * 100 : 0,
    profit_factor: gl > 0 ? gp / gl : gp > 0 ? null : 0,
    average_return_pct: closed.length ? closed.reduce((z, r) => z + (r.cost > 0 ? r.pnl / r.cost * 100 : 0), 0) / closed.length : 0,
    return_basis: "VENUE_AWARE_ACTUAL_EXIT_MARGIN_WEIGHTED", source_of_truth: "BINANCE_SPOT_AND_FUTURES_EXCHANGE_TRADE_FILLS",
  };
}
'''
              if agg_marker not in p: raise SystemExit('performance serve marker missing')
              p = p.replace(agg_marker, helper + agg_marker, 1)
          p = p.replace('source_of_truth: { binance: "exchange_trade_fills direct settlement", upbit: "trading_fills" },', 'source_of_truth: { binance: "spot + futures exchange_trade_fills direct settlement", binance_spot: "exchange_trade_fills", binance_futures: "exchange_trade_fills / fapi userTrades", upbit: "trading_fills" },')
          p = p.replace('balance_snapshot_at: { upbit: latestSnap.upbit?.captured_at || null, binance: latestSnap.binance?.captured_at || null },', 'balance_snapshot_at: { upbit: latestSnap.upbit?.captured_at || null, binance: latestSnap.binance?.captured_at || null, binance_futures: latestSnap.binance_futures?.captured_at || null },')
          p = p.replace('exchanges: { upbit: aggregate("upbit", trades, latestSnap.upbit), binance: aggregate("binance", trades, latestSnap.binance) },', 'exchanges: {\n        upbit: aggregate("upbit", trades, latestSnap.upbit),\n        binance_spot: aggregate("binance", trades, latestSnap.binance),\n        binance_futures: aggregate("binance_futures", trades, latestSnap.binance_futures),\n        binance: aggregateBinanceCombined(trades, latestSnap.binance, latestSnap.binance_futures),\n      },')
          p = p.replace('binance_exit: "Binance SELL은 exchange_trade_fills를 exchange_order_id별로 묶어 분할매도를 각각 표시",', 'binance_exit: "Binance 현물·선물 SELL은 exchange_trade_fills를 exchange_order_id별로 묶어 각각 표시",')
          perf_path.write_text(p)

          # --- UI: BINANCE filter includes spot + futures and shows venue badge --------
          u = ui_path.read_text()
          u = u.replace('.filter(row => exchangeFilter === "all" || String(row?.exchange || "") === exchangeFilter)', '.filter(row => exchangeFilter === "all" || (exchangeFilter === "binance" ? ["binance","binance_futures"].includes(String(row?.exchange || "")) : String(row?.exchange || "") === exchangeFilter))')
          u = u.replace('<td data-label="종목"><strong>${esc(row.market)}</strong>${locked}</td>', '<td data-label="종목"><strong>${esc(row.market)}</strong><small class="realized-fill-count">${row.exchange === "binance_futures" ? "FUTURES" : row.exchange === "binance" ? "SPOT" : "UPBIT"}</small>${locked}</td>')
          u = u.replace('<option value="binance">BINANCE</option>', '<option value="binance">BINANCE · 현물+선물</option>')
          ui_path.write_text(u)

          # Guard assertions.
          checks = {
            sync_path: ['syncFuturesTrades', 'binance_futures", action: "trade_history"', 'settle_futures_position_from_exchange_fills'],
            perf_path: ['aggregateBinanceCombined', 'exchange=in.(binance,binance_futures)', 'binance_futures: aggregate("binance_futures"'],
            ui_path: ['BINANCE · 현물+선물', '"binance_futures"].includes', 'FUTURES'],
          }
          for path, needles in checks.items():
              text = path.read_text()
              for needle in needles:
                  if needle not in text: raise SystemExit(f'{path}: missing {needle}')
          PY

          deno fmt supabase/functions/exchange-trade-sync/index.ts supabase/functions/market-performance/index.ts
          deno check supabase/functions/exchange-trade-sync/index.ts
          deno check supabase/functions/market-performance/index.ts
          node --check docs/realized-performance.js

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/exchange-trade-sync/index.ts supabase/functions/market-performance/index.ts docs/realized-performance.js
          git commit -m "fix: combine Binance spot and futures performance"
          git push origin HEAD:main
