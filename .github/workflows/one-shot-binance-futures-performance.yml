name: One-shot Binance futures performance integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-binance-futures-performance.yml"
      - "scripts/apply_binance_futures_performance.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply integration patch
        run: |
          python3 scripts/apply_binance_futures_performance.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/exchange-trade-sync/index.ts')
          text = path.read_text().replace('ReturnType<typeof createClient>', 'any')
          path.write_text(text)
          PY
      - name: Validate integration
        run: |
          deno fmt supabase/functions/exchange-trade-sync/index.ts supabase/functions/market-performance/index.ts
          deno check supabase/functions/exchange-trade-sync/index.ts
          deno check supabase/functions/market-performance/index.ts
          node --check docs/realized-performance.js
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/exchange-trade-sync/index.ts supabase/functions/market-performance/index.ts docs/realized-performance.js
          git commit -m "fix: combine Binance spot and futures performance"
          git push origin HEAD:main
