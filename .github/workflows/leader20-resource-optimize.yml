name: Optimize existing capture resources and verify capacity
on:
  push:
    branches: [main]
    paths: [deployment-evidence/leader20-resource-request.json]
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Reduce only the existing collector guest and verify ten minutes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ops/leader20/resource-optimize.mjs
      - name: Verify archive and audit collector plus gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ops/leader20/capacity-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leader20-resource-optimization
          path: release-evidence
          retention-days: 7
