name: Deterministic strategy and capture regression
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'supabase/functions/_shared/exit-authority.mjs'
      - 'supabase/functions/_shared/leader-native-protection.mjs'
      - 'test-support/exit-authority-v2/**'
      - 'supabase/migrations/*exit_authority*'
      - 'supabase/functions/v10-lane-executor/**'
      - 'collectors/doa-capture/**'
      - 'supabase/migrations/*capture*'
      - 'test-support/v17-entry/**'
      - 'test-support/v17-exit/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - 'research/qv3/**'
      - 'supabase/functions/_shared/deterministic/**'
      - 'test-support/deterministic/**'
      - '.github/workflows/deepseek-research-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'supabase/functions/_shared/exit-authority.mjs'
      - 'supabase/functions/_shared/leader-native-protection.mjs'
      - 'test-support/exit-authority-v2/**'
      - 'supabase/migrations/*exit_authority*'
      - 'supabase/functions/v10-lane-executor/**'
      - 'collectors/doa-capture/**'
      - 'supabase/migrations/*capture*'
      - 'test-support/v17-entry/**'
      - 'test-support/v17-exit/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - 'research/qv3/**'
      - 'supabase/functions/_shared/deterministic/**'
      - 'test-support/deterministic/**'
      - '.github/workflows/deepseek-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # Existing V17 safety tests compare archived production source commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Install current deterministic verification dependencies
        run: npm ci --prefix test-support/deterministic
      - name: Current market, capture and execution safety regressions (no API keys or deployment)
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pglite/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          npm test --prefix test-support/deterministic
          node --test collectors/doa-capture/*.test.mjs \
            test-support/v17-exit/native-protection.test.mjs \
            test-support/v17-exit/exit-settle.test.mjs \
            test-support/v17-exit/native-fill-reconcile.test.mjs \
            tests/native-submission-phase.test.mjs tests/native-proof-program.test.mjs
