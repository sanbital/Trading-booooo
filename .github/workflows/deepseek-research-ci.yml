name: DeepSeek research regression
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - '.github/workflows/deepseek-research-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - '.github/workflows/deepseek-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.0
      - name: Research, HOLD and final-recheck regressions (no API keys or deployment)
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pglite/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --test \
            tests/fd1-parallel.test.mjs tests/fd1-parallel-deadline.test.mjs \
            tests/fd1-counter-errors.test.mjs tests/fd1-noise-control.test.mjs \
            tests/fd1-temporal.test.mjs tests/fd1-exit-hardening.test.mjs \
            tests/fd1-final-recheck.test.mjs \
            development/gpt-final-decision/tests/fd1.test.mjs \
            development/gpt-final-decision/tests/fd1-hold.test.mjs
