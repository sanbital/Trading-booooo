name: AI strategy and capture regression
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'supabase/functions/v10-lane-executor/**'
      - 'collectors/doa-capture/**'
      - 'supabase/migrations/*capture*'
      - 'test-support/v17-entry/**'
      - 'test-support/v17-exit/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - '.github/workflows/deepseek-research-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'supabase/functions/v10-lane-executor/**'
      - 'collectors/doa-capture/**'
      - 'supabase/migrations/*capture*'
      - 'test-support/v17-entry/**'
      - 'test-support/v17-exit/**'
      - 'tests/fd1-*.test.mjs'
      - 'development/gpt-final-decision/tests/**'
      - 'research/deepseek-counter-20260925/**'
      - 'research/deepseek-temporal-20260925/**'
      - '.github/workflows/deepseek-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # Existing V17 safety tests compare archived production source commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Production arbitration, capture and execution safety regressions (no API keys or deployment)
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pglite/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --test \
            tests/fd1*.test.mjs \
            test-support/v17-entry/*.test.mjs test-support/v17-exit/*.test.mjs \
            collectors/doa-capture/*.test.mjs development/gpt-final-decision/tests/*.test.mjs
