name: One-shot Postpatch Performance Readonly 1758

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-postpatch-performance-readonly-1758.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production trading performance read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -P pager=off -F '|' -A -t <<'SQL'
          BEGIN READ ONLY;
          WITH params AS (
            SELECT timestamptz '2026-08-15 15:35:07+00' AS cut,
                   timestamptz '2026-08-16 08:58:01+00' AS nowt
          ), windows AS (
            SELECT 'post'::text period, cut s, nowt e FROM params
            UNION ALL SELECT 'pre', cut-(nowt-cut), cut FROM params
            UNION ALL SELECT 'prior', cut-2*(nowt-cut), cut-(nowt-cut) FROM params
          ), base AS (
            SELECT w.period,p.* FROM windows w
            JOIN public.trading_positions p ON p.opened_at>=w.s AND p.opened_at<w.e
            WHERE p.is_paper=false AND p.exchange IN ('upbit','binance_futures')
          ), closed AS (
            SELECT * FROM base WHERE state='CLOSED' AND closed_at IS NOT NULL
          )
          SELECT 'AGG',period,exchange,
                 count(*) AS closed_positions,
                 count(*) FILTER (WHERE realized_pnl_quote>0) AS wins,
                 count(*) FILTER (WHERE realized_pnl_quote<=0) AS losses,
                 round(coalesce(sum(realized_pnl_quote),0)::numeric,6) AS pnl,
                 round(avg(realized_return_pct)::numeric,4) AS avg_return_pct,
                 round(avg(realized_return_pct) FILTER (WHERE realized_pnl_quote>0)::numeric,4) AS avg_win_pct,
                 round(avg(realized_return_pct) FILTER (WHERE realized_pnl_quote<=0)::numeric,4) AS avg_loss_pct,
                 count(*) FILTER (WHERE close_reason IN ('STOP','HARD_STOP')) AS hard_stop_like,
                 round(avg(mfe_capture_ratio)::numeric,4) AS mfe_capture_ratio,
                 round(avg(profit_giveback_pct)::numeric,4) AS profit_giveback_pct
          FROM closed GROUP BY period,exchange ORDER BY period,exchange;

          WITH params AS (
            SELECT timestamptz '2026-08-15 15:35:07+00' AS cut,
                   timestamptz '2026-08-16 08:58:01+00' AS nowt
          ), windows AS (
            SELECT 'post'::text period, cut s, nowt e FROM params
            UNION ALL SELECT 'pre', cut-(nowt-cut), cut FROM params
            UNION ALL SELECT 'prior', cut-2*(nowt-cut), cut-(nowt-cut) FROM params
          )
          SELECT 'OPENED',w.period,p.exchange,count(*),count(*) FILTER (WHERE p.state='OPEN'),count(*) FILTER (WHERE p.state='CLOSED')
          FROM windows w JOIN public.trading_positions p ON p.opened_at>=w.s AND p.opened_at<w.e
          WHERE p.is_paper=false AND p.exchange IN ('upbit','binance_futures')
          GROUP BY w.period,p.exchange ORDER BY w.period,p.exchange;

          SELECT 'POST_DETAIL',id,exchange,market,state,opened_at,closed_at,realized_pnl_quote,realized_return_pct,close_reason,peak_return_pct,mfe_capture_ratio,profit_giveback_pct
          FROM public.trading_positions
          WHERE is_paper=false AND opened_at>=timestamptz '2026-08-15 15:35:07+00' AND opened_at<timestamptz '2026-08-16 08:58:01+00'
            AND exchange IN ('upbit','binance_futures')
          ORDER BY opened_at;

          SELECT 'CARRYOVER_CLOSED',id,exchange,market,opened_at,closed_at,realized_pnl_quote,realized_return_pct,close_reason
          FROM public.trading_positions
          WHERE is_paper=false AND opened_at<timestamptz '2026-08-15 15:35:07+00'
            AND closed_at>=timestamptz '2026-08-15 15:35:07+00' AND closed_at<timestamptz '2026-08-16 08:58:01+00'
            AND exchange IN ('upbit','binance_futures')
          ORDER BY closed_at;
          ROLLBACK;
          SQL