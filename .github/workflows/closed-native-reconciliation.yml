name: Reconcile closed native stop records
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: closed-native-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'sanbital/Trading-booooo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify closed native proof and atomically settle only proven records
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
          NATIVE_PROOF_APPLY: 'true'
          NATIVE_PROOF_VERSION: CLOSED_NATIVE_ABSENCE_1
        run: node ops/execution-infra/native-stop-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-closed-reconciliation-${{ github.run_id }}
          path: infra-evidence/*.encrypted.json
          retention-days: 7
          if-no-files-found: error
