name: Deploy recovery 180m v765 now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-recovery-180m-v765-now.yml"

permissions:
  contents: read

concurrency:
  group: deploy-recovery-180m-v765-now
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Final code verification before deploy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          deno check supabase/functions/market-autotrader/index.ts
          deno test \
            supabase/functions/market-autotrader/executable-exit.test.ts \
            supabase/functions/market-autotrader/spot-exit-policy.test.ts \
            supabase/functions/market-autotrader/split-stop-policy.test.ts \
            supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno test --allow-read supabase/functions/market-autotrader/futures-lane.test.ts
          grep -q 'STALE_RECOVERY_NET_POSITIVE_EXIT_180M' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES_STALE_RECOVERY_NET_POSITIVE_EXIT_180M' supabase/functions/market-autotrader/index.ts
          grep -q 'executable_net_allowed: true' supabase/functions/market-autotrader/executable-exit.ts
          grep -q 'action === "EMERGENCY"' supabase/functions/market-autotrader/index.ts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify production DB guard is v765
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null
          result="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 <<'SQL'
          select (
            position('STALE_RECOVERY_NET_POSITIVE_EXIT_180M' in pg_get_functiondef(p.oid)) > 0
            and position('FUTURES_STALE_RECOVERY_NET_POSITIVE_EXIT_180M' in pg_get_functiondef(p.oid)) > 0
            and position('STALE_RECOVERY_REQUIRES_POSITIVE_NET' in pg_get_functiondef(p.oid)) > 0
            and position('pending_exit_reason' in pg_get_functiondef(p.oid)) > 0
            and position('EMERGENCY' in pg_get_functiondef(p.oid)) > 0
          )
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='guard_residual_sell_order_v751';
          SQL
          )"
          test "$result" = "t"

      - name: Deploy market-autotrader
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api
