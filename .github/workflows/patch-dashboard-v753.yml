name: Align dashboard v7.5.3 fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-v753.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch dashboard fallback and cache revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text()
          replacements = {
            '7.5.2-RESIDUAL-TP10-SL4-r4-HIDE-SUB-DOLLAR': '7.5.3-RECOVERY-NET-POSITIVE-r1',
            'UPBIT KRW + BINANCE USDT SPOT · v7.5.2-RESIDUAL-TP10-SL4': 'UPBIT KRW + BINANCE USDT SPOT · v7.5.3-RECOVERY-NET-POSITIVE',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected dashboard token: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          grep -F 'SPOT · v7.5.3-RECOVERY-NET-POSITIVE' docs/index.html
          grep -F 'config.js?v=7.5.3-RECOVERY-NET-POSITIVE-r1' docs/index.html
          grep -F 'app.js?v=7.5.3-RECOVERY-NET-POSITIVE-r1' docs/index.html
      - name: Commit dashboard alignment
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'ui: align fallback banner with v7.5.3'
          git push origin HEAD:main
