name: Postpatch Performance Audit 1205

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-postpatch-performance-1205.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only performance audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -P pager=off -F '|' -A -t <<'SQL'
          with params as (
            select
              timestamptz '2026-08-16 10:16:42+00' as patch_ts,
              timestamptz '2026-08-17 03:05:20+00' as now_ts,
              timestamptz '2026-08-15 17:28:04+00' as prev_equal_start,
              timestamptz '2026-08-15 10:16:42+00' as pre24_start
          ), windows as (
            select 'POST_PATCH'::text label, patch_ts s, now_ts e from params
            union all
            select 'PRE_EQUAL', prev_equal_start, patch_ts from params
            union all
            select 'PRE_24H', pre24_start, patch_ts from params
          ), b as (
            select w.label,
                   case when p.exchange='binance_futures' then 'FUTURES' else 'SPOT' end kind,
                   p.*
            from windows w
            join public.trading_positions p on p.closed_at >= w.s and p.closed_at < w.e
            where p.is_paper=false and p.closed_at is not null
          )
          select 'AGG',label,kind,
                 count(*) closed_positions,
                 count(*) filter (where coalesce(realized_pnl_quote,0)>0) wins,
                 count(*) filter (where coalesce(realized_pnl_quote,0)<0) losses,
                 round(sum(coalesce(realized_pnl_quote,0))::numeric,6) pnl_usdt,
                 round(avg(realized_return_pct)::numeric,4) avg_return_pct,
                 round(avg(realized_return_pct) filter (where coalesce(realized_pnl_quote,0)>0)::numeric,4) avg_win_pct,
                 round(avg(realized_return_pct) filter (where coalesce(realized_pnl_quote,0)<0)::numeric,4) avg_loss_pct,
                 count(*) filter (where coalesce(close_reason,'') in ('STOP','HARD_STOP') or coalesce(close_reason,'') ilike '%STOP%') stop_count,
                 round((100.0*count(*) filter (where coalesce(close_reason,'') in ('STOP','HARD_STOP') or coalesce(close_reason,'') ilike '%STOP%')/nullif(count(*),0))::numeric,2) stop_rate_pct,
                 round(avg(mfe_capture_ratio) filter (where mfe_capture_ratio is not null)::numeric,4) avg_mfe_capture_ratio,
                 count(mfe_capture_ratio) mfe_n,
                 round(avg(profit_giveback_pct) filter (where profit_giveback_pct is not null)::numeric,4) avg_profit_giveback_pct,
                 count(profit_giveback_pct) giveback_n
          from b
          group by label,kind
          order by label,kind;

          with p as (
            select case when exchange='binance_futures' then 'FUTURES' else 'SPOT' end kind,*
            from public.trading_positions
            where is_paper=false and closed_at >= timestamptz '2026-08-16 10:16:42+00'
              and closed_at < timestamptz '2026-08-17 03:05:20+00'
          )
          select 'REASON',kind,coalesce(close_reason,'NULL'),count(*),round(sum(coalesce(realized_pnl_quote,0))::numeric,6)
          from p group by kind,coalesce(close_reason,'NULL') order by kind,4 desc;

          with p as (
            select case when exchange='binance_futures' then 'FUTURES' else 'SPOT' end kind,*
            from public.trading_positions
            where is_paper=false and closed_at >= timestamptz '2026-08-16 10:16:42+00'
              and closed_at < timestamptz '2026-08-17 03:05:20+00'
          )
          select 'TRADE',kind,market,opened_at,closed_at,
                 round(coalesce(realized_pnl_quote,0)::numeric,6),round(realized_return_pct::numeric,4),
                 coalesce(close_reason,'NULL'),round(coalesce(mfe_capture_ratio,0)::numeric,4),round(coalesce(profit_giveback_pct,0)::numeric,4)
          from p order by closed_at;
          SQL
