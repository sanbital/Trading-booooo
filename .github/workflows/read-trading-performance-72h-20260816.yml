name: Read trading performance 72h 20260816

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-trading-performance-72h-20260816.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production trading performance
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          echo '=== DB_NOW ==='
          psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "select now() at time zone 'Asia/Seoul';"

          echo '=== SUMMARY_72H ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            with p as (
              select * from public.trading_positions
              where opened_at >= now() - interval '72 hours' and is_paper=false
            )
            select exchange,
                   count(*) filter(where state='CLOSED') closed,
                   count(*) filter(where state='OPEN') open_now,
                   count(*) filter(where state='CLOSED' and realized_pnl_quote>0) wins,
                   count(*) filter(where state='CLOSED' and realized_pnl_quote<0) losses,
                   round(100.0*count(*) filter(where state='CLOSED' and realized_pnl_quote>0)/nullif(count(*) filter(where state='CLOSED' and realized_pnl_quote<>0),0),2) win_rate_pct,
                   round(sum(realized_pnl_quote) filter(where state='CLOSED')::numeric,6) realized_pnl,
                   round(avg(realized_return_pct) filter(where state='CLOSED')::numeric,4) avg_ret_pct,
                   round(avg(realized_return_pct) filter(where state='CLOSED' and realized_pnl_quote>0)::numeric,4) avg_win_pct,
                   round(avg(realized_return_pct) filter(where state='CLOSED' and realized_pnl_quote<0)::numeric,4) avg_loss_pct,
                   round(avg(peak_return_pct) filter(where state='CLOSED')::numeric,4) avg_peak_pct,
                   round(avg(mfe_capture_ratio) filter(where state='CLOSED' and realized_pnl_quote>0)::numeric,4) avg_mfe_capture_winners,
                   round(avg(profit_giveback_pct) filter(where state='CLOSED')::numeric,4) avg_giveback,
                   round(avg(extract(epoch from (closed_at-opened_at))/60) filter(where state='CLOSED')::numeric,1) avg_hold_min
            from p group by exchange order by exchange;"

          echo '=== DAILY_3D ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select (opened_at at time zone 'Asia/Seoul')::date as day_kst, exchange,
                   count(*) filter(where state='CLOSED') closed,
                   count(*) filter(where state='CLOSED' and realized_pnl_quote>0) wins,
                   count(*) filter(where state='CLOSED' and realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote) filter(where state='CLOSED')::numeric,4) pnl,
                   round(avg(realized_return_pct) filter(where state='CLOSED')::numeric,3) avg_ret,
                   round(avg(realized_return_pct) filter(where state='CLOSED' and realized_pnl_quote>0)::numeric,3) avg_win,
                   round(avg(realized_return_pct) filter(where state='CLOSED' and realized_pnl_quote<0)::numeric,3) avg_loss
            from public.trading_positions
            where opened_at >= now()-interval '72 hours' and is_paper=false
            group by 1,2 order by 1,2;"

          echo '=== RECENT_72H_TRADES ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select exchange, market,
                   to_char(opened_at at time zone 'Asia/Seoul','MM-DD HH24:MI') opened_kst,
                   to_char(closed_at at time zone 'Asia/Seoul','MM-DD HH24:MI') closed_kst,
                   round(realized_pnl_quote::numeric,4) pnl,
                   round(realized_return_pct::numeric,3) ret_pct,
                   round(peak_return_pct::numeric,3) peak_pct,
                   round(profit_giveback_pct::numeric,3) giveback_pct,
                   round(mfe_capture_ratio::numeric,3) capture_ratio,
                   round((extract(epoch from (closed_at-opened_at))/60)::numeric,1) hold_min,
                   close_reason
            from public.trading_positions
            where opened_at >= now()-interval '72 hours' and is_paper=false and state='CLOSED'
            order by opened_at;"

          echo '=== LOSS_CONCENTRATION ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select exchange, market, count(*) losses,
                   round(sum(realized_pnl_quote)::numeric,4) pnl,
                   round(avg(realized_return_pct)::numeric,3) avg_ret,
                   round(avg(peak_return_pct)::numeric,3) avg_peak
            from public.trading_positions
            where opened_at >= now()-interval '72 hours' and is_paper=false and state='CLOSED' and realized_pnl_quote<0
            group by exchange, market order by sum(realized_pnl_quote) asc;"

          echo '=== CLOSE_REASON ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select exchange, coalesce(close_reason,'NULL') close_reason,
                   count(*) n,
                   count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,4) pnl,
                   round(avg(realized_return_pct)::numeric,3) avg_ret
            from public.trading_positions
            where opened_at >= now()-interval '72 hours' and is_paper=false and state='CLOSED'
            group by exchange, coalesce(close_reason,'NULL') order by exchange,n desc;"

          echo '=== HOURLY_KST ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select exchange, extract(hour from opened_at at time zone 'Asia/Seoul')::int hour_kst,
                   count(*) n,
                   count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,4) pnl,
                   round(avg(realized_return_pct)::numeric,3) avg_ret
            from public.trading_positions
            where opened_at >= now()-interval '72 hours' and is_paper=false and state='CLOSED'
            group by exchange,2 order by exchange,2;"

          echo '=== CANDIDATE_SCORE_SPLIT ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            with x as (
              select p.exchange,p.realized_pnl_quote,p.realized_return_pct,p.peak_return_pct,
                     c.score,c.period_score,coalesce((c.snapshot->>'change_24h_pct')::numeric,0) change24
              from public.trading_positions p
              left join public.scanner_candidates c on c.id=p.candidate_id
              where p.opened_at >= now()-interval '72 hours' and p.is_paper=false and p.state='CLOSED'
            )
            select exchange,
                   case when change24>=25 then 'change24_25_plus' else 'change24_under_25' end bucket,
                   count(*) n,
                   count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,4) pnl,
                   round(avg(realized_return_pct)::numeric,3) avg_ret,
                   round(avg(peak_return_pct)::numeric,3) avg_peak,
                   round(avg(score)::numeric,2) avg_score,
                   round(avg(period_score)::numeric,2) avg_period
            from x group by 1,2 order by 1,2;"

          echo '=== PRE_T1_LOSS_RECURRANCE ==='
          psql "${SUPABASE_DB_URL}" -P pager=off --set=ON_ERROR_STOP=1 -c "
            select count(*) as loss_pre_t1_after_fix,
                   round(coalesce(sum(realized_pnl_quote),0)::numeric,6) pnl
            from public.trading_positions
            where closed_at >= timestamptz '2026-08-12 23:11:40+00'
              and is_paper=false and state='CLOSED'
              and realized_pnl_quote < 0
              and coalesce(close_reason,'') ilike '%PRE_T1%';"
