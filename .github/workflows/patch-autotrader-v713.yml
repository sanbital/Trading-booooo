name: Patch autotrader v7.1.3 exit policy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-autotrader-v713.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical LOB exit policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/market-autotrader/index.ts")
          text = path.read_text(encoding="utf-8")

          old_version = 'const VERSION = "7.1.1-LOB-45S-PROFIT-OR-5PCT";'
          new_version = 'const VERSION = "7.1.3-180S-NET1-OR-MINUS3";'
          if old_version in text:
              text = text.replace(old_version, new_version, 1)
          elif new_version not in text:
              raise SystemExit("version patch point missing")

          old_target = '''    const targetPct = decision.targetBps / 10000;
              // The model stop remains available for entry EV, but execution uses the user's
              // single hard-loss boundary. No tighter LOB stop may liquidate a losing position.
              const stopPct = 0.05;
              scalpStopPrice = tickRound(entryPrice * (1 - stopPct), rules.price_tick, "down");
              scalpTarget1 = tickRound(entryPrice * (1 + targetPct), rules.price_tick, "up");
              scalpTarget2 = scalpTarget1;'''.replace("              ", "")

          new_target = '''    const targetPct = decision.targetBps / 10000;
              // v7.1.3: every target must remain at least one quote-currency unit profitable
              // after round-trip fees and a conservative p95 exit-price shortfall.
              const targetFeeRate = clamp(FEE_PCT[exchange] / 100, 0, 0.01);
              const targetShortfallBps = exchange === "upbit" ? 20 : 50;
              const targetEntryCost = entryPrice * quantity * (1 + targetFeeRate);
              const netOneTargetPrice = ((targetEntryCost + 1) / (quantity * (1 - targetFeeRate))) /
                (1 - targetShortfallBps / 10000);
              const stopPct = 0.03;
              scalpStopPrice = tickRound(entryPrice * (1 - stopPct), rules.price_tick, "down");
              scalpTarget1 = tickRound(
                Math.max(entryPrice * (1 + targetPct), netOneTargetPrice),
                rules.price_tick,
                "up",
              );
              scalpTarget2 = scalpTarget1;'''.replace("              ", "")

          if old_target in text:
              text = text.replace(old_target, new_target, 1)
          elif "const netOneTargetPrice" not in text:
              raise SystemExit("target geometry patch point missing")

          revision = "7.1.3-180S-NET1-OR-MINUS3"
          if 'reason: "lob:post-180-hold-until-net1-or-minus3pct"' not in text:
              marker = '      if (decision.action === "NONE") continue;'
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit("canonical exit insertion point missing")

              policy = '''      // v7.1.3 canonical LOB exit policy. This final override runs after target,
              // trail, LOB invalidation, live-hold and loss-backstop decisions so none can bypass it.
              if (lobMode && !settings.emergency_liquidation) {
                const policyFeeRate = clamp(FEE_PCT[exchange] / 100, 0, 0.01);
                const policyQuantity = Math.max(0, finite(position.remaining_quantity));
                const policyShortfallBps = exchange === "upbit" ? 20 : 50;
                const guardedExitPrice = current * (1 - policyShortfallBps / 10000);
                const policyEntryCost = lobEntryPrice * policyQuantity * (1 + policyFeeRate);
                const guardedNetProfitQuote =
                  guardedExitPrice * policyQuantity * (1 - policyFeeRate) - policyEntryCost;
                const drawdownPct = lobEntryPrice > 0
                  ? (current / lobEntryPrice - 1) * 100
                  : 0;
                const requestedAction = decision.action;

                if (heldSeconds < 180) {
                  decision = requestedAction !== "NONE" && guardedNetProfitQuote >= 1
                    ? {
                      action: "TARGET_1",
                      fraction: 1,
                      reason: "lob:pre-180-target-guarded-net-at-least-1",
                    }
                    : {
                      action: "NONE",
                      fraction: 0,
                      reason: "lob:pre-180-hold-no-stop-no-loss-exit",
                    };
                } else if (guardedNetProfitQuote >= 1) {
                  decision = {
                    action: "TARGET_1",
                    fraction: 1,
                    reason: "lob:post-180-guarded-net-at-least-1",
                  };
                } else if (drawdownPct <= -3) {
                  decision = {
                    action: "STOP",
                    fraction: 1,
                    reason: "lob:post-180-minus-3pct-stop",
                  };
                } else {
                  decision = {
                    action: "NONE",
                    fraction: 0,
                    reason: "lob:post-180-hold-until-net1-or-minus3pct",
                  };
                }

                if (decision.action !== "NONE") {
                  position = {
                    ...position,
                    ...(await patch("trading_positions", `id=eq.${position.id}`, {
                      metadata: {
                        ...(position.metadata || {}),
                        exit_policy_quote: {
                          revision: "7.1.3-180S-NET1-OR-MINUS3",
                          price: current,
                          measured_at: new Date().toISOString(),
                          held_seconds: heldSeconds,
                          guarded_net_profit_quote: guardedNetProfitQuote,
                          drawdown_pct: drawdownPct,
                          requested_action: requestedAction,
                          approved_action: decision.action,
                        },
                      },
                    }))[0],
                  };
                }
              }

          '''.replace("              ", "")
              text = text[:index] + policy + text[index:]

          path.write_text(text, encoding="utf-8")

          final = path.read_text(encoding="utf-8")
          checks = {
              "engine version": new_version in final,
              "dynamic net-one target": "const netOneTargetPrice" in final,
              "three-percent stop geometry": "const stopPct = 0.03;" in final,
              "pre-180 no-loss rule": "lob:pre-180-hold-no-stop-no-loss-exit" in final,
              "post-180 net-one exit": "lob:post-180-guarded-net-at-least-1" in final,
              "post-180 minus-three stop": "lob:post-180-minus-3pct-stop" in final,
              "fresh quote audit": "exit_policy_quote" in final,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("policy checks failed: " + ", ".join(failed))
          for name in checks:
              print("PASS:", name)
          PY

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and validate source
        run: |
          deno fmt supabase/functions/market-autotrader/index.ts
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("supabase/functions/market-autotrader/index.ts").read_text()
          assert text.count('reason: "lob:post-180-hold-until-net1-or-minus3pct"') == 1
          assert text.rfind('reason: "lob:post-180-hold-until-net1-or-minus3pct"') < text.rfind('if (decision.action === "NONE") continue;')
          print("PASS: canonical override is immediately upstream of final execution gate")
          PY

      - name: Commit static operating source
        run: |
          git config user.name "trading-booooo-deploy-bot"
          git config user.email "trading-booooo-deploy-bot@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          if git diff --cached --quiet; then
            echo "Source already contains v7.1.3 policy."
          else
            git commit -m "fix(autotrader): enforce 180s net1 or minus3 exit policy"
            git push origin HEAD:main
          fi
