      REVISION: ${{ needs.start.outputs.revision }}
      SOURCE_SHA: ${{ needs.start.outputs.source_sha }}
      IMPLEMENTATION_SHA256: ${{ needs.start.outputs.implementation_sha256 }}
    steps:
      - name: Run three all-fold logical shards from worker ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(psql "$SUPABASE_DB_URL" -XAt -v ON_ERROR_STOP=1 <<'SQL'
          select token from edge_internal_tokens where name = 'market-v2-research';
          SQL
          )
          test "$(printf '%s\n' "$token" | sed '/^$/d' | wc -l)" = "1"
          worker='${{ matrix.shard }}'
          for logical_shard in "$worker" "$((worker + 200))" "$((worker + 400))"; do
            trace_dir="$RUNNER_TEMP/v5-trace/backtest/$(printf '%03d' "$logical_shard")"
            mkdir -p "$trace_dir"
            payload=$(jq -cn \
              --arg job_id "$JOB_ID" \
              --argjson shard_index "$logical_shard" \
              --argjson shard_count "$BACKTEST_SHARDS" \
              '{action:"backtest_shard_v5",job_id:$job_id,shard_index:$shard_index,shard_count:$shard_count}')
            printf '%s\n' "$payload" > "$trace_dir/request.json"
            status=$(curl --silent --show-error \
              --connect-timeout 20 --max-time 400 --retry 2 --retry-all-errors \
              --output "$trace_dir/response.json" --write-out '%{http_code}' \
              --header 'content-type: application/json' \
              --header "x-v2-research-token: $token" \
              --data-binary "$payload" "$EDGE_URL")
            printf '%s\n' "$status" > "$trace_dir/http-status.txt"
            test "$status" = "200"
            jq -e \
              --arg job "$JOB_ID" --arg revision "$REVISION" \
              --arg source_sha "$SOURCE_SHA" --arg implementation_sha256 "$IMPLEMENTATION_SHA256" \
              --argjson shard "$logical_shard" \
              --argjson candidates "$EXPECTED_CANDIDATES" \
              '.ok == true and .action == "backtest_shard_v5" and
               .job_id == $job and .revision == $revision and
               .source_sha == $source_sha and .implementation_sha256 == $implementation_sha256 and
               .shard_index == $shard and .shard_count == 600 and
               .failed_markets == [] and .successful_markets == .assigned_markets and
               .result_rows == (.successful_markets * $candidates * 4 * 3)' \
              "$trace_dir/response.json" >/dev/null
            sha256sum "$trace_dir"/* > "$trace_dir/SHA256SUMS"
          done

      - name: Upload backtest shard trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v5-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.start.outputs.job_id }}-backtest-${{ matrix.shard }}
          path: ${{ runner.temp }}/v5-trace
          if-no-files-found: error
          overwrite: false
          retention-days: 90

