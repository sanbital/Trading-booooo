name: Apply planned stop reason fix

on:
  push:
    branches:
      - agent/fix-planned-stop-reason-independent

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[planned-stop-reason-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-planned-stop-reason-independent
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact source replacement
        run: python3 scripts/apply-planned-stop-reason-fix.py
      - name: Format and verify
        run: |
          deno fmt supabase/functions/market-autotrader/index.ts
          git diff --check
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix: authorize planned LOB stop by price condition [planned-stop-reason-applied]"
          git push origin HEAD:agent/fix-planned-stop-reason-independent
