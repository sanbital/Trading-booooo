name: Hotfix full exit quantity authorization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-full-exit-quantity.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-full-exit-quantity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch exit sizing authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/market-autotrader/index.ts')
          s = p.read_text()
          old = '''  // Every reason that is allowed to liquidate the half the first leg protected.\n  const residualThresholdExit = decisionReason === "RESIDUAL_TAKE_PROFIT_10" ||\n    decisionReason === "RESIDUAL_STOP_LOSS_4" ||\n    decisionReason === "FUTURES_RESIDUAL_TAKE_PROFIT_ROE_30" || recoveryNetPositive;\n  const protectedHoldQuantity = residualThresholdExit\n    ? 0\n    : Math.max(0, finite(position.initial_quantity) * 0.5);'''
          new = '''  // Every reason that must be allowed to liquidate the protected half.\n  // First take-profit (+5% spot / +15% futures ROE) is the only split-exit path that\n  // preserves 50%. Hard stops and residual protected-trail exits must close everything\n  // still remaining. Keep legacy residual reasons authorized for already-open positions.\n  const fullLiquidationExit = decisionReason === "HALF_HOLD_STOP_LOSS_4" ||\n    decisionReason === "FUTURES_HALF_STOP_LOSS_ROE_12" ||\n    decisionReason === "RESIDUAL_PROTECTED_TRAIL_EXIT" ||\n    decisionReason === "FUTURES_RESIDUAL_PROTECTED_TRAIL_EXIT" ||\n    decisionReason === "RESIDUAL_TAKE_PROFIT_10" ||\n    decisionReason === "RESIDUAL_STOP_LOSS_4" ||\n    decisionReason === "FUTURES_RESIDUAL_TAKE_PROFIT_ROE_30" || recoveryNetPositive;\n  const protectedHoldQuantity = fullLiquidationExit\n    ? 0\n    : Math.max(0, finite(position.initial_quantity) * 0.5);'''
          if old not in s:
              raise SystemExit('expected exit sizing block not found; refusing blind patch')
          p.write_text(s.replace(old, new, 1))

          test = Path('supabase/functions/market-autotrader/futures-lane.test.ts')
          t = test.read_text()
          marker = 'Deno.test("engine full-liquidation reasons release the protected half", () => {'
          if marker not in t:
              t += '''\n\nDeno.test("engine full-liquidation reasons release the protected half", () => {\n  assert(ENGINE.includes('decisionReason === "HALF_HOLD_STOP_LOSS_4"'));\n  assert(ENGINE.includes('decisionReason === "FUTURES_HALF_STOP_LOSS_ROE_12"'));\n  assert(ENGINE.includes('decisionReason === "RESIDUAL_PROTECTED_TRAIL_EXIT"'));\n  assert(ENGINE.includes('decisionReason === "FUTURES_RESIDUAL_PROTECTED_TRAIL_EXIT"'));\n  assert(ENGINE.includes('const protectedHoldQuantity = fullLiquidationExit'));\n});\n'''
              test.write_text(t)
          PY
          deno fmt supabase/functions/market-autotrader/index.ts supabase/functions/market-autotrader/futures-lane.test.ts
          deno test supabase/functions/market-autotrader/spot-exit-policy.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno test --allow-read supabase/functions/market-autotrader/futures-lane.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          git diff --check
      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-full-exit-quantity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts supabase/functions/market-autotrader/futures-lane.test.ts .github/workflows/hotfix-full-exit-quantity.yml
          git commit -m "fix: release protected half on hard stop and trail exit"
          git push origin HEAD:main
