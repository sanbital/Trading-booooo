name: Run LOB consistency hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-lob-consistency-hotfix.yml

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: etaajwpernzrcdrifdnw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and apply hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/lob-consistency-hotfix.yml').read_text()
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('embedded hotfix script not found')
          script = textwrap.dedent(match.group(1))
          Path('/tmp/lob_hotfix.py').write_text(script)
          PY
          python3 /tmp/lob_hotfix.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and validate
        run: |
          deno fmt \
            supabase/functions/_shared/lob/patterns.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          git diff --check

      - name: Commit operating code
        run: |
          git config user.name trading-booooo-deploy-bot
          git config user.email trading-booooo-deploy-bot@users.noreply.github.com
          git add supabase/functions
          git commit -m "fix: align LOB collection and admission"
          git push origin HEAD:main

      - name: Verify Supabase credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy market scanner
        run: npx --yes supabase@latest functions deploy market-scanner --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy market autotrader
        run: npx --yes supabase@latest functions deploy market-autotrader --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Confirm functions
        run: npx --yes supabase@latest functions list --project-ref "$PROJECT_REF"
