name: Deploy B06133 entry selection

on:
  push:
    branches: [release/b06133-live-20260920]
    paths:
      - "supabase/functions/_shared/leader-b06133-entry.mjs"
      - "supabase/functions/_shared/leader-b06133-entry.test.mjs"
      - "supabase/functions/v10-lane-executor/index.ts"
      - ".github/workflows/deploy-b06133-entry-selection-20260920.yml"

permissions:
  contents: write

concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false

env:
  BASELINE_SHA: c8700c5638b8bb551701ae8aa93f796b5994406d
  EXPECTED_VERSION_BEFORE: "55"
  EXPECTED_EXECUTOR_HASH: 02cad3b5cef307fa68575205c9d930ec70553dcbe2c6203eb6fe2aca42e8c907
  EXPECTED_GENERATOR_HASH: e7472bc415192794438eb4a2910b6fc20789a93bfef6e4cbeba6f46a4a8e7186
  B06133_VERSION: B06133_ENTRY_SELECTION_1
  FROZEN_ASOF: "2026-09-20T07:03:54.503Z"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove release scope and frozen operating constraints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/release-sha.txt
          test "$(git merge-base "$BASELINE_SHA" HEAD)" = "$BASELINE_SHA"
          changed="$(git diff --name-only "$BASELINE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/deploy-b06133-entry-selection-20260920.yml \
            supabase/functions/_shared/leader-b06133-entry.mjs \
            supabase/functions/_shared/leader-b06133-entry.test.mjs \
            supabase/functions/v10-lane-executor/index.ts | sort)"
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }
          grep -Fq 'targetMarginUsdt: 200' supabase/functions/_shared/leader-slot-sizing.mjs
          grep -Fq 'leverage: 3' supabase/functions/_shared/leader-slot-sizing.mjs
          grep -Fq 'const MAX_SLOTS=10' supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const SETUP_MAX_CONCURRENT=2' supabase/functions/v10-lane-executor/index.ts
          # Exit, stop, settlement, reconciliation, lease and fencing code is outside scope.
          git diff --quiet "$BASELINE_SHA" HEAD -- \
            supabase/functions/_shared/leader-exit-review.mjs \
            supabase/functions/_shared/leader-entry-protection.mjs \
            supabase/functions/_shared/leader-protection-adapter.mjs \
            supabase/functions/_shared/leader-entry-settlement.mjs \
            supabase/functions/_shared/leader-exit-settlement.mjs \
            supabase/functions/_shared/leader-db-only-reconciliation.mjs \
            supabase/functions/_shared/leader-entry-control.mjs \
            supabase/functions/_shared/leader-ops-isolation.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test exact logic, integration ordering and deployable graph
        shell: bash
        run: |
          set -euo pipefail
          node --test supabase/functions/_shared/leader-b06133-entry.test.mjs \
            supabase/functions/v10-lane-executor/entry-evidence.test.mjs \
            | tee release-evidence/tests.tap
          node --check supabase/functions/_shared/leader-b06133-entry.mjs
          node --check supabase/functions/v10-lane-executor/index.ts
          npm exec --yes --package=deno@2.5.6 -- deno check \
            supabase/functions/v10-lane-executor/index.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Prove production is the frozen CURRENT code and capture safety state
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > release-evidence/functions-before.json
          python - <<'PY'
          import json,os
          rows=json.load(open('release-evidence/functions-before.json'))
          rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
          row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
          generator=next(x for x in rows if x.get('slug')=='v10-lane-signal-generator')
          assert row.get('status')=='ACTIVE' and row.get('verify_jwt') is False, row
          assert int(row['version'])==int(os.environ['EXPECTED_VERSION_BEFORE']), row
          assert row.get('ezbr_sha256')==os.environ['EXPECTED_EXECUTOR_HASH'], row
          assert generator.get('status')=='ACTIVE' and generator.get('verify_jwt') is False, generator
          assert int(generator['version'])==23 and generator.get('ezbr_sha256')==os.environ['EXPECTED_GENERATOR_HASH'], generator
          open('release-evidence/version-before.txt','w').write(str(row['version'])+'\n')
          open('release-evidence/hash-before.txt','w').write(row['ezbr_sha256']+'\n')
          PY
          mkdir -p release-evidence/production-before
          supabase functions download v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api --workdir "$PWD/release-evidence/production-before"
          node test-support/v19-ops/verify-downloaded-function.mjs \
            release-evidence/production-before . "$BASELINE_SHA" \
            > release-evidence/current-source-parity.json

          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select jsonb_build_object('observed_at',clock_timestamp(),'settings',(select to_jsonb(s) from (select mode,pause_new_entries,withdrawal_mode,manual_intervention_required,scalp_kill_switch,emergency_liquidation,pause_lock_reason,binance_futures_allocation_usdt,binance_futures_leverage from public.trading_settings where id=1) s),'control',(select to_jsonb(c) from (select entry_enabled,legacy_entries_retired from public.v17_operator_control where singleton) c),'runtime',(select to_jsonb(r) from (select revision,live_enabled,circuit_open,last_error,last_cycle_started_at,last_cycle_completed_at,protection_health from public.v11_long_regime_runtime where singleton) r),'pending_orders',(select count(*) from public.v11_long_regime_orders where state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED')),'duplicate_client_ids',(select count(*) from (select client_order_id from public.v11_long_regime_orders group by client_order_id having count(*)>1) d))" \
            > release-evidence/safety-before.json
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'symbol',symbol,'entry_at',entry_at,'original_quantity',original_quantity,'remaining_quantity',remaining_quantity,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','protection',metadata->'exitProtection') order by id),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-before.json
          python - <<'PY'
          import json
          x=json.load(open('release-evidence/safety-before.json'))
          s,c,r=x['settings'],x['control'],x['runtime']
          assert s['mode']=='LIVE_LIMITED' and s['pause_new_entries'] is False, s
          assert not any(s[k] for k in ('withdrawal_mode','manual_intervention_required','scalp_kill_switch','emergency_liquidation')), s
          assert s['pause_lock_reason'] is None and float(s['binance_futures_allocation_usdt'])==200, s
          assert float(s['binance_futures_leverage'])==3, s
          assert c=={'entry_enabled':True,'legacy_entries_retired':True}, c
          assert r['revision']=='V11-LONG-REGIME-1.0.1' and r['live_enabled'] is True and r['circuit_open'] is False, r
          assert x['duplicate_client_ids']==0, x
          PY

      - name: Compare latest DB CURRENT with conservative B06133 bounds
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select jsonb_build_object('asof',clock_timestamp(),'rows',coalesce(jsonb_agg(jsonb_build_object('id',id,'symbol',symbol,'entry_at',entry_at,'closed_at',closed_at,'net200',realized_pnl_usdt::numeric*200/nullif((metadata->>'sizedMarginUsdt')::numeric,0)) order by entry_at),'[]'::jsonb)) from public.v11_long_regime_positions where state='CLOSED' and metadata->>'executionMode'='LEADER_MOMENTUM_V17' and entry_at>=clock_timestamp()-interval '48 hours' and realized_pnl_usdt is not null and (metadata->>'sizedMarginUsdt')::numeric>0" \
            > release-evidence/latest-db-rows.json
          python - <<'PY'
          import datetime,json,os
          doc=json.load(open('release-evidence/latest-db-rows.json'))
          asof=datetime.datetime.fromisoformat(doc['asof'])
          frozen=datetime.datetime.fromisoformat(os.environ['FROZEN_ASOF'])
          selected=set('''74956834-7198-4ba1-b034-5575ce188623
          064571ec-8beb-4432-b3ef-268c3b9489da
          25152181-0b8c-49d9-b704-cfb47da3059c
          4c0766fa-c25a-4700-b98b-f83922bc50fd
          79c39831-a27d-4567-afd9-f3e5c96d56f8
          6cf8421b-a933-45e1-aa06-8a983c000f95
          966a11a1-c679-40ae-b432-38d317be7c0b
          13092375-c9f9-4b68-996e-9320d60e09ba
          cf2b9a80-49b5-4990-b325-4465853a9cb6
          aa2a021f-11c0-444f-a41d-bff8f0698ddb
          38ff6ff6-19ea-41db-8713-6abd57ea75d9'''.split())
          result={'asof':doc['asof'],'method':'Frozen decisions through 2026-09-20T07:03:54.503Z; later-closed rows are UNKNOWN. Bounds never impute a decision.','windows':{}}
          for hours in (24,48):
              cutoff=asof-datetime.timedelta(hours=hours)
              rows=[r for r in doc['rows'] if datetime.datetime.fromisoformat(r['entry_at'])>=cutoff]
              current=sum(float(r['net200']) for r in rows)
              known=[r for r in rows if r['id'] in selected]
              unknown=[r for r in rows if datetime.datetime.fromisoformat(r['closed_at'])>frozen and r['id'] not in selected]
              base=sum(float(r['net200']) for r in known)
              low=base+sum(min(0,float(r['net200'])) for r in unknown)
              high=base+sum(max(0,float(r['net200'])) for r in unknown)
              result['windows'][str(hours)]={'current':current,'b06133Lower':low,'b06133Upper':high,
                'currentTrades':len(rows),'knownSelectedTrades':len(known),'unknownTrades':len(unknown),
                'unknownIds':[r['id'] for r in unknown]}
              assert low>current, f'B06133 superiority is no longer established at {hours}h: {result}'
          result['frozen']={'asof':'2026-09-20T07:03:54Z','db24h':{'current':40.98,'b06133':83.54},
            'db48h':{'current':53.86,'b06133':75.87},'cache7d':{'current':-295.97,'b06133':246.53},
            'cache30d':{'current':-3224.76,'b06133':479.77},
            'stress30dHighFirst44bp':{'b06133':-325.46,'robust':False}}
          json.dump(result,open('release-evidence/comparison.json','w'),indent=2)
          print(json.dumps(result,indent=2))
          PY

      - name: Recheck serialization and deploy only v10-lane-executor
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > release-evidence/functions-immediate-predeploy.json
          python - <<'PY'
          import json
          def one(path):
              x=json.load(open(path)); x=x.get('functions',x) if isinstance(x,dict) else x
              return next(r for r in x if r.get('slug')=='v10-lane-executor')
          a,b=one('release-evidence/functions-before.json'),one('release-evidence/functions-immediate-predeploy.json')
          assert int(a['version'])==int(b['version']) and a['ezbr_sha256']==b['ezbr_sha256'], (a,b)
          PY
          psql "${{ secrets.SUPABASE_DB_URL }}" -XAt --set=ON_ERROR_STOP=1 -c \
            "select to_char(clock_timestamp() at time zone 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS.MS')||'Z'" \
            > release-evidence/deploy-started-at.txt
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api

      - name: Verify active version, exact source and read-only live preflight
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
              > release-evidence/functions-after.json
            if python - <<'PY'
          import json,sys
          x=json.load(open('release-evidence/functions-after.json')); x=x.get('functions',x) if isinstance(x,dict) else x
          row=next(r for r in x if r.get('slug')=='v10-lane-executor')
          before=int(open('release-evidence/version-before.txt').read())
          sys.exit(0 if int(row['version'])==before+1 and row.get('status')=='ACTIVE' else 1)
          PY
            then break; fi
            test "$i" -lt 24 || exit 1
            sleep 5
          done
          python - <<'PY'
          import json
          x=json.load(open('release-evidence/functions-after.json')); x=x.get('functions',x) if isinstance(x,dict) else x
          row=next(r for r in x if r.get('slug')=='v10-lane-executor')
          before=int(open('release-evidence/version-before.txt').read())
          old_hash=open('release-evidence/hash-before.txt').read().strip()
          assert int(row['version'])==before+1 and row.get('status')=='ACTIVE' and row.get('verify_jwt') is False, row
          assert row.get('ezbr_sha256')!=old_hash, row
          PY
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select to_char(clock_timestamp() at time zone 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS.MS')||'Z'" \
            > release-evidence/deployed-at.txt
          mkdir -p release-evidence/production-after
          supabase functions download v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api --workdir "$PWD/release-evidence/production-after"
          node test-support/v19-ops/verify-downloaded-function.mjs \
            release-evidence/production-after . > release-evidence/deployed-source-parity.json
          found="$(find release-evidence/production-after -type f -path '*/functions/_shared/leader-b06133-entry.mjs' -print -quit)"
          test -n "$found" && cmp "$found" supabase/functions/_shared/leader-b06133-entry.mjs

          token="$(psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c "select token from public.edge_internal_tokens where name='v10-lane-executor'")"
          curl -fsS --max-time 25 -X POST \
            -H "content-type: application/json" -H "x-v10-executor-token: $token" \
            -d '{"mode":"preflight","symbol":"BTCUSDT"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/v10-lane-executor" \
            > release-evidence/live-preflight.json
          python - <<'PY'
          import json,os
          x=json.load(open('release-evidence/live-preflight.json'))
          assert x.get('ok') is True and x.get('patch')=='B06133-ENTRY-SELECTION-1', x
          assert x.get('b06133Runtime')=={'version':os.environ['B06133_VERSION'],'scope':'NEW_ENTRIES_AFTER_PULLBACK_REACCEL_TRIGGER','enabled':True}, x
          assert x.get('maxSlots')==10 and float(x['sizingContract']['targetMarginUsdt'])==200
          assert float(x['sizingContract']['leverage'])==3
          PY

      - name: Observe scheduler and verify positions, protection and order idempotency
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os,subprocess,time
          deployed=datetime.datetime.fromisoformat(open('release-evidence/deployed-at.txt').read().strip())
          seen=[]
          query="select jsonb_build_object('completed',last_cycle_completed_at,'error',last_error,'circuit',circuit_open,'protection',protection_health,'entry_block',entry_block_reason) from public.v11_long_regime_runtime where singleton"
          for _ in range(24):
              row=json.loads(subprocess.check_output(['psql',os.environ['SUPABASE_DB_URL'],'-XAt','--set=ON_ERROR_STOP=1','-c',query],text=True))
              at=row.get('completed')
              if at and datetime.datetime.fromisoformat(at)>deployed and at not in {x['completed'] for x in seen}:
                  seen.append(row)
                  if len(seen)>=2: break
              time.sleep(10)
          assert len(seen)>=2, seen
          assert all(not x['circuit'] and not x['error'] for x in seen), seen
          json.dump(seen,open('release-evidence/cycles.json','w'),indent=2)
          PY
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select coalesce(jsonb_agg(jsonb_build_object('id',id,'symbol',symbol,'entry_at',entry_at,'original_quantity',original_quantity,'remaining_quantity',remaining_quantity,'hard_stop_price',hard_stop_price,'exit_policy',metadata->>'leaderExitPolicyVersion','protection',metadata->'exitProtection') order by id),'[]'::jsonb) from public.v11_long_regime_positions where state='OPEN'" \
            > release-evidence/open-positions-after.json
          psql "$SUPABASE_DB_URL" -XAt --set=ON_ERROR_STOP=1 -c \
            "select jsonb_build_object('new_open_intents',(select count(*) from public.v11_long_regime_orders where intent='OPEN_LONG' and created_at>='$(cat release-evidence/deployed-at.txt)'::timestamptz),'missing_b06133',(select count(*) from public.v11_long_regime_orders where intent='OPEN_LONG' and created_at>='$(cat release-evidence/deployed-at.txt)'::timestamptz and request_payload->'entry_selection'->>'version' is distinct from '$B06133_VERSION'),'new_reconciliation_failures',(select count(*) from public.v11_long_regime_orders where created_at>='$(cat release-evidence/deployed-at.txt)'::timestamptz and state='RECONCILIATION_FAILED'),'duplicate_client_ids',(select count(*) from (select client_order_id from public.v11_long_regime_orders group by client_order_id having count(*)>1) d),'b06133_decisions',(select count(*) from public.v11_long_regime_decisions where decided_at>='$(cat release-evidence/deployed-at.txt)'::timestamptz and details->'b06133'->>'version'='$B06133_VERSION'))" \
            > release-evidence/order-health.json
          python - <<'PY'
          import json
          before={x['id']:x for x in json.load(open('release-evidence/open-positions-before.json'))}
          after={x['id']:x for x in json.load(open('release-evidence/open-positions-after.json'))}
          for pid,old in before.items():
              new=after.get(pid)
              if new is None: continue
              assert new['entry_at']==old['entry_at'] and new['exit_policy']==old['exit_policy'], (old,new)
              assert float(new['original_quantity'])==float(old['original_quantity']), (old,new)
              assert float(new['remaining_quantity'])<=float(old['remaining_quantity'])+1e-12, (old,new)
              assert float(new['hard_stop_price'])+1e-12>=float(old['hard_stop_price']), (old,new)
          h=json.load(open('release-evidence/order-health.json'))
          assert h['missing_b06133']==0 and h['new_reconciliation_failures']==0 and h['duplicate_client_ids']==0, h
          print('preserved pre-existing positions:',len(before),'order health:',h)
          PY

      - name: Write durable deployment evidence to the release branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json,os
          def load(name): return json.load(open('release-evidence/'+name))
          funcs=load('functions-after.json'); funcs=funcs.get('functions',funcs) if isinstance(funcs,dict) else funcs
          function=next(x for x in funcs if x.get('slug')=='v10-lane-executor')
          out={'releaseSha':open('release-evidence/release-sha.txt').read().strip(),
            'deployStartedAt':open('release-evidence/deploy-started-at.txt').read().strip(),
            'deployedAt':open('release-evidence/deployed-at.txt').read().strip(),
            'function':function,'comparison':load('comparison.json'),'safetyBefore':load('safety-before.json'),
            'openPositionsBefore':load('open-positions-before.json'),'openPositionsAfter':load('open-positions-after.json'),
            'cycles':load('cycles.json'),'orderHealth':load('order-health.json'),'preflight':load('live-preflight.json'),
            'rollback':{'sourceSha':os.environ['BASELINE_SHA'],'functionVersion':int(os.environ['EXPECTED_VERSION_BEFORE']),
              'command':'supabase functions deploy v10-lane-executor --project-ref etaajwpernzrcdrifdnw --no-verify-jwt --use-api'}}
          json.dump(out,open('deployment-evidence/b06133-20260920.json','w'),indent=2)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/b06133-20260920.json
          git commit -m "ops: record B06133 production deployment [skip ci]"
          git push origin HEAD:release/b06133-live-20260920

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b06133-production-release
          path: release-evidence
