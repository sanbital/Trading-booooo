name: Account observability repair (isolated tests)
on:
  push:
    branches: [fix/20260908-account-observability]
    paths:
      - .github/workflows/account-observability-repair-test.yml
      - tests/account-observability/**
      - scripts/account-observability/**
      - supabase/migrations/20260908*.sql
      - supabase/functions/account-observability-collector/**
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: observability_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d observability_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Isolated regression tests (no production credentials)
        env:
          TEST_DATABASE_URL: postgresql://test:isolated-test-only@localhost:5432/observability_test
        run: |
          set -euo pipefail
          mkdir -p repair-artifacts
          git rev-parse HEAD > repair-artifacts/commit.txt
          python3 tests/account-observability/regression.py 2>&1 | tee repair-artifacts/sql-test-results.txt
          node --experimental-strip-types --test tests/account-observability/collector.test.mjs 2>&1 | tee repair-artifacts/collector-test-results.txt
          deno check --no-config --no-lock supabase/functions/account-observability-collector/index.ts 2>&1 | tee repair-artifacts/typecheck.txt
      - name: Archive exact tested source
        if: always()
        run: |
          mkdir -p repair-artifacts
          git archive --format=tar HEAD | gzip > repair-artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-observability-repair-${{ github.sha }}
          path: repair-artifacts/
          retention-days: 1
