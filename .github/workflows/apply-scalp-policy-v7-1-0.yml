name: Apply EXP1 index arm stop

on:
  push:
    branches:
      - main
    paths:
      - .github/exp1-index-arm-stop-main.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply reviewed patch
        run: python3 .github/scripts/apply-exp1-index-arm-stop.py
      - name: Format and type-check
        run: |
          deno fmt supabase/functions/market-autotrader/index.ts
          python3 .github/scripts/apply-exp1-index-arm-stop.py
          deno check supabase/functions/market-autotrader/index.ts
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce EXP-1 arm stops before 180s"
          git push origin HEAD:main
