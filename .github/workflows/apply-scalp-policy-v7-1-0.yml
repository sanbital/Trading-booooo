name: One-time EXP-1 index arm stop patch

on:
  push:
    branches: [exp1-index-arm-stop-v2]
    paths:
      - .github/exp1-index-arm-stop-v2.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply reviewed replacements and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/market-autotrader/index.ts")
          source = path.read_text(encoding="utf-8")

          old_1 = '''        if (guardedNetReturnPct <= -2) {
            decision = {
              action: "STOP",
              fraction: 1,
              reason: "HARD_STOP_MINUS_2",
            };
          } else if (heldSeconds < 180) {'''

          new_1 = '''        // EXP-1 (2026-08-02): -2% was the only force-sell, so every LOB loser rode to it and
        // the realised stop averaged -239bp against a +42bp target. A counterfactual sweep on
        // 239 closed positions put the operating point at 30-70bp under every execution
        // slippage assumption tested, so the randomised arm width is now the operative stop
        // and -2% sits below it as the backstop. Widths and hash must stay byte-identical to
        // public.exp_stop_arm_bps(uuid) and to the market-autotrader core.ts override, or
        // runtime and database judge different positions. The database guard tests price
        // drawdown, so this test does too.
        const exp1ArmWidthsBps = [30, 50, 90];
        const exp1ArmHash =
          parseInt(String(position.id ?? "").replace(/-/g, "").slice(-8), 16);
        const exp1ArmBps = exp1ArmWidthsBps[
          (Number.isFinite(exp1ArmHash) ? exp1ArmHash : 0) % exp1ArmWidthsBps.length
        ];
        if (guardedNetReturnPct <= -2) {
          decision = {
            action: "STOP",
            fraction: 1,
            reason: "HARD_STOP_MINUS_2",
          };
        } else if (drawdownPct <= -(exp1ArmBps / 100)) {
          decision = {
            action: "STOP",
            fraction: 1,
            reason: `EXP1_ARM_STOP_${exp1ArmBps}`,
          };
        } else if (heldSeconds < 180) {'''

          old_2 = '''        if (
          !approvedPre180Target && !approvedPre180Reversal &&
          !approvedPre180PlannedStop
        ) {'''

          new_2 = '''        // The two price floors are age-independent by design and the database guard already
        // clears both ahead of its own 180s branch. This list did not carry them, so a
        // position that breached -2% inside 180 seconds was held anyway and kept falling —
        // realised stops reached -245bp (binance) and -319bp (upbit) against a -200bp policy.
        // EXP-1 arm stops fire mostly inside 180s, so without this they never execute.
        const approvedPre180PriceFloor = decision.action === "STOP" &&
          ((decision as any).reason === "HARD_STOP_MINUS_2" ||
            String((decision as any).reason || "").startsWith("EXP1_ARM_STOP_"));
        if (
          !approvedPre180Target && !approvedPre180Reversal &&
          !approvedPre180PlannedStop && !approvedPre180PriceFloor
        ) {'''

          if source.count(old_1) != 1:
              raise SystemExit(f"first anchor count was {source.count(old_1)}, expected 1")
          if source.count(old_2) != 1:
              raise SystemExit(f"second anchor count was {source.count(old_2)}, expected 1")

          source = source.replace(old_1, new_1, 1).replace(old_2, new_2, 1)
          path.write_text(source, encoding="utf-8")
          PY

          deno fmt supabase/functions/market-autotrader/index.ts
          test "$(grep -c 'if (guardedNetReturnPct <= -2) {' supabase/functions/market-autotrader/index.ts)" -eq 1
          test "$(grep -c 'approvedPre180PriceFloor' supabase/functions/market-autotrader/index.ts)" -eq 2
          test "$(grep -c 'const exp1ArmWidthsBps = \[30, 50, 90\];' supabase/functions/market-autotrader/index.ts)" -eq 1
          deno check supabase/functions/market-autotrader/index.ts

      - name: Commit patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix: enforce EXP-1 arm stops before 180s"
          git push origin "HEAD:${GITHUB_REF_NAME}"
