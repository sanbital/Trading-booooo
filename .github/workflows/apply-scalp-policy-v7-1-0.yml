name: Guard v7.1.4 exit policy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/_shared/lob/exit.ts"
      - "supabase/migrations/*v714*"
      - ".github/workflows/apply-scalp-policy-v7-1-0.yml"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
      - ".github/workflows/patch-autotrader-v714.yml"
      - "scripts/patch_v714_exit_policy.py"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-v714-exit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v714-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Reject legacy policy mutators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path("supabase/functions/market-autotrader/index.ts").read_text()
          deploy = Path(".github/workflows/deploy-market-autotrader-v707.yml").read_text()
          guard = Path(".github/workflows/apply-scalp-policy-v7-1-0.yml").read_text()
          migration = Path("supabase/migrations/20260801024500_lock_v714_exit_policy.sql").read_text()

          required_version = 'const VERSION = "7.1.4-VOLATILITY-AWARE-EXIT";'
          assert required_version in engine, "autotrader is not pinned to v7.1.4"

          forbidden_workflow_commands = (
              "python3 .github/scripts/apply_scalp_v7_1_0.py",
              "python3 .github/scripts/align_v712_tests.py",
              "python3 .github/scripts/fix_v712_remaining_tests.py",
              "Stamp v7.0.8 runtime version",
              "git push origin main",
          )
          for command in forbidden_workflow_commands:
              assert command not in deploy, f"legacy deploy mutator remains: {command}"
              assert command not in guard, f"legacy guard mutator remains: {command}"

          assert "contents: write" not in guard, "policy guard must remain read-only"
          assert "7.1.4-VOLATILITY-AWARE-EXIT" in deploy
          assert "trading_positions_v708_profit_only_exit" in migration
          assert "zz_trading_positions_exit_policy_v713" in migration
          assert "zz_trading_orders_lob_exit_guard_v713" in migration
          assert "zz_trading_positions_exit_policy_v714" in migration
          assert "zz_trading_orders_lob_exit_guard_v714" in migration
          print("PASS: legacy workflows cannot rewrite v7.1.4")
          PY

      - name: Type-check v7.1.4 runtime
        run: |
          deno fmt --check \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/exit.ts
          deno check supabase/functions/market-autotrader/index.ts
