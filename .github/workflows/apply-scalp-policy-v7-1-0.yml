name: EXP1 runner probe

on:
  push:
    branches:
      - main
    paths:
      - .github/exp1-index-arm-stop-main.trigger

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Commit runner marker
        shell: bash
        run: |
          set -e
          date -u +%FT%TZ > .github/exp1-runner-ran.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/exp1-runner-ran.txt
          git commit -m "chore: confirm EXP1 runner"
          git push origin HEAD:main
