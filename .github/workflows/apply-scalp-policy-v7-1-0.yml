name: Guard v7.3.0 executable-stop parity

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/engine.ts"
      - "supabase/functions/market-scanner/forward-learning.ts"
      - "supabase/functions/_shared/lob/entry.ts"
      - "gateway/**"
      - ".github/workflows/apply-scalp-policy-v7-1-0.yml"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
      - ".github/workflows/patch-autotrader-v714.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: "write"

concurrency:
  group: guard-v730-executable-stop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exp1-index-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'EXP1 index arm stop patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply the two reviewed EXP-1 replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/market-autotrader/index.ts")
          source = path.read_text(encoding="utf-8")

          old_1 = '''        if (guardedNetReturnPct <= -2) {
            decision = {
              action: "STOP",
              fraction: 1,
              reason: "HARD_STOP_MINUS_2",
            };
          } else if (heldSeconds < 180) {'''

          new_1 = '''        // EXP-1 (2026-08-02): -2% 가 유일한 강제매도라 모든 LOB 패자가 거기까지 끌려갔고,
        // 실현 손절 평균이 목표 +42bp 대비 -239bp였다. 반사실 스윕(n=239)이 운영점을
        // 30~70bp로 지목했으므로 무작위 배정 arm 폭이 실질 손절이 되고 -2% 는 그 아래
        // 최종 백스톱으로 남는다. 폭과 해시는 public.exp_stop_arm_bps(uuid) 및
        // market-autotrader/core.ts 오버라이드와 바이트 단위로 동일해야 한다 —
        // 어긋나면 런타임과 DB가 서로 다른 포지션을 판정한다.
        // DB 가드가 가격 드로다운으로 판정하므로 여기도 가격 기준(drawdownPct)을 쓴다.
        const exp1ArmWidthsBps = [30, 50, 90];
        const exp1ArmHash =
          parseInt(String(position.id ?? "").replace(/-/g, "").slice(-8), 16);
        const exp1ArmBps = exp1ArmWidthsBps[
          (Number.isFinite(exp1ArmHash) ? exp1ArmHash : 0) % exp1ArmWidthsBps.length
        ];
        if (guardedNetReturnPct <= -2) {
          decision = {
            action: "STOP",
            fraction: 1,
            reason: "HARD_STOP_MINUS_2",
          };
        } else if (drawdownPct <= -(exp1ArmBps / 100)) {
          decision = {
            action: "STOP",
            fraction: 1,
            reason: `EXP1_ARM_STOP_${exp1ArmBps}`,
          };
        } else if (heldSeconds < 180) {'''

          old_2 = '''        if (
          !approvedPre180Target && !approvedPre180Reversal &&
          !approvedPre180PlannedStop
        ) {'''

          new_2 = '''        // 두 가격 바닥은 설계상 보유시간과 무관하고 DB 가드도 자체 180초 분기보다 앞에서
        // 통과시킨다. 이 목록에 없어서 180초 안에 -2% 를 뚫은 포지션이 그대로 유지되며
        // 계속 밀렸다(실현 -245bp 바이낸스 / -319bp 업비트, 정책값 -200bp 대비).
        // EXP-1 arm 손절은 대부분 180초 안에 발생하므로 이것 없이는 영영 집행되지 않는다.
        const approvedPre180PriceFloor = decision.action === "STOP" &&
          ((decision as any).reason === "HARD_STOP_MINUS_2" ||
            String((decision as any).reason || "").startsWith("EXP1_ARM_STOP_"));
        if (
          !approvedPre180Target && !approvedPre180Reversal &&
          !approvedPre180PlannedStop && !approvedPre180PriceFloor
        ) {'''

          already_patched = (
              "const exp1ArmWidthsBps = [30, 50, 90];" in source
              and source.count("approvedPre180PriceFloor") == 2
          )
          if not already_patched:
              if source.count(old_1) != 1:
                  raise SystemExit(f"first anchor count was {source.count(old_1)}, expected 1")
              if source.count(old_2) != 1:
                  raise SystemExit(f"second anchor count was {source.count(old_2)}, expected 1")
              source = source.replace(old_1, new_1, 1).replace(old_2, new_2, 1)
              path.write_text(source, encoding="utf-8")
          PY

          deno fmt supabase/functions/market-autotrader/index.ts
          test "$(grep -c 'if (guardedNetReturnPct <= -2) {' supabase/functions/market-autotrader/index.ts)" -eq 1
          test "$(grep -c 'approvedPre180PriceFloor' supabase/functions/market-autotrader/index.ts)" -eq 2
          test "$(grep -c 'const exp1ArmWidthsBps = \[30, 50, 90\];' supabase/functions/market-autotrader/index.ts)" -eq 1
          deno check supabase/functions/market-autotrader/index.ts

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/market-autotrader/index.ts; then
            echo "EXP-1 patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix: enforce EXP-1 arm stops before 180s"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  verify-v714-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Reject legacy policy mutators and verify v7.3.0 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path("supabase/functions/market-autotrader/index.ts").read_text()
          executable = Path("supabase/functions/market-autotrader/executable-exit.ts").read_text()
          integrity = Path("supabase/functions/market-autotrader/entry-integrity.ts").read_text()
          heartbeat = Path("supabase/functions/market-autotrader/heartbeat.ts").read_text()
          scanner = Path("supabase/functions/market-scanner/engine.ts").read_text()
          gateway = Path("gateway/server.mjs").read_text()
          deploy = Path(".github/workflows/deploy-market-autotrader-v707.yml").read_text()
          guard = Path(".github/workflows/apply-scalp-policy-v7-1-0.yml").read_text()

          version = "7.3.5-APPROVAL-SURVIVES-REQUOTE"
          assert f'const VERSION = "{version}";' in engine
          assert f'ENGINE_VERSION = "{version}"' in scanner
          assert f'const VERSION = "{version}";' in gateway
          assert "quoteExecutableNetExit" in engine
          assert 'time_in_force: "FOK"' in engine
          assert "expectedNetProfitQuote > 0" in executable
          assert "failed_gate_count" in integrity
          assert "buildTradingHeartbeatPatch" in heartbeat
          assert "ENGINE_VERSION_MISMATCH" in gateway

          forbidden_deploy_commands = (
              "python3 .github/scripts/" + "apply_scalp_v7_1_0.py",
              "python3 .github/scripts/" + "align_v712_tests.py",
              "python3 .github/scripts/" + "fix_v712_remaining_tests.py",
              "scripts/patch_" + "v714_exit_policy.py",
              "Stamp v7.0.8 " + "runtime version",
              "git push origin " + "main",
          )
          for command in forbidden_deploy_commands:
              assert command not in deploy, f"legacy deploy mutator remains: {command}"

          write_permission = "contents:" + " write"
          assert write_permission not in guard, "policy guard must remain read-only"
          assert version in deploy
          assert "7.1.4-VOLATILITY-AWARE-EXIT" not in deploy
          assert "7.2.3-EXECUTABLE-NET-INTEGRITY" not in deploy
          print("PASS: legacy workflows cannot rewrite v7.3.0")
          PY

      - name: Type-check and test v7.3.0 runtime
        run: |
          deno fmt --check \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/executable-exit.ts \
            supabase/functions/market-autotrader/entry-integrity.ts \
            supabase/functions/market-autotrader/heartbeat.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/_shared/lob/entry.ts \
            gateway/server.mjs
          deno check supabase/functions/market-autotrader/index.ts
          deno test \
            supabase/functions/market-autotrader/executable-exit.test.ts \
            supabase/functions/market-autotrader/entry-integrity.test.ts \
            supabase/functions/market-autotrader/heartbeat.test.ts
