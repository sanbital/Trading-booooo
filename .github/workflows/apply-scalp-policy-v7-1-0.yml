name: Apply scalp exit policy v7.1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply_scalp_v7_1_0.py"
      - ".github/scripts/align_v712_tests.py"
      - ".github/scripts/fix_v712_remaining_tests.py"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-scalp-exit-policy-v7-1-2
  cancel-in-progress: false

jobs:
  patch-verify-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply post-180 net-profit policy
        run: |
          python3 .github/scripts/apply_scalp_v7_1_0.py
          python3 .github/scripts/fix_lob_config_shape.py
          python3 .github/scripts/align_v712_tests.py
          python3 .github/scripts/fix_v712_remaining_tests.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Full Deno check
        run: deno task check

      - name: Full Deno tests
        run: deno task test

      - name: Gateway tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          tests=(gateway/*.test.mjs gateway/**/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No gateway test files found; validating gateway syntax instead"
            node --check gateway/server.mjs
          else
            node --test "${tests[@]}"
          fi

      - name: Validate v6.9 invariants
        run: node validation/v690-deploy-validation.mjs

      - name: Commit policy update
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes detected"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/market-scanner/index.ts \
                    supabase/functions/market-scanner/engine.ts \
                    supabase/functions/market-scanner/engine.test.ts \
                    supabase/functions/_shared/lob/entry.ts \
                    supabase/functions/_shared/lob/exit.ts \
                    supabase/functions/_shared/lob/lob.test.ts \
                    supabase/functions/_shared/lob/momentum-continuation.test.ts \
                    supabase/functions/_shared/scalp/v512-invariants.test.ts \
                    supabase/functions/_shared/scalp/version.test.ts \
                    supabase/functions/market-autotrader/index.ts \
                    supabase/functions/market-autotrader/core.ts \
                    supabase/migrations/20260731033000_scalp_v7_1_0_risk_and_holding.sql \
                    gateway/server.mjs \
                    docs/index.html
            git commit -m "fix: exit fee-net profit immediately after 180s"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@latest functions deploy market-scanner \
            --project-ref etaajwpernzrcdrifdnw --no-verify-jwt --use-api
          npx --yes supabase@latest functions deploy market-autotrader \
            --project-ref etaajwpernzrcdrifdnw --no-verify-jwt --use-api
