name: Launch RANGE Exit V2 research

on:
  push:
    branches: [main]
    paths:
      - "research/regime_router_v5/range-exit-v2-trigger.txt"

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch apply workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run apply-range-exit-v2-research-20260829.yml
          --repo sanbital/Trading-booooo
          --ref main
