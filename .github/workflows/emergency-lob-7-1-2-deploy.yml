name: emergency-lob-7-1-2-deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-lob-7-1-2-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-lob-7-1-2-deploy
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: etaajwpernzrcdrifdnw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic LOB hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          VERSION_OLD = "7.1.1-LOB-45S-PROFIT-OR-5PCT"
          VERSION_NEW = "7.1.2-LOB-WINDOW-PARTIAL-EV"

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {found}\n--- OLD ---\n{old}")
              write(path, text.replace(old, new))

          def replace_version(path):
              text = read(path)
              found = text.count(VERSION_OLD)
              if found < 1:
                  raise SystemExit(f"{path}: old version marker not found")
              write(path, text.replace(VERSION_OLD, VERSION_NEW))

          entry = "supabase/functions/_shared/lob/entry.ts"
          patterns = "supabase/functions/_shared/lob/patterns.ts"
          engine = "supabase/functions/market-scanner/engine.ts"
          scanner = "supabase/functions/market-scanner/index.ts"
          trader = "supabase/functions/market-autotrader/index.ts"

          # 1. Declining rolling-flow diagnostics no longer veto a Top-10 symbol.
          replace_exact(
              entry,
              '''  if (Number(features.notionalTrend) < -0.20) reasons.push("FLOW_NOTIONAL_DECLINING");
  if (Number(features.tradeSpeedTrend) < -0.20) reasons.push("FLOW_TRADE_SPEED_DECLINING");
  if (Number(features.tradeArrivalTrend) < -0.20) reasons.push("TAPE_SPEED_DECLINING");''',
              '''  if (Number(features.notionalTrend) < -0.20) warnings.push("FLOW_NOTIONAL_DECLINING_DIAGNOSTIC");
  if (Number(features.tradeSpeedTrend) < -0.20) warnings.push("FLOW_TRADE_SPEED_DECLINING_DIAGNOSTIC");
  if (Number(features.tradeArrivalTrend) < -0.20) warnings.push("TAPE_SPEED_DECLINING_DIAGNOSTIC");''',
          )
          replace_exact(
              entry,
              '''  const coherentPositiveBook = positivePressure >= 0.12 &&
    features.micropriceDeviationBps >= -0.5 &&
    features.bookImbalance > -0.55 && features.tradeArrivalRate > 0 &&
    Number(features.tradeArrivalTrend) >= -0.20;''',
              '''  const coherentPositiveBook = positivePressure >= 0.12 &&
    features.micropriceDeviationBps >= -0.5 &&
    features.bookImalance > -0.55 && features.tradeArrivalRate > 0;'''.replace("bookImalance", "bookImbalance"),
          )
          replace_exact(
              patterns,
              '''    Number(f.notionalTrend) >= -0.20 && Number(f.tradeSpeedTrend) >= -0.20 &&
    Number(f.tradeArrivalTrend) >= -0.20 &&
    f.tradePressureFast >= 0.12 && f.micropriceDeviationBps >= -0.5 &&''',
              '''    f.tradePressureFast >= 0.12 && f.micropriceDeviationBps >= -0.5 &&''',
          )

          # Positive conservative fee-net EV remains an explicit hard admission condition.
          replace_exact(
              entry,
              '''  const evLowerBoundBps = conditionalEvLowerBoundBps;

  for (const reason of payoff.reasons) reasons.push(reason);''',
              '''  const evLowerBoundBps = conditionalEvLowerBoundBps;

  if (!(evLowerBoundBps > cfg.minEvBps)) reasons.push("EV_BELOW_MINIMUM");
  for (const reason of payoff.reasons) reasons.push(reason);''',
          )
          replace_exact(
              entry,
              '''  const technicalBlock = reasons.some((r) =>
    r.startsWith("TRAP_") ||
    r.startsWith("FLOW_") ||
    r.startsWith("FIXED_PLAN_") ||
    r === "TAPE_SPEED_DECLINING" ||
    r === "SELL_PRESSURE_DOMINANT" ||''',
              '''  const technicalBlock = reasons.some((r) =>
    r.startsWith("TRAP_") ||
    r.startsWith("FIXED_PLAN_") ||
    r === "EV_BELOW_MINIMUM" ||
    r === "SELL_PRESSURE_DOMINANT" ||''',
          )

          # 2. Microprice direction is a recent-window, recency-weighted measurement.
          replace_exact(
              engine,
              '''  const latestUnit = latestFrame?.units?.[0];
  const mid = latestFrame ? (latestFrame.bestBid + latestFrame.bestAsk) / 2 : 0;
  const microprice = latestUnit && latestUnit.bidSize + latestUnit.askSize > 0
    ? (latestUnit.askPrice * latestUnit.bidSize + latestUnit.bidPrice * latestUnit.askSize) /
      (latestUnit.bidSize + latestUnit.askSize)
    : mid;
  const micropriceDeviationBps = mid > 0 ? (microprice / mid - 1) * 10_000 : 0;''',
              '''  const mid = latestFrame ? (latestFrame.bestBid + latestFrame.bestAsk) / 2 : 0;
  const micropriceWindow = latestFrame
    ? frames.filter((frame) => frame.timestamp >= latestFrame.timestamp - 8_000).slice(-24)
    : [];
  let weightedMicropriceDeviationBps = 0;
  let micropriceWeight = 0;
  micropriceWindow.forEach((frame, index) => {
    const unit = frame.units[0];
    const frameMid = (frame.bestBid + frame.bestAsk) / 2;
    if (!unit || !(frameMid > 0) || !(unit.bidSize + unit.askSize > 0)) return;
    const frameMicroprice =
      (unit.askPrice * unit.bidSize + unit.bidPrice * unit.askSize) /
      (unit.bidSize + unit.askSize);
    const weight = index + 1;
    weightedMicropriceDeviationBps += (frameMicroprice / frameMid - 1) * 10_000 * weight;
    micropriceWeight += weight;
  });
  const micropriceDeviationBps = micropriceWeight > 0
    ? weightedMicropriceDeviationBps / micropriceWeight
    : 0;''',
          )

          # 3. Use partial websocket observations rather than silently reverting to REST.
          replace_exact(
              scanner,
              '''      if (marketCoverage?.complete && streamedBooks.length >= 2) {
        snapshots.set(market, streamedBooks);
        websocketMarkets++;
        if (streamedTrades.length) {
          trades.set(market, [
            ...(trades.get(market) || []),
            ...streamedTrades,
          ]);
        }
      }''',
              '''      if (streamedBooks.length >= 2) {
        snapshots.set(market, streamedBooks);
        if (marketCoverage?.complete) websocketMarkets++;
      }
      if (streamedTrades.length) {
        trades.set(market, [
          ...(trades.get(market) || []),
          ...streamedTrades,
        ]);
      }''',
              expected=2,
          )

          # 4. Scanner and order-time recheck share the same strict decision. Expected
          # admission failures are durable REJECTED outcomes, not engine ERROR outcomes.
          replace_exact(
              trader,
              '''    // v7.1.1: FIXED_PLAN_STOP_INVALIDATED was a scanner/autotrader contract mismatch.
    // Ignore that code only when it is the sole blocker and the live recheck still has
    // a primary pattern, positive conditional EV and positive fee-net target.
    const effectiveRecheckReasons = decision.reasons.filter((reason) =>
      reason !== "FIXED_PLAN_STOP_INVALIDATED"
    );
    const fixedPlanCompatibilityEntry = decision.decision !== "BUY" &&
      effectiveRecheckReasons.length === 0 &&
      Boolean(decision.pattern) &&
      decision.conditionalEvNetBps > 0 &&
      decision.targetReturnNetBps > 0;
    if (decision.decision !== "BUY" && !fixedPlanCompatibilityEntry) {''',
              '''    // v7.1.2: order-time admission uses the same strict decision as the scanner.
    // Fixed-plan invalidation, non-positive conservative EV and weak payoff are ordinary
    // candidate rejections; none may be bypassed to create an order.
    if (decision.decision !== "BUY") {''',
          )

          helper_anchor = '''async function enterCandidate(
  candidate: Candidate,
  settings: TradingSettings,'''
          helper = '''function expectedLobAdmissionRejection(message: string): boolean {
  return /(?:FIXED_PLAN_STOP_INVALIDATED|EV_BELOW_MINIMUM|TARGET_NET_CUSHION_TOO_SMALL|NO_PRIMARY_LOB_PATTERN|INSUFFICIENT_LOB_SAMPLES|INSUFFICIENT_OBSERVATION_WINDOW|STALE_ORDERBOOK|SPREAD_TOO_WIDE|low-evidence|uneconomic payoff|admission rejected|LOB recheck)/i.test(message);
}

async function enterCandidate(
  candidate: Candidate,
  settings: TradingSettings,'''
          replace_exact(trader, helper_anchor, helper)
          replace_exact(
              trader,
              '''  } catch (error) {
    const message = error instanceof Error ? error.message : String(error);
    await recordDecision({
      decisionId,
      cycleId,
      scanId: candidate.scan_id ? String(candidate.scan_id) : null,
      exchange: candidate.exchange,
      market: candidate.market,
      outcome: "ERROR",
      reason: message,
      audit: (candidate as any).__decision_audit || null,
    });
    await recordLatency(trace, { outcome: "ERROR" });
    throw error;
  }''',
              '''  } catch (error) {
    const message = error instanceof Error ? error.message : String(error);
    const expectedRejection = isLobStrategy((settings as any).strategy) &&
      expectedLobAdmissionRejection(message);
    await recordDecision({
      decisionId,
      cycleId,
      scanId: candidate.scan_id ? String(candidate.scan_id) : null,
      exchange: candidate.exchange,
      market: candidate.market,
      outcome: expectedRejection ? "REJECTED" : "ERROR",
      reason: message,
      audit: (candidate as any).__decision_audit || null,
    });
    await recordLatency(trace, { outcome: expectedRejection ? "REJECTED" : "ERROR" });
    if (expectedRejection) {
      await event("LOB_EXPECTED_REJECTION", message, {
        candidate_id: candidate.id,
        exchange: candidate.exchange,
        market: candidate.market,
      }, { cycleId, level: "INFO" }).catch(() => null);
      return {
        entered: false,
        exchange: candidate.exchange,
        market: candidate.market,
        reason: message,
        decision_id: decisionId,
      };
    }
    throw error;
  }''',
          )

          for path in (entry, patterns, engine, scanner, trader):
              replace_version(path)

          # Final source assertions.
          checks = {
              entry: ["EV_BELOW_MINIMUM", "FLOW_NOTIONAL_DECLINING_DIAGNOSTIC"],
              engine: ["micropriceWindow", "weightedMicropriceDeviationBps"],
              scanner: ["if (streamedBooks.length >= 2)"],
              trader: ["expectedLobAdmissionRejection", "LOB_EXPECTED_REJECTION"],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: assertion failed: {needle}")
          print(VERSION_NEW)
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check both production functions
        run: |
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts

      - name: Commit patched production source
        shell: bash
        run: |
          git config user.name "trading-booooo-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/market-scanner/index.ts \
                  supabase/functions/market-scanner/engine.ts \
                  supabase/functions/market-autotrader/index.ts \
                  supabase/functions/_shared/lob/entry.ts \
                  supabase/functions/_shared/lob/patterns.ts
          git diff --cached --check
          git commit -m "Fix LOB observation and admission consistency [skip ci]"
          git push origin HEAD:main

      - name: Validate Supabase token
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Install Supabase CLI
        run: npx --yes supabase@latest --version

      - name: Deploy market scanner
        run: npx --yes supabase@latest functions deploy market-scanner --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy market autotrader
        run: npx --yes supabase@latest functions deploy market-autotrader --project-ref "$PROJECT_REF" --no-verify-jwt
