name: Temporary Trading Performance Readonly
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trading-performance-readonly.yml"
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production trading records read-only
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -P pager=off > /tmp/trading-query.txt <<'SQL'
          BEGIN READ ONLY;
          \echo '=== POSITIONS_COLUMNS ==='
          select column_name from information_schema.columns where table_schema='public' and table_name='trading_positions' order by ordinal_position;
          \echo '=== ORDERS_COLUMNS ==='
          select column_name from information_schema.columns where table_schema='public' and table_name='trading_orders' order by ordinal_position;
          \echo '=== RECENT_POSITIONS_JSON ==='
          select row_to_json(t) from (select * from public.trading_positions where created_at >= timestamptz '2026-08-16 00:00:00+09' order by created_at desc limit 100) t;
          \echo '=== RECENT_ORDERS_JSON ==='
          select row_to_json(t) from (select * from public.trading_orders where created_at >= timestamptz '2026-08-16 00:00:00+09' order by created_at desc limit 300) t;
          ROLLBACK;
          SQL
      - name: Upload query result
        uses: actions/upload-artifact@v4
        with:
          name: trading-performance-readonly
          path: /tmp/trading-query.txt
          retention-days: 1
