name: V26 isolated read-only research export
on:
  push:
    branches: [research/v26-offline-validation-20260919]
    paths: [.github/workflows/research-v26-offline-audit.yml]
permissions:
  contents: read
concurrency:
  group: v26-isolated-research-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export existing public-market research rows (explicit READ ONLY)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=180000 -c lock_timeout=2000'
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          mkdir -p research-export/raw research-export/modules
          psql -Xq "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "BEGIN TRANSACTION READ ONLY; SELECT current_setting('transaction_read_only'); ROLLBACK;" > research-export/transaction-mode.txt
          grep -x on research-export/transaction-mode.txt
          for t in meta symbols k15 k5; do
            psql -Xq "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "BEGIN TRANSACTION READ ONLY; SET LOCAL statement_timeout='180s'; COPY (SELECT * FROM public.research_v26_${t}) TO STDOUT WITH (FORMAT CSV, HEADER TRUE); ROLLBACK;" | gzip -1 > "research-export/raw/${t}.csv.gz"
            echo "exported market table ${t}"
          done
          cp supabase/functions/_shared/leader-momentum-v17.mjs research-export/modules/
          cp supabase/functions/_shared/leader-pullback-reaccel.mjs research-export/modules/
          cp supabase/functions/_shared/leader-exit-review.mjs research-export/modules/
          cp supabase/functions/_shared/leader-slot-sizing.mjs research-export/modules/
          cp supabase/functions/_shared/leader-qv3-rules.mjs research-export/modules/
          git rev-parse HEAD > research-export/source-commit.txt
          (cd research-export && sha256sum raw/* modules/* > SHA256SUMS)
      - name: Check official downloadable archive (no exchange trading API)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-export
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,json,pathlib,zipfile,io
          base='https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/15m/BTCUSDT-15m-2026-09-03.zip'
          out=pathlib.Path('research-export')
          result={'url':base,'endpoint_type':'OFFICIAL_PUBLIC_ARCHIVE','no_api_keys':True}
          try:
              with urllib.request.urlopen(base,timeout=25) as r:
                  data=r.read(); result['status']=r.status
              with urllib.request.urlopen(base+'.CHECKSUM',timeout=25) as r:
                  expected=r.read().decode().split()[0]
              result['sha256']=hashlib.sha256(data).hexdigest()
              result['checksum_ok']=result['sha256']==expected
              if not result['checksum_ok']: raise ValueError('CHECKSUM_MISMATCH')
              result['zip_members']=zipfile.ZipFile(io.BytesIO(data)).namelist()
              (out/'BTCUSDT-15m-2026-09-03.zip').write_bytes(data)
          except urllib.error.HTTPError as e:
              result.update(status=e.code,error='ARCHIVE_UNAVAILABLE_NO_PROXY_NO_RETRY')
          except Exception as e:
              result['error']=type(e).__name__+':'+str(e)[:200]
          (out/'archive-probe.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v26-readonly-market-export
          path: research-export/
          if-no-files-found: error
          retention-days: 7
