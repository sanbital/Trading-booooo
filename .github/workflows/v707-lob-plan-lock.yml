name: Apply v7.0.7 LOB plan lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v707-lob-plan-lock.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'chore: apply v7.0.7 LOB plan lock'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded patch
        run: python3 scripts/apply_v707_lob_plan_lock.py

      - name: Verify clean patch structure
        run: git diff --check

      - name: Type-check shared LOB evaluator
        run: deno check supabase/functions/_shared/lob/entry.ts

      - name: Type-check market autotrader
        run: deno check supabase/functions/market-autotrader/index.ts

      - name: Verify plan-lock markers
        run: |
          grep -q '7.0.7-LOB-SCAN-PLAN-LOCK' supabase/functions/market-autotrader/index.ts
          grep -q 'FIXED_SCAN_PLAN_GEOMETRY' supabase/functions/_shared/lob/entry.ts
          grep -q 'fixedTargetBps: fixedPlanTargetBps' supabase/functions/market-autotrader/index.ts

      - name: Commit verified source patch
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-autotrader/index.ts
          git commit -m "fix: lock autotrader to scanner LOB plan geometry"
          git push origin main
