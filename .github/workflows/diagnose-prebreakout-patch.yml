name: Diagnose pre-breakout patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-prebreakout-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - name: Run patcher and preserve result
        shell: bash
        run: |
          set +e
          python3 scripts/apply_prebreakout_burst_strategy.py > /tmp/patch.log 2>&1
          status=$?
          {
            echo "status=${status}"
            echo "commit=$(git rev-parse HEAD)"
            echo "--- output ---"
            cat /tmp/patch.log
            echo "--- changed files ---"
            git status --short
          } > prebreakout-patch-diagnostic.txt
          cat prebreakout-patch-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebreakout-patch-diagnostic.txt
          git commit -m "chore: record pre-breakout patch diagnostic"
          git push origin HEAD:main
