name: Entry evidence regression
on:
  pull_request:
    paths:
      - supabase/functions/v10-lane-executor/**
      - gateway/**
      - test-support/**
      - .github/workflows/entry-evidence-tests.yml
  push:
    branches: [fix/entry-evidence-20260918]
    paths:
      - supabase/functions/v10-lane-executor/**
      - gateway/**
      - test-support/**
      - .github/workflows/entry-evidence-tests.yml
permissions:
  contents: read
jobs:
  entry-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_ENABLED: 'false'
      V17_SHADOW_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Boundary, dispatcher, and existing gateway tests
        run: node --test supabase/functions/v10-lane-executor/entry-evidence.test.mjs gateway/*.test.mjs
      - name: Existing entry integration regressions
        run: deno task test:entry
      - name: Read-only margin and BOO regressions
        run: deno test --allow-read supabase/functions/v10-lane-executor/margin-config.test.ts supabase/functions/_shared/boo/*.test.ts
      - name: Build exact gateway image and verify imports without networking or credentials
        shell: bash
        run: |
          set -euo pipefail
          node gateway/stage-engine.mjs
          docker build --network=none --tag gateway-entry-evidence-ci gateway
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e SCHEDULER_ENABLED=false -e V17_SHADOW_ENABLED=false \
            gateway-entry-evidence-ci node --input-type=module --eval \
            "for (const name of ['server.mjs','v17-shadow-worker.mjs','v17-shadow-host.mjs','leader-exit-r4.mjs']) { await import('./' + name); } console.log('DOCKER_IMAGE_IMPORT_OK');"
