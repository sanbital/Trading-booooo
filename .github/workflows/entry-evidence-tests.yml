name: Entry evidence regression
on:
  pull_request:
    paths:
      - supabase/functions/v10-lane-executor/**
      - supabase/functions/_shared/**
      - gateway/**
      - test-support/**
      - .github/workflows/entry-evidence-tests.yml
  push:
    branches: [fix/entry-evidence-20260918]
    paths:
      - supabase/functions/v10-lane-executor/**
      - supabase/functions/_shared/**
      - gateway/**
      - test-support/**
      - .github/workflows/entry-evidence-tests.yml
permissions:
  contents: read
jobs:
  entry-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_ENABLED: 'false'
      V17_SHADOW_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --prefix test-support/deterministic
      - name: Stage shared engines before gateway import verification
        run: node gateway/stage-engine.mjs
      - name: Current deterministic entry, submit fence, settlement and gateway tests
        run: |
          npm test --prefix test-support/deterministic
          node --test gateway/*.test.mjs tests/native-submission-phase.test.mjs tests/native-proof-program.test.mjs
      - name: Type-check the actual entrypoints with the pinned Supabase stub
        run: |
          ln -s "$PWD/test-support/deterministic/node_modules" "$PWD/node_modules"
          deno check --no-config --node-modules-dir=manual \
            --import-map test-support/v19-ops/deno-import-map.json \
            supabase/functions/v10-lane-executor/index.ts \
            supabase/functions/v10-lane-signal-generator/index.ts
      - name: Build exact gateway image and verify imports without networking or credentials
        shell: bash
        run: |
          set -euo pipefail
          node gateway/stage-engine.mjs
          docker build --network=none --tag gateway-entry-evidence-ci gateway
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e SCHEDULER_ENABLED=false -e V17_SHADOW_ENABLED=false \
            gateway-entry-evidence-ci node --input-type=module --eval \
            "for (const name of ['server.mjs','v17-shadow-worker.mjs','v17-shadow-host.mjs','leader-exit-r4.mjs']) { await import('./' + name); } console.log('DOCKER_IMAGE_IMPORT_OK');"
