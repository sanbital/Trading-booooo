name: Top20 collector book initialization
on:
  push:
    branches: [main]
    paths: [deployment-evidence/top20-book-bootstrap.json]
permissions:
  contents: read
concurrency:
  group: deploy-doa-capture-only
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify collector and fixed-window capital controls
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          npm install --prefix "$RUNNER_TEMP/bootstrap-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/bootstrap-test/node_modules/@electric-sql/pglite/dist/index.js"
          node --test collectors/doa-capture/*.test.mjs tests/leader20-clock*.test.mjs tests/leader20-funded-capture.test.mjs > release-evidence/tests.tap
          node --check collectors/doa-capture/worker.mjs
          node --check ops/leader20/book-bootstrap-release.mjs
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Build exact collector image
        run: docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -t "registry.fly.io/sanbital-doa-capture-20260925:$GITHUB_SHA" collectors/doa-capture
      - name: Update existing collector and its protocol digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ops/leader20/book-bootstrap-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top20-book-bootstrap
          path: release-evidence
          retention-days: 30
