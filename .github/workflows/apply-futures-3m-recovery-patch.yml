name: Apply futures 3m recovery patch

on:
  push:
    branches:
      - agent/futures-3m-recovery-state-machine
    paths:
      - .github/scripts/patch_futures_3m_recovery.py
      - .github/workflows/apply-futures-3m-recovery-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futures-3m-recovery-state-machine
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact patch
        run: python3 .github/scripts/patch_futures_3m_recovery.py
      - name: Format changed TypeScript
        run: deno fmt supabase/functions/market-autotrader/index.ts supabase/functions/market-autotrader/futures-exit-policy.ts supabase/functions/market-autotrader/futures-exit-policy.test.ts
      - name: Type-check policy and orchestrator
        run: |
          deno check supabase/functions/market-autotrader/futures-exit-policy.ts
          deno check supabase/functions/market-autotrader/index.ts
      - name: Run futures policy regressions
        run: deno test --allow-env supabase/functions/market-autotrader/futures-exit-policy.test.ts
      - name: Commit patched orchestrator and formatting
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts supabase/functions/market-autotrader/futures-exit-policy.ts supabase/functions/market-autotrader/futures-exit-policy.test.ts
          git commit -m "refactor: wire futures 3m recovery state machine"
          git push origin HEAD:agent/futures-3m-recovery-state-machine
