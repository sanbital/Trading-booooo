name: Forward Learning and Auto Promotion

on:
  schedule:
    # Hourly: reconcile matured automatic trades and promote only when the guarded
    # forward-validation requirements are satisfied.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate secrets
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
        run: |
          for name in SUPABASE_PROJECT_REF LEARNING_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret ${name}"
              exit 1
            fi
          done
          if [ "${#LEARNING_ACCESS_TOKEN}" -lt 32 ]; then
            echo "::error::LEARNING_ACCESS_TOKEN must be at least 32 characters"
            exit 1
          fi

      - name: Reconcile outcomes and auto-promote
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "content-type: application/json" \
            -H "x-learning-token: ${LEARNING_ACCESS_TOKEN}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-learning"
