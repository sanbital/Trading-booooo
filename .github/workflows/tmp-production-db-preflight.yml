name: Temporary production DB preflight
on:
  push:
    branches: [fix/db-singleflight-collector-isolation-20260930]
    paths: [.github/workflows/tmp-production-db-preflight.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/tmp-production-db-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Read production DB once
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=8000 -c lock_timeout=1000'
          timeout 20s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee preflight-db.txt
          select 'SERVER_TIME|' || now();
          select 'CRON50|' || row_to_json(x)::text from (
            select jobid,jobname,schedule,active,command from cron.job where jobid=50
          ) x;
          select 'LATEST_MIGRATION|' || version from supabase_migrations.schema_migrations order by version desc limit 10;
          select 'OPEN_POSITION|' || row_to_json(x)::text from (
            select id,symbol,state,side,remaining_quantity,entry_price,hard_stop_price,hard_deadline,
                   last_evaluated_at,updated_at
            from public.v11_long_regime_positions
            where state='OPEN'
            order by entry_at
          ) x;
          select 'UNRESOLVED_ORDER|' || row_to_json(x)::text from (
            select id,symbol,state,intent,requested_quantity,exchange_order_id,created_at,updated_at
            from public.v11_long_regime_orders
            where state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED')
            order by created_at
          ) x;
          select 'RUNTIME|' || row_to_json(x)::text from (
            select live_enabled,circuit_open,circuit_reason,incident_kind,incident_generation,
                   last_error,entry_block_reason,protection_health,last_cycle_started_at,last_cycle_completed_at
            from public.v11_long_regime_runtime where singleton=true
          ) x;
          select 'EXEC_LEASE_FN|' || encode(digest(pg_get_functiondef(p.oid),'sha256'),'hex') || '|' ||
                 replace(regexp_replace(pg_get_functiondef(p.oid),'[[:space:]]+',' ','g'),'|','/')
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='v17_acquire_execution_lease';
          select 'VERIFY_LEASE_FN|' || encode(digest(pg_get_functiondef(p.oid),'sha256'),'hex') || '|' ||
                 replace(regexp_replace(pg_get_functiondef(p.oid),'[[:space:]]+',' ','g'),'|','/')
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='v17_verify_execution_lease';
          select 'TRADING_LEASE_FN|' || encode(digest(pg_get_functiondef(p.oid),'sha256'),'hex') || '|' ||
                 replace(regexp_replace(pg_get_functiondef(p.oid),'[[:space:]]+',' ','g'),'|','/')
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='acquire_trading_lease';
          SQL
      - name: Read collector machine status
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          flyctl status --app sanbital-doa-capture-20260925 > collector-status.txt 2>&1 || true
          flyctl logs --app sanbital-doa-capture-20260925 --no-tail 2>&1 | tail -160 > collector-log.txt || true
          cat collector-status.txt
          tail -80 collector-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-production-db-preflight
          path: |
            preflight-db.txt
            collector-status.txt
            collector-log.txt
          retention-days: 1
