name: V10 R3 Locked Final Test

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/final-lock.json'

permissions:
  contents: read

jobs:
  final-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-final
          key: v10-final-binance-usdm-15m-2025-11-02-2026-01-01-v1
      - name: Run exactly one locked final test per lane
        run: python research/v10_continuation/run_r3_final_test.py
      - name: Upload locked final-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-r3-final-test-result
          path: research/v10_continuation/r3-final-test-result.json
          if-no-files-found: ignore
