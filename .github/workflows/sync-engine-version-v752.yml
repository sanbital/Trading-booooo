name: Sync engine version v7.5.2

# v7.5.2 shipped the autotrader runtime bump without its companion version alignment.
# The scanner kept stamping candidates 7.5.1-RESIDUAL-TP50-SL10 while the autotrader ran
# 7.5.2-RESIDUAL-TP10-SL4, so assessCandidateIntegrity() rejected every candidate with
# ENGINE_VERSION_MISMATCH and no entry could reach the order path.
#
# This workflow carries no strategy change. It only refuses to deploy unless every
# component in the checked-out ref already declares the same engine version, and then
# redeploys the scanner so the deployed runtime stamps that version onto new candidates.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-scanner/engine.ts"
      - ".github/workflows/sync-engine-version-v752.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-engine-version-v752
  cancel-in-progress: false

env:
  ENGINE_VERSION: 7.5.2-RESIDUAL-TP10-SL4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the ref being deployed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Assert every component declares one engine version
        shell: bash
        run: |
          set -euo pipefail
          grep -q "export const ENGINE_VERSION = \"${ENGINE_VERSION}\";" \
            supabase/functions/market-scanner/engine.ts
          grep -q "const VERSION = \"${ENGINE_VERSION}\";" \
            supabase/functions/market-autotrader/index.ts
          grep -q "const VERSION = \"${ENGINE_VERSION}\";" \
            gateway/server.mjs
          # A stale 7.5.1 string anywhere in a runtime file is the exact failure this
          # workflow exists to prevent, so it must fail the deploy rather than ship.
          if grep -rq '7\.5\.1-RESIDUAL-TP50-SL10' \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-autotrader/index.ts \
            gateway/server.mjs; then
            echo "::error::a runtime file still declares the v7.5.1 engine version"
            exit 1
          fi

      - name: Validate scanner runtime
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts
          deno check supabase/functions/market-scanner/index.ts
          node --check gateway/server.mjs
          node --test gateway/server.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy market scanner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy market-scanner \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

      - name: Verify the database canonical revision matches the deployed runtime
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # psql does not interpolate variables inside a dollar-quoted body, so the
          # expected version is written out here and cross-checked against $ENGINE_VERSION
          # by the grep below.
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_canonical text;
            v_admission text;
          begin
            select canonical_engine_revision into v_canonical
            from public.trading_ops_invariants where id = 1;
            select lob_live_admission_revision into v_admission
            from public.trading_settings where id = 1;
            if v_canonical is distinct from '7.5.2-RESIDUAL-TP10-SL4'
               or v_admission is distinct from '7.5.2-RESIDUAL-TP10-SL4' then
              raise exception
                'database canonical revision (%/%) does not match the deployed runtime',
                v_canonical, v_admission;
            end if;
          end
          $$;
          SQL
          test "${ENGINE_VERSION}" = "7.5.2-RESIDUAL-TP10-SL4"
