name: Deploy V17 Exit Reliability

# Ships the V17 exit-reliability patch to the production v10-lane-executor:
# batched top-of-book quote with a staleness gate, close-before-audit ordering,
# and deterministic exit attempt identifiers. The R3/R4 review modules ride along
# as unreferenced files; nothing imports them from the live path.
#
# The Binance gateway half of this change (v17_create_stop / v17_cancel_stop)
# is deployed by deploy-binance-gateway.yml, which already fires on any push to
# main touching gateway/**. Do not deploy the gateway from here as well.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/v17-exit-reliability-deploy-trigger.txt"

permissions:
  contents: read

concurrency:
  group: deploy-v17-exit-reliability-20260908
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false

      - name: Check the exit protection wiring
        shell: bash
        run: |
          set -euo pipefail
          # Cost-breakeven / profit-lock protection is ACTIVE: the executor spreads
          # EXIT_REVIEW_CANDIDATE into the effective policy. Both thresholds are applied
          # per tick with no confirmation window, so they work on the one-minute cron.
          grep -Fq 'nextExitReviewed' supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'V17-EXIT-R5-LOSS-TAIL-1' supabase/functions/v10-lane-executor/index.ts
          grep -Eq 'const policy=\{\.\.\.POLICY,.*EXIT_REVIEW_CANDIDATE' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::EXIT_REVIEW_CANDIDATE no longer reaches the effective policy; profit protection would be off."; exit 1; }

          # R5 loss-tail ladder. The cutover is per position: only rows stamped at entry with
          # leaderExitPolicyVersion take the new ladder, so a position open across a deploy
          # keeps the policy it was opened under and never has its stop moved underneath it.
          grep -Fq 'EXIT_REVIEW_R5' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::the executor no longer selects the R5 exit ladder."; exit 1; }
          grep -Fq 'leaderExitPolicyVersion:EXIT_REVIEW_R5.policyVersion' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::new positions are not stamped with the R5 policy version; the cutover would never start."; exit 1; }
          grep -Eq 'const r5=meta\.leaderExitPolicyVersion===EXIT_REVIEW_R5\.policyVersion;' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::the per-position R5 gate is missing; open positions could have their stop moved by a deploy."; exit 1; }
          for key in riskCutArmPct riskCutLevelPct failCutAfterMs policyVersion; do
            grep -Fq "$key" supabase/functions/_shared/leader-exit-review.mjs \
              || { echo "::error::EXIT_REVIEW_R5 lost $key; the risk cut cannot arm."; exit 1; }
          done

          # costBreakeven() needs both cost inputs; without them it throws and the whole
          # exit evaluation aborts, leaving the position with no stop at all.
          for key in estimatedExitFeeRate exitSlippageBudgetPct breakEvenArmPct profitLockArmPct profitLockCapture; do
            grep -Fq "$key" supabase/functions/_shared/leader-exit-review.mjs \
              || { echo "::error::EXIT_REVIEW_CANDIDATE lost $key; the breakeven math cannot run."; exit 1; }
          done
          # A row with an unusable fee/quantity must fall back to the baseline stop
          # rather than abort the evaluation.
          grep -Fq 'costUsable' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::missing the unusable-cost fallback; a bad row would leave a position unmanaged."; exit 1; }

          # The exchange-resident stop must stay opt-in. Enabling it starts submitting
          # real STOP_MARKET orders, which is an operator decision, not a deploy effect.
          grep -Fq 'const NATIVE_STOP_ENABLED=env("V17_NATIVE_STOP")==="true";' supabase/functions/v10-lane-executor/index.ts \
            || { echo "::error::the native stop flag is missing or no longer defaults off."; exit 1; }

          # R3/R4 stay out of the live path. Their exits need a confirmation clock that a
          # one-minute cron cannot feed: maxEvidenceGapMs is 3s, so every tick resets
          # breachSince and the 10s confirmation never completes, which would silently
          # remove the soft stop and all profit protection. Wiring them requires a
          # sub-second event host first.
          for mod in leader-exit-r3 leader-exit-r4; do
            if grep -Fq "$mod" supabase/functions/v10-lane-executor/index.ts; then
              echo "::error::executor imports $mod; its confirmation clock cannot run on the one-minute cron."
              exit 1
            fi
          done

      - name: Run the V17 exit test suite against production sources
        shell: bash
        run: |
          set -euo pipefail
          node --test test-support/v17-exit/*.test.mjs
          node --check gateway/server.mjs
          node --test gateway/server.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Validate production deploy secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"

      - name: Deploy v10-lane-executor only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy v10-lane-executor \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

      - name: Verify function is active
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${SUPABASE_PROJECT_REF}" | tee /tmp/functions.txt
          grep -q "v10-lane-executor" /tmp/functions.txt
