name: Postpatch Performance Audit Actual 0602

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-postpatch-performance-actual.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only actual-trade performance audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -P pager=off -F '|' -A -t <<'SQL'
          with params as (
            select timestamptz '2026-08-16 10:16:42+00' patch_ts,
                   timestamptz '2026-08-16 21:02:11+00' now_ts,
                   timestamptz '2026-08-15 23:31:13+00' prev_equal_start,
                   timestamptz '2026-08-15 10:16:42+00' pre24_start
          ), windows as (
            select 'POST_PATCH'::text label, patch_ts s, now_ts e from params
            union all select 'PRE_EQUAL', prev_equal_start, patch_ts from params
            union all select 'PRE_24H', pre24_start, patch_ts from params
          ), b as (
            select w.label, case when p.exchange='binance_futures' then 'FUTURES' else 'SPOT' end kind, p.*
            from windows w join public.trading_positions p on p.closed_at>=w.s and p.closed_at<w.e
            where p.is_paper=false and p.closed_at is not null and p.opened_at is not null
              and p.realized_return_pct is not null
          )
          select 'ACTUAL',label,kind,count(*) trades,
                 count(*) filter(where realized_pnl_quote>0) wins,
                 count(*) filter(where realized_pnl_quote<0) losses,
                 round((100.0*count(*) filter(where realized_pnl_quote>0)/nullif(count(*),0))::numeric,2) win_rate,
                 round(sum(realized_pnl_quote)::numeric,6) pnl,
                 round(avg(realized_return_pct)::numeric,4) avg_ret,
                 round(avg(realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) avg_win,
                 round(avg(realized_return_pct) filter(where realized_pnl_quote<0)::numeric,4) avg_loss,
                 count(*) filter(where close_reason='HARD_STOP' or close_reason='STOP' or close_reason ilike '%STOP%') stops,
                 round((100.0*count(*) filter(where close_reason='HARD_STOP' or close_reason='STOP' or close_reason ilike '%STOP%')/nullif(count(*),0))::numeric,2) stop_rate,
                 round(avg(mfe_capture_ratio)::numeric,4) mfe_all,
                 round(avg(mfe_capture_ratio) filter(where realized_pnl_quote>0)::numeric,4) mfe_wins,
                 round(avg(profit_giveback_pct)::numeric,4) giveback_all,
                 round(avg(profit_giveback_pct) filter(where realized_pnl_quote>0)::numeric,4) giveback_wins
          from b group by label,kind order by label,kind;
          SQL
