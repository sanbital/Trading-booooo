name: Patch Futures Entry Leakage

on:
  push:
    paths:
      - '.github/workflows/patch-futures-entry-leakage.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          policy = 'supabase/functions/market-autotrader/futures-exit-policy.ts'
          marker = '/** Return on margin: a 4% price move on 3x margin is a 12% move on the money posted. */'
          helper = r'''export type FuturesAffordableEntryInput = {
  /** Free USDⓈ-M wallet margin available to the bot at order time. */
  availableMarginQuote: number;
  /** Strategy-requested contract notional before wallet affordability is applied. */
  requestedNotionalQuote: number;
  entryPrice: number;
  quantityStep: number;
  leverage: number;
  /** One-side taker commission in percentage units, e.g. 0.05 means 0.05%. */
  feePerSidePct: number;
};

export type FuturesAffordableEntry = {
  quantity: number;
  notionalQuote: number;
  marginQuote: number;
  entryFeeQuote: number;
  totalWalletDebitQuote: number;
};

/**
 * Cap a futures entry by the wallet amount that can fund BOTH initial margin and the
 * entry commission. Quantity is floored to the venue step so this function can never
 * manufacture extra leverage merely to preserve a nominal allocation floor.
 *
 * Production evidence on 2026-08-17..19 showed repeated `Margin is insufficient`
 * rejections when the engine allocated 100% of available USDⓈ-M balance as margin. At
 * 3x, a 0.05% taker fee consumes another 0.15% of the posted margin. The exchange needs
 * that fee headroom before it can accept the order.
 */
export function futuresAffordableEntry(
  input: FuturesAffordableEntryInput,
): FuturesAffordableEntry {
  const available = Math.max(0, finite(input.availableMarginQuote));
  const requestedNotional = Math.max(0, finite(input.requestedNotionalQuote));
  const entryPrice = Math.max(0, finite(input.entryPrice));
  const quantityStep = Math.max(0, finite(input.quantityStep));
  const leverage = normalizeFuturesLeverage(input.leverage);
  const feeRate = Math.max(0, finite(input.feePerSidePct)) / 100;
  if (!(available > 0 && requestedNotional > 0 && entryPrice > 0)) {
    return {
      quantity: 0,
      notionalQuote: 0,
      marginQuote: 0,
      entryFeeQuote: 0,
      totalWalletDebitQuote: 0,
    };
  }

  // notional/leverage + notional*feeRate <= available
  const walletNotionalCap = available / (1 / leverage + feeRate);
  const targetNotional = Math.min(requestedNotional, walletNotionalCap);
  const rawQuantity = targetNotional / entryPrice;
  const quantity = quantityStep > 0
    ? Math.floor((rawQuantity + quantityStep * 1e-10) / quantityStep) * quantityStep
    : rawQuantity;
  const notionalQuote = Math.max(0, quantity * entryPrice);
  const marginQuote = notionalQuote / leverage;
  const entryFeeQuote = notionalQuote * feeRate;
  return {
    quantity,
    notionalQuote,
    marginQuote,
    entryFeeQuote,
    totalWalletDebitQuote: marginQuote + entryFeeQuote,
  };
}

'''
          replace_once(policy, marker, helper + marker)

          test = 'supabase/functions/market-autotrader/futures-exit-policy.test.ts'
          replace_once(
              test,
              'import { assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";',
              'import { assert, assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";',
          )
          replace_once(
              test,
              '  futuresEntryMinimums,\n',
              '  futuresAffordableEntry,\n  futuresEntryMinimums,\n',
          )
          affordability_test = r'''Deno.test("futures entry reserves live fee headroom instead of spending 100% of wallet as margin", () => {
  const available = 66.38173576;
  const result = futuresAffordableEntry({
    availableMarginQuote: available,
    requestedNotionalQuote: available * 3,
    entryPrice: 0.5,
    quantityStep: 0.1,
    leverage: 3,
    feePerSidePct: 0.05,
  });
  assert(result.quantity > 0);
  assert(result.marginQuote >= FUTURES_MIN_ENTRY_MARGIN_USDT);
  assert(result.notionalQuote < available * 3);
  assert(result.totalWalletDebitQuote <= available + 1e-9);
});

Deno.test("futures affordable quantity never rounds upward beyond wallet capacity", () => {
  const result = futuresAffordableEntry({
    availableMarginQuote: 66.38173576,
    requestedNotionalQuote: 199.14520728,
    entryPrice: 60_000,
    quantityStep: 0.001,
    leverage: 3,
    feePerSidePct: 0.05,
  });
  assertEquals(result.quantity, 0.003);
  assert(result.totalWalletDebitQuote <= 66.38173576 + 1e-9);
});

'''
          replace_once(
              test,
              'Deno.test("3x converts -4/+5 price return to -12/+15 ROE", () => {',
              affordability_test + 'Deno.test("3x converts -4/+5 price return to -12/+15 ROE", () => {',
          )

          engine = 'supabase/functions/market-autotrader/index.ts'
          replace_once(
              engine,
              '  FUTURES_SPLIT_EXIT_THRESHOLDS,\n  futuresEntryMinimums,\n',
              '  FUTURES_SPLIT_EXIT_THRESHOLDS,\n  futuresAffordableEntry,\n  futuresEntryMinimums,\n',
          )

          universe_helper = r'''const BINANCE_FUTURES_PUBLIC_URL = "https://fapi.binance.com";
let activeFuturesSymbolCache: { expires: number; symbols: Set<string> } | null = null;

/**
 * Spot and USDⓈ-M share symbol grammar, not listing membership. Refresh the active
 * perpetual universe once per five minutes so a spot-only gainer is never promoted into
 * a futures candidate and sent through klines/LOB/order endpoints that cannot accept it.
 */
async function activeBinanceFuturesSymbols(): Promise<Set<string>> {
  const now = Date.now();
  if (activeFuturesSymbolCache && activeFuturesSymbolCache.expires > now) {
    return activeFuturesSymbolCache.symbols;
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8_000);
  try {
    const response = await fetch(`${BINANCE_FUTURES_PUBLIC_URL}/fapi/v1/exchangeInfo`, {
      signal: controller.signal,
      headers: { Accept: "application/json" },
    });
    if (!response.ok) {
      throw new Error(`Binance futures exchangeInfo ${response.status}`);
    }
    const payload = await response.json();
    const rows = Array.isArray(payload?.symbols) ? payload.symbols : [];
    const symbols = new Set<string>(
      rows
        .filter((row: JsonRecord) =>
          String(row?.status || "") === "TRADING" &&
          String(row?.contractType || "") === "PERPETUAL" &&
          String(row?.quoteAsset || "") === "USDT"
        )
        .map((row: JsonRecord) => String(row?.symbol || "").toUpperCase())
        .filter(Boolean),
    );
    if (!symbols.size) throw new Error("Binance futures exchangeInfo returned no active USDT perpetuals");
    activeFuturesSymbolCache = { expires: now + 5 * 60_000, symbols };
    return symbols;
  } finally {
    clearTimeout(timer);
  }
}

'''
          replace_once(
              engine,
              'const DASHBOARD_ORIGIN = env("ALLOWED_ORIGINS").split(",")[0] || "*";',
              universe_helper + 'const DASHBOARD_ORIGIN = env("ALLOWED_ORIGINS").split(",")[0] || "*";',
          )

          old_mirror = '''  const already = new Set((existing || []).map((row) => String(row.market)));
  const clones = (spot || [])
    .filter((row) => !already.has(String(row.market)))
    .map((row) => {
'''
          new_mirror = '''  const already = new Set((existing || []).map((row) => String(row.market)));
  const unmirroredSpot = (spot || []).filter((row) => !already.has(String(row.market)));
  let activeFuturesSymbols: Set<string>;
  try {
    activeFuturesSymbols = await activeBinanceFuturesSymbols();
  } catch (error) {
    await event(
      "FUTURES_UNIVERSE_REFRESH_FAILED",
      "Binance futures universe unavailable; skipping futures mirror for this scan",
      { scan_id: scanId, error: error instanceof Error ? error.message : String(error) },
      { cycleId, level: "WARN" },
    );
    return 0;
  }
  const skippedMarkets = unmirroredSpot
    .map((row) => String(row.market || "").toUpperCase())
    .filter((market) => market && !activeFuturesSymbols.has(market));
  if (skippedMarkets.length) {
    await event(
      "FUTURES_SPOT_ONLY_SYMBOL_SKIPPED",
      "Spot BUY candidates without an active USDⓈ-M perpetual were not mirrored",
      { scan_id: scanId, markets: skippedMarkets, count: skippedMarkets.length },
      { cycleId, level: "INFO" },
    );
  }
  const clones = unmirroredSpot
    .filter((row) => activeFuturesSymbols.has(String(row.market || "").toUpperCase()))
    .map((row) => {
'''
          replace_once(engine, old_mirror, new_mirror)

          old_qty = '''  let quantity = entryQuantityForNotional(
    exchange,
    sizing.notionalQuote,
    entryPrice,
    rules.quantity_step || 0.00000001,
  );
'''
          new_qty = '''  const entryQuantityStep = rules.quantity_step || 0.00000001;
  const futuresEntryFeePct = exchange === "binance_futures"
    ? await liveFeePct(exchange, settings)
    : 0;
  const executableEntryQuantity = (requestedNotionalQuote: number): number => {
    if (exchange !== "binance_futures") {
      return entryQuantityForNotional(
        exchange,
        requestedNotionalQuote,
        entryPrice,
        entryQuantityStep,
      );
    }
    return futuresAffordableEntry({
      availableMarginQuote: managedAvailable,
      requestedNotionalQuote,
      entryPrice,
      quantityStep: entryQuantityStep,
      leverage,
      feePerSidePct: futuresEntryFeePct,
    }).quantity;
  };
  let quantity = executableEntryQuantity(sizing.notionalQuote);
'''
          replace_once(engine, old_qty, new_qty)

          old_resized = '''      quantity = entryQuantityForNotional(
        exchange,
        decision.notional,
        entryPrice,
        rules.quantity_step || 0.00000001,
      );
'''
          new_resized = '''      quantity = executableEntryQuantity(decision.notional);
'''
          replace_once(engine, old_resized, new_resized)

          lane_test = 'supabase/functions/market-autotrader/futures-lane.test.ts'
          lane_add = r'''Deno.test("futures mirror rejects spot-only symbols before candidate admission", () => {
  assert(ENGINE.includes("activeBinanceFuturesSymbols"));
  assert(ENGINE.includes('"FUTURES_SPOT_ONLY_SYMBOL_SKIPPED"'));
  assert(
    ENGINE.includes(
      '.filter((row) => activeFuturesSymbols.has(String(row.market || "").toUpperCase()))',
    ),
  );
});

Deno.test("futures entry quantity reserves wallet headroom for the live entry fee", () => {
  assert(ENGINE.includes("futuresAffordableEntry({"));
  assert(ENGINE.includes("availableMarginQuote: managedAvailable"));
  assert(ENGINE.includes("feePerSidePct: futuresEntryFeePct"));
  assert(!ENGINE.includes("let quantity = entryQuantityForNotional(\n    exchange,\n    sizing.notionalQuote"));
});

'''
          replace_once(
              lane_test,
              'Deno.test("entry sizing commits margin and the exchange sees margin x leverage", () => {',
              lane_add + 'Deno.test("entry sizing commits margin and the exchange sees margin x leverage", () => {',
          )
          PY

      - name: Format patched files
        run: deno fmt supabase/functions/market-autotrader/index.ts supabase/functions/market-autotrader/futures-exit-policy.ts supabase/functions/market-autotrader/futures-exit-policy.test.ts supabase/functions/market-autotrader/futures-lane.test.ts

      - name: Run focused tests
        run: deno test --allow-read supabase/functions/market-autotrader/futures-exit-policy.test.ts supabase/functions/market-autotrader/futures-lane.test.ts

      - name: Type-check autotrader
        run: deno check supabase/functions/market-autotrader/index.ts

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts \
                  supabase/functions/market-autotrader/futures-exit-policy.ts \
                  supabase/functions/market-autotrader/futures-exit-policy.test.ts \
                  supabase/functions/market-autotrader/futures-lane.test.ts
          git diff --cached --check
          git commit -m "fix: remove futures entry execution leakage"
          git push origin HEAD:main
