name: Signal generator production parity
on:
  pull_request:
    paths:
      - supabase/functions/v10-lane-signal-generator/**
      - deployment-evidence/signal-generator-v51-baseline.json
      - tests/signal-generator-production-baseline.test.mjs
      - .github/workflows/signal-generator-parity.yml
permissions:
  contents: read
jobs:
  production-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --prefix test-support/deterministic
      - run: node --test tests/signal-generator-production-baseline.test.mjs tests/leader20-generator.test.mjs
      - run: |
          ln -s "$PWD/test-support/deterministic/node_modules" "$PWD/node_modules"
          deno check --no-config --node-modules-dir=manual \
            --import-map test-support/v19-ops/deno-import-map.json \
            supabase/functions/v10-lane-signal-generator/index.ts
