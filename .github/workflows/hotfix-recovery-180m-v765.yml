              )
              append_once(
                  test_path,
                  'STALE_RECOVERY_NET_POSITIVE_EXIT_180M',
                  '''Deno.test("spot 180m recovery exits 100% only on executable positive net", () => {
  const before = decide({
    heldSeconds: 10_799,
    grossReturnPct: 1,
    executableNetAllowed: true,
    expectedNetProfitQuote: 0.2,
  });
  assertEquals(before.action, "NONE");

  const exit = decide({
    heldSeconds: 10_800,
    grossReturnPct: 1,
    executableNetAllowed: true,
    expectedNetProfitQuote: 0.2,
