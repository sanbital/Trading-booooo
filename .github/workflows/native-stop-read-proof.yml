name: Native stop encrypted read proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-stop-read-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'sanbital/Trading-booooo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only exchange and ledger proof
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: node ops/execution-infra/native-stop-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stop-proof-${{ github.run_id }}
          path: infra-evidence/*.encrypted.json
          retention-days: 7
          if-no-files-found: error
