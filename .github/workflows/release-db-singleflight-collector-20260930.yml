name: Release dynamic capture recovery 20260930
# One release for the symbol-scoped collector recovery and its bounded inference refresh.
# Retired one-shot release. Its original release completed on 2026-09-30.
# A test-file edit must never restart this historical production deploy.
# Reactivation requires a new reviewed workflow/version and a new live DB baseline.
on:
  workflow_dispatch:
env:
  ONE_SHOT_RELEASE_VERSION: DYNAMIC_CAPTURE_RECOVERY_20260930_RETIRED_1
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  release:
    # Fence this archived workflow by its immutable file identity, even if re-enabled.
    if: github.event_name == 'workflow_dispatch' && !contains(github.workflow_ref, '/release-db-singleflight-collector-20260930.yml@')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Verify exact minimal scope and regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git diff --check
          before='${{ github.event.before }}'
          test "$before" != '0000000000000000000000000000000000000000'
          while IFS= read -r path; do
            case "$path" in
              collectors/doa-capture/bootstrap.test.mjs|collectors/doa-capture/core.mjs|collectors/doa-capture/core.test.mjs|collectors/doa-capture/worker.mjs|ops/leader20/book-bootstrap-release.mjs|supabase/functions/_shared/gpt-final-decision/capture-context.mjs|tests/capture-recovery-finite.test.mjs|tests/dynamic-capture-recovery-scope.test.mjs|tests/inference-acquisition.test.mjs|tests/leader20-campaign-lifecycle.test.mjs|tests/timeout-recovery.test.mjs|.github/workflows/release-db-singleflight-collector-20260930.yml) ;;
              *) echo "OUT_OF_SCOPE_CHANGE:$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$before" "$GITHUB_SHA")
          npm install --prefix "$RUNNER_TEMP/dynamic-capture-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/dynamic-capture-test/node_modules/@electric-sql/pglite/dist/index.js"
          node --test --test-concurrency=1 \
            collectors/doa-capture/*.test.mjs \
            tests/capture-recovery-finite.test.mjs \
            tests/dynamic-capture-recovery-scope.test.mjs \
            tests/dynamic-flow-lifecycle.test.mjs \
            tests/inference-acquisition.test.mjs \
            tests/leader20-campaign-lifecycle.test.mjs \
            tests/leader20.test.mjs \
            tests/timeout-recovery.test.mjs | tee release-evidence/tests.tap
          node --check collectors/doa-capture/worker.mjs
          node --check ops/leader20/book-bootstrap-release.mjs
          deno check --no-config supabase/functions/v10-lane-executor/index.ts
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Capture production baseline and deploy bounded inference refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-before.json
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 <<'SQL' > release-evidence/production-before.json
          select jsonb_build_object(
            'captured_at',clock_timestamp(),
            'collector',(select to_jsonb(c)-'lease_owner' from doa_capture.control c where id=1),
            'book_unsynced_or_stale_2h',(select count(*) from doa_capture.live_micro where at>=now()-interval '2 hours' and payload->>'reason'='BOOK_UNSYNCED_OR_STALE'),
            'dynamic_clock_invalid_2h',(select count(*) from public.gpt_final_entry_reviews where created_at>=now()-interval '2 hours' and record#>>'{result,error}'='DYNAMIC_CLOCK_INVALID_OR_NONCAUSAL_BUCKET'),
            'capture_not_ready_2h',(select count(*) from public.gpt_final_entry_reviews where created_at>=now()-interval '2 hours' and record#>>'{result,error}'='DYNAMIC_INFERENCE_CAPTURE_NOT_READY'),
            'gpt_reviews_2h',(select count(*) from public.gpt_final_entry_reviews where created_at>=now()-interval '2 hours'),
            'gpt_buys_2h',(select count(*) from public.gpt_final_entry_reviews where created_at>=now()-interval '2 hours' and record#>>'{result,decision}'='BUY'));
          SQL
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p));return x.functions??x};
          const before=rows('release-evidence/functions-before.json'),after=rows('release-evidence/functions-after.json');
          const old=before.find(x=>x.slug==='v10-lane-executor'),fresh=after.find(x=>x.slug==='v10-lane-executor');
          const ingest=after.find(x=>x.slug==='doa-capture-ingest');
          if(!old||!fresh||Number(fresh.version)<=Number(old.version)||fresh.status!=='ACTIVE'||fresh.verify_jwt!==false)
            throw Error('V10_DEPLOY_NOT_ACTIVE:'+JSON.stringify({old,fresh}));
          if(!ingest||ingest.status!=='ACTIVE'||ingest.verify_jwt!==false)throw Error('INGEST_NOT_ACTIVE:'+JSON.stringify(ingest));
          NODE
      - name: Build and push exact collector image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP='sanbital-doa-capture-20260925'
          IMAGE="registry.fly.io/$APP:${GITHUB_SHA}"
          flyctl auth docker
          docker build --build-arg SOURCE_COMMIT="${GITHUB_SHA}" -t "$IMAGE" collectors/doa-capture
          docker push "$IMAGE"
      - name: Replace only the existing collector machine image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const app='sanbital-doa-capture-20260925',sha=process.env.GITHUB_SHA;
          const image=`registry.fly.io/${app}:${sha}`;
          const api=async(path='',method='GET',body,nonce)=>{
            const r=await fetch(`https://api.machines.dev/v1/apps/${app}/machines${path}`,{
              method,
              headers:{authorization:'Bearer '+process.env.FLY_API_TOKEN,'content-type':'application/json',
                ...(nonce?{'fly-machine-lease-nonce':nonce}:{})},
              ...(body?{body:JSON.stringify(body)}:{}),
              signal:AbortSignal.timeout(60000)
            });
            const text=await r.text();
            if(!r.ok)throw Error(`MACHINE_HTTP_${r.status}:${text.slice(0,200)}`);
            return text?JSON.parse(text):null;
          };
          const list=await api();
          if(!Array.isArray(list)||list.length!==1)throw Error('EXPECTED_ONE_COLLECTOR');
          const before=await api('/'+list[0].id),cfg=before.config??{};
          if(before.state!=='started')throw Error('COLLECTOR_NOT_STARTED_BEFORE_RELEASE');
          if(cfg.env?.CAPTURE_ENDPOINT!=='https://etaajwpernzrcdrifdnw.supabase.co/functions/v1/doa-capture-ingest')
            throw Error('CAPTURE_ENDPOINT_CHANGED');
          if(!/^[a-f0-9]{64}$/.test(cfg.env?.PROTOCOL_SHA256??''))throw Error('PROTOCOL_ENV_INVALID');
          const lease=await api('/'+before.id+'/lease','POST',{description:'db-singleflight-'+sha.slice(0,12),ttl:60});
          const nonce=lease?.data?.nonce;if(!nonce)throw Error('MACHINE_LEASE_MISSING');
          try{
            const current=await api('/'+before.id);
            if(current.instance_id!==before.instance_id)throw Error('CONCURRENT_COLLECTOR_DEPLOY');
            await api('/'+before.id,'POST',{
              current_version:before.instance_id,
              config:{...cfg,image,auto_destroy:false,restart:{policy:'always'}}
            },nonce);
          }finally{
            await api('/'+before.id+'/lease','DELETE',undefined,nonce).catch(()=>null);
          }
          await new Promise(r=>setTimeout(r,15000));
          const after=await api('/'+before.id);
          if(after.state!=='started'||after.config?.image!==image)throw Error('COLLECTOR_IMAGE_NOT_ACTIVE');
          if(after.config?.restart?.policy!=='always'||after.config?.auto_destroy===true)
            throw Error('COLLECTOR_SUPERVISION_NOT_SAFE');
          console.log(JSON.stringify({collector_id:after.id,state:after.state,image:after.config.image,
            restart:after.config.restart,auto_destroy:after.config.auto_destroy,source_commit:sha}));
          NODE
          date -u +%Y-%m-%dT%H:%M:%SZ > release-evidence/released-at.txt
      - name: Observe a complete 24-bucket production window
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 9); do sleep 15; done
          since="$(cat release-evidence/released-at.txt)"
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 --set=since="$since" <<'SQL' > release-evidence/production-after.json
          select jsonb_build_object(
            'captured_at',clock_timestamp(),
            'release_at',:'since'::timestamptz,
            'collector_health',public.leader20_collector_health(),
            'collector',(select jsonb_build_object(
              'enabled',enabled,'production_enabled',production_enabled,'heartbeat_at',heartbeat_at,
              'version',metrics->>'version','source_commit',metrics->>'source_commit',
              'watched',(metrics->>'watched')::int,'synced',(metrics->>'synced')::int,
              'book_states',metrics->'book_states','book_resync',metrics->'book_resync',
              'resync_successes',metrics->'resync_successes','resync_failures',metrics->'resync_failures')
             from doa_capture.control where id=1),
            'leader20_members',(select count(*) from public.leader20_members where epoch_id=(select epoch_id from public.leader20_control where singleton)),
            'recent_symbols',(select count(distinct symbol) from doa_capture.live_micro where kind='micro' and at>now()-interval '90 seconds'),
            'book_unsynced_or_stale',(select count(*) from doa_capture.live_micro where at>=:'since'::timestamptz and payload->>'reason'='BOOK_UNSYNCED_OR_STALE'),
            'complete_buckets',(select count(*) from doa_capture.live_micro where at>=:'since'::timestamptz and (payload->>'bucket_complete')::boolean),
            'dynamic_clock_invalid',(select count(*) from public.gpt_final_entry_reviews where created_at>=:'since'::timestamptz and record#>>'{result,error}'='DYNAMIC_CLOCK_INVALID_OR_NONCAUSAL_BUCKET'),
            'capture_not_ready',(select count(*) from public.gpt_final_entry_reviews where created_at>=:'since'::timestamptz and record#>>'{result,error}'='DYNAMIC_INFERENCE_CAPTURE_NOT_READY'),
            'gpt_reviews',(select count(*) from public.gpt_final_entry_reviews where created_at>=:'since'::timestamptz),
            'gpt_buys',(select count(*) from public.gpt_final_entry_reviews where created_at>=:'since'::timestamptz and record#>>'{result,decision}'='BUY'),
            'duplicate_symbol_buckets',(select count(*) from (select symbol,at,count(*) from doa_capture.live_micro where at>=:'since'::timestamptz group by symbol,at having count(*)>1)x));
          SQL
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('release-evidence/production-after.json','utf8').trim());
          if(x.collector_health?.live!==true||x.collector?.enabled!==true||x.collector?.production_enabled!==true)
            throw Error('COLLECTOR_NOT_LIVE:'+JSON.stringify(x));
          if(x.collector.version!=='DOA-CAPTURE-9-SYMBOL-RESYNC'||x.collector.source_commit!==process.env.GITHUB_SHA)
            throw Error('COLLECTOR_VERSION_MISMATCH:'+JSON.stringify(x.collector));
          if(x.leader20_members!==20||x.recent_symbols<20||x.collector.watched<20)
            throw Error('LEADER20_NOT_OBSERVED:'+JSON.stringify(x));
          if(x.duplicate_symbol_buckets!==0)throw Error('DUPLICATE_SYMBOL_BUCKET:'+JSON.stringify(x));
          NODE
      - name: Capture post-release collector logs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          flyctl logs --app sanbital-doa-capture-20260925 --no-tail 2>&1 | tail -160 | tee collector-release.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-singleflight-collector-release
          path: |
            collector-release.log
            release-evidence
          retention-days: 30
