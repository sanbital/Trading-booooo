name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-recovery-20260920:
    name: one-time DB recovery
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restart Supabase project and verify healthy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/restart-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw/restart")"
          echo "restart_http_status=$code"
          case "$code" in
            200|201|202|204) ;;
            *) cat /tmp/restart-response.txt; exit 1 ;;
          esac
          healthy=0
          for i in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw" || true)"
            if printf '%s' "$body" | grep -q '"status":"ACTIVE_HEALTHY"'; then
              healthy=1
              echo "project_status=ACTIVE_HEALTHY"
              break
            fi
            sleep 5
          done
          test "$healthy" = "1"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: Validate every workflow
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color
