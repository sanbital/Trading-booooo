name: Apply pre-breakout burst strategy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-prebreakout-burst-strategy.yml"
      - "scripts/apply_prebreakout_burst_strategy.py"
      - "scripts/fix_prebreakout_test_fixture.py"
  issues:
    types: [opened]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prebreakout-burst-strategy
  cancel-in-progress: false

jobs:
  patch-deploy-verify:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.title == '[DEPLOY] pre-breakout burst strategy') ||
      (github.event_name == 'pull_request' && github.event.pull_request.title == '[DEPLOY] pre-breakout burst strategy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Apply production patch
        run: |
          set -euo pipefail
          python3 scripts/apply_prebreakout_burst_strategy.py
          python3 scripts/fix_prebreakout_test_fixture.py

      - name: Format and validate
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/_shared/lob/minute-entry-gate.ts \
            supabase/functions/_shared/lob/minute-entry-market.ts \
            supabase/functions/_shared/lob/minute-entry-gate.test.ts \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-autotrader/index.ts
          deno test supabase/functions/_shared/lob/minute-entry-gate.test.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          grep -q 'M1-BB-PREBREAKOUT-STOCH-14-3-3-V2' supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'M1_CANDLE_ALREADY_EXTENDED' supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'BUY_PRESSURE_NOT_CONFIRMED' supabase/functions/_shared/lob/entry.ts
          grep -q 'PREBREAKOUT-BURST-V1: no planned stop' supabase/functions/market-autotrader/index.ts
          grep -q 'guardedNetReturnPct <= -2' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_UPPER_REENTRY_CONFIRMED' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_RECLAIM_FAILED' supabase/functions/market-autotrader/index.ts
          grep -q 'ORDERBOOK_COLLAPSE' supabase/functions/market-autotrader/index.ts
          ! grep -q 'const exp1ArmWidthsBps' supabase/functions/market-autotrader/index.ts

      - name: Commit canonical production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deploy-market-autotrader-v707.yml \
            supabase/functions/_shared/lob/minute-entry-gate.ts \
            supabase/functions/_shared/lob/minute-entry-market.ts \
            supabase/functions/_shared/lob/minute-entry-gate.test.ts \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/migrations/20260802151000_prebreakout_burst_entry_exit_policy.sql
          if git diff --cached --quiet; then
            echo "Production source already patched"
          else
            git commit -m "feat: trade the pre-breakout Bollinger burst"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve entry pause and pause during rollout
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          previous=$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c \
            "select coalesce(pause_new_entries,false)::text from public.trading_settings where id=1")
          previous=${previous:-true}
          echo "PREVIOUS_PAUSE_NEW_ENTRIES=${previous}" >> "${GITHUB_ENV}"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=true, updated_at=now() where id=1"

      - name: Deploy scanner and autotrader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          for fn in market-scanner market-autotrader; do
            supabase functions deploy "$fn" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --no-verify-jwt \
              --use-api
          done

      - name: Apply executable exit guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260802151000_prebreakout_burst_entry_exit_policy.sql

      - name: Verify production policy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_def text;
          begin
            select pg_get_functiondef(p.oid) into v_def
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'guard_lob_sell_order_v714';
            if v_def is null then
              raise exception 'guard_lob_sell_order_v714 is missing';
            end if;
            if position('PREBREAKOUT-BURST-V1' in v_def) = 0 then
              raise exception 'pre-breakout burst guard was not deployed';
            end if;
            if position('BB_UPPER_REENTRY_CONFIRMED' in v_def) = 0
               or position('BB_RECLAIM_FAILED' in v_def) = 0
               or position('ORDERBOOK_COLLAPSE' in v_def) = 0 then
              raise exception 'one or more canonical burst exits are missing';
            end if;
            if position('HARD_STOP_MINUS_2' in v_def) = 0 then
              raise exception 'executable-net minus-2 backstop is missing';
            end if;
            if position('POSITIVE_NET_AFTER_180S' in v_def) > 0
               or position('EXP1_ARM_STOP' in v_def) > 0
               or position('lob:STOP_HIT' in v_def) > 0 then
              raise exception 'legacy time/planned/experimental exit authority remains';
            end if;
            raise notice 'PREBREAKOUT-BURST-V1 guard verified';
          end
          $$;
          SQL

      - name: Restore prior entry-pause state
        if: always() && env.PREVIOUS_PAUSE_NEW_ENTRIES != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          case "${PREVIOUS_PAUSE_NEW_ENTRIES}" in
            true|t|1) restore=true ;;
            false|f|0) restore=false ;;
            *) restore=true ;;
          esac
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=${restore}, updated_at=now() where id=1"
          echo "Restored pause_new_entries=${restore}"
