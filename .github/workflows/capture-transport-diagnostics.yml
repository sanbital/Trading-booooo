    paths: [.github/workflows/capture-transport-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Read bounded contemporaneous CPU scheduling and collector logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
