name: Capture transport diagnostics
on:
  push:
    branches: [codex/capture-transport-backlog-20260926]
    paths: [.github/workflows/capture-transport-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Read existing collector logs and machine status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl logs --no-tail --app sanbital-doa-capture-20260925
          flyctl machine status 185030da006d48 --app sanbital-doa-capture-20260925
          flyctl ssh console --app sanbital-doa-capture-20260925 --command 'cat /proc/stat'
          sleep 15
          flyctl ssh console --app sanbital-doa-capture-20260925 --command 'cat /proc/stat'
# Post-capacity verification: same collector, current CPU scheduling and image.
