name: V10 R4 Robustness Surface

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/run_r4.py'
      - '.github/workflows/v10-r4-robustness.yml'

permissions:
  contents: read

jobs:
  r4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-r3
          key: v10-r3-binance-usdm-15m-2023-2025-v1
      - name: Run local robustness and cycle-aware RANGE research
        run: python research/v10_continuation/run_r4.py
      - name: Upload R4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-r4-result
          path: research/v10_continuation/r4-result.json
          if-no-files-found: ignore
