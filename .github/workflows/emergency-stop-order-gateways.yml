name: Emergency stop Trading Boo order gateways
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Scale every order gateway to zero
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BINANCE_APP: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          for app in trading-booooo trading-booooo-sanbital-gateway "$BINANCE_APP"; do
            test -n "$app"
            flyctl scale count 0 --app "$app" --yes
            echo "Stopped $app"
          done
