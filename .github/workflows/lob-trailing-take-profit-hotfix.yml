name: Apply LOB order-book trailing take-profit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lob-trailing-take-profit-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed hotfix script
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          workflow_path = ".github/workflows/lob-trailing-take-profit-hotfix.yml"
          reviewed = subprocess.check_output(
              ["git", "show", "29e0451479d70143fb85c6a7a4cf91210f392e86:" + workflow_path],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          if marker not in reviewed:
              raise SystemExit("reviewed hotfix script marker missing")
          block = reviewed.split(marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, "lob_trailing_hotfix.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Commit patched engine
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source change produced"
            exit 1
          fi
          git config user.name "Trading-booooo automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "feat: trail LOB profits from live order-book flow"
          git push origin HEAD:main

      - name: Deploy market-autotrader
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          npx --yes supabase@latest functions deploy market-autotrader \
            --project-ref etaajwpernzrcdrifdnw \
            --no-verify-jwt \
            --use-api
