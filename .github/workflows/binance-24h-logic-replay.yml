name: Binance 24h Logic Replay
on:
  push:
    branches: [main]
    paths:
      - 'research/binance_24h_logic_replay.py'
      - '.github/workflows/binance-24h-logic-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas 'psycopg[binary]' requests
      - name: Run decision-relevant 24h replay
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          python research/binance_24h_logic_replay.py
      - name: Persist results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/candidate24h
          git commit -m 'research: persist Binance 24h logic replay' || true
          git pull --rebase origin main
          git push
