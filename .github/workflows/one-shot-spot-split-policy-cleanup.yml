name: One-shot spot split policy cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-spot-split-policy-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply canonical spot split policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index_path = root / 'supabase/functions/market-autotrader/index.ts'
          old_policy_path = root / 'supabase/functions/market-autotrader/recovery-exit-policy.ts'
          old_test_path = root / 'supabase/functions/market-autotrader/recovery-exit-policy.test.ts'
          split_test_path = root / 'supabase/functions/market-autotrader/split-stop-policy.test.ts'
          futures_test_path = root / 'supabase/functions/market-autotrader/futures-lane.test.ts'
          new_policy_path = root / 'supabase/functions/market-autotrader/spot-exit-policy.ts'
          new_test_path = root / 'supabase/functions/market-autotrader/spot-exit-policy.test.ts'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          new_policy_path.write_text('''export const SPOT_SPLIT_EXIT_THRESHOLDS = {\n  firstTakeProfitPct: 5,\n  firstStopLossPct: -4,\n  residualTakeProfitPct: 10,\n  residualStopLossPct: -4,\n} as const;\n\nexport type SpotSplitExitInput = {\n  residualStage: boolean;\n  grossReturnPct: number;\n  residualNetReturnPct: number;\n  safetyRequested?: boolean;\n};\n\nexport type SpotSplitExitDecision = {\n  action: "STOP" | "NONE";\n  fraction: number;\n  reason: string;\n};\n\n/** Canonical spot policy: first 50% at +5%/-4%, residual 100% at +10%/-4%. */\nexport function spotSplitExitDecision(input: SpotSplitExitInput): SpotSplitExitDecision {\n  const t = SPOT_SPLIT_EXIT_THRESHOLDS;\n  if (input.residualStage) {\n    if (input.residualNetReturnPct >= t.residualTakeProfitPct) {\n      return { action: "STOP", fraction: 1, reason: "RESIDUAL_TAKE_PROFIT_10" };\n    }\n    if (input.residualNetReturnPct <= t.residualStopLossPct) {\n      return { action: "STOP", fraction: 1, reason: "RESIDUAL_STOP_LOSS_4" };\n    }\n    return { action: "NONE", fraction: 0, reason: "RESIDUAL_AWAITING_TP10_OR_SL4" };\n  }\n  if (input.grossReturnPct >= t.firstTakeProfitPct) {\n    return { action: "STOP", fraction: 0.5, reason: "HALF_HOLD_TAKE_PROFIT_5" };\n  }\n  if (input.grossReturnPct <= t.firstStopLossPct) {\n    return { action: "STOP", fraction: 0.5, reason: "HALF_HOLD_STOP_LOSS_4" };\n  }\n  return {\n    action: "NONE", fraction: 0,\n    reason: input.safetyRequested\n      ? "HALF_HOLD_THRESHOLD_OVERRIDES_NON_PRICE_SAFETY_EXIT"\n      : "HALF_HOLD_AWAITING_TP5_OR_SL4",\n  };\n}\n''')

          canonical_test = '''import { assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";\nimport { spotSplitExitDecision } from "./spot-exit-policy.ts";\n\nfunction decide(overrides: Partial<Parameters<typeof spotSplitExitDecision>[0]> = {}) {\n  return spotSplitExitDecision({ residualStage: false, grossReturnPct: 0, residualNetReturnPct: 0, safetyRequested: false, ...overrides });\n}\nDeno.test("spot first tranche sells 50% at +5%", () => { assertEquals(decide({ grossReturnPct: 5 }), { action: "STOP", fraction: 0.5, reason: "HALF_HOLD_TAKE_PROFIT_5" }); });\nDeno.test("spot first tranche sells 50% at -4%", () => { assertEquals(decide({ grossReturnPct: -4 }), { action: "STOP", fraction: 0.5, reason: "HALF_HOLD_STOP_LOSS_4" }); });\nDeno.test("spot residual exits all at +10%", () => { assertEquals(decide({ residualStage: true, residualNetReturnPct: 10 }), { action: "STOP", fraction: 1, reason: "RESIDUAL_TAKE_PROFIT_10" }); });\nDeno.test("spot residual exits all at -4%", () => { assertEquals(decide({ residualStage: true, residualNetReturnPct: -4 }), { action: "STOP", fraction: 1, reason: "RESIDUAL_STOP_LOSS_4" }); });\nDeno.test("spot residual holds only inside -4% to +10%", () => { assertEquals(decide({ residualStage: true, residualNetReturnPct: 9.99 }).action, "NONE"); assertEquals(decide({ residualStage: true, residualNetReturnPct: -3.99 }).action, "NONE"); });\n'''
          new_test_path.write_text(canonical_test)
          split_test_path.write_text(canonical_test)
          if old_policy_path.exists(): old_policy_path.unlink()
          if old_test_path.exists(): old_test_path.unlink()

          futures_test = futures_test_path.read_text()
          futures_test = replace_once(futures_test,
              '  assert(ENGINE.includes("halfHoldRecoveryExitDecision({"));',
              '  assert(ENGINE.includes("spotSplitExitDecision({"));', 'futures test spot helper')
          futures_test = replace_once(futures_test,
              '  assert(MIGRATION.includes("RECOVERY_TOTAL_NET_NOT_POSITIVE"));\n',
              '', 'futures test obsolete spot recovery assertion')
          futures_test_path.write_text(futures_test)

          text = index_path.read_text()
          text = replace_once(text, 'import { halfHoldRecoveryExitDecision } from "./recovery-exit-policy.ts";', 'import { spotSplitExitDecision } from "./spot-exit-policy.ts";', 'spot import')
          text = replace_once(text, '  const recoveryNetPositive = decisionReason === "RECOVERY_NET_POSITIVE_EXIT" ||\n    decisionReason === "FUTURES_RECOVERY_NET_POSITIVE_EXIT";', '  const recoveryNetPositive = decisionReason === "FUTURES_RECOVERY_NET_POSITIVE_EXIT";', 'spot protected recovery')

          block = re.compile(r'  if \(\n    \(decisionReason === "HALF_HOLD_STOP_LOSS_4" \|\|\n      decisionReason === "FUTURES_HALF_STOP_LOSS_ROE_12"\) &&\n    !finalized\?\.closed &&\n    finite\(finalized\?\.position\?\.remaining_quantity\) > 0\n  \) \{.*?\n  \}\n  if \(\n    \(targetAction \|\| positiveNetGuardedExit\)', re.S)
          m = block.search(text)
          if not m: raise SystemExit('mixed recovery block not found')
          futures_only = '''  if (\n    decisionReason === "FUTURES_HALF_STOP_LOSS_ROE_12" &&\n    !finalized?.closed &&\n    finite(finalized?.position?.remaining_quantity) > 0\n  ) {\n    const enteredAt = new Date().toISOString();\n    const priorMetadata = finalized.position?.metadata || position.metadata || {};\n    const recoveryMetadata = { ...priorMetadata, recovery_exit: {\n      ...(priorMetadata.recovery_exit || {}), enabled: true, revision: VERSION, entered_at: enteredAt,\n      trigger_reason: "FUTURES_HALF_STOP_LOSS_ROE_12", first_exit_price: finite(result?.fill?.averagePrice, price),\n      first_exit_quantity: finite(result?.fill?.executedVolume), realized_pnl_quote_after_first_exit: finite(finalized.position?.realized_pnl_quote),\n      exit_rule: "RESIDUAL_NET_PNL_GT_0", leverage: positionLeverage(position), percentage_residual_thresholds_disabled: true,\n    }};\n    const recoveryPosition = (await patch("trading_positions", `id=eq.${position.id}`, { metadata: recoveryMetadata }))[0] || { ...finalized.position, metadata: recoveryMetadata };\n    await event("RECOVERY_MODE_ENTERED", `${position.exchange}:${position.market} first -12% ROE tranche filled; residual waits for positive residual net`,\n      { first_exit_price: recoveryMetadata.recovery_exit.first_exit_price, first_exit_quantity: recoveryMetadata.recovery_exit.first_exit_quantity, realized_pnl_quote_after_first_exit: recoveryMetadata.recovery_exit.realized_pnl_quote_after_first_exit, exit_rule: recoveryMetadata.recovery_exit.exit_rule },\n      { cycleId, positionId: position.id, orderId: result.orderRow?.id, level: "INFO" });\n    finalized = { ...finalized, position: recoveryPosition };\n    position = { ...position, ...recoveryPosition };\n  }\n  if (\n    (targetAction || positiveNetGuardedExit)'''
          text = text[:m.start()] + futures_only + text[m.end():]

          text = replace_once(text, '      decisionReason === "RECOVERY_NET_POSITIVE_EXIT" ||\n      decisionReason === "FUTURES_RECOVERY_NET_POSITIVE_EXIT" ||', '      decisionReason === "FUTURES_RECOVERY_NET_POSITIVE_EXIT" ||', 'terminal spot recovery')
          text = replace_once(text,
              '      // Spot LOB keeps HALF-HOLD-RECOVERY-NET-POSITIVE-V4. Futures always enters this\n      // boundary too, but its dedicated branch replaces every spot decision with the\n      // position-stamped leverage rules (+15/-12 then +30 or residual-net recovery).\n      if ((lobMode || futuresLane) && !settings.emergency_liquidation) {\n        const BURST_POLICY_VERSION = "HALF-HOLD-RECOVERY-NET-POSITIVE-V4";',
              '      // Spot: +5/-4 first 50%, then +10/-4 residual. Futures keeps its isolated ROE/recovery policy.\n      if ((lobMode || futuresLane) && !settings.emergency_liquidation) {\n        const activeSplitPolicyVersion = futuresLane\n          ? "FUTURES-SPLIT-ROE15-SL12-ROE30-RECOVERY-V1"\n          : "SPOT-SPLIT-TP5-SL4-TP10-SL4-V1";', 'policy header')
          text = replace_once(text, '        let recoveryMode = position.metadata?.recovery_exit?.enabled === true;', '        let recoveryMode = futuresLane && position.metadata?.recovery_exit?.enabled === true;', 'recovery latch')
          text = replace_once(text,
              '''        } else {\n          decision = halfHoldRecoveryExitDecision({\n            residualStage: !hasTradableHalf,\n            recoveryMode,\n            grossReturnPct,\n            residualNetReturnPct,\n            executableNetAllowed: executableQuote.allowed,\n            expectedNetProfitQuote: finite(executableQuote.expectedNetProfitQuote),\n            safetyRequested,\n          }) as any;\n        }''',
              '''        } else {\n          decision = spotSplitExitDecision({\n            residualStage: !hasTradableHalf,\n            grossReturnPct,\n            residualNetReturnPct,\n            safetyRequested,\n          }) as any;\n        }''', 'spot decision')
          text = replace_once(text, '              burst_policy_version: BURST_POLICY_VERSION,', '              burst_policy_version: activeSplitPolicyVersion,', 'audit version')
          text = replace_once(text, '              recovery_mode: recoveryMode,', '              ...(futuresLane ? { recovery_mode: recoveryMode } : {}),', 'spot audit recovery')
          text = replace_once(text, '          decision.reason === "RESIDUAL_STOP_LOSS_4" ||\n          decision.reason === "RECOVERY_NET_POSITIVE_EXIT" ||\n          decision.reason === "BB_UPPER_REENTRY_CONFIRMED" ||', '          decision.reason === "RESIDUAL_STOP_LOSS_4" ||\n          decision.reason === "BB_UPPER_REENTRY_CONFIRMED" ||', 'resting TP spot recovery')

          display = re.compile(r'function displayPosition\(row: any\): any \{.*?\n\}\n\nasync function status', re.S)
          dm = display.search(text)
          if not dm: raise SystemExit('displayPosition not found')
          replacement = '''function displayPosition(row: any): any {\n  const lob = isLobStrategy(row?.metadata?.lob_signal?.strategy);\n  if (!lob) return row;\n  const revision = String(row?.metadata?.active_exit_revision || row?.metadata?.exit_policy_revision || (row?.exchange === "binance_futures" ? "7.6.0-BINANCE-FUTURES" : "7.6.2-SPOT-SPLIT-SL4"));\n  const markedPnl = finite(row?.marked_pnl_quote, finite(row?.metadata?.live_mark?.fee_net_pnl_quote));\n  if (row?.exchange === "binance_futures") return { ...row, exit_policy: "FUTURES_SPLIT_EXIT", strategy_revision: revision, marked_pnl_quote: markedPnl, active_exit_policy: { revision, price_basis: "QUANTITY_AWARE_EXECUTABLE_BID", return_basis: "RETURN_ON_MARGIN", leverage: positionLeverage(row), first_take_profit_roe_pct: 15, first_stop_loss_roe_pct: -12, first_tranche_sell_fraction: 0.5, residual_take_profit_roe_pct: 30, residual_loss_mode: "RESIDUAL_NET_POSITIVE", stop_price: row?.stop_price, target_1: row?.target_1, target_2: row?.target_2, marked_pnl_quote: markedPnl, measured_at: row?.metadata?.live_mark?.measured_at || null }};\n  return { ...row, exit_policy: "SPOT_SPLIT_EXIT", strategy_revision: revision, stop_bps: 400, marked_pnl_quote: markedPnl, active_exit_policy: { revision, price_basis: "QUANTITY_AWARE_EXECUTABLE_BID", return_basis: "RETURN_ON_PRICE", first_take_profit_pct: 5, first_stop_loss_pct: -4, first_tranche_sell_fraction: 0.5, residual_take_profit_pct: 10, residual_stop_loss_pct: -4, residual_sell_fraction: 1, stop_price: row?.stop_price, target_1: row?.target_1, target_2: row?.target_2, marked_pnl_quote: markedPnl, measured_at: row?.metadata?.live_mark?.measured_at || null }, historical_entry_signal: { engine_version: row?.metadata?.engine_version || null, strategy_revision: row?.metadata?.lob_signal?.strategy_revision || null, stop_bps: row?.metadata?.lob_signal?.stop_bps ?? null }};\n}\n\nasync function status'''
          text = text[:dm.start()] + replacement + text[dm.end():]
          for forbidden in ['halfHoldRecoveryExitDecision', './recovery-exit-policy.ts', '"RECOVERY_NET_POSITIVE_EXIT"', 'hard_stop_return_pct: -2', 'hard_stop_after_seconds: 180', 'stop_bps: 300']:
              if forbidden in text: raise SystemExit(f'legacy runtime token remains: {forbidden}')
          index_path.write_text(text)
          PY

          deno fmt supabase/functions/market-autotrader/spot-exit-policy.ts supabase/functions/market-autotrader/spot-exit-policy.test.ts supabase/functions/market-autotrader/split-stop-policy.test.ts supabase/functions/market-autotrader/futures-lane.test.ts
          deno test supabase/functions/market-autotrader/spot-exit-policy.test.ts supabase/functions/market-autotrader/split-stop-policy.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts supabase/functions/market-autotrader/futures-lane.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          ! grep -R --line-number --fixed-strings 'halfHoldRecoveryExitDecision' supabase/functions/market-autotrader
          ! grep -R --line-number --fixed-strings './recovery-exit-policy.ts' supabase/functions/market-autotrader
          ! grep -R --line-number --fixed-strings '"RECOVERY_NET_POSITIVE_EXIT"' supabase/functions/market-autotrader/index.ts
          grep -q 'SPOT-SPLIT-TP5-SL4-TP10-SL4-V1' supabase/functions/market-autotrader/index.ts
          grep -q 'first_stop_loss_pct: -4' supabase/functions/market-autotrader/index.ts
          grep -q 'residual_stop_loss_pct: -4' supabase/functions/market-autotrader/index.ts
          ! grep -q 'hard_stop_return_pct: -2' supabase/functions/market-autotrader/index.ts
          ! grep -q 'stop_bps: 300' supabase/functions/market-autotrader/index.ts

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A supabase/functions/market-autotrader
          git status --short
          git commit -m "fix: canonicalize spot split exits"
          git push origin HEAD:main
