name: Read trading position constraint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-position-constraint.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - name: Read constraint
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
            select conname||'|'||pg_get_constraintdef(oid)
            from pg_constraint
            where conrelid='public.trading_positions'::regclass and contype='c'
            order by conname;" > .github/trading-position-constraints.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/trading-position-constraints.txt
          git commit -m "chore: record trading position constraints" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
