name: Leader20 multi-slot hotfix release

on:
  push:
    branches: [main]
    paths:
      - 'deployment-evidence/leader20-multislot-hotfix-release.json'

permissions:
  contents: read

concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Verify exact hotfix source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git diff --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('deployment-evidence/leader20-multislot-hotfix-release.json'));
          if(r.release_mode!=='HOTFIX_DEPLOY_AND_OBSERVE'||r.change_trading_settings||r.validation_orders||r.deploy_collector)
            throw Error('INVALID_RELEASE_SCOPE');
          if(!/^[a-f0-9]{40}$/.test(r.source_commit)) throw Error('SOURCE_COMMIT');
          NODE
          source_commit="$(node -p 'require("./deployment-evidence/leader20-multislot-hotfix-release.json").source_commit')"
          git merge-base --is-ancestor "$source_commit" HEAD
          git diff --quiet "$source_commit" HEAD --             supabase/functions/v10-lane-executor             supabase/functions/v10-lane-signal-generator             supabase/functions/_shared/leader20             supabase/migrations/20260929130830_leader20_late_wake_multislot_recovery.sql
          npm install --prefix "$RUNNER_TEMP/leader20-hotfix-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/leader20-hotfix-test/node_modules/@electric-sql/pglite/dist/index.js"
          node --test             tests/leader20-multislot-continuity-hotfix.test.mjs             tests/leader20-handoff.test.mjs             tests/leader20-multi-slot-entry.test.mjs
          deno check --no-config             supabase/functions/v10-lane-executor/index.ts             supabase/functions/v10-lane-signal-generator/index.ts

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Capture production baseline and wait for order quiescence
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const req=JSON.parse(fs.readFileSync('deployment-evidence/leader20-multislot-hotfix-release.json'));
          let f=JSON.parse(fs.readFileSync('release-evidence/functions-before.json'));f=f.functions??f;
          for(const [slug,version] of Object.entries(req.expected_versions)){
            const x=f.find(v=>v.slug===slug);
            if(x?.version!==version||x?.status!=='ACTIVE'||x?.verify_jwt!==false)
              throw Error('CONCURRENT_DEPLOY_OR_AUTH_CHANGE:'+slug+':'+JSON.stringify(x));
          }
          NODE

          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 <<'SQL' > release-evidence/settings-before.json
          select jsonb_build_object(
            'leader20',jsonb_build_object(
              'clock_capture_enabled',c.clock_capture_enabled,
              'watch_limit',c.watch_limit,
              'active_strategy',c.active_strategy,
              'observation_enabled',c.observation_enabled),
            'batch',jsonb_build_object(
              'enabled',b.enabled,
              'decision_reserve_ms',b.decision_reserve_ms),
            'trading',(
              select jsonb_build_object(
                'mode',s.mode,
                'pause_new_entries',s.pause_new_entries,
                'emergency_liquidation',s.emergency_liquidation,
                'binance_futures_enabled',s.binance_futures_enabled,
                'binance_futures_leverage',s.binance_futures_leverage,
                'binance_futures_allocation_mode',s.binance_futures_allocation_mode,
                'binance_futures_allocation_usdt',s.binance_futures_allocation_usdt,
                'binance_futures_reserve_usdt',s.binance_futures_reserve_usdt,
                'scalp_position_slots',s.scalp_position_slots,
                'scalp_min_position_slots',s.scalp_min_position_slots,
                'scalp_max_position_slots',s.scalp_max_position_slots)
              from public.trading_settings s where s.id=1),
            'ai',(
              select jsonb_build_object(
                'mode',g.mode,
                'daily_cap_usd',g.daily_cap_usd,
                'max_calls_per_day',g.max_calls_per_day,
                'monthly_cap_usd',g.monthly_cap_usd,
                'approval_ref',g.approval_ref,
                'enforce_approved',g.enforce_approved)
              from public.gpt_final_review_control g where g.singleton),
            'cron',(
              select jsonb_build_object('schedule',j.schedule,'active',j.active)
              from cron.job j where j.jobname='leader20-observer-tick')
          )
          from public.leader20_control c
          cross join public.leader20_batch_control b
          where c.singleton and b.singleton;
          SQL
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('release-evidence/settings-before.json','utf8').trim());
          if(s.leader20.clock_capture_enabled!==true||s.leader20.watch_limit!==20||
             s.leader20.active_strategy!=='LEADER20_DYNAMIC_1'||s.leader20.observation_enabled!==true||
             s.batch.enabled!==true||s.cron.schedule!=='10 seconds'||s.cron.active!==true)
            throw Error('PRODUCTION_BASELINE_CHANGED:'+JSON.stringify(s));
          NODE

          date -u +%FT%TZ > release-evidence/deploy-started-at.txt
          settled=false
          for _ in $(seq 1 18); do
            pending="$(psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c "select count(*) from public.v11_long_regime_orders where intent='OPEN_LONG' and state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED') and response_payload->>'v18ExposureFinal' is distinct from 'true'")"
            echo "$pending" > release-evidence/pending-entries-before.txt
            if [ "$pending" = "0" ]; then settled=true; break; fi
            sleep 5
          done
          test "$settled" = true

      - name: Apply exact late-wake migration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          version=20260929130830
          already="$(psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$version'")"
          if [ "$already" = "0" ]; then
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1               -f supabase/migrations/20260929130830_leader20_late_wake_multislot_recovery.sql
            supabase migration repair "$version" --status applied --db-url "$SUPABASE_DB_URL"
          elif [ "$already" != "1" ]; then
            echo "unexpected migration history count: $already" >&2
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1             -c "select pg_get_functiondef('public.leader20_batch_claim(jsonb,text,boolean)'::regprocedure)"             > release-evidence/leader20-batch-claim-after.sql
          grep -F "least(c.decision_reserve_ms,55000)" release-evidence/leader20-batch-claim-after.sql
          test "$(psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$version'")" = 1

      - name: Deploy exact Edge bundles
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy v10-lane-signal-generator             --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy v10-lane-executor             --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

          for slug in v10-lane-signal-generator v10-lane-executor; do
            mkdir -p "release-evidence/after-$slug"
            supabase functions download "$slug" --project-ref "$SUPABASE_PROJECT_REF" --use-api               --workdir "release-evidence/after-$slug"
            node ops/gpt-final-review/verify-bundle-parity.mjs               "release-evidence/after-$slug" . "$slug" --normalize-line-endings               > "release-evidence/parity-$slug.json"
          done
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const req=JSON.parse(fs.readFileSync('deployment-evidence/leader20-multislot-hotfix-release.json'));
          let f=JSON.parse(fs.readFileSync('release-evidence/functions-after.json'));f=f.functions??f;
          for(const [slug,before] of Object.entries(req.expected_versions)){
            const x=f.find(v=>v.slug===slug);
            if(x?.version!==before+1||x?.status!=='ACTIVE'||x?.verify_jwt!==false)
              throw Error('POST_DEPLOY_VERSION_OR_AUTH_MISMATCH:'+slug+':'+JSON.stringify(x));
          }
          NODE

      - name: Verify settings parity and natural clock runtime
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 <<'SQL' > release-evidence/settings-after.json
          select jsonb_build_object(
            'leader20',jsonb_build_object(
              'clock_capture_enabled',c.clock_capture_enabled,
              'watch_limit',c.watch_limit,
              'active_strategy',c.active_strategy,
              'observation_enabled',c.observation_enabled),
            'batch',jsonb_build_object(
              'enabled',b.enabled,
              'decision_reserve_ms',b.decision_reserve_ms),
            'trading',(
              select jsonb_build_object(
                'mode',s.mode,
                'pause_new_entries',s.pause_new_entries,
                'emergency_liquidation',s.emergency_liquidation,
                'binance_futures_enabled',s.binance_futures_enabled,
                'binance_futures_leverage',s.binance_futures_leverage,
                'binance_futures_allocation_mode',s.binance_futures_allocation_mode,
                'binance_futures_allocation_usdt',s.binance_futures_allocation_usdt,
                'binance_futures_reserve_usdt',s.binance_futures_reserve_usdt,
                'scalp_position_slots',s.scalp_position_slots,
                'scalp_min_position_slots',s.scalp_min_position_slots,
                'scalp_max_position_slots',s.scalp_max_position_slots)
              from public.trading_settings s where s.id=1),
            'ai',(
              select jsonb_build_object(
                'mode',g.mode,
                'daily_cap_usd',g.daily_cap_usd,
                'max_calls_per_day',g.max_calls_per_day,
                'monthly_cap_usd',g.monthly_cap_usd,
                'approval_ref',g.approval_ref,
                'enforce_approved',g.enforce_approved)
              from public.gpt_final_review_control g where g.singleton),
            'cron',(
              select jsonb_build_object('schedule',j.schedule,'active',j.active)
              from cron.job j where j.jobname='leader20-observer-tick')
          )
          from public.leader20_control c
          cross join public.leader20_batch_control b
          where c.singleton and b.singleton;
          SQL
          cmp release-evidence/settings-before.json release-evidence/settings-after.json

          start="$(cat release-evidence/deploy-started-at.txt)"
          observed=false
          for _ in $(seq 1 70); do
            psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c               "select coalesce(row_to_json(x)::text,'') from (
                 select slot_at,slot_status,batch_reason,batch_requested_at,capture_ready_at,
                        available_slots,open_position_count,orders_attempted,fills,updated_at
                 from public.leader20_clock_slot_report
                 where updated_at >= '$start'::timestamptz
                   and batch_requested_at is not null
                 order by slot_at desc limit 1
               ) x" > release-evidence/natural-slot.txt
            if test -s release-evidence/natural-slot.txt && test -n "$(tr -d '[:space:]' < release-evidence/natural-slot.txt)"; then
              observed=true
              break
            fi
            sleep 10
          done
          test "$observed" = true
          cat release-evidence/natural-slot.txt

          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c             "select jsonb_build_object(
               'open_positions',(select count(*) from public.v11_long_regime_positions where state='OPEN' or remaining_quantity>0.0000000001 or metadata->>'exitAccountingPending'='true'),
               'pending_entries',(select count(*) from public.v11_long_regime_orders where intent='OPEN_LONG' and state in ('PLANNED','DISPATCHED','RECONCILIATION_PENDING','RECONCILIATION_FAILED') and response_payload->>'v18ExposureFinal' is distinct from 'true'),
               'migration',(select count(*) from supabase_migrations.schema_migrations where version='20260929130830')
             )" > release-evidence/final-state.json
          echo "$GITHUB_SHA" > release-evidence/release-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leader20-multislot-hotfix-release
          path: release-evidence
          retention-days: 30
