name: Align LOB hotfix engine label

on:
  push:
    branches:
      - agent/fix-lob-execution-stop

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[version-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-lob-execution-stop
          fetch-depth: 0
      - name: Preserve immutable executable-net engine label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/market-autotrader/index.ts')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ('// Trading-booooo v7.2.4-LOB-PLANNED-STOP — autonomous spot orchestrator.', '// Trading-booooo v7.2.3-EXECUTABLE-NET-INTEGRITY — autonomous spot orchestrator.'),
              ('const VERSION = "7.2.4-LOB-PLANNED-STOP";', 'const VERSION = "7.2.3-EXECUTABLE-NET-INTEGRITY";'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected match count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit label alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix: preserve v7.2.3 engine integrity label [version-aligned]"
          git push origin HEAD:agent/fix-lob-execution-stop
