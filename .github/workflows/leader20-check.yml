name: Leader20 candidate verification
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/leader20/**'
      - 'supabase/functions/_shared/gpt-final-decision/**'
      - 'supabase/functions/v10-lane-executor/**'
      - 'supabase/functions/v10-lane-signal-generator/**'
      - 'supabase/migrations/20260927121708_leader20_campaigns.sql'
      - 'tests/leader20*'
      - 'ops/leader20/**'
      - '.github/workflows/leader20-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Verify without production credentials
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm install --prefix "$RUNNER_TEMP/leader20-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/leader20-test/node_modules/@electric-sql/pglite/dist/index.js"
          node ops/dynamic-flow/run-tests.mjs
          deno check --no-config supabase/functions/v10-lane-executor/index.ts supabase/functions/v10-lane-signal-generator/index.ts
          deno task test
