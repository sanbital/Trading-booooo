name: Hotfix Binance entry floor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-binance-entry-floor.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-binance-entry-floor
  cancel-in-progress: false

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Apply narrow floor correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('supabase/functions/market-autotrader/core.ts'): (
                  'export const BINANCE_MIN_ORDER_USDT = 90;',
                  'export const BINANCE_MIN_ORDER_USDT = 40;',
              ),
              Path('.github/workflows/main.deploy-supabase.yml'): (
                  '"BINANCE_MIN_ORDER_USDT=90"',
                  '"BINANCE_MIN_ORDER_USDT=40"',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1))
              print(f'patched {path}')

          legacy = Path('functions/market-autotrader/core.ts')
          if legacy.exists():
              text = legacy.read_text()
              old = 'export const BINANCE_MIN_ORDER_USDT = 90;'
              if text.count(old) == 1:
                  legacy.write_text(text.replace(old, 'export const BINANCE_MIN_ORDER_USDT = 40;', 1))
                  print(f'patched {legacy}')
              else:
                  print(f'skipped obsolete {legacy}: canonical declaration not present')
          PY
          grep -n 'BINANCE_MIN_ORDER_USDT = 40' supabase/functions/market-autotrader/core.ts
          grep -n 'BINANCE_MIN_ORDER_USDT=40' .github/workflows/main.deploy-supabase.yml

      - name: Validate autotrader typecheck
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/market-autotrader/index.ts

      - name: Commit corrected source to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-binance-entry-floor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/market-autotrader/core.ts .github/workflows/main.deploy-supabase.yml .github/workflows/hotfix-binance-entry-floor.yml
          if ! git diff --quiet -- functions/market-autotrader/core.ts; then git add functions/market-autotrader/core.ts; fi
          git diff --cached --check
          git commit -m 'fix: lower Binance admission floor to 40 USDT'
          git push origin HEAD:main

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy market-autotrader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy market-autotrader --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          supabase functions list --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Verify live admission state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c "select id, mode, pause_new_entries, binance_enabled, min_order_usdt, max_order_usdt, binance_allocation_mode, binance_allocation_usdt, binance_reserve_usdt, updated_at from public.trading_settings where id=1;"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c "select * from public.v_entry_admission_gap where exchange='binance';"
