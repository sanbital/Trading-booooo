name: Deploy entry-status scan-stage funnel

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/trading-entry-status/**"
      - ".github/workflows/deploy-entry-status-scan-stage-funnel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-entry-status-scan-stage-funnel
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verified main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify the scan-stage funnel is present and typechecks
        run: |
          set -euo pipefail
          grep -q 'scan_stage' supabase/functions/trading-entry-status/index.ts
          grep -q 'summarizeScanStage' supabase/functions/trading-entry-status/index.ts
          grep -q 'scanner_candidates' supabase/functions/trading-entry-status/index.ts
          deno check supabase/functions/trading-entry-status/index.ts \
            supabase/functions/trading-entry-status/scan-stage.ts
          deno test --allow-read supabase/functions/trading-entry-status/scan-stage.test.ts
          node --test docs/version-runtime.test.mjs

      # The status function is read-only: it takes no orders and writes no rows, so it
      # deploys without pausing entries the way an engine rollout has to.
      - name: Deploy trading-entry-status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          supabase functions deploy trading-entry-status \
            --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
