name: One-shot Supabase project restart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-db-session-recovery.yml"

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "20"
      PGSSLMODE: require
    steps:
      - name: Validate recovery credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_URL"

      - name: Restart Supabase project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restart"

      - name: Wait for project health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl --show-error --silent \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/health" || true)"
            if printf '%s' "$body" | grep -q '"status":"ACTIVE_HEALTHY"'; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Project health did not recover within 10 minutes."
          exit 1

      - name: Verify database connection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select now() as database_now, current_database() as database_name;"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
