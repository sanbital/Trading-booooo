name: Bootstrap pre-execution BUY validity production release
on:
  push:
    branches: [main]
    paths: [deployment-evidence/pre-execution-validity-bootstrap-20260930.patch]
permissions:
  contents: write
  actions: write
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply release patch
        shell: bash
        run: |
          set -euo pipefail
          patch=deployment-evidence/pre-execution-validity-bootstrap-20260930.patch
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = 74173b68a38e005943ebc2f6cf302ebf62df5b6d7e2398655f78a5558e36049f
          git merge-base --is-ancestor 63cc0c2a HEAD
          git apply --check --3way "$patch"
          git apply --3way "$patch"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pre-execution-validity-release-20260930.yml \
            deployment-evidence/pre-execution-validity-release-20260930.json \
            development/gpt-final-review/tests/reviewer.test.mjs \
            supabase/functions/v10-lane-executor/gpt-final-recheck-adapter.mjs \
            supabase/functions/v10-lane-executor/index.ts \
            tests/pre-execution-validity.test.mjs
          git diff --cached --quiet && { echo PATCH_EMPTY; exit 1; }
          git commit -m 'Complete and release pre-execution BUY validity'
          git push origin HEAD:main
      - name: Dispatch production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            gh workflow run pre-execution-validity-release-20260930.yml --ref main && exit 0
            test "$attempt" -lt 12 || exit 1
            sleep 5
          done
