name: V10 R5 Three-Period Tactical Validation

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/run_r5.py'
      - '.github/workflows/v10-r5-three-period.yml'

permissions:
  contents: read

jobs:
  r5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-r3
          key: v10-r3-binance-usdm-15m-2023-2025-v1
      - name: Validate tactical RANGE and BEAR_REBREAK across all three periods
        run: python research/v10_continuation/run_r5.py
      - name: Upload R5 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-r5-result
          path: research/v10_continuation/r5-result.json
          if-no-files-found: ignore
