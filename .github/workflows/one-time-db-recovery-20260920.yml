name: One-time Supabase DB recovery 2026-09-20

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-db-recovery-20260920.yml

permissions:
  contents: read

concurrency:
  group: one-time-db-recovery-20260920
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Restart Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p recovery-evidence
          code="$(curl --silent --show-error --max-time 30 -o recovery-evidence/restart-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw/restart")"
          echo "restart_http_status=$code" | tee recovery-evidence/restart-status.txt
          case "$code" in
            200|201|202|204) ;;
            *) cat recovery-evidence/restart-response.txt; exit 1 ;;
          esac

      - name: Verify project and database recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 60); do
            project="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw" || true)"
            printf '%s\n' "$project" > recovery-evidence/project-latest.json
            if printf '%s' "$project" | grep -q '"status":"ACTIVE_HEALTHY"'; then
              qcode="$(curl --silent --show-error --max-time 20 -o recovery-evidence/query-response.json -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/etaajwpernzrcdrifdnw/database/query" \
                --data '{"query":"select 1 as ok, now() as db_now;","read_only":true}' || true)"
              echo "$(date -u +%FT%TZ) query_http_status=$qcode" | tee -a recovery-evidence/query-poll.log
              if [ "$qcode" = "200" ] || [ "$qcode" = "201" ]; then
                healthy=1
                cat recovery-evidence/query-response.json
                break
              fi
            fi
            sleep 5
          done
          test "$healthy" = "1"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-recovery-20260920
          path: recovery-evidence/
          retention-days: 7
