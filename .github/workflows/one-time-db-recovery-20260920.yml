name: One-time Supabase DB recovery 2026-09-20

on:
  push:
    branches:
      - ops/db-recovery-20260920
    paths:
      - .github/workflows/one-time-db-recovery-20260920.yml

permissions:
  contents: read

concurrency:
  group: one-time-db-recovery-20260920
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate recovery inputs
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "etaajwpernzrcdrifdnw"

      - name: Capture pre-restart project status
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p recovery-evidence
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            > recovery-evidence/pre-project.json

      - name: Restart Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o recovery-evidence/restart-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restart")"
          echo "restart_http_status=$code" | tee recovery-evidence/restart-status.txt
          case "$code" in
            200|201|202|204) ;;
            *) cat recovery-evidence/restart-response.txt; exit 1 ;;
          esac

      - name: Wait for ACTIVE_HEALTHY
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          : > recovery-evidence/poll.log
          healthy=0
          for i in $(seq 1 48); do
            body="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" || true)"
            status="$(printf '%s' "$body" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$status" | tee -a recovery-evidence/poll.log
            if [ "$status" = "ACTIVE_HEALTHY" ]; then
              healthy=1
              printf '%s' "$body" > recovery-evidence/post-project.json
              break
            fi
            sleep 5
          done
          test "$healthy" = "1"

      - name: Verify database query path
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          : > recovery-evidence/query-poll.log
          for i in $(seq 1 18); do
            code="$(curl --silent --show-error --max-time 20 -o recovery-evidence/query-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              --data '{"query":"select 1 as ok, now() as db_now;","read_only":true}' || true)"
            echo "$(date -u +%FT%TZ) query_http_status=$code" | tee -a recovery-evidence/query-poll.log
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              cat recovery-evidence/query-response.json
              exit 0
            fi
            sleep 5
          done
          cat recovery-evidence/query-response.json || true
          exit 1

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-recovery-20260920
          path: recovery-evidence/
          retention-days: 7
