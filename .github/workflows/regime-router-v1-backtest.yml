name: Regime Router V1 full-market backtest

on:
  push:
    branches: [main]
    paths:
      - 'research/regime_router_v1/trigger.txt'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests

      - name: Assemble validated research script
        run: |
          cat research/regime_router_v1/part1.pyfrag \
              research/regime_router_v1/part2.pyfrag \
              research/regime_router_v1/part3.pyfrag \
              research/regime_router_v1/part4.pyfrag > /tmp/regime_router_backtest_v1.py
          python -m py_compile /tmp/regime_router_backtest_v1.py

      - name: Diagnose Binance public endpoints
        run: |
          mkdir -p research/results/regime-router-v1
          : > research/results/regime-router-v1/endpoint_diagnostics.txt
          for host in https://fapi.binance.com https://fapi1.binance.com https://fapi2.binance.com https://fapi3.binance.com https://fapi4.binance.com; do
            code=$(curl -L -sS --connect-timeout 8 --max-time 15 -o /tmp/binance-body -w '%{http_code}' "$host/fapi/v1/time" || true)
            body=$(head -c 300 /tmp/binance-body 2>/dev/null || true)
            printf '%s status=%s body=%s\n' "$host" "$code" "$body" >> research/results/regime-router-v1/endpoint_diagnostics.txt
          done
          cat research/results/regime-router-v1/endpoint_diagnostics.txt

      - name: Run Binance full-market backtest
        run: |
          mkdir -p research/results/regime-router-v1
          set +e
          python /tmp/regime_router_backtest_v1.py \
            --days 30 \
            --workers 8 \
            --out-dir research/results/regime-router-v1 \
            2>&1 | tee research/results/regime-router-v1/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > research/results/regime-router-v1/exit_status.txt
          echo "backtest_exit_status=$status"
          exit 0

      - name: Commit backtest results and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/regime-router-v1
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
            exit 0
          fi
          git commit -m 'research: record regime router v1 full-market backtest'
          git pull --rebase origin main
          git push origin HEAD:main
