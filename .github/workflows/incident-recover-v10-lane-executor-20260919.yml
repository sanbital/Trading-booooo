# INCIDENT RECOVERY. v10-lane-executor was overwritten with a placeholder file
# (version 54) by a manual MCP-based deploy attempt that hit an output-size limit
# while trying to upload the full ~470KB / 26-file bundle in one call. Every
# invocation of the function has been failing since. New entries were already
# paused (trading_settings.pause_new_entries=true) before this happened and there
# were 0 open positions / 0 pending orders at the time, so no live position was
# mismanaged -- but the function itself must be restored.
#
# This workflow deploys the exact production v53 file set with exactly ONE
# intentional change: _shared/leader-slot-sizing.mjs targetMarginUsdt 30 -> 200
# (operator instruction, 2026-09-19; MAX_SLOTS and leverage untouched). Every
# other file, including leader-momentum-v17.mjs, is byte-identical to what was
# running in production at v53 -- verified by diff before this branch was created.
# This branch deliberately excludes an unrelated, already-committed-elsewhere
# momentum-filter change (minVolumeRatio, maxDayReturn) per explicit operator
# instruction to keep this release scoped to the margin change alone.
name: Incident recovery -- restore v10-lane-executor (margin-only change)

on:
  workflow_dispatch:
    inputs:
      expected_version_before:
        description: >-
          The v10-lane-executor version this run expects to find in production
          right now (the broken placeholder version). Pinning it stops this from
          landing on top of a further unexpected change.
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove this checkout is what it claims to be
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          grep -Fq 'targetMarginUsdt: 200' supabase/functions/_shared/leader-slot-sizing.mjs
          grep -Fq 'leverage: 3' supabase/functions/_shared/leader-slot-sizing.mjs
          # The unrelated momentum-filter change must NOT be present on this branch.
          if grep -Fq 'maxDayReturn' supabase/functions/_shared/leader-momentum-v17.mjs; then
            echo "::error::this recovery branch must not carry the unrelated momentum-filter change"
            exit 1
          fi
          grep -Fq 'const MARGIN=SLOT_SIZING_CONTRACT.targetMarginUsdt,LEV=SLOT_SIZING_CONTRACT.leverage,NOTIONAL=MARGIN*LEV;' \
            supabase/functions/v10-lane-executor/index.ts
          grep -Fq 'const MAX_SLOTS=10,' supabase/functions/v10-lane-executor/index.ts

      - name: Type-check the exact Edge Function graph
        shell: bash
        run: npm exec --yes --package=deno@2.5.6 -- deno check supabase/functions/v10-lane-executor/index.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Confirm current (broken) production state before touching it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          mkdir -p release-evidence
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > release-evidence/functions-before.json
          python - <<'PY'
          import json
          rows=json.load(open('release-evidence/functions-before.json'))
          rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
          row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
          expected=int("${{ inputs.expected_version_before }}")
          assert int(row['version'])==expected, f"expected v{expected} in production, found {row['version']}"
          print("confirmed broken state at version", row['version'])
          PY

      - name: Deploy the restored bundle
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api

      - name: Verify the deployed version is healthy and correct
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          ref=os.environ['SUPABASE_PROJECT_REF']
          before=int("${{ inputs.expected_version_before }}")
          deadline=time.time()+120
          row=None
          while time.time()<deadline:
              out=subprocess.run(['supabase','functions','list','--project-ref',ref,'--output','json'],
                  capture_output=True, text=True, check=True).stdout
              rows=json.loads(out); rows=rows.get('functions',rows) if isinstance(rows,dict) else rows
              row=next(x for x in rows if x.get('slug')=='v10-lane-executor')
              if int(row['version'])>before:
                  break
              time.sleep(5)
          assert row is not None and int(row['version'])>before, f"version did not advance past {before}: {row}"
          assert row.get('status')=='ACTIVE', row
          assert row.get('verify_jwt') is False, row
          print("RECOVERED. new version:", row['version'], "sha256:", row.get('ezbr_sha256'))
          open('release-evidence/version-after.txt','w').write(str(row['version'])+'\n')
          PY
