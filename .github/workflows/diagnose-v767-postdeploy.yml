name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Momentum test 1 - continuation pulse
        id: pulse
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts --filter "Top-10 eligibility"
      - name: Momentum test 2 - informational geometry
        id: geometry
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts --filter "momentum pattern remains short-lived"
      - name: Momentum test 3 - default block override
        id: block
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts --filter "live-loss momentum block"
      - name: Momentum test 4 - historical context
        id: history
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts --filter "large historical gainer"

      - name: Report exact momentum failure
        if: always()
        env:
          PULSE: ${{ steps.pulse.outcome }}
          GEOMETRY: ${{ steps.geometry.outcome }}
          BLOCK: ${{ steps.block.outcome }}
          HISTORY: ${{ steps.history.outcome }}
        run: |
          echo "pulse=$PULSE geometry=$GEOMETRY block=$BLOCK history=$HISTORY"
          failed=0
          for pair in "pulse:$PULSE" "geometry:$GEOMETRY" "block:$BLOCK" "history:$HISTORY"; do
            name=${pair%%:*}; outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error file=supabase/functions/_shared/lob/momentum-continuation.test.ts,line=1::MOMENTUM_TEST_FAIL ${name}=${outcome}"
              failed=1
            fi
          done
          exit "$failed"
