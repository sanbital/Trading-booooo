name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Stress test groups three times
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            name="$1"; shift
            for attempt in 1 2 3; do
              echo "===== ${name} attempt ${attempt} ====="
              if ! "$@"; then
                echo "::error file=.github/workflows/diagnose-v767-postdeploy.yml,line=1::FLAKY_GROUP ${name} attempt=${attempt}"
                failed=1
              fi
            done
          }
          run_group scanner deno test --allow-read supabase/functions/market-scanner/*.test.ts
          run_group autotrader deno test --allow-read supabase/functions/market-autotrader/*.test.ts
          run_group performance deno test --allow-read supabase/functions/market-performance/*.test.ts
          run_group shared_root deno test --allow-read supabase/functions/_shared/*.test.ts
          run_group shared_scalp deno test --allow-read supabase/functions/_shared/scalp/*.test.ts
          run_group shared_lob deno test --allow-read supabase/functions/_shared/lob/*.test.ts
          run_group backtest deno test --allow-read backtest/*.test.ts
          exit "$failed"
      - name: If LOB is suspect run each file three times
        if: always()
        run: |
          set -uo pipefail
          failed=0
          for file in supabase/functions/_shared/lob/*.test.ts; do
            for attempt in 1 2 3; do
              if ! deno test --allow-read "$file"; then
                echo "::error file=$file,line=1::FLAKY_FILE $file attempt=$attempt"
                failed=1
              fi
            done
          done
          exit "$failed"
