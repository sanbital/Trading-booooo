name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run momentum test file and surface exact failure
        run: |
          set +e
          set -o pipefail
          deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts 2>&1 | tee /tmp/momentum-test.log
          status=${PIPESTATUS[0]}
          echo "momentum_status=$status"
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/momentum-test.log').read_text(errors='replace')
          tail = '\n'.join(text.splitlines()[-80:])
          tail = tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error file=supabase/functions/_shared/lob/momentum-continuation.test.ts,line=1::FULL_FILE_OUTPUT {tail[:6000]}')
          PY
          fi
          exit "$status"
