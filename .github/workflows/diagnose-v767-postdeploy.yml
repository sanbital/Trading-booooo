name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
      - "supabase/functions/_shared/lob/momentum-continuation.test.ts"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run momentum test file three times
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "momentum full-file attempt ${attempt}"
            deno test --allow-read supabase/functions/_shared/lob/momentum-continuation.test.ts
          done
