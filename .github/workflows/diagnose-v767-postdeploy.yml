name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Diff integrity
        id: diff
        continue-on-error: true
        run: git diff --check
      - name: Repository typecheck
        id: check
        continue-on-error: true
        run: deno task check
      - name: Repository tests
        id: tests
        continue-on-error: true
        run: deno task test
      - name: Gateway syntax
        id: gateway_syntax
        continue-on-error: true
        run: node --check gateway/server.mjs
      - name: Gateway tests
        id: gateway_tests
        continue-on-error: true
        run: node --test gateway/server.test.mjs
      - name: Report failed subcheck
        if: always()
        env:
          DIFF: ${{ steps.diff.outcome }}
          CHECK: ${{ steps.check.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GATEWAY_SYNTAX: ${{ steps.gateway_syntax.outcome }}
          GATEWAY_TESTS: ${{ steps.gateway_tests.outcome }}
        run: |
          echo "diff=$DIFF check=$CHECK tests=$TESTS gateway_syntax=$GATEWAY_SYNTAX gateway_tests=$GATEWAY_TESTS"
          for pair in "diff:$DIFF" "check:$CHECK" "tests:$TESTS" "gateway_syntax:$GATEWAY_SYNTAX" "gateway_tests:$GATEWAY_TESTS"; do
            name=${pair%%:*}; outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then echo "::error::postdeploy subcheck failed: $name=$outcome"; fi
          done
          test "$DIFF" = success
          test "$CHECK" = success
          test "$TESTS" = success
          test "$GATEWAY_SYNTAX" = success
          test "$GATEWAY_TESTS" = success
