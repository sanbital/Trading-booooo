name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Scanner tests
        id: scanner
        continue-on-error: true
        run: deno test --allow-read supabase/functions/market-scanner/*.test.ts
      - name: Autotrader tests
        id: autotrader
        continue-on-error: true
        run: deno test --allow-read supabase/functions/market-autotrader/*.test.ts
      - name: Performance tests
        id: performance
        continue-on-error: true
        run: deno test --allow-read supabase/functions/market-performance/*.test.ts
      - name: Shared root tests
        id: shared
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/*.test.ts
      - name: Shared scalp tests
        id: scalp
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/scalp/*.test.ts
      - name: Shared LOB tests
        id: lob
        continue-on-error: true
        run: deno test --allow-read supabase/functions/_shared/lob/*.test.ts
      - name: Backtest tests
        id: backtest
        continue-on-error: true
        run: deno test --allow-read backtest/*.test.ts
      - name: Report failing test group
        if: always()
        env:
          SCANNER: ${{ steps.scanner.outcome }}
          AUTOTRADER: ${{ steps.autotrader.outcome }}
          PERFORMANCE: ${{ steps.performance.outcome }}
          SHARED: ${{ steps.shared.outcome }}
          SCALP: ${{ steps.scalp.outcome }}
          LOB: ${{ steps.lob.outcome }}
          BACKTEST: ${{ steps.backtest.outcome }}
        run: |
          echo "scanner=$SCANNER autotrader=$AUTOTRADER performance=$PERFORMANCE shared=$SHARED scalp=$SCALP lob=$LOB backtest=$BACKTEST"
          failed=0
          for pair in "scanner:$SCANNER" "autotrader:$AUTOTRADER" "performance:$PERFORMANCE" "shared:$SHARED" "scalp:$SCALP" "lob:$LOB" "backtest:$BACKTEST"; do
            name=${pair%%:*}; outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error::failing test group: $name=$outcome"
              failed=1
            fi
          done
          exit "$failed"
