name: Diagnose v7.6.7 postdeploy consistency

on:
  push:
    branches: [agent/spot-ofi-pre-t1-protection-v767]
    paths:
      - ".github/workflows/diagnose-v767-postdeploy.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/spot-ofi-pre-t1-protection-v767
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Full test task once
        id: full
        continue-on-error: true
        run: deno task test
      - name: Run every LOB test file separately
        id: files
        if: always()
        run: |
          set -uo pipefail
          failed=0
          for file in supabase/functions/_shared/lob/*.test.ts; do
            echo "===== $file ====="
            if ! deno test --allow-read "$file"; then
              echo "::error file=$file,line=1::individual LOB test failed: $file"
              failed=1
            fi
          done
          exit "$failed"
      - name: Report full task
        if: always()
        env:
          FULL: ${{ steps.full.outcome }}
          FILES: ${{ steps.files.outcome }}
        run: |
          echo "full=$FULL individual_lob_files=$FILES"
          test "$FULL" = success
          test "$FILES" = success
