name: Analyze profit floor temp

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[ANALYZE-PROFIT-FLOOR]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Inspect DB guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          \set VERBOSITY terse

          select n.nspname as schema_name, p.proname as function_name,
                 pg_get_function_identity_arguments(p.oid) as args,
                 left(pg_get_functiondef(p.oid),12000) as function_def
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.prokind in ('f','p')
            and pg_get_functiondef(p.oid) ilike '%FIRST_TRANCHE_THRESHOLD_NOT_REACHED%';

          select conname, conrelid::regclass as table_name, pg_get_constraintdef(oid) as definition
          from pg_constraint
          where pg_get_constraintdef(oid) ilike '%tranche%'
             or pg_get_constraintdef(oid) ilike '%threshold%';

          select p.id,p.market,p.state,p.exchange,
                 to_jsonb(p)->>'average_entry_price' as average_entry_price,
                 to_jsonb(p)->>'remaining_quantity' as remaining_quantity,
                 to_jsonb(p)->>'first_tranche_exited' as first_tranche_exited,
                 to_jsonb(p)#>'{metadata,profit_protection}' as profit_protection,
                 to_jsonb(p)#>'{metadata,execution_plan}' as execution_plan,
                 to_jsonb(p)#>'{metadata,half_hold}' as half_hold
          from public.trading_positions p
          where p.id in ('45742434-bee8-47c9-8005-d68812dc9964','fd624735-e95d-423c-b831-0b4439abfdfc');
          SQL
