name: Run isolated Regime Router V3 job

on:
  push:
    branches: [main]
    paths:
      - 'research/regime_router_v1/job-trigger.txt'

permissions:
  contents: write

concurrency:
  group: regime-router-v3-job
  cancel-in-progress: false

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_ID: a3c860b8-4aef-45ca-aaaa-66c4b0f8241d
      EDGE_URL: https://etaajwpernzrcdrifdnw.supabase.co/functions/v1/regime-router-v1-research
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify database connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          psql "$SUPABASE_DB_URL" -XAt -v ON_ERROR_STOP=1 -c 'select 1' | grep -qx '1'

      - name: Complete breadth, finalize, and backtest V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/results/regime-router-v1
          TRACE="research/results/regime-router-v1/job-${JOB_ID}.log"
          : > "$TRACE"

          call_action() {
            local payload="$1"
            local out status content
            out=$(psql "$SUPABASE_DB_URL" -XAt -F $'\t' -v ON_ERROR_STOP=1 -v payload="$payload" -v edge_url="$EDGE_URL" <<'SQL'
          with tok as (
            select token from edge_internal_tokens where name='market-v2-research' limit 1
          ), call as (
            select extensions.http((
              'POST'::extensions.http_method,
              :'edge_url'::varchar,
              array[extensions.http_header('x-v2-research-token'::varchar,tok.token::varchar)]::extensions.http_header[],
              'application/json'::varchar,
              :'payload'::varchar
            )::extensions.http_request) as resp
            from tok
          )
          select (resp).status, (resp).content from call;
          SQL
          )
            status=$(printf '%s' "$out" | head -n1 | cut -f1)
            content=$(printf '%s' "$out" | head -n1 | cut -f2-)
            printf '%s\t%s\n' "$status" "$content" | tee -a "$TRACE"
            test "$status" = "200"
            CONTENT="$content" python - <<'PY'
          import json, os, sys
          x=json.loads(os.environ['CONTENT'])
          if not x.get('ok'):
              print(x, file=sys.stderr)
              raise SystemExit(1)
          PY
          }

          for shard in $(seq 0 24); do
            done=$(psql "$SUPABASE_DB_URL" -XAt -v ON_ERROR_STOP=1 -v shard="$shard" -v job="$JOB_ID" <<'SQL'
          select count(*) from v2_research_market_results
          where job_id=:'job'::uuid
            and config_key='BREADTH_SHARD_V3'
            and (parameters->>'shard')::int=:'shard'::int;
          SQL
          )
            if [ "$done" = "0" ]; then
              echo "=== breadth shard ${shard}/24 ===" | tee -a "$TRACE"
              call_action "{\"action\":\"breadth_shard_v3\",\"job_id\":\"${JOB_ID}\",\"shard_index\":${shard},\"shard_count\":25}"
            fi
          done

          call_action "{\"action\":\"finalize_v3\",\"job_id\":\"${JOB_ID}\"}"
          for shard in $(seq 0 24); do
            echo "=== V3 backtest shard ${shard}/24 ===" | tee -a "$TRACE"
            call_action "{\"action\":\"backtest_shard_v3\",\"job_id\":\"${JOB_ID}\",\"shard_index\":${shard},\"shard_count\":25}"
          done
          call_action "{\"action\":\"complete_v3\",\"job_id\":\"${JOB_ID}\"}"

      - name: Write V3 aggregate and walk-forward selection
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/results/regime-router-v1/job-${JOB_ID}-aggregate.tsv"
          psql "$SUPABASE_DB_URL" -XAt -F $'\t' -v ON_ERROR_STOP=1 > "$OUT" <<SQL
          select regime, config_key, split,
            sum(trades)::bigint,
            sum(wins)::bigint,
            round(sum(wins)::numeric/nullif(sum(trades)::numeric,0)*100,2),
            round(sum(net_bps)::numeric,2),
            round(sum(stress_net_bps)::numeric,2),
            round(sum(gross_profit_bps)::numeric/nullif(sum(gross_loss_bps)::numeric,0),4),
            round(sum(mean_net_bps*trades)::numeric/nullif(sum(trades)::numeric,0),3),
            round(sum(average_mfe_bps*trades)::numeric/nullif(sum(trades)::numeric,0),3),
            round(sum(average_mae_bps*trades)::numeric/nullif(sum(trades)::numeric,0),3),
            round(sum(average_hold_bars*trades)::numeric/nullif(sum(trades)::numeric,0),3),
            round(sum(stop_hits)::numeric/nullif(sum(trades)::numeric,0)*100,2),
            round(sum(coalesce((parameters->>'capture_sum')::double precision,0))::numeric/nullif(sum(coalesce((parameters->>'capture_count')::int,0))::numeric,0),4),
            round(sum(coalesce((parameters->>'giveback_sum_bps')::double precision,0))::numeric/nullif(sum(trades)::numeric,0),3),
            round(avg(max_drawdown_bps)::numeric,2),
            round(max(max_drawdown_bps)::numeric,2)
          from v2_research_market_results
          where job_id='${JOB_ID}' and config_key<>'BREADTH_SHARD_V3'
          group by regime,config_key,split
          order by regime,split,config_key;
          SQL
          cat "$OUT"

          SEL="research/results/regime-router-v1/job-${JOB_ID}-selection.tsv"
          psql "$SUPABASE_DB_URL" -XAt -F $'\t' -v ON_ERROR_STOP=1 > "$SEL" <<SQL
          with a as (
            select regime,config_key,split,
              sum(trades)::bigint trades,
              sum(stress_net_bps)::double precision stress,
              sum(gross_profit_bps)::double precision gp,
              sum(gross_loss_bps)::double precision gl
            from v2_research_market_results
            where job_id='${JOB_ID}' and config_key<>'BREADTH_SHARD_V3'
            group by regime,config_key,split
          ), p as (
            select regime,config_key,
              max(trades) filter(where split='TRAIN') train_trades,
              max(stress) filter(where split='TRAIN') train_stress,
              max(case when gl>0 then gp/gl end) filter(where split='TRAIN') train_pf,
              max(trades) filter(where split='VALIDATION') val_trades,
              max(stress) filter(where split='VALIDATION') val_stress,
              max(case when gl>0 then gp/gl end) filter(where split='VALIDATION') val_pf,
              max(trades) filter(where split='TEST') test_trades,
              max(stress) filter(where split='TEST') test_stress,
              max(case when gl>0 then gp/gl end) filter(where split='TEST') test_pf
            from a group by regime,config_key
          )
          select regime,config_key,train_trades,round(train_stress::numeric,2),round(train_pf::numeric,4),
            val_trades,round(val_stress::numeric,2),round(val_pf::numeric,4),
            test_trades,round(test_stress::numeric,2),round(test_pf::numeric,4)
          from p
          where train_trades>=40 and val_trades>=15 and train_stress>0 and train_pf>1 and val_stress>0 and val_pf>1
          order by regime, least(train_stress/nullif(train_trades,0),val_stress/nullif(val_trades,0)) desc;
          SQL
          echo '=== WALK-FORWARD ELIGIBLE ==='
          cat "$SEL"

      - name: Commit immutable V3 research trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/regime-router-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record regime router v3 walk-forward job ${JOB_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
