name: Deploy isolated Regime Router research

on:
  push:
    branches: [main]
    paths:
      - 'research/regime_router_v1/deploy-trigger.txt'

permissions:
  contents: read

concurrency:
  group: regime-router-v1-research-deploy
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Assemble and validate isolated research function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/regime-router-v1-research
          cat supabase/functions/regime-router-v1-research/chunks/*.tsfrag > supabase/functions/regime-router-v1-research/index.ts
          # Persist only schema-approved split labels and route the research backtester to V2 candidates.
          sed -i \
            -e 's/REGIME_ROUTER_V1_15M_30D_OOS/REGIME_ROUTER_V2_15M_30D_OOS/g' \
            -e 's/split:"SHARD"/split:"TRAIN"/g' \
            -e 's/metricRow(job,f.market,c,"IS"/metricRow(job,f.market,c,"TRAIN"/g' \
            -e 's/metricRow(job,f.market,c,"OOS"/metricRow(job,f.market,c,"TEST"/g' \
            -e 's/split=eq.OOS/split=eq.TEST/g' \
            -e 's/for(const c of candidates()){const sim=simulateMarket(p,job.metrics,c,splitTime);/for(const c of candidatesV2()){const sim=simulateMarketV2(p,job.metrics,c,splitTime);/g' \
            supabase/functions/regime-router-v1-research/index.ts
          deno check supabase/functions/regime-router-v1-research/index.ts
          grep -q 'REGIME_ROUTER_V2_15M_30D_OOS' supabase/functions/regime-router-v1-research/index.ts
          grep -q 'function candidatesV2' supabase/functions/regime-router-v1-research/index.ts
          grep -q 'function simulateMarketV2' supabase/functions/regime-router-v1-research/index.ts
          grep -q 'candidatesV2()){const sim=simulateMarketV2' supabase/functions/regime-router-v1-research/index.ts
          grep -q 'split:"TRAIN"' supabase/functions/regime-router-v1-research/index.ts
          grep -q '"TEST",summarize(sim.OOS)' supabase/functions/regime-router-v1-research/index.ts
          test "$(wc -c < supabase/functions/regime-router-v1-research/index.ts)" -gt 30000

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy research-only Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          supabase functions deploy regime-router-v1-research \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api
