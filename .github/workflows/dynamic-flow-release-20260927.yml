name: Dynamic flow lifecycle production release
on:
  push:
    branches: [main]
    paths: [deployment-evidence/dynamic-flow-release-request.json]
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Verify regression suite and protected sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence /tmp/dynamic-pglite
          git diff --check
          baseline=$(node -p 'JSON.parse(require("fs").readFileSync("deployment-evidence/dynamic-flow-release-request.json")).baseline_main')
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --quiet "$baseline" HEAD -- supabase/functions/_shared/leader-slot-sizing.mjs supabase/functions/_shared/leader-native-protection.mjs supabase/functions/_shared/leader-entry-settlement.mjs supabase/functions/_shared/leader-exit-settlement.mjs supabase/functions/_shared/leader-fill-evidence.mjs supabase/functions/_shared/leader-db-only-reconciliation.mjs supabase/functions/_shared/exit-authority.mjs
          (cd /tmp/dynamic-pglite && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 >/dev/null)
          export PGLITE_MODULE=/tmp/dynamic-pglite/node_modules/@electric-sql/pglite/dist/index.js
          node ops/dynamic-flow/run-tests.mjs | tee release-evidence/tests.tap
          deno check supabase/functions/v10-lane-executor/index.ts
          deno task test | tee release-evidence/deno-tests.txt
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - name: Verify production version and read settings
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions deploy --help > release-evidence/deploy-help.txt
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-before.json
          node --input-type=module -e 'import fs from "node:fs";let x=JSON.parse(fs.readFileSync("release-evidence/functions-before.json"));x=x.functions??x;const f=x.find(x=>x.slug==="v10-lane-executor"),r=JSON.parse(fs.readFileSync("deployment-evidence/dynamic-flow-release-request.json"));if(f.version!==r.expected_executor_version_before||f.verify_jwt!==false||f.status!=="ACTIVE")throw Error("CONCURRENT_DEPLOY_OR_AUTH_CHANGE");'
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c 'select binance_futures_allocation_usdt,binance_futures_leverage,max_open_positions_per_exchange from public.trading_settings where id=1' > release-evidence/settings-before.txt
      - name: Deploy executor with existing internal token authentication
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-after.json
          mkdir -p release-evidence/download-executor
          supabase functions download v10-lane-executor --project-ref "$SUPABASE_PROJECT_REF" --use-api --workdir "$PWD/release-evidence/download-executor"
          node ops/gpt-final-review/verify-bundle-parity.mjs release-evidence/download-executor . v10-lane-executor > release-evidence/bundle-parity.json
          echo "$GITHUB_SHA" > release-evidence/source-sha.txt
      - name: Read-only runtime and account protection verification
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          token="$(psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c "select token from public.edge_internal_tokens where name='v10-lane-executor'")"
          test -n "$token"
          curl -fsS --retry 2 -H 'content-type: application/json' -H "x-v10-executor-token: $token" -d '{"mode":"ops-readiness"}' "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/v10-lane-executor" > release-evidence/ops-readiness.json
          node -e 'const r=require("./release-evidence/ops-readiness.json");if(!r.ok||!r.binance.positionsComplete||!r.binance.openOrdersComplete||r.dynamicLifecycle?.version!=="DYNAMIC_FLOW_LIFECYCLE_1")throw Error("READINESS_FAILED");'
          curl -fsS -H 'content-type: application/json' -H "x-v10-executor-token: $token" -d "{\"mode\":\"fd1-exit-probe\",\"symbol\":\"SOONUSDT\",\"runId\":\"dynamic-$GITHUB_SHA\"}" "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/v10-lane-executor" > release-evidence/ai-probe.json
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c 'select binance_futures_allocation_usdt,binance_futures_leverage,max_open_positions_per_exchange from public.trading_settings where id=1' > release-evidence/settings-after.txt
          cmp release-evidence/settings-before.txt release-evidence/settings-after.txt
          psql "$SUPABASE_DB_URL" -At --set=ON_ERROR_STOP=1 -c "select jsonb_build_object('id',id,'symbol',symbol,'hard_stop',hard_stop_price,'protection',metadata->'exitProtection','dynamic',metadata->'fd1Hold'->'dynamicTracker') from public.v11_long_regime_positions where state='OPEN'" > release-evidence/open-positions.jsonl
      - name: Build public collector image from the same commit
        run: docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -t "registry.fly.io/sanbital-doa-capture-20260925:$GITHUB_SHA" collectors/doa-capture
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      - name: Update collector image and verify continuous capture
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node collectors/doa-capture/release-market-sensor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-flow-production-release
          path: |
            release-evidence
            market-sensor-release.json
          retention-days: 30
