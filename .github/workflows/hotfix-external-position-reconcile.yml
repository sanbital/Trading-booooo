name: Hotfix external spot position reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-external-position-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-external-position-reconcile
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Patch zero-balance reconciliation and dashboard backing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("supabase/functions/market-autotrader/index.ts")
          engine = engine_path.read_text(encoding="utf-8")

          old_meta = '''  const metadata = {
            ...(position.metadata || {}),
            exclude_from_learning: true,
            manual_reconcile: {
          '''
          new_meta = '''  const metadata = {
            ...(position.metadata || {}),
            exclude_from_learning: true,
            exclude_from_performance: true,
            manual_reconcile: {
          '''
          if old_meta not in engine:
              raise SystemExit("manual reconciliation metadata anchor not found")
          engine = engine.replace(old_meta, new_meta, 1)

          old_handler = '''        if (/no available .* balance for exit/i.test(message)) {
            const settled = await reconcileExhaustedPosition(position, cycleId, message);
            actions.push({
              exchange,
              market: position.market,
              action: decision.action,
              reconciled: settled,
              error: settled ? undefined : message,
            });
            continue;
          }
          '''
          new_handler = '''        if (/no available .* balance for exit/i.test(message)) {
            let settled = await reconcileExhaustedPosition(position, cycleId, message);
            let reconciliation = settled ? "EXCHANGE_FILLS" : "UNRESOLVED";

            // A withdrawal or other external spot balance reduction has no SELL fill to
            // attribute. If the authenticated account confirms ZERO total balance and the
            // exchange has no open order locking the asset, the ledger is stale and must be
            // terminalized as an external/manual reduction. Futures is intentionally excluded:
            // a derivatives position is not represented by spot base-asset inventory.
            if (!settled && position.exchange !== "binance_futures") {
              try {
                const portfolio = await gateway(position.exchange, { action: "portfolio" });
                const actualTotal = accountQuantity(portfolio, position.base_asset, false);
                const openAssets = await openOrderAssets(position.exchange);
                if (
                  actualTotal <= 1e-12 && openAssets !== null &&
                  !openAssets.has(position.base_asset)
                ) {
                  const reconciled = await reconcileManualReduction(
                    position,
                    actualTotal,
                    current,
                    cycleId,
                  );
                  settled = String(reconciled?.state || "") === "CLOSED" ||
                    finite(reconciled?.remaining_quantity) <= 1e-12;
                  if (settled) {
                    reconciliation = "AUTHENTICATED_ZERO_BALANCE";
                    await event(
                      "EXIT_RECONCILED_EXTERNAL_REDUCTION",
                      `${position.exchange}:${position.market} closed after authenticated zero-balance confirmation`,
                      {
                        reason: message,
                        expected_quantity: finite(position.remaining_quantity),
                        actual_total_quantity: actualTotal,
                        open_order_asset_present: false,
                        excluded_from_performance: true,
                      },
                      { cycleId, positionId: position.id, level: "WARNING" },
                    );
                  }
                }
              } catch (reconcileError) {
                await event(
                  "EXIT_EXTERNAL_REDUCTION_CHECK_FAILED",
                  reconcileError instanceof Error ? reconcileError.message : String(reconcileError),
                  { reason: message },
                  { cycleId, positionId: position.id, level: "WARNING" },
                );
              }
            }

            actions.push({
              exchange,
              market: position.market,
              action: decision.action,
              reconciled: settled,
              reconciliation,
              error: settled ? undefined : message,
            });
            continue;
          }
          '''
          if old_handler not in engine:
              raise SystemExit("zero-balance exit handler anchor not found")
          engine = engine.replace(old_handler, new_handler, 1)
          engine_path.write_text(engine, encoding="utf-8")

          status_path = Path("supabase/functions/trading-entry-status/index.ts")
          status = status_path.read_text(encoding="utf-8")
          status = status.replace(
              'const REVISION = "5-VENUE-NATIVE-OPEN-POSITION-METRICS";',
              'const REVISION = "6-BALANCE-BACKED-OPEN-POSITIONS";',
              1,
          )

          build_anchor = '''function buildOpenPositions(
            positionRows: JsonRecord[],
            snapshotRows: JsonRecord[],
            venuePrices: Map<string, VenuePrice>,
          ): JsonRecord[] {
            const snapshots = new Map<string, JsonRecord>();
            for (const snapshot of snapshotRows) {
              const exchange = String(snapshot?.exchange || "").toLowerCase();
              if (exchange && !snapshots.has(exchange)) snapshots.set(exchange, snapshot);
            }

            return positionRows
              .map((row) => {
          '''
          build_replacement = '''function spotBaseAsset(exchange: string, market: string, quoteCurrency: string): string {
            const normalizedMarket = String(market || "").toUpperCase();
            if (exchange === "upbit") return normalizedMarket.split("-")[1] || "";
            const quote = String(quoteCurrency || "USDT").toUpperCase();
            return normalizedMarket.endsWith(quote)
              ? normalizedMarket.slice(0, -quote.length)
              : normalizedMarket;
          }

          function usableSpotBalances(snapshot: JsonRecord): Map<string, number> | null {
            const capturedAt = Date.parse(String(snapshot?.captured_at || ""));
            if (!Number.isFinite(capturedAt) || Date.now() - capturedAt > 120_000) return null;
            const rows = snapshot?.balances;
            if (!Array.isArray(rows)) return null;
            const balances = new Map<string, number>();
            for (const row of rows) {
              const asset = String(row?.currency || row?.asset || "").toUpperCase();
              if (!asset) continue;
              const free = Math.max(0, finite(row?.free, finite(row?.balance)));
              const locked = Math.max(0, finite(row?.locked));
              balances.set(asset, (balances.get(asset) || 0) + free + locked);
            }
            return balances;
          }

          function buildOpenPositions(
            positionRows: JsonRecord[],
            snapshotRows: JsonRecord[],
            venuePrices: Map<string, VenuePrice>,
          ): JsonRecord[] {
            const snapshots = new Map<string, JsonRecord>();
            for (const snapshot of snapshotRows) {
              const exchange = String(snapshot?.exchange || "").toLowerCase();
              if (exchange && !snapshots.has(exchange)) snapshots.set(exchange, snapshot);
            }

            // Spot holdings are displayable only to the extent that a fresh authenticated
            // account snapshot still backs their ledger quantity. Allocate the shared base
            // balance oldest-first so multiple rows for one asset cannot each claim the same
            // coins. A stale/unreadable snapshot fails soft to the ledger; it never blanks UI.
            const remainingBalances = new Map<string, Map<string, number> | null>();
            for (const [exchange, snapshot] of snapshots) {
              if (exchange === "upbit" || exchange === "binance") {
                remainingBalances.set(exchange, usableSpotBalances(snapshot));
              }
            }
            const effectiveQuantity = new Map<string, number>();
            const oldestFirst = [...positionRows].sort((left, right) =>
              (Date.parse(String(left?.opened_at || left?.created_at || "")) || 0) -
              (Date.parse(String(right?.opened_at || right?.created_at || "")) || 0)
            );
            for (const row of oldestFirst) {
              const exchange = String(row?.exchange || "").toLowerCase();
              const state = String(row?.state || "").toUpperCase();
              const ledgerQuantity = Math.max(
                0,
                finite(row?.remaining_quantity),
                finite(row?.reserved_quantity),
              );
              if ((exchange !== "upbit" && exchange !== "binance") || state === "ENTRY_PENDING") {
                effectiveQuantity.set(String(row?.id || ""), ledgerQuantity);
                continue;
              }
              const balances = remainingBalances.get(exchange);
              if (!balances) {
                effectiveQuantity.set(String(row?.id || ""), ledgerQuantity);
                continue;
              }
              const base = spotBaseAsset(
                exchange,
                String(row?.market || ""),
                String(row?.quote_currency || (exchange === "upbit" ? "KRW" : "USDT")),
              );
              const available = Math.max(0, balances.get(base) || 0);
              const backed = Math.min(ledgerQuantity, available);
              balances.set(base, Math.max(0, available - backed));
              effectiveQuantity.set(String(row?.id || ""), backed);
            }

            return positionRows
              .map((row) => {
          '''
          if build_anchor not in status:
              raise SystemExit("open-position build anchor not found")
          status = status.replace(build_anchor, build_replacement, 1)

          old_quantity = '''      const quantity = Math.max(0, finite(row.remaining_quantity), finite(row.reserved_quantity));'''
          new_quantity = '''      const quantity = effectiveQuantity.get(String(row.id || "")) ??
                Math.max(0, finite(row.remaining_quantity), finite(row.reserved_quantity));'''
          if old_quantity not in status:
              raise SystemExit("open-position quantity anchor not found")
          status = status.replace(old_quantity, new_quantity, 1)

          old_snapshot_query = 'db("trading_account_snapshots?select=exchange,captured_at,prices,bot_unrealized_pnl_quote&order=captured_at.desc&limit=12"),'
          new_snapshot_query = 'db("trading_account_snapshots?select=exchange,captured_at,balances,prices,bot_unrealized_pnl_quote&order=captured_at.desc&limit=12"),'
          if old_snapshot_query not in status:
              raise SystemExit("snapshot query anchor not found")
          status = status.replace(old_snapshot_query, new_snapshot_query, 1)
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Validate patch
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check changed functions
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/market-autotrader/index.ts supabase/functions/trading-entry-status/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/trading-entry-status/index.ts
          git diff --check
          grep -q 'AUTHENTICATED_ZERO_BALANCE' supabase/functions/market-autotrader/index.ts
          grep -q 'exclude_from_performance: true' supabase/functions/market-autotrader/index.ts
          grep -q '6-BALANCE-BACKED-OPEN-POSITIONS' supabase/functions/trading-entry-status/index.ts
          grep -q 'balances,prices' supabase/functions/trading-entry-status/index.ts

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts supabase/functions/trading-entry-status/index.ts
          if git diff --cached --quiet; then
            echo "Source already patched"
          else
            git commit -m "fix: reconcile externally removed spot positions"
            git push origin HEAD:main
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy patched functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          supabase functions deploy market-autotrader --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          supabase functions deploy trading-entry-status --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
