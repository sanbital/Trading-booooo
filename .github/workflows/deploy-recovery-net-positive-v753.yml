name: Deploy recovery net-positive exit v7.5.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-recovery-net-positive-v753.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-recovery-net-positive-v753
  cancel-in-progress: false

jobs:
  patch-test-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture state and pause new entries
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          original_pause="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "select coalesce(pause_new_entries,false)::text from public.trading_settings where id=1")"
          original_version="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "select coalesce(version,0)::text from public.trading_settings where id=1")"
          echo "ORIGINAL_PAUSE=${original_pause}" >> "$GITHUB_ENV"
          echo "ORIGINAL_SETTINGS_VERSION=${original_version}" >> "$GITHUB_ENV"
          echo "DEPLOY_ATTEMPTED=false" >> "$GITHUB_ENV"
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries=true, updated_at=now() where id=1 and emergency_liquidation is not true"

      - name: Apply canonical v7.5.3 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_recovery_exit_v753.py

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format, typecheck and test recovery policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_recovery_exit_v753.py
          deno fmt \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/recovery-exit-policy.ts \
            supabase/functions/market-autotrader/recovery-exit-policy.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          deno test \
            supabase/functions/market-autotrader/recovery-exit-policy.test.ts \
            supabase/functions/market-autotrader/executable-exit.test.ts
          grep -q '7.5.3-RECOVERY-NET-POSITIVE' supabase/functions/market-autotrader/index.ts
          grep -q 'RECOVERY_MODE_ENTERED' supabase/functions/market-autotrader/index.ts
          grep -q 'RECOVERY_NET_POSITIVE_EXIT' supabase/functions/market-autotrader/index.ts
          grep -q 'halfHoldRecoveryExitDecision' supabase/functions/market-autotrader/index.ts
          grep -q 'RECOVERY_TOTAL_NET_NOT_POSITIVE' supabase/migrations/20260809120000_recovery_net_positive_exit_v753.sql

      - name: Commit canonical production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/recovery-exit-policy.ts \
            supabase/functions/market-autotrader/recovery-exit-policy.test.ts \
            scripts/apply_recovery_exit_v753.py \
            supabase/migrations/20260809120000_recovery_net_positive_exit_v753.sql
          if git diff --cached --quiet; then
            echo "Canonical v7.5.3 source already committed"
          else
            git commit -m "fix: exit recovered loss positions at positive total net"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Apply v7.5.3 database authority
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260809120000_recovery_net_positive_exit_v753.sql

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy market-autotrader v7.5.3
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_ATTEMPTED=true" >> "$GITHUB_ENV"
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

      - name: Verify live runtime and database guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          autotrade_token="$(printf 'autotrade:%s' "$LEARNING_ACCESS_TOKEN" | sha256sum | awk '{print $1}')"
          curl --fail-with-body --retry 2 --retry-delay 3 --max-time 60 -X POST \
            -H 'content-type: application/json' \
            -H "x-autotrade-token: ${autotrade_token}" \
            -d '{"action":"status"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-autotrader" \
            > /tmp/autotrader-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/autotrader-status.json') as fh:
              payload = json.load(fh)
          assert payload.get('ok') is True, payload
          assert payload.get('version') == '7.5.3-RECOVERY-NET-POSITIVE', payload.get('version')
          print('LIVE_RUNTIME_OK', payload.get('version'))
          PY
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_guard text := pg_get_functiondef('public.guard_residual_sell_order_v751()'::regprocedure);
            v_policy text := pg_get_functiondef('public.enforce_residual_exit_position_policy_v751()'::regprocedure);
            v_open integer;
          begin
            if position('RECOVERY_EXIT_REASON_REQUIRED' in v_guard) = 0 or
               position('RECOVERY_TOTAL_NET_NOT_POSITIVE' in v_guard) = 0 then
              raise exception 'v7.5.3 recovery database guard missing';
            end if;
            if position('TOTAL_NET_POSITIVE' in v_policy) = 0 then
              raise exception 'v7.5.3 recovery policy metadata missing';
            end if;
            select count(*) into v_open
            from public.trading_positions
            where state in ('OPEN','EXITING');
            raise notice 'RECOVERY_POLICY_OK open_positions=%', v_open;
          end
          $$;
          SQL

      - name: Restore pre-deploy entry pause state
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
            "update public.trading_settings set pause_new_entries='${ORIGINAL_PAUSE}'::boolean, updated_at=now() where id=1 and version=${ORIGINAL_SETTINGS_VERSION} and emergency_liquidation is not true and coalesce(manual_intervention_required,false) is not true and coalesce(withdrawal_mode,false) is not true"

      - name: Safe cleanup on pre-deploy failure
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DEPLOY_ATTEMPTED:-false}" = "false" ]; then
            psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 -c \
              "update public.trading_settings set pause_new_entries='${ORIGINAL_PAUSE}'::boolean, updated_at=now() where id=1 and version=${ORIGINAL_SETTINGS_VERSION} and emergency_liquidation is not true and coalesce(manual_intervention_required,false) is not true and coalesce(withdrawal_mode,false) is not true"
          else
            echo "Deployment was attempted; keeping new entries paused for safety."
          fi
