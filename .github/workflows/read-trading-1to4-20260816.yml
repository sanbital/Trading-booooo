name: Read trading checks 1-4 20260816

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-trading-1to4-20260816.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production DB read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          echo '=== POST_FIX_SPOT_SUMMARY ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            with p as (
              select * from public.trading_positions
              where opened_at >= timestamptz '2026-08-12 22:56:10+00'
                and is_paper=false and exchange='binance' and state='CLOSED'
            )
            select count(*) n,
                   count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,6) pnl,
                   round(avg(realized_return_pct)::numeric,4) avg_ret,
                   round(avg(realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) avg_win,
                   round(avg(realized_return_pct) filter(where realized_pnl_quote<0)::numeric,4) avg_loss,
                   round(avg(peak_return_pct)::numeric,4) avg_peak,
                   round(avg(mfe_capture_ratio) filter(where realized_pnl_quote>0)::numeric,4) avg_capture,
                   round(avg(profit_giveback_pct)::numeric,4) avg_giveback
            from p;"

          echo '=== POST_EXIT_FIX_BOTH ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select exchange,count(*) n,
                   count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,6) pnl,
                   round(avg(realized_return_pct)::numeric,4) avg_ret,
                   round(avg(realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) avg_win,
                   round(avg(realized_return_pct) filter(where realized_pnl_quote<0)::numeric,4) avg_loss,
                   round(avg(peak_return_pct)::numeric,4) avg_peak,
                   round(avg(mfe_capture_ratio) filter(where realized_pnl_quote>0)::numeric,4) avg_capture,
                   round(avg(profit_giveback_pct)::numeric,4) avg_giveback
            from public.trading_positions
            where opened_at >= timestamptz '2026-08-12 23:11:17+00' and is_paper=false and state='CLOSED'
            group by exchange order by exchange;"

          echo '=== SPOT_CLOSE_REASON_RAW ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select close_reason,count(*) n,count(*) filter(where realized_pnl_quote>0) wins,
                   count(*) filter(where realized_pnl_quote<0) losses,
                   round(sum(realized_pnl_quote)::numeric,4) pnl
            from public.trading_positions
            where opened_at >= timestamptz '2026-08-12 23:11:17+00' and is_paper=false and exchange='binance' and state='CLOSED'
            group by close_reason order by n desc;"

          echo '=== SPOT_WINNER_DISTRIBUTION ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select
              count(*) filter(where realized_pnl_quote>0) winners,
              round(percentile_cont(0.5) within group(order by realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) median_win,
              round(percentile_cont(0.75) within group(order by realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) p75_win,
              round(max(realized_return_pct) filter(where realized_pnl_quote>0)::numeric,4) max_win,
              count(*) filter(where realized_pnl_quote>0 and realized_return_pct<0.25) win_under_025,
              count(*) filter(where realized_pnl_quote>0 and realized_return_pct>=0.25 and realized_return_pct<0.5) win_025_05,
              count(*) filter(where realized_pnl_quote>0 and realized_return_pct>=0.5 and realized_return_pct<1) win_05_1,
              count(*) filter(where realized_pnl_quote>0 and realized_return_pct>=1) win_1_plus
            from public.trading_positions
            where opened_at >= timestamptz '2026-08-12 23:11:17+00' and is_paper=false and exchange='binance' and state='CLOSED';"

          echo '=== LA_POSITION ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select id,market,opened_at at time zone 'Asia/Seoul' opened_kst,closed_at at time zone 'Asia/Seoul' closed_kst,
                   average_entry_price,peak_price,realized_pnl_quote,realized_return_pct,peak_return_pct,profit_giveback_pct,mfe_capture_ratio,close_reason,
                   candidate_id,metadata
            from public.trading_positions
            where market='LAUSDT' and opened_at >= timestamptz '2026-08-14 00:00:00+00'
            order by opened_at desc limit 3;"

          echo '=== LA_CANDIDATE ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select c.id,c.created_at at time zone 'Asia/Seoul' created_kst,c.score,c.period_score,c.confidence,c.snapshot,c.feature_vector
            from public.scanner_candidates c
            join public.trading_positions p on p.candidate_id=c.id
            where p.market='LAUSDT' and p.opened_at >= timestamptz '2026-08-14 00:00:00+00'
            order by p.opened_at desc limit 1;"

          echo '=== LA_ORDERS ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select side,status,type,requested_quantity,filled_quantity,average_fill_price,created_at at time zone 'Asia/Seoul' created_kst,updated_at at time zone 'Asia/Seoul' updated_kst,metadata
            from public.trading_orders
            where market='LAUSDT' and created_at >= timestamptz '2026-08-14 00:00:00+00'
            order by created_at;"

          echo '=== LA_EVENTS ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select event_type,created_at at time zone 'Asia/Seoul' created_kst,payload
            from public.trading_events
            where market='LAUSDT' and created_at >= timestamptz '2026-08-14 00:00:00+00'
            order by created_at;"

          echo '=== LA_DECISIONS ==='
          psql "${SUPABASE_DB_URL}" -P pager=off -v ON_ERROR_STOP=1 -c "
            select action,reason,created_at at time zone 'Asia/Seoul' created_kst,details
            from public.trading_decisions
            where market='LAUSDT' and created_at >= timestamptz '2026-08-14 00:00:00+00'
            order by created_at;"
