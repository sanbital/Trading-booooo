name: Verify production cohort reporting
on:
  pull_request:
    branches: [main]
    paths:
      - ops/execution-infra/cohort.sql
      - tests/production-cohort-report.test.mjs
      - .github/workflows/production-cohort-tests.yml
permissions:
  contents: read
jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/cohort-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: node --test tests/production-cohort-report.test.mjs
        env:
          PGLITE_MODULE: /tmp/cohort-test/node_modules/@electric-sql/pglite/dist/index.js
