name: V10 R3 RANGE BEAR Mechanism Discovery

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/run_r3.py'
      - '.github/workflows/v10-r3-mechanisms.yml'

permissions:
  contents: read

jobs:
  research-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-r3
          key: v10-r3-binance-usdm-15m-2023-2025-v1
          restore-keys: |
            v10-r3-binance-usdm-15m-
      - name: Run R3 mechanism discovery and pre-test confirmation
        run: python research/v10_continuation/run_r3.py
      - name: Upload R3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-r3-result
          path: research/v10_continuation/r3-result.json
          if-no-files-found: ignore
