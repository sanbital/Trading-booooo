name: Temporary Readonly Performance Check
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-readonly-performance-check.yml"]
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Query production database read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          {
            echo '=== trading_positions columns ==='
            psql "$SUPABASE_DB_URL" -X -A -F '|' -c "select column_name,data_type from information_schema.columns where table_schema='public' and table_name='trading_positions' order by ordinal_position;"
            echo '=== trading_orders columns ==='
            psql "$SUPABASE_DB_URL" -X -A -F '|' -c "select column_name,data_type from information_schema.columns where table_schema='public' and table_name='trading_orders' order by ordinal_position;"
            echo '=== recent positions ==='
            psql "$SUPABASE_DB_URL" -X -P pager=off -c "select * from public.trading_positions where coalesce(closed_at,created_at) >= timestamptz '2026-08-16 00:00:00+00' order by coalesce(closed_at,created_at) desc limit 100;"
            echo '=== recent sell orders ==='
            psql "$SUPABASE_DB_URL" -X -P pager=off -c "select * from public.trading_orders where created_at >= timestamptz '2026-08-16 00:00:00+00' and upper(coalesce(side,''))='SELL' order by created_at desc limit 200;"
          } > performance-query.txt
      - name: Upload query result
        uses: actions/upload-artifact@v4
        with:
          name: performance-query
          path: performance-query.txt
          retention-days: 1
