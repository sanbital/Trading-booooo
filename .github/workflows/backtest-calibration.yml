name: Weekly Backtest Calibration

on:
  schedule:
    # Monday 05:00 KST (Sunday 20:00 UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to collect (minimum 125)"
        required: true
        default: "450"
      promote:
        description: "Write a promoted profile when all validation guards pass"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-backtest-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Static checks and tests
        run: |
          deno task check
          deno task test

      - name: Resolve collection period
        id: period
        shell: bash
        run: |
          days="${{ inputs.days }}"
          if [ -z "$days" ]; then days=450; fi
          if ! [[ "$days" =~ ^[0-9]+$ ]]; then
            echo "::error::days must be an integer."
            exit 1
          fi
          if [ "$days" -lt 350 ]; then
            echo "::error::At least 350 days are required so the 120-day warm-up leaves a meaningful evaluation window."
            exit 1
          fi
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Fetch fixed calibration basket
        run: deno run -A backtest/fetch-basket.ts "${{ steps.period.outputs.days }}"

      - name: Run guarded walk-forward calibration
        shell: bash
        run: |
          promote="${{ inputs.promote }}"
          if [ -z "$promote" ]; then promote=true; fi
          if [ "$promote" = "true" ]; then
            deno run -A backtest/calibrate.ts --write-profile backtest/data/*.json
          else
            deno run -A backtest/calibrate.ts backtest/data/*.json
          fi

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-calibration-${{ github.run_number }}
          path: |
            backtest/output/
            backtest/calibration-history.jsonl
            backtest/data/fetch-failures.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit promoted calibration profile
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/market-scanner/calibration-profile.ts backtest/calibration-history.jsonl; then
            echo "No promoted profile change."
            exit 0
          fi
          git config user.name "trading-booooo-calibration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-scanner/calibration-profile.ts backtest/calibration-history.jsonl
          git commit -m "chore(calibration): record weekly self-calibration"
          git push
