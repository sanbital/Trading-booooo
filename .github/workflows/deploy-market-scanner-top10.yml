name: Deploy Top10 LOB production fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-market-scanner-top10.yml

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: etaajwpernzrcdrifdnw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scanner and target-exit guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scanner = Path("supabase/functions/market-scanner/index.ts")
          s = scanner.read_text(encoding="utf-8")
          scanner_replacements = {
              "v7.1.1-LOB-45S-PROFIT-OR-5PCT": "v7.2.2-TOP10-50S-PROFIT-SAFE",
              "const DEFAULT_DYNAMIC_OBSERVATION_MS = 47_000;": "const DEFAULT_DYNAMIC_OBSERVATION_MS = 55_000;",
              "const LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 50_000;": "const LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 60_000;",
              "const MIN_DYNAMIC_OBSERVATION_MS = 47_000;": "const MIN_DYNAMIC_OBSERVATION_MS = 55_000;",
              "const MAX_DYNAMIC_OBSERVATION_MS = 50_000;": "const MAX_DYNAMIC_OBSERVATION_MS = 60_000;",
              "const REQUIRED_PER_MARKET_OBSERVATION_MS = 45_000;": "const REQUIRED_PER_MARKET_OBSERVATION_MS = 50_000;",
              "All books use the 47–50 second observation range.": "The collector stays open 55–60 seconds to guarantee 50 seconds per market.",
              "full 45 seconds": "full 50 seconds",
              "full 45-second": "full 50-second",
              "Top 10 전 종목 47~50초 실시간 호가·체결": "Top 10 전 종목 최소 50초 실시간 호가·체결",
          }
          for old, new in scanner_replacements.items():
              s = s.replace(old, new)
          s = re.sub(r"\s*\|\|\s*!heat\.flowHealthy", "", s)
          scanner.write_text(s, encoding="utf-8")

          trader = Path("supabase/functions/market-autotrader/index.ts")
          t = trader.read_text(encoding="utf-8")
          t = t.replace("v7.1.1-LOB-45S-PROFIT-OR-5PCT", "v7.2.2-TOP10-50S-PROFIT-SAFE")

          old_metrics = '''      const lobExitNotional = current * lobRemainingQuantity;
      const lobNetProfitQuote = lobExitNotional * (1 - lobFeeRate) -
        lobEntryNotional * (1 + lobFeeRate);
      const lobHardStopHit = lobEntryPrice > 0 && current <= lobEntryPrice * 0.95;
      const lobPost180ProfitReady = heldSeconds >= 180 &&
        (exchange === "upbit" ? lobNetProfitQuote >= 1 : lobNetProfitQuote > 0);'''
          new_metrics = '''      const lobExitNotional = current * lobRemainingQuantity;
      const lobNetProfitQuote = lobExitNotional * (1 - lobFeeRate) -
        lobEntryNotional * (1 + lobFeeRate);
      // TARGET_FILL_NET_GUARD_V722: a target quote is not an executable fill.
      // Use the trailing 7-day p95 target-to-fill shortfall plus a small cushion:
      // Upbit 20bp; Binance 50bp. A pre-180 target sell is allowed only when
      // the conservative fill estimate remains fee-net profitable.
      const targetFillSafetyBps = exchange === "upbit" ? 20 : 50;
      const guardedTargetExitPrice = current * (1 - targetFillSafetyBps / 10000);
      const guardedTargetExitNotional = guardedTargetExitPrice * lobRemainingQuantity;
      const guardedTargetNetProfitQuote = guardedTargetExitNotional * (1 - lobFeeRate) -
        lobEntryNotional * (1 + lobFeeRate);
      const lobTargetProfitSafe = exchange === "upbit"
        ? guardedTargetNetProfitQuote >= 1
        : guardedTargetNetProfitQuote > 0;
      const lobHardStopHit = lobEntryPrice > 0 && current <= lobEntryPrice * 0.95;
      const lobPost180ProfitReady = heldSeconds >= 180 &&
        (exchange === "upbit" ? lobNetProfitQuote >= 1 : lobNetProfitQuote > 0);'''
          if "TARGET_FILL_NET_GUARD_V722" not in t:
              if old_metrics not in t:
                  raise SystemExit("autotrader profit metric block not found")
              t = t.replace(old_metrics, new_metrics, 1)

          old_policy = '''        if (lobHardStopHit) {
          decision = { action: "STOP", fraction: 1, reason: "lob:-5pct-hard-stop" };
        } else if (heldSeconds >= 180) {
          decision = lobPost180ProfitReady
            ? { action: "TARGET_1", fraction: 1, reason: "lob:post-180-fee-net-profit" }
            : { action: "NONE", fraction: 0, reason: "lob:post-180-hold-until-net-profit-or--5pct" };
        }'''
          new_policy = '''        if (lobHardStopHit) {
          decision = { action: "STOP", fraction: 1, reason: "lob:-5pct-hard-stop" };
        } else if (heldSeconds >= 180) {
          decision = lobPost180ProfitReady
            ? { action: "TARGET_1", fraction: 1, reason: "lob:post-180-fee-net-profit" }
            : { action: "NONE", fraction: 0, reason: "lob:post-180-hold-until-net-profit-or--5pct" };
        } else if (decision.action === "TARGET_1" || decision.action === "TARGET_2") {
          decision = lobTargetProfitSafe
            ? decision
            : { action: "NONE", fraction: 0, reason: "lob:target-blocked-by-conservative-fee-net-guard" };
        }'''
          if "lob:target-blocked-by-conservative-fee-net-guard" not in t:
              if old_policy not in t:
                  raise SystemExit("autotrader LOB exit policy block not found")
              t = t.replace(old_policy, new_policy, 1)
          trader.write_text(t, encoding="utf-8")

          checks = {
              "scanner collector default 55s": "const DEFAULT_DYNAMIC_OBSERVATION_MS = 55_000;" in s,
              "scanner collector max 60s": "const MAX_DYNAMIC_OBSERVATION_MS = 60_000;" in s,
              "per-market observation 50s": "const REQUIRED_PER_MARKET_OBSERVATION_MS = 50_000;" in s,
              "target conservative fill metric": "TARGET_FILL_NET_GUARD_V722" in t,
              "target order-time fee-net veto": "lob:target-blocked-by-conservative-fee-net-guard" in t,
              "180-second policy retained": "lob:post-180-hold-until-net-profit-or--5pct" in t,
              "hard stop retained": "lob:-5pct-hard-stop" in t,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("production policy check failed: " + ", ".join(failed))
          for name in checks:
              print("PASS:", name)
          PY

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check production entrypoints
        run: |
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts

      - name: Validate diff
        run: git diff --check

      - name: Commit operating code
        run: |
          git config user.name "trading-booooo-deploy-bot"
          git config user.email "trading-booooo-deploy-bot@users.noreply.github.com"
          git add supabase/functions/market-scanner/index.ts supabase/functions/market-autotrader/index.ts
          if git diff --cached --quiet; then
            echo "Operating code already matches v7.2.2."
          else
            git commit -m "fix(lob): guarantee Upbit 50s and block loss-making target exits"
            git push origin HEAD:main
          fi

      - name: Verify Supabase credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy production functions
        run: |
          npx --yes supabase@latest functions deploy market-scanner --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy market-autotrader --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Confirm deployed functions
        run: npx --yes supabase@latest functions list --project-ref "$PROJECT_REF"

