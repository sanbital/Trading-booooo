name: Deploy market scanner strict Top10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-market-scanner-top10.yml

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: etaajwpernzrcdrifdnw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch strict Top10 50-second observation policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scanner = Path("supabase/functions/market-scanner/index.ts")
          text = scanner.read_text(encoding="utf-8")

          replacements = {
              "// Trading-booooo Market Scanner v7.1.1-LOB-45S-PROFIT-OR-5PCT — Supabase Edge Function":
                  "// Trading-booooo Market Scanner v7.2.1-TOP10-PER-MARKET-50S — Supabase Edge Function",
              "// The collector runs slightly beyond the required per-market window so late first frames\n// still receive a full 45 seconds. All books use the 47–50 second observation range.\nconst DEFAULT_DYNAMIC_OBSERVATION_MS = 47_000;\nconst LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 50_000;\nconst MIN_DYNAMIC_OBSERVATION_MS = 47_000;\nconst MAX_DYNAMIC_OBSERVATION_MS = 50_000;\n// Every symbol must receive its own full 45-second wall-clock observation window.\n// The global socket-open timer alone is insufficient because a symbol's first frame can arrive late.\nconst REQUIRED_PER_MARKET_OBSERVATION_MS = 45_000;":
                  "// The socket remains open for 55–60 seconds so a symbol whose first frame arrives late\n// still receives at least 50 full seconds of its own wall-clock orderbook observation.\nconst DEFAULT_DYNAMIC_OBSERVATION_MS = 55_000;\nconst LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 60_000;\nconst MIN_DYNAMIC_OBSERVATION_MS = 55_000;\nconst MAX_DYNAMIC_OBSERVATION_MS = 60_000;\n// Every symbol must receive its own full 50-second wall-clock observation window.\n// The global socket-open timer alone is insufficient because a symbol's first frame can arrive late.\nconst REQUIRED_PER_MARKET_OBSERVATION_MS = 50_000;",
              "const DEFAULT_DYNAMIC_OBSERVATION_MS = 47_000;":
                  "const DEFAULT_DYNAMIC_OBSERVATION_MS = 55_000;",
              "const LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 50_000;":
                  "const LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 60_000;",
              "const MIN_DYNAMIC_OBSERVATION_MS = 47_000;":
                  "const MIN_DYNAMIC_OBSERVATION_MS = 55_000;",
              "const MAX_DYNAMIC_OBSERVATION_MS = 50_000;":
                  "const MAX_DYNAMIC_OBSERVATION_MS = 60_000;",
              "const REQUIRED_PER_MARKET_OBSERVATION_MS = 45_000;":
                  "const REQUIRED_PER_MARKET_OBSERVATION_MS = 50_000;",
              "All books use the 47–50 second observation range.":
                  "All books use a 55–60 second collector window to guarantee 50 seconds per market.",
              "full 45 seconds": "full 50 seconds",
              "full 45-second": "full 50-second",
              "TOP10_24H_GAINERS_THEN_FLOW_EXCLUSION":
                  "TOP10_24H_GAINERS_OBSERVE_ALL",
              "Top 10 중 흐름 유지 종목 최소 45초 실시간 호가·체결":
                  "Top 10 전 종목 최소 50초 실시간 호가·체결",
              "Top 10 전 종목 47~50초 실시간 호가·체결":
                  "Top 10 전 종목 최소 50초 실시간 호가·체결",
              "거래대금·체결속도 감소 필터를 통과했습니다.":
                  "거래대금·체결속도 변화는 사전 제외 없이 호가 관찰 진단값으로만 사용합니다.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text, removed = re.subn(r"\s*\|\|\s*!heat\.flowHealthy", "", text)
          scanner.write_text(text, encoding="utf-8")

          shared = Path("supabase/functions/_shared/lob/market-heat.ts").read_text(encoding="utf-8")
          final = scanner.read_text(encoding="utf-8")
          checks = {
              "collector default is 55 seconds":
                  "const DEFAULT_DYNAMIC_OBSERVATION_MS = 55_000;" in final,
              "low-liquidity collector ceiling is 60 seconds":
                  "const LOW_LIQUIDITY_DYNAMIC_OBSERVATION_MS = 60_000;" in final,
              "collector minimum is 55 seconds":
                  "const MIN_DYNAMIC_OBSERVATION_MS = 55_000;" in final,
              "collector maximum is 60 seconds":
                  "const MAX_DYNAMIC_OBSERVATION_MS = 60_000;" in final,
              "minimum per-market observation is 50 seconds":
                  "const REQUIRED_PER_MARKET_OBSERVATION_MS = 50_000;" in final,
              "flow health cannot pre-exclude a Top-10 member":
                  "!heat.flowHealthy" not in final,
              "ranker keeps flow diagnostics without eligibility veto":
                  "flowHealthy: true" in shared,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("policy check failed: " + ", ".join(failed))
          print(f"removed pre-observation flow veto occurrences: {removed}")
          for name in checks:
              print("PASS:", name)
          PY

      - name: Validate Top10 orderbook-only entry gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          entry = Path("supabase/functions/_shared/lob/entry.ts").read_text(encoding="utf-8")
          checks = {
              "50-second entry observation required":
                  'features.observationMs < 50_000' in entry,
              "Top10 universe required":
                  'features.universeMode === "TOP10_24H_GAINERS_LOB_ONLY"' in entry,
              "spread remains an execution gate":
                  'reasons.push("SPREAD_TOO_WIDE")' in entry,
              "executable depth remains a gate":
                  'reasons.push("INSUFFICIENT_EXECUTABLE_DEPTH")' in entry,
              "EV is informational only":
                  'warnings.push("EV_INFORMATIONAL_ONLY")' in entry,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("entry policy check failed: " + ", ".join(failed))
          for name in checks:
              print("PASS:", name)
          PY

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Top10 regression test
        run: deno test supabase/functions/_shared/lob/market-heat.test.ts

      - name: Validate diff
        run: |
          git diff --check
          git diff -- supabase/functions/market-scanner/index.ts supabase/functions/_shared/lob/market-heat.ts

      - name: Commit operating code
        run: |
          git config user.name "trading-booooo-deploy-bot"
          git config user.email "trading-booooo-deploy-bot@users.noreply.github.com"
          git add supabase/functions/market-scanner/index.ts
          if git diff --cached --quiet; then
            echo "Operating code already guarantees a full 50-second per-market observation."
          else
            git commit -m "fix(scanner): guarantee full 50s observation per Top10 market"
            git push origin HEAD:main
          fi

      - name: Verify Supabase credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is missing"
            exit 1
          }

      - name: Deploy market-scanner
        run: npx --yes supabase@latest functions deploy market-scanner --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Confirm deployed function listing
        run: npx --yes supabase@latest functions list --project-ref "$PROJECT_REF"

# deployment trigger: per-market 50s guarantee 2026-08-01T02:27+09:00
