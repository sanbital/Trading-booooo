name: Binance Market-Wide Replay

on:
  push:
    branches: [main]
    paths:
      - 'research/binance_marketwide_replay.py'
      - '.github/workflows/binance-marketwide-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas 'psycopg[binary]' requests tabulate

      - name: Run 7-day whole-Binance replay
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          python research/binance_marketwide_replay.py --days 7 --control-step-min 30 --out research-output

      - name: Publish summary
        if: always()
        run: |
          if [ -f research-output/SUMMARY.md ]; then
            cat research-output/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist compact research result
        if: success()
        run: |
          mkdir -p research/results/latest
          cp research-output/SUMMARY.md research/results/latest/SUMMARY.md
          cp research-output/metadata.json research/results/latest/metadata.json
          cp research-output/checkpoint_summary.csv research/results/latest/checkpoint_summary.csv
          cp research-output/breakeven_metrics.csv research/results/latest/breakeven_metrics.csv
          cp research-output/recovery_metrics.csv research/results/latest/recovery_metrics.csv
          cp research-output/single_gate_metrics.csv research/results/latest/single_gate_metrics.csv
          cp research-output/whole_market_controls.csv research/results/latest/whole_market_controls.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/latest
          if ! git diff --cached --quiet; then
            git commit -m 'research: refresh Binance market-wide replay results'
            git push
          fi

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-marketwide-replay
          path: research-output/
          if-no-files-found: warn
          retention-days: 14
