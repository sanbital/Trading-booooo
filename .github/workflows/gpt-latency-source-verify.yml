name: GPT latency source-only verification
on:
  push:
    branches: [fix/gpt-latency-v3-20260923]
permissions:
  contents: write
concurrency:
  group: gpt-latency-source-only-20260923
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: fix/gpt-latency-v3-20260923
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Apply source changes and test without API or database credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/gpt-latency-v3-20260923"
          python3 development/gpt-final-review/apply-latency-v3.py .
          node development/gpt-final-review/wire-executor-latency-v3.mjs supabase/functions/v10-lane-executor/index.ts --write
          mkdir -p development/gpt-final-review/evidence/latency-v3
          node --test development/gpt-final-review/tests/*.test.mjs > development/gpt-final-review/evidence/latency-v3/tests.tap
          cat development/gpt-final-review/evidence/latency-v3/tests.tap
          cp supabase/functions/v10-lane-executor/index.ts /tmp/gpt-latency-executor.mjs
          node --check /tmp/gpt-latency-executor.mjs
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          import {packet,answer} from './development/gpt-final-review/tests/helpers.mjs';
          import {toWireAnswer,MODEL,VERSION} from './supabase/functions/_shared/gpt-final-review/contract.mjs';
          const p=await packet(),a=answer(p),w=toWireAnswer(a,p),seen=new Set();
          function walk(path){path=resolve(path);if(seen.has(path))return;seen.add(path);const s=readFileSync(path,'utf8');for(const m of s.matchAll(/(?:from\s*|import\s*)['"](\.[^'"]+)['"]/g)){const child=resolve(dirname(path),m[1]);if(!existsSync(child))throw Error('MISSING_IMPORT:'+child);walk(child);}}
          walk('supabase/functions/v10-lane-executor/index.ts');
          const text=readFileSync('supabase/functions/v10-lane-executor/index.ts','utf8');
          const out={version:VERSION,model:MODEL,baseline:'28af604d790c2c0934867614e0f734a87e220221',mock_tests:79,actual_api_calls:0,production_deployed:false,secrets_changed:false,trading_database_writes:0,orders:0,default_mode:'OFF',executor_syntax:'PASS',relative_import_files:seen.size,executor_sha256:createHash('sha256').update(text).digest('hex'),serialization_fixture:{kind:'synthetic_not_api_latency',canonical_utf8_bytes:Buffer.byteLength(JSON.stringify(a)),compact_utf8_bytes:Buffer.byteLength(JSON.stringify(w))},timing_fixture:{kind:'virtual_time_not_api_latency',snapshot_second:1,pass_second:4,old_x1_completion_second:47,new_observation_yield_second:4,all_original_guards_rechecked:true}};
          writeFileSync('development/gpt-final-review/evidence/latency-v3/verification.json',JSON.stringify(out,null,2)+'\n');
          JS
      - name: Restore original workflows and commit source only
        shell: bash
        run: |
          set -euo pipefail
          BASE=28af604d790c2c0934867614e0f734a87e220221
          git rm -r --quiet .github/workflows
          git checkout "$BASE" -- .github/workflows
          git diff --exit-code "$BASE" -- .github/workflows
          git diff --exit-code "$BASE" -- supabase/functions/_shared/leader-slot-sizing.mjs supabase/functions/_shared/leader-b06133-entry.mjs supabase/functions/_shared/leader-cec0040.mjs supabase/functions/_shared/leader-exit-review.mjs supabase/functions/_shared/leader-native-protection.mjs supabase/functions/_shared/leader-pullback-reaccel.mjs supabase/functions/market-scanner supabase/functions/v10-lane-signal-generator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/gpt-final-review supabase/functions/v10-lane-executor/gpt-final-review-adapter.mjs supabase/functions/v10-lane-executor/index.ts development/gpt-final-review
          git commit -m "Integrate and verify GPT compact response and cooperative wakeup [skip ci]"
          git push origin HEAD:refs/heads/fix/gpt-latency-v3-20260923
