name: Read ZRO geometry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-zro-geometry.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - name: Read row
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "${SUPABASE_DB_URL}" -At -F '|' --set=ON_ERROR_STOP=1 -c "
            select planned_entry_price,average_entry_price,stop_price,target_1,target_2,
                   initial_quantity,remaining_quantity,t1_allocation_pct,
                   coalesce(metadata->'lob_signal'->>'stop_bps',''),coalesce(metadata->'lob_signal'->>'target_bps','')
            from public.trading_positions where id='111c5f48-27bf-4c26-9819-4f4ed7714577'::uuid;" > .github/zro-geometry.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/zro-geometry.txt
          git commit -m "chore: record ZRO geometry" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
