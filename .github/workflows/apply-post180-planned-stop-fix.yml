name: Apply post-180 planned stop fix

on:
  push:
    branches:
      - agent/fix-post180-planned-stop

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[post180-stop-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-post180-planned-stop
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact source replacements
        run: python3 scripts/apply-post180-planned-stop-fix.py
      - name: Format and verify
        run: |
          deno fmt supabase/functions/market-autotrader/index.ts
          git diff --check
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix: keep planned LOB stop authoritative after 180s [post180-stop-applied]"
          git push origin HEAD:agent/fix-post180-planned-stop
