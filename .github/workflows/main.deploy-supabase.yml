name: Deploy Supabase Trading Engine

# Non-ordering Supabase services. Scanner/autotrader are owned by the v7.2.3 workflow.
on:
  push:
    branches: [main]
    paths:
      - "backtest/**"
      - "supabase/functions/market-learning/**"
      - "supabase/functions/market-performance/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "validation/**"
      - "deno.json"
      - ".github/workflows/main.deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-supabase-trading-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate TypeScript and tests
        run: |
          deno task check
          deno task test
          node validation/v700-deploy-validation.mjs
          node --check gateway/server.mjs
          node --test gateway/server.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Validate repository secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SCAN_ACCESS_TOKEN: ${{ secrets.SCAN_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SCAN_ACCESS_TOKEN SUPABASE_DB_URL LEARNING_ACCESS_TOKEN FLY_APP_NAME FLY_BINANCE_APP_NAME; do
            if [ -z "${!name:-}" ]; then echo "::error::GitHub repository secret ${name} is missing."; exit 1; fi
          done
          for name in SCAN_ACCESS_TOKEN LEARNING_ACCESS_TOKEN; do
            value="${!name}"; if [ "${#value}" -lt 32 ]; then echo "::error::${name} must be at least 32 characters."; exit 1; fi
          done

      - name: Set Edge Function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SCAN_ACCESS_TOKEN: ${{ secrets.SCAN_ACCESS_TOKEN }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: |
          allowed_origin="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          autotrade_token="$(printf 'autotrade:%s' "$LEARNING_ACCESS_TOKEN" | sha256sum | awk '{print $1}')"
          gateway_secret="$(printf 'gateway:%s' "$LEARNING_ACCESS_TOKEN" | sha256sum | awk '{print $1}')"
          supabase secrets set \
            "SCAN_ACCESS_TOKEN=${SCAN_ACCESS_TOKEN}" \
            "ALLOWED_ORIGINS=${allowed_origin}" \
            "DEEP_SCAN_LIMIT=30" \
            "LEARNING_ACCESS_TOKEN=${LEARNING_ACCESS_TOKEN}" \
            "AUTOTRADE_ACCESS_TOKEN=${autotrade_token}" \
            "ORDER_GATEWAY_URL=https://${FLY_APP_NAME}.fly.dev" \
            "GATEWAY_SHARED_SECRET=${gateway_secret}" \
            "BINANCE_ORDER_GATEWAY_URL=https://${FLY_BINANCE_APP_NAME}.fly.dev" \
            "BINANCE_GATEWAY_SHARED_SECRET=${gateway_secret}" \
            "BINANCE_FUTURES_ORDER_GATEWAY_URL=https://${FLY_BINANCE_APP_NAME}.fly.dev" \
            "BINANCE_FUTURES_GATEWAY_SHARED_SECRET=${gateway_secret}" \
            "BINANCE_FUTURES_FEE_PER_SIDE_PCT=0.05" \
            "TRADING_MODE_DEFAULT=PAPER" \
            "TRADING_STRATEGY=P10_DONCHIAN_SLOW4R" \
            "SCALP_PER_ORDER_PCT=100" \
            "SCALP_DAILY_LOSS_PCT=30" \
            "SCALP_MAX_SINGLE_LOSS_PCT=5" \
            "SCALP_MAX_CONSECUTIVE_LOSSES=50" \
            "SCALP_KILL_SWITCH=false" \
            "SCALP_MAX_HOLDING_MINUTES=3" \
            "SCALP_MAKER_ENTRY_TTL_SECONDS=8" \
            "SCALP_MAKER_ENTRY_DRIFT_TICKS=1" \
            "BINANCE_MIN_ORDER_USDT=90" \
            "LOB_MAX_HOLDING_SECONDS=180" \
            "LOB_ABSOLUTE_MAX_HOLDING_SECONDS=300" \
            "LOB_SCAN_INTERVAL_SECONDS=12" \
            "LOB_MIN_NET_EV_BPS=0.5" \
            "LOB_MAX_BOOK_AGE_MS=5000" \
            "LOB_MAX_SPREAD_BPS=35" \
            "LOB_HEAT_SAMPLE_COUNT=3" \
            "LOB_HEAT_SAMPLE_INTERVAL_MS=900" \
            "LOB_HEAT_FINALIST_LIMIT=12" \
            "LOB_OBSERVATION_MS=32000" \
            "AUTO_SCAN_INTERVAL_SECONDS=12" \
            "AUTO_MONITOR_INTERVAL_SECONDS=2" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Apply database migrations
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          project_ref = os.environ["SUPABASE_PROJECT_REF"].strip()
          raw = os.environ["SUPABASE_DB_URL"].strip()
          parsed = urlparse(raw)

          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("SUPABASE_DB_URL must start with postgres:// or postgresql://")
          if not parsed.hostname or not parsed.hostname.endswith(".pooler.supabase.com"):
              raise SystemExit("SUPABASE_DB_URL must be the Supabase Session pooler URL")
          if parsed.port != 5432:
              raise SystemExit("SUPABASE_DB_URL must use Session pooler port 5432")
          expected_user = f"postgres.{project_ref}"
          if parsed.username != expected_user:
              raise SystemExit(f"SUPABASE_DB_URL username must be {expected_user}; got {parsed.username!r}")
          if not parsed.password or parsed.password == "[YOUR-PASSWORD]":
              raise SystemExit("SUPABASE_DB_URL must contain the real URL-encoded database password")
          print(f"Validated Session pooler target: host={parsed.hostname}, port={parsed.port}, user={parsed.username}")
          PY
          command -v psql >/dev/null
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260810010000_binance_futures_lane_v760.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260810133000_protected_trailing_exit_v761.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260811090700_first_tranche_recovery_exit_v765.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260817090456_fix_timeout_reason_priority_before_first_tranche.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260817090516_enforce_absolute_timeout_before_tranche_guard.sql
          # The state-machine migration intentionally replaces legacy recovery ownership.
          # Always restore the later Late Recovery branch and then the futures timeout
          # owner after it, so deployment cannot end in the spot-only timeout variant.
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260820091000_restore_late_recovery_after_state_machine.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260820090000_restore_futures_absolute_timeout_guard.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260821110000_p10_live_cutover.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260821112500_p10_fill_stop_parity.sql
          psql "${SUPABASE_DB_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file supabase/migrations/20260821113000_p10_rpc_privilege_lockdown.sql

      - name: Verify the sell guard survived the batch
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_def text;
            v_futures_def text;
            v_position_def text;
            v_bad_timeout text := $bad$
            and not v_futures
            and v_approved_reason in ('HALF_HOLD_ABSOLUTE_TIMEOUT', 'POST180_MAX_HOLD_TIMEOUT')
          $bad$;
          begin
            select pg_get_functiondef(p.oid) into v_def
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'guard_lob_sell_order_v714';

            if v_def is null then
              raise exception 'guard_lob_sell_order_v714 is missing after the batch';
            end if;
            if position('exit_policy_quote,executable_vwap' in v_def) = 0
               or position('live_mark,executable_price' in v_def) = 0 then
              raise exception 'guard lost the multi-field executable quote fallback';
            end if;
            if position('coalesce(p.stop_price, 0) > 0' in v_def) > 0 then
              raise exception
                'the planned stop is an exit trigger again; only the canonical executable-net policy may force a generic LOB sell';
            end if;
            if position('HARD_STOP_MINUS_2' in v_def) = 0 then
              raise exception 'spot LOB guard lost the executable-net stop at minus 2 percent';
            end if;
            if position('lob:STOP_HIT' in v_def) > 0 then
              raise exception
                'planned-stop authority is gated on a reason string again; risk control must not depend on a diagnostic';
            end if;
            if position('POST180_MAX_HOLD_TIMEOUT' in v_def) > 0 then
              raise exception
                'spot post-180 hold carries a time cap again; current spot policy must remain unchanged';
            end if;
            if position('v_policy_revision = ''7.3.0' in v_def) > 0
               or position('v_policy_revision = ''7.3.2' in v_def) > 0 then
              raise exception
                'a revision test is an equality against a comma list; it will fail when the branch is first reached';
            end if;
            if position('PREBREAKOUT-BURST-V1' in v_def) = 0 then
              raise exception 'guard lost the deployed pre-breakout policy revision';
            end if;

            select pg_get_functiondef(p.oid) into v_futures_def
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'guard_residual_sell_order_v751';
            if v_futures_def is null
               or position('FUTURES_RECOVERY_NET_POSITIVE_EXIT' in v_futures_def) = 0
               or position('FUTURES_STALE_GIVEBACK_EXIT_180M' in v_futures_def) = 0
               or position('FUTURES_RECOVERY_REQUIRES_POSITIVE_NET' in v_futures_def) = 0
               or position('FUTURES_RECOVERY_NOT_LATCHED' in v_futures_def) = 0
               or position('v_held_seconds < 180' in v_futures_def) = 0
               or position('v_held_seconds < 10800' in v_futures_def) = 0
               or position('pending_exit_reason' in v_futures_def) = 0
               or position('EMERGENCY' in v_futures_def) = 0
               or position('LATE_RECOVERY_NET_POSITIVE_EXIT' in v_futures_def) = 0
               or position('LATE_RECOVERY_DRAWDOWN_33_EXIT' in v_futures_def) = 0
               or position('LATE_RECOVERY_OUTSIDE_OWNER_WINDOW' in v_futures_def) = 0
               or position('POST180_MAX_HOLD_TIMEOUT' in v_futures_def) = 0
               or position('HALF_HOLD_ABSOLUTE_TIMEOUT' in v_futures_def) = 0
               or position('absolute_max_holding_seconds' in v_futures_def) = 0 then
              raise exception 'Futures recovery/late-recovery/timeout guard missing after migration batch';
            end if;
            if position(v_bad_timeout in v_futures_def) > 0 then
              raise exception 'Futures absolute-timeout STOP owner is incorrectly excluded after migration batch';
            end if;

            select pg_get_functiondef(p.oid) into v_position_def
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'enforce_residual_exit_position_policy_v751';
            if v_position_def is null
               or position('recovery_latch_after_seconds' in v_position_def) = 0
               or position('coalesce(new.t1_completed, false)' in v_position_def) = 0
               or position('- ''recovery_exit''' in v_position_def) > 0 then
              raise exception 'Futures 3m recovery position-state policy missing after migration batch';
            end if;
            raise notice 'sell guard end state verified';
          end
          $$;
          SQL

      - name: Deploy Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for fn in market-learning scalp-calibration lob-calibration; do
            supabase functions deploy "$fn" --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          done

      - name: Bootstrap autonomous trading configuration
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LEARNING_ACCESS_TOKEN: ${{ secrets.LEARNING_ACCESS_TOKEN }}
        run: |
          autotrade_token="$(printf 'autotrade:%s' "$LEARNING_ACCESS_TOKEN" | sha256sum | awk '{print $1}')"
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 60 -X POST \
            -H "content-type: application/json" -H "x-autotrade-token: ${autotrade_token}" \
            -d '{"action":"bootstrap"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-autotrader"
