name: Patch Main Deploy Timeout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-main-deploy-timeout.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Patch primary deployment batch
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path(".github/workflows/main.deploy-supabase.yml"); s=p.read_text(); needle="          psql \"${SUPABASE_DB_URL}\" \\\n            --set=ON_ERROR_STOP=1 \\\n            --single-transaction \\\n            --file supabase/migrations/20260811090700_first_tranche_recovery_exit_v765.sql\n"; add=needle+"          psql \"${SUPABASE_DB_URL}\" \\\n            --set=ON_ERROR_STOP=1 \\\n            --single-transaction \\\n            --file supabase/migrations/20260817090456_fix_timeout_reason_priority_before_first_tranche.sql\n          psql \"${SUPABASE_DB_URL}\" \\\n            --set=ON_ERROR_STOP=1 \\\n            --single-transaction \\\n            --file supabase/migrations/20260817090516_enforce_absolute_timeout_before_tranche_guard.sql\n"; (None if "20260817090516_enforce_absolute_timeout_before_tranche_guard.sql" in s else (_ for _ in ()).throw(SystemExit("migration marker missing")) if needle not in s else None); s=s if "20260817090516_enforce_absolute_timeout_before_tranche_guard.sql" in s else s.replace(needle,add,1); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path(".github/workflows/main.deploy-supabase.yml"); s=p.read_text(); old="               or position('\''EMERGENCY'\'' in v_recovery_def) = 0 then\n              raise exception '\''v7.6.5 recovery sell guard missing after migration batch'\'';\n            end if;\n"; new="               or position('\''EMERGENCY'\'' in v_recovery_def) = 0\n               or position('\''POST180_MAX_HOLD_TIMEOUT'\'' in v_recovery_def) = 0\n               or position('\''HALF_HOLD_ABSOLUTE_TIMEOUT'\'' in v_recovery_def) = 0\n               or position('\''absolute_max_holding_seconds'\'' in v_recovery_def) = 0\n               or position('\''v_approved_reason in ('\''\''HALF_HOLD_ABSOLUTE_TIMEOUT'\''\'', '\''\''POST180_MAX_HOLD_TIMEOUT'\''\'')'\'' in v_recovery_def) = 0 then\n              raise exception '\''v7.6.5 recovery/absolute-timeout sell guard missing after migration batch'\'';\n            end if;\n"; (None if "recovery/absolute-timeout sell guard missing after migration batch" in s else (_ for _ in ()).throw(SystemExit("verification marker missing")) if old not in s else None); s=s if "recovery/absolute-timeout sell guard missing after migration batch" in s else s.replace(old,new,1); p.write_text(s)'
          git diff --check
          git diff -- .github/workflows/main.deploy-supabase.yml
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/main.deploy-supabase.yml
          git commit -m "fix: make timeout guard part of primary deployment batch"
          git push origin HEAD:main
