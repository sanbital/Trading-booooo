name: PR LOB consistency deploy

on:
  pull_request:
    branches: [main]
    paths:
      - .deploy/lob-7-1-2.trigger

permissions:
  contents: write

concurrency:
  group: pr-lob-consistency-deploy
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: etaajwpernzrcdrifdnw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply robust reviewed LOB patch
        run: python3 .github/scripts/apply_lob_7_1_2.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and type-check production functions
        shell: bash
        run: |
          deno fmt \
            supabase/functions/_shared/lob/patterns.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          git diff --check

      - name: Commit patched production source to PR branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions
          git commit -m "fix: align LOB collection and admission [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Require deployment credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy market scanner
        run: npx --yes supabase@latest functions deploy market-scanner --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy market autotrader
        run: npx --yes supabase@latest functions deploy market-autotrader --project-ref "$PROJECT_REF" --no-verify-jwt
