name: V10 Continuation RANGE BEAR Research

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/**'
      - '.github/workflows/v10-continuation-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-continuation
          key: v10-cont-binance-usdm-15m-2025-v1
      - name: Run sealed discovery or locked test
        run: python research/v10_continuation/run.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-continuation-result
          path: research/v10_continuation/result.json
          if-no-files-found: ignore
