name: V10 Continuation RANGE BEAR Research

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/**'
      - '.github/workflows/v10-continuation-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-continuation
          key: v10-cont-binance-usdm-15m-2025-v1
      - uses: actions/cache@v4
        with:
          path: v10-cache-r3
          key: v10-r3-binance-usdm-15m-2023-2025-v1
      - uses: actions/cache@v4
        with:
          path: v10-cache-final-r5
          key: v10-r5-binance-usdm-15m-final-2025-11-02-2026-01-01-v1
      - name: Run sealed research or immutable final test
        run: |
          if [ -f research/v10_continuation/final-lock-r5-range.json ]; then
            python research/v10_continuation/run_r5_range_final_test.py
          else
            python research/v10_continuation/run.py
            python research/v10_continuation/run_r5.py
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-continuation-result
          path: |
            research/v10_continuation/result.json
            research/v10_continuation/r5-result.json
            research/v10_continuation/r5-range-final-test-result.json
          if-no-files-found: ignore
