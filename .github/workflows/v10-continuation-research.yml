name: V10 Continuation RANGE BEAR Research

on:
  push:
    branches:
      - v10-continuation-20260830
    paths:
      - 'research/v10_continuation/**'
      - '.github/workflows/v10-continuation-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v10-cache-r3
          key: v10-r3-binance-usdm-15m-2023-2025-v1
      - name: Run R6 breadth and RANGE plateau research only
        run: python research/v10_continuation/run_r6.py
      - name: Upload R6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-r6-result
          path: research/v10_continuation/r6-result.json
          if-no-files-found: error
