name: Apply and deploy P10 orphan entry self-heal R2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - ".p10-orphan-entry-self-heal-r2-trigger"

permissions:
  contents: write

concurrency:
  group: p10-orphan-entry-self-heal-r2
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bot/p10-orphan-entry-self-heal-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply bounded P10 patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python scripts/apply_p10_orphan_entry_self_heal_r2.py

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \
            supabase/functions/market-autotrader/index.ts
          git diff --check
          deno test supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts
          deno test --allow-read supabase/functions/market-autotrader/p10-entry-latch-ownership.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          grep -q '8.0.2-P10-ORPHAN-ENTRY-SELF-HEAL' supabase/functions/market-autotrader/index.ts
          grep -q 'P10_ENTRY_ORDER_RECORD_FAILED' supabase/functions/market-autotrader/index.ts
          grep -q 'P10_ORPHAN_ENTRY_CANCELLED' supabase/functions/market-autotrader/index.ts
          grep -q 'p10PendingReservationExpired' supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts

      - name: Commit validated product fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts
          git commit -m "fix: self-heal orphan P10 entry reservations"
          git push origin HEAD:main

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy market-autotrader to production
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api
