name: Readonly Trade Audit 20260903

on:
  push:
    branches:
      - automation-readonly-trade-audit-20260903-1754

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production database in read-only transaction
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          begin transaction read only;
          select 'META|'||jsonb_build_object('db_now',now(),'latest_cut','2026-09-03 05:58:31.544+00'::timestamptz,'range_cut','2026-09-03 03:22:25.869+00'::timestamptz)::text;
          select 'RUNTIME_V11|'||to_jsonb(r)::text from public.v11_long_regime_runtime r limit 1;
          select 'RUNTIME_RANGE|'||to_jsonb(r)::text from public.v12_range_live_runtime r limit 1;
          select 'RUNTIME_BEAR|'||to_jsonb(r)::text from public.v14_bear_live_runtime r limit 1;

          with x as (
            select p.*,p.realized_pnl_usdt/nullif(p.entry_price*p.original_quantity/3.0,0)*100 ret,(p.peak_price/p.entry_price-1)*300 mfe
            from public.v11_long_regime_positions p where p.state='CLOSED' and p.entry_at>='2026-09-03 05:58:31.544+00'
          ) select 'FUT_POST|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_usdt>0),'l',count(*)filter(where realized_pnl_usdt<0),'pnl',round(coalesce(sum(realized_pnl_usdt),0)::numeric,8),'avg_ret',round(avg(ret)::numeric,6),'avg_win',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt>0)::numeric,8),'avg_loss',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt<0)::numeric,8),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(exit_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'avg_mfe',round(avg(mfe)::numeric,6),'mfe_recovery_pct',round((100*sum(ret)/nullif(sum(mfe),0))::numeric,4),'giveback_bps',round(avg((mfe-ret)*100)::numeric,4),'first_entry',min(entry_at),'last_close',max(closed_at))::text from x;

          with pc as (select count(*)::int n from public.v11_long_regime_positions where state='CLOSED' and entry_at>='2026-09-03 05:58:31.544+00'), p as (select * from public.v11_long_regime_positions where state='CLOSED' and entry_at<'2026-09-03 05:58:31.544+00' order by entry_at desc limit (select n from pc)), x as (select p.*,p.realized_pnl_usdt/nullif(p.entry_price*p.original_quantity/3.0,0)*100 ret,(p.peak_price/p.entry_price-1)*300 mfe from p)
          select 'FUT_PRE_N|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_usdt>0),'l',count(*)filter(where realized_pnl_usdt<0),'pnl',round(coalesce(sum(realized_pnl_usdt),0)::numeric,8),'avg_ret',round(avg(ret)::numeric,6),'avg_win',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt>0)::numeric,8),'avg_loss',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt<0)::numeric,8),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(exit_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'avg_mfe',round(avg(mfe)::numeric,6),'mfe_recovery_pct',round((100*sum(ret)/nullif(sum(mfe),0))::numeric,4),'giveback_bps',round(avg((mfe-ret)*100)::numeric,4))::text from x;

          with x as (select p.*,p.realized_pnl_usdt/nullif(p.entry_price*p.original_quantity/3.0,0)*100 ret,(p.peak_price/p.entry_price-1)*300 mfe from public.v11_long_regime_positions p where p.state='CLOSED' and p.entry_at>='2026-09-02 15:00:00+00' and p.entry_at<'2026-09-03 05:58:31.544+00')
          select 'FUT_TODAY_PRE|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_usdt>0),'l',count(*)filter(where realized_pnl_usdt<0),'pnl',round(coalesce(sum(realized_pnl_usdt),0)::numeric,8),'avg_ret',round(avg(ret)::numeric,6),'avg_win',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt>0)::numeric,8),'avg_loss',round(avg(realized_pnl_usdt)filter(where realized_pnl_usdt<0)::numeric,8),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(exit_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'avg_mfe',round(avg(mfe)::numeric,6),'mfe_recovery_pct',round((100*sum(ret)/nullif(sum(mfe),0))::numeric,4),'giveback_bps',round(avg((mfe-ret)*100)::numeric,4))::text from x;

          with x as (select p.*,p.realized_pnl_usdt/nullif(p.entry_price*p.original_quantity/3.0,0)*100 ret,(p.peak_price/p.entry_price-1)*300 mfe from public.v11_long_regime_positions p where p.state='CLOSED' and p.revision='V13-RANGE-ACTIVE-EXIT-1.0.0')
          select 'V13|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_usdt>0),'l',count(*)filter(where realized_pnl_usdt<0),'pnl',round(coalesce(sum(realized_pnl_usdt),0)::numeric,8),'avg_ret',round(avg(ret)::numeric,6),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(exit_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'avg_mfe',round(avg(mfe)::numeric,6),'mfe_recovery_pct',round((100*sum(ret)/nullif(sum(mfe),0))::numeric,4),'giveback_bps',round(avg((mfe-ret)*100)::numeric,4),'first_entry',min(entry_at),'last_close',max(closed_at))::text from x;

          with x as (select p.*,p.realized_pnl_usdt/nullif(p.entry_price*p.original_quantity/3.0,0)*100 ret,(p.peak_price/p.entry_price-1)*300 mfe from public.v11_long_regime_positions p where p.state='CLOSED' and p.revision='V14-BEAR-CS-PROOF-1.0.0')
          select 'V14|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_usdt>0),'l',count(*)filter(where realized_pnl_usdt<0),'pnl',round(coalesce(sum(realized_pnl_usdt),0)::numeric,8),'avg_ret',round(avg(ret)::numeric,6),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(exit_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'avg_mfe',round(avg(mfe)::numeric,6),'mfe_recovery_pct',round((100*sum(ret)/nullif(sum(mfe),0))::numeric,4),'giveback_bps',round(avg((mfe-ret)*100)::numeric,4),'first_entry',min(entry_at),'last_close',max(closed_at))::text from x;

          select 'FUT_ORDERS|'||jsonb_build_object('filled',count(*)filter(where state='FILLED'),'entry_fills',count(*)filter(where state='FILLED' and intent='OPEN_LONG'),'exit_fills',count(*)filter(where state='FILLED' and intent in('CLOSE_LONG','PARTIAL_CLOSE')),'recon_failed',count(*)filter(where state='RECONCILIATION_FAILED'))::text from public.v11_long_regime_orders where created_at>='2026-09-03 05:58:31.544+00';
          select 'FUT_OPEN|'||jsonb_build_object('n',count(*),'rows',coalesce(jsonb_agg(jsonb_build_object('symbol',symbol,'revision',revision,'lane',active_lane,'entry_at',entry_at)),'[]'::jsonb))::text from public.v11_long_regime_positions where state='OPEN';

          with x as (select * from public.trading_positions where is_paper=false and state='CLOSED' and lower(exchange::text) in('binance','upbit') and opened_at>='2026-09-03 05:58:31.544+00')
          select 'SPOT_POST|'||jsonb_build_object('n',count(*),'w',count(*)filter(where realized_pnl_quote>0),'l',count(*)filter(where realized_pnl_quote<0),'pnl',round(coalesce(sum(realized_pnl_quote),0)::numeric,8),'avg_ret',round(avg(realized_return_pct)::numeric,6),'avg_win',round(avg(realized_pnl_quote)filter(where realized_pnl_quote>0)::numeric,8),'avg_loss',round(avg(realized_pnl_quote)filter(where realized_pnl_quote<0)::numeric,8),'stop_pct',round((100.0*count(*)filter(where upper(coalesce(close_reason,'')) like '%STOP%')/nullif(count(*),0))::numeric,4),'mfe_capture_stored',round(avg(mfe_capture_ratio)::numeric,6),'giveback_bps_stored',round(avg(profit_giveback_bps)::numeric,4))::text from x;
          select 'SPOT_FILLS|'||jsonb_build_object('fills',count(*),'buys',count(*)filter(where upper(side::text)='BUY'),'sells',count(*)filter(where upper(side::text)='SELL'))::text from public.exchange_trade_fills where executed_at>='2026-09-03 05:58:31.544+00' and lower(account_scope::text)='spot' and upper(source::text)='AUTOMATED';
          select 'ROWS|'||coalesce(jsonb_agg(t order by entry_at),'[]'::jsonb)::text from (select revision,entry_lane,symbol,state,entry_at,closed_at,entry_price,exit_price,exit_reason,realized_pnl_usdt,peak_price,original_quantity from public.v11_long_regime_positions where entry_at>='2026-09-03 03:22:25.869+00' order by entry_at) t;
          rollback;
          SQL
