name: Maker Post-Only Fallback v6.14.2

on:
  push:
    branches: [main]
    paths:
      - .github/maker-post-only-fallback-v6142.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch deterministic post-only fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/market-autotrader/index.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''import {
            lobRecommendationWindowSeconds,
            recommendationAdmission,
            summarizeEntryAdmission,
          } from "./entry-admission.ts";
          '''.replace('          ', '')
          import_replacement = import_anchor + '''import { shouldFallbackPostOnlyMomentumToIoc } from "./maker-fallback.ts";
'''
          if import_anchor not in text:
            raise SystemExit('maker fallback import anchor unavailable')
          text = text.replace(import_anchor, import_replacement, 1)

          old = '''    } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              await patch("trading_orders", `id=eq.${makerOrderRow.id}`, {
                state: "REJECTED",
                error_message: message,
                completed_at: new Date().toISOString(),
              });
              await patch("trading_positions", `id=eq.${position.id}`, {
                state: "CANCELLED",
                reserved_quote: 0,
                reserved_quantity: 0,
                reservation_expires_at: null,
                close_reason: "MAKER_ENTRY_REJECTED",
                closed_at: new Date().toISOString(),
              });
              await event("MAKER_ENTRY_REJECTED", `${exchange}:${candidate.market} maker entry rejected`, {
                error: message,
                price: makerPrice,
              }, { cycleId, positionId: position.id, level: "WARNING" });
              return { entered: false, exchange, market: candidate.market, reason: message };
            }
          '''.replace('          ', '')

          new = '''    } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              await patch("trading_orders", `id=eq.${makerOrderRow.id}`, {
                state: "REJECTED",
                error_message: message,
                completed_at: new Date().toISOString(),
              });
              const makerFallback = shouldFallbackPostOnlyMomentumToIoc({
                exchange,
                pattern: position.metadata?.lob_signal?.pattern,
                errorMessage: message,
                convertToTaker: position.metadata?.lob_signal?.maker_fill?.convertToTaker,
                attemptEvLowerBoundBps: position.metadata?.lob_signal?.attempt_ev_lower_bound_bps,
                conditionalEvLowerBoundBps: position.metadata?.lob_signal?.conditional_ev_lower_bound_bps,
                spreadBps,
                maxSpreadBps: finite((settings as any).lob_momentum_max_spread_bps, 8),
                candidateAgeMs: position.metadata?.lob_signal?.recommendation?.candidateAgeMs,
                hardMaxAgeMs: position.metadata?.lob_signal?.recommendation?.hardMaxAgeMs,
              });
              if (makerFallback) {
                const rows = await patch("trading_positions", `id=eq.${position.id}`, {
                  metadata: {
                    ...(position.metadata || {}),
                    maker_post_only_fallback: {
                      revision: "6.14.2-MAKER-RACE-IOC-FALLBACK",
                      rejected_price: makerPrice,
                      reason: message,
                      attempt_ev_lower_bound_bps: finite(
                        position.metadata?.lob_signal?.attempt_ev_lower_bound_bps,
                      ),
                      conditional_ev_lower_bound_bps: finite(
                        position.metadata?.lob_signal?.conditional_ev_lower_bound_bps,
                      ),
                      spread_bps: spreadBps,
                      routed_at: new Date().toISOString(),
                    },
                  },
                });
                position = { ...position, ...(rows[0] || {}) };
                await event(
                  "MAKER_POST_ONLY_RACE_IOC_FALLBACK",
                  `${exchange}:${candidate.market} post-only race; continuing through verified IOC path`,
                  {
                    error: message,
                    rejected_price: makerPrice,
                    spread_bps: spreadBps,
                    attempt_ev_lower_bound_bps: finite(
                      position.metadata?.lob_signal?.attempt_ev_lower_bound_bps,
                    ),
                    conditional_ev_lower_bound_bps: finite(
                      position.metadata?.lob_signal?.conditional_ev_lower_bound_bps,
                    ),
                  },
                  { cycleId, positionId: position.id, orderId: makerOrderRow.id, level: "INFO" },
                );
                // Deterministic exchange rejection means no maker order exists. Fall through to
                // the existing order_test + IOC limit route below; no duplicate can be created.
              } else {
                await patch("trading_positions", `id=eq.${position.id}`, {
                  state: "CANCELLED",
                  reserved_quote: 0,
                  reserved_quantity: 0,
                  reservation_expires_at: null,
                  close_reason: "MAKER_ENTRY_REJECTED",
                  closed_at: new Date().toISOString(),
                });
                await event("MAKER_ENTRY_REJECTED", `${exchange}:${candidate.market} maker entry rejected`, {
                  error: message,
                  price: makerPrice,
                }, { cycleId, positionId: position.id, level: "WARNING" });
                return { entered: false, exchange, market: candidate.market, reason: message };
              }
            }
          '''.replace('          ', '')
          if old not in text:
            raise SystemExit('maker catch patch anchor unavailable')
          text = text.replace(old, new, 1)

          text = text.replace(
            '// Trading-booooo v6.13.0-REALIZED-EDGE-PROFIT-RETENTION',
            '// Trading-booooo v6.14.2-MOMENTUM-EXECUTION',
            1,
          )
          text = text.replace(
            'const VERSION = "6.13.0-REALIZED-EDGE-PROFIT-RETENTION";',
            'const VERSION = "6.14.2-MOMENTUM-EXECUTION";',
            1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source integration
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-autotrader/index.ts
          git commit -m "fix(v6.14.2): preserve positive-EV momentum after post-only race"
          git push
