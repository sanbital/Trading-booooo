name: Patch Upbit Pre-T1 FOK v7.6.16

on:
  push:
    branches: [opt/upbit-fok-v7616]
    paths:
      - "ops/patch-upbit-fok-v7616.py"
      - ".github/workflows/patch-upbit-fok-v7616.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: opt/upbit-fok-v7616
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact patch
        run: python ops/patch-upbit-fok-v7616.py
      - name: Format and validate
        run: |
          set -euo pipefail
          deno fmt supabase/functions/market-autotrader/index.ts
          deno test supabase/functions/market-autotrader/executable-exit.test.ts
          deno test supabase/functions/market-autotrader/spot-exit-policy.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno check supabase/functions/market-autotrader/index.ts
          grep -q 'const upbitPreT1ProfitProtection = position.exchange === "upbit"' supabase/functions/market-autotrader/index.ts
          grep -q 'UPBIT_PRE_T1_PROFIT_PROTECTION_FOK_NOT_FILLED' supabase/functions/market-autotrader/index.ts
          grep -q 'UPBIT_PRE_T1_PROFIT_PROTECTION_GUARD_BREACH' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES_RECOVERY_NET_POSITIVE_EXIT' supabase/functions/market-autotrader/index.ts
          grep -q 'LATE_RECOVERY_DRAWDOWN_33_EXIT' supabase/functions/market-autotrader/index.ts
      - name: Commit patched runtime
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add supabase/functions/market-autotrader/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: enforce Upbit pre-T1 protection with FOK re-quote v7.6.16 [skip ci]"
          git push origin HEAD:opt/upbit-fok-v7616
