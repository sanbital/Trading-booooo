name: Leader10 monthly cost and private archive release
on:
  push:
    branches: [main]
    paths: [deployment-evidence/leader20-capacity-request.json]
permissions:
  contents: read
concurrency:
  group: deploy-v10-lane-executor
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Test all production contracts
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git diff --check
          npm install --prefix "$RUNNER_TEMP/tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/tests/node_modules/@electric-sql/pglite/dist/index.js"
          node ops/dynamic-flow/run-tests.mjs > release-evidence/tests.tap
          deno check --no-config supabase/functions/doa-capture-ingest/index.ts supabase/functions/v10-lane-executor/index.ts supabase/functions/v10-lane-signal-generator/index.ts supabase/functions/self-evolution-worker/index.ts
          deno task test > release-evidence/deno-tests.txt
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - name: Guard baseline, preserve rollback, deploy existing functions and verify source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = etaajwpernzrcdrifdnw
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-before.json
          node --input-type=module -e 'import fs from "node:fs";let x=JSON.parse(fs.readFileSync("release-evidence/functions-before.json"));x=x.functions??x;const r=JSON.parse(fs.readFileSync("deployment-evidence/leader20-capacity-request.json"));if(r.monthly_ai_usd!==40||r.daily_ai_usd!==1.25||r.activate_strategy||r.validation_orders)throw Error("SCOPE");for(const [slug,version]of Object.entries(r.expected_versions)){const f=x.find(f=>f.slug===slug);if(f?.version!==version||f.verify_jwt!==false||f.status!=="ACTIVE")throw Error("CONCURRENT_DEPLOY:"+slug);}'
          for slug in doa-capture-ingest v10-lane-executor v10-lane-signal-generator self-evolution-worker; do
            mkdir -p "release-evidence/before-$slug" "release-evidence/after-$slug"
            supabase functions download "$slug" --project-ref "$SUPABASE_PROJECT_REF" --use-api --workdir "$PWD/release-evidence/before-$slug"
            supabase functions deploy "$slug" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
            supabase functions download "$slug" --project-ref "$SUPABASE_PROJECT_REF" --use-api --workdir "$PWD/release-evidence/after-$slug"
            node ops/gpt-final-review/verify-bundle-parity.mjs "release-evidence/after-$slug" . "$slug" > "release-evidence/parity-$slug.json"
          done
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > release-evidence/functions-after.json
      - name: Verify private archive roundtrip and existing Fly resource floor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_BINANCE_APP_NAME: ${{ secrets.FLY_BINANCE_APP_NAME }}
        run: node ops/leader20/capacity-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leader20-monthly-capacity
          path: release-evidence
          retention-days: 7
