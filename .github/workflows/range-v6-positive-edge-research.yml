name: RANGE V6 Positive Edge Research

on:
  push:
    branches:
      - research/range-v6-positive-edge-20260829
    paths:
      - ops/range-v6-positive-edge-trigger.txt

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: research/range-v6-positive-edge-20260829
          fetch-depth: 0

      - name: Apply precommitted RANGE V6 patch
        run: |
          set -euo pipefail
          python scripts/research_range_v6_patch.py
          python scripts/research_range_v6_fix1.py

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and test full V5/V6 research engine
        run: |
          set -euo pipefail
          deno fmt supabase/functions/regime-router-v5-research
          deno test supabase/functions/regime-router-v5-research/*.test.ts
          deno check supabase/functions/regime-router-v5-research/index.ts
          grep -q 'REGIME_ROUTER_V6_RANGE_EDGE_SCORE_15M_120D_RSWF' supabase/functions/regime-router-v5-research/types.ts
          grep -q 'V6_RANGE_SHORT_EDGE' supabase/functions/regime-router-v5-research/strategies.ts
          grep -q 'RANGE_DOWN_CYCLE' supabase/functions/regime-router-v5-research/tactical.ts

      - name: Commit tested research revision
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/regime-router-v5-research
          if git diff --cached --quiet; then
            echo 'No research changes to commit'
          else
            git commit -m 'research: implement RANGE V6 scored two-sided mean reversion'
            git push origin HEAD:research/range-v6-positive-edge-20260829
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy research function only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          supabase functions deploy regime-router-v5-research --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
