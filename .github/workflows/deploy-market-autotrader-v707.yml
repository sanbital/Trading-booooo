name: Deploy pre-breakout burst strategy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/market-v2-signal/**"
      - "supabase/functions/market-regime-observer/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/20260802151000_prebreakout_burst_entry_exit_policy.sql"
      - "supabase/migrations/20260810010000_binance_futures_lane_v760.sql"
      - "supabase/migrations/20260810133000_protected_trailing_exit_v761.sql"
      - "supabase/migrations/20260811090700_first_tranche_recovery_exit_v765.sql"
      - "supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql"
      - "supabase/migrations/20260821110000_p10_live_cutover.sql"
      - "supabase/migrations/20260823213500_enable_s37_combined_long_short.sql"
      - "supabase/migrations/20260823220000_document_s096_short_cutover.sql"
      - "supabase/migrations/20260824013500_p10_market_risk_overlay.sql"
      - "supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql"
      - "supabase/migrations/20260824054500_confirm_emergency_liquidation.sql"
      - "supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql"
      - "supabase/migrations/20260827104008_binance_futures_margin_40_usdt.sql"
      - "supabase/migrations/20260829120027_p10_production_regime_router_v3_validation_registry.sql"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/market-v2-signal/**"
      - "supabase/functions/market-regime-observer/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/20260810010000_binance_futures_lane_v760.sql"
      - "supabase/migrations/20260810133000_protected_trailing_exit_v761.sql"
      - "supabase/migrations/20260811090700_first_tranche_recovery_exit_v765.sql"
      - "supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql"
      - "supabase/migrations/20260821110000_p10_live_cutover.sql"
      - "supabase/migrations/20260823213500_enable_s37_combined_long_short.sql"
      - "supabase/migrations/20260823220000_document_s096_short_cutover.sql"
      - "supabase/migrations/20260824013500_p10_market_risk_overlay.sql"
      - "supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql"
      - "supabase/migrations/20260824054500_confirm_emergency_liquidation.sql"
      - "supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql"
      - "supabase/migrations/20260827104008_binance_futures_margin_40_usdt.sql"
      - "supabase/migrations/20260829120027_p10_production_regime_router_v3_validation_registry.sql"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prebreakout-burst
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate strategy invariants
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/_shared/lob/minute-entry-gate.ts \
            supabase/functions/_shared/lob/minute-entry-market.ts \
            supabase/functions/_shared/lob/minute-entry-gate.test.ts \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/_shared/p10-policy.ts \
            supabase/functions/_shared/p10-policy.test.ts \
            supabase/functions/_shared/futures-short-safety.ts \
            supabase/functions/_shared/futures-short-safety.test.ts \
            supabase/functions/_shared/s37-short-policy.ts \
            supabase/functions/_shared/s37-short-policy.test.ts \
            supabase/functions/_shared/s096-short-policy.ts \
            supabase/functions/_shared/s096-short-policy.test.ts \
            supabase/functions/_shared/p10-market-risk.ts \
            supabase/functions/_shared/p10-market-risk.test.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-v2-signal/index.ts \
            supabase/functions/market-autotrader/manual-position-import.ts \
            supabase/functions/market-autotrader/manual-position-import.test.ts \
            supabase/functions/market-autotrader/executable-exit.ts \
            supabase/functions/market-autotrader/executable-exit.test.ts \
            supabase/functions/market-autotrader/spot-exit-policy.ts \
            supabase/functions/market-autotrader/spot-exit-policy.test.ts \
            supabase/functions/market-autotrader/split-stop-policy.test.ts \
            supabase/functions/market-autotrader/futures-exit-policy.ts \
            supabase/functions/market-autotrader/futures-exit-policy.test.ts \
            supabase/functions/market-autotrader/futures-snapshot.ts \
            supabase/functions/market-autotrader/futures-snapshot-reconcile.test.ts \
            supabase/functions/market-autotrader/monitor-concurrency.ts \
            supabase/functions/market-autotrader/monitor-concurrency.test.ts \
            supabase/functions/market-autotrader/p10-monitor-cadence.ts \
            supabase/functions/market-autotrader/p10-monitor-cadence.test.ts \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.ts \
            supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-exit-reconciliation.ts \
            supabase/functions/market-autotrader/p10-exit-durable-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-exit-preflight.ts \
            supabase/functions/market-autotrader/p10-exit-preflight.test.ts \
            supabase/functions/market-autotrader/p10-regime-router-v3.test.ts \
            supabase/functions/market-autotrader/emergency-liquidation-safety.test.ts \
            supabase/functions/market-autotrader/futures-lane.test.ts \
            supabase/functions/market-autotrader/combined-long-s096-short.test.ts
          deno test supabase/functions/_shared/lob/minute-entry-gate.test.ts
          deno test supabase/functions/market-autotrader/manual-position-import.test.ts
          deno test supabase/functions/market-autotrader/executable-exit.test.ts
          deno test \
            supabase/functions/market-autotrader/spot-exit-policy.test.ts \
            supabase/functions/market-autotrader/split-stop-policy.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno test --allow-read \
            supabase/functions/market-autotrader/futures-snapshot-reconcile.test.ts
          deno test supabase/functions/market-autotrader/monitor-concurrency.test.ts
          deno test supabase/functions/market-autotrader/p10-monitor-cadence.test.ts
          deno test supabase/functions/market-autotrader/p10-entry-reconciliation.test.ts
          deno test --allow-read \
            supabase/functions/market-autotrader/p10-exit-durable-reconciliation.test.ts \
            supabase/functions/market-autotrader/p10-exit-preflight.test.ts \
            supabase/functions/market-autotrader/p10-regime-router-v3.test.ts
          deno test --allow-read \
            supabase/functions/market-autotrader/emergency-liquidation-safety.test.ts
          deno test --allow-read supabase/functions/market-autotrader/futures-lane.test.ts
          deno test supabase/functions/_shared/p10-policy.test.ts
          deno test --allow-read \
            supabase/functions/_shared/futures-short-safety.test.ts \
            supabase/functions/_shared/s37-short-policy.test.ts \
            supabase/functions/_shared/s096-short-policy.test.ts
          deno test supabase/functions/_shared/p10-market-risk.test.ts
          deno test --allow-read \
            supabase/functions/market-autotrader/combined-long-s096-short.test.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-v2-signal/index.ts
          deno check supabase/functions/market-regime-observer/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          engine_version="$(sed -n 's/.*export const ENGINE_VERSION = "\([^"]*\)".*/\1/p' \
            supabase/functions/market-scanner/engine.ts)"
          test -n "$engine_version"
          grep -q "const VERSION = \"${engine_version}\";" \
            supabase/functions/market-autotrader/index.ts
          grep -q "const VERSION = \"${engine_version}\";" gateway/server.mjs
          grep -q 'ORDER_GATEWAY_PROTOCOL_VERSION = "8.0.0-P10-DONCHIAN-SLOW4R"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'PREVIOUS_ENGINE_VERSION = "8.0.0-P10-DONCHIAN-SLOW4R"' \
            gateway/server.mjs
          gate_version="$(sed -n 's/.*MINUTE_ENTRY_GATE_VERSION = "\([^"]*\)".*/\1/p' \
            supabase/functions/_shared/lob/minute-entry-gate.ts)"
          test -n "$gate_version"
          grep -q "$gate_version" supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'M1_UPPER_BAND_NOT_TOUCHED' supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'BUY_PRESSURE_NOT_CONFIRMED' supabase/functions/_shared/lob/entry.ts
          grep -q 'const DEFAULT_DYNAMIC_OBSERVATION_MS = 15_000' supabase/functions/market-scanner/index.ts
          grep -q 'SPOT-PROTECTED-TRAIL-TP5-SL4-FLOOR3-TRAIL1P5-RECOVERY180M-V2' supabase/functions/market-autotrader/index.ts
          grep -q 'spotSplitExitDecision' supabase/functions/market-autotrader/index.ts
          grep -q 'first_stop_loss_pct: -4' supabase/functions/market-autotrader/index.ts
          grep -q 'residual_profit_floor_pct: 3' supabase/functions/market-autotrader/index.ts
          grep -q 'residual_trailing_drawdown_pct: 1.5' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "RESIDUAL_PROTECTED_TRAIL_EXIT"' supabase/functions/market-autotrader/index.ts
          grep -q 'STALE_RECOVERY_NET_POSITIVE_EXIT_180M' supabase/functions/market-autotrader/index.ts
          grep -q 'executable_net_allowed: true' supabase/functions/market-autotrader/executable-exit.ts
          ! grep -q 'halfHoldRecoveryExitDecision' supabase/functions/market-autotrader/index.ts
          ! grep -q 'hard_stop_return_pct: -2' supabase/functions/market-autotrader/index.ts
          ! grep -q 'hard_stop_after_seconds: 180' supabase/functions/market-autotrader/index.ts
          ! grep -q 'stop_bps: 300' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_UPPER_REENTRY_CONFIRMED' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_RECLAIM_FAILED' supabase/functions/market-autotrader/index.ts
          grep -q 'ORDERBOOK_COLLAPSE' supabase/functions/market-autotrader/index.ts
          grep -q '7.6.0-BINANCE-FUTURES' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES-ROE15-SL12-RECOVERY3M-FLOOR9-TRAIL4P5-GIVEBACK180M-V3' supabase/functions/market-autotrader/index.ts
          grep -q 'futuresRecoveryState({' supabase/functions/market-autotrader/index.ts
          grep -q 'trigger_reason: "FUTURES_3M_NET_NONPOSITIVE"' supabase/functions/market-autotrader/index.ts
          grep -q 'position.t1_completed !== true' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "FUTURES_RECOVERY_NET_POSITIVE_EXIT"' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "FUTURES_RESIDUAL_PROTECTED_TRAIL_EXIT"' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "FUTURES_STALE_GIVEBACK_EXIT_180M"' supabase/functions/market-autotrader/index.ts
          grep -q 'action === "EMERGENCY"' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES_MIN_ENTRY_MARGIN_USDT = 40' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualProfitFloorRoePct: 9' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualTrailingDrawdownRoePct: 4.5' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'recoveryLatchAfterSeconds: 180' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'staleGivebackAfterSeconds: 180 \* 60' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'staleGivebackMinPeakRoePct: 2.13815789473683' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'SPOT_POLICY_TRIGGERS_NOT_ISOLATED_FROM_FUTURES' \
            supabase/migrations/20260810010000_binance_futures_lane_v760.sql
          grep -q 'drop trigger if exists zzzzzzz_trading_positions_spot_split_stop_v762' \
            supabase/migrations/20260810133000_protected_trailing_exit_v761.sql
          grep -q 'STALE_RECOVERY_REQUIRES_POSITIVE_NET' \
            supabase/migrations/20260811090700_first_tranche_recovery_exit_v765.sql
          grep -q 'FUTURES_RECOVERY_NET_POSITIVE_EXIT' \
            supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          grep -q 'FUTURES_STALE_GIVEBACK_EXIT_180M' \
            supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          grep -q 'recovery_latch_after_seconds' \
            supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          grep -q 'coalesce(new.t1_completed, false)' \
            supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          grep -q "upper(coalesce(new.purpose, '')) = 'EMERGENCY'" \
            supabase/migrations/20260818083500_futures_recovery_3m_state_machine.sql
          ! grep -q 'const exp1ArmWidthsBps' supabase/functions/market-autotrader/index.ts
          grep -q 'P10_STRATEGY_KEY' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'P10_DONCHIAN_BREAKOUT_E10_SLOW_4R' \
            supabase/functions/_shared/p10-policy.ts
          grep -q 'P10_SLOW_4R' supabase/migrations/20260821110000_p10_live_cutover.sql
          grep -q 'binance_futures_short_enabled' \
            supabase/migrations/20260823213500_enable_s37_combined_long_short.sql
          grep -q 'S096-LIVE-1.0.0' \
            supabase/migrations/20260823220000_document_s096_short_cutover.sql
          grep -q 'p10_market_risk_partial_at' \
            supabase/migrations/20260824013500_p10_market_risk_overlay.sql
          grep -q 'p10_market_risk_exit_at' \
            supabase/migrations/20260824013500_p10_market_risk_overlay.sql
          grep -q 'positions: futuresSnapshot.positions' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'positions_complete: futuresSnapshot.complete' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'positions_revision: futuresSnapshot.complete' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'monitor_path: "P10_FAST_2S"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'mapConcurrentOrdered(open' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'action: "p10_quotes"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'action: "p10_portfolio"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'P10_SLOW_MAINTENANCE_BATCH_FAILED' \
            supabase/functions/market-autotrader/index.ts
          grep -q '8.0.1-DIRECTION-AWARE-FUTURES-ZERO-SNAPSHOT-RECONCILE' \
            supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql
          grep -q '1-DIRECTIONAL-FUTURES-POSITIONS' \
            supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql
          grep -q 'guard_p10_terminal_state_with_entry_execution' \
            supabase/migrations/20260826094500_p10_entry_reconciliation_invariants.sql
          grep -q "set search_path = ''" \
            supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql
          grep -q 'from public, anon, authenticated' \
            supabase/migrations/20260824031619_direction_aware_futures_snapshot_reconcile.sql

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - name: Wait for production database policy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          test -n "${SUPABASE_DB_URL}"
          for attempt in $(seq 1 40); do
            ready="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select
                exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_settings'
                    and column_name = 'binance_futures_enabled'
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_positions'
                    and column_name = 'leverage'
                )
                and exists (
                  select 1 from public.trading_ops_invariants
                  where id = 1
                    and canonical_engine_revision = '7.6.0-BINANCE-FUTURES'
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_settings'
                    and column_name = 'emergency_liquidation_started_at'
                    and data_type = 'timestamp with time zone'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'latch_p10_entry_safety'
                    and position('FOR UPDATE' in upper(pg_get_functiondef(p.oid))) > 0
                    and position('TEMP_SAFETY_' in pg_get_functiondef(p.oid)) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'guard_residual_sell_order_v751'
                    and position('FUTURES_RECOVERY_NET_POSITIVE_EXIT' in pg_get_functiondef(p.oid)) > 0
                    and position('FUTURES_STALE_GIVEBACK_EXIT_180M' in pg_get_functiondef(p.oid)) > 0
                    and position('FUTURES_RECOVERY_REQUIRES_POSITIVE_NET' in pg_get_functiondef(p.oid)) > 0
                    and position('v_held_seconds < 180' in pg_get_functiondef(p.oid)) > 0
                    and position('pending_exit_reason' in pg_get_functiondef(p.oid)) > 0
                    and position('EMERGENCY' in pg_get_functiondef(p.oid)) > 0
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'enforce_residual_exit_position_policy_v751'
                    and position('recovery_latch_after_seconds' in pg_get_functiondef(p.oid)) > 0
                    and position('coalesce(new.t1_completed, false)' in pg_get_functiondef(p.oid)) > 0
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_positions'
                    and column_name = 'position_side'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'apply_p10_entry_order'
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_settings'
                    and column_name = 'binance_futures_short_enabled'
                )
                and not exists (
                  select 1 from pg_constraint
                  where conrelid = 'public.market_regime_observations'::regclass
                    and conname = 'market_regime_observations_trading_influence_check'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'apply_p10_exit_order'
                    and position('p10_market_risk_partial_at' in pg_get_functiondef(p.oid)) > 0
                    and position('p10_market_risk_exit_at' in pg_get_functiondef(p.oid)) > 0
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_account_snapshots'
                    and column_name = 'positions'
                    and data_type = 'jsonb'
                    and column_default is null
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_account_snapshots'
                    and column_name = 'positions_complete'
                    and data_type = 'boolean'
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_account_snapshots'
                    and column_name = 'positions_revision'
                    and data_type = 'text'
                    and column_default is null
                )
                and exists (
                  select 1
                  from pg_constraint c
                  where c.conrelid = 'public.trading_account_snapshots'::regclass
                    and c.conname = 'trading_account_snapshots_positions_shape_ck'
                    and c.convalidated
                    and position(
                      '1-DIRECTIONAL-FUTURES-POSITIONS'
                      in pg_get_constraintdef(c.oid)
                    ) > 0
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'reconcile_futures_zero_positions_from_snapshots'
                    and position(
                      '8.0.1-DIRECTION-AWARE-FUTURES-ZERO-SNAPSHOT-RECONCILE'
                      in pg_get_functiondef(p.oid)
                    ) > 0
                    and position('positions_complete' in pg_get_functiondef(p.oid)) > 0
                    and position('position_side' in pg_get_functiondef(p.oid)) > 0
                    and position(
                      '1-DIRECTIONAL-FUTURES-POSITIONS'
                      in pg_get_functiondef(p.oid)
                    ) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_trigger t
                  where t.tgrelid = 'public.trading_account_snapshots'::regclass
                    and t.tgname = 'trading_account_snapshots_futures_zero_reconcile'
                    and not t.tgisinternal
                    and t.tgenabled <> 'D'
                    and position(
                      'reconcile_futures_zero_positions_from_snapshots'
                      in pg_get_triggerdef(t.oid)
                    ) > 0
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'guard_emergency_liquidation_transition'
                    and position(
                      'trading.emergency_liquidation_confirmation'
                      in pg_get_functiondef(p.oid)
                    ) > 0
                    and position(
                      'trading.emergency_liquidation_clearance'
                      in pg_get_functiondef(p.oid)
                    ) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'request_emergency_liquidation'
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'complete_emergency_liquidation'
                    and position('ENTRY_PENDING' in pg_get_functiondef(p.oid)) > 0
                    and position('RECONCILIATION_FAILED' in pg_get_functiondef(p.oid)) > 0
                    and position('v_pending_close_orders' in pg_get_functiondef(p.oid)) > 0
                    and position('emergency_liquidation_started_at' in pg_get_functiondef(p.oid)) > 0
                    and position('o.requested_at' in pg_get_functiondef(p.oid)) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_trigger t
                  where t.tgrelid = 'public.trading_settings'::regclass
                    and t.tgname = 'trg_guard_emergency_liquidation_transition'
                    and not t.tgisinternal
                    and t.tgenabled <> 'D'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'guard_p10_live_entry_settings'
                    and position('FOR SHARE' in upper(pg_get_functiondef(p.oid))) > 0
                    and position('pause_new_entries' in pg_get_functiondef(p.oid)) > 0
                    and position('emergency_liquidation' in pg_get_functiondef(p.oid)) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_trigger t
                  where t.tgrelid = 'public.trading_positions'::regclass
                    and t.tgname = 'trg_guard_p10_live_entry_settings'
                    and not t.tgisinternal
                    and t.tgenabled <> 'D'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'stage_p10_executed_entry_reconciliation'
                    and position('P10_ENTRY_EXECUTION_MONOTONIC_V2' in pg_get_functiondef(p.oid)) > 0
                    and position('TRADING_FILLS' in upper(pg_get_functiondef(p.oid))) > 0
                    and position('FOR UPDATE' in upper(pg_get_functiondef(p.oid))) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'guard_p10_terminal_state_with_entry_execution'
                    and position('TRADING_FILLS' in upper(pg_get_functiondef(p.oid))) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1 from pg_trigger t
                  where t.tgrelid = 'public.trading_positions'::regclass
                    and t.tgname = 'trg_guard_p10_terminal_state_with_entry_execution'
                    and t.tgfoid = 'public.guard_p10_terminal_state_with_entry_execution()'::regprocedure
                    and not t.tgisinternal and t.tgenabled <> 'D'
                )
                and exists (
                  select 1 from pg_trigger t
                  where t.tgrelid = 'public.trading_orders'::regclass
                    and t.tgname = 'aaa_stage_p10_executed_order_reconciliation'
                    and t.tgfoid = 'public.stage_p10_executed_entry_reconciliation()'::regprocedure
                    and position('BEFORE' in pg_get_triggerdef(t.oid)) > 0
                    and not t.tgisinternal and t.tgenabled <> 'D'
                )
                and exists (
                  select 1 from pg_trigger t
                  where t.tgrelid = 'public.exchange_trade_fills'::regclass
                    and t.tgname = 'aaa_stage_p10_entry_fill_reconciliation'
                    and t.tgfoid = 'public.stage_p10_executed_entry_reconciliation()'::regprocedure
                    and position('BEFORE' in pg_get_triggerdef(t.oid)) > 0
                    and not t.tgisinternal and t.tgenabled <> 'D'
                )
                and exists (
                  select 1 from pg_trigger t
                  where t.tgrelid = 'public.trading_fills'::regclass
                    and t.tgname = 'aaa_stage_p10_trading_fill_reconciliation'
                    and t.tgfoid = 'public.stage_p10_executed_entry_reconciliation()'::regprocedure
                    and position('BEFORE' in pg_get_triggerdef(t.oid)) > 0
                    and not t.tgisinternal and t.tgenabled <> 'D'
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'apply_p10_entry_order'
                    and position('CLOSED_AT = NULL' in upper(pg_get_functiondef(p.oid))) > 0
                    and position('RECONCILIATION_FAILED' in upper(pg_get_functiondef(p.oid))) > 0
                    and position('IS NOT IN ENTRY RECONCILIATION' in upper(pg_get_functiondef(p.oid))) > 0
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'resume_p10_safely'
                    and p.prosecdef
                    and position('TERMINAL_ENTRY_EXECUTION_EXISTS' in pg_get_functiondef(p.oid)) > 0
                    and position('FOR UPDATE' in upper(pg_get_functiondef(p.oid))) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                );
            ")" || ready="f"
            if [ "${ready}" = "t" ]; then
              echo "Production database policy is ready"
              exit 0
            fi
            echo "Waiting for production database policy (${attempt}/40)"
            sleep 15
          done
          echo "::error::Production database policy was not ready before Edge Function deployment"
          exit 1

      - name: Wait for 40-USDT futures entry policy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            ready="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select
                exists (
                  select 1
                  from pg_constraint c
                  where c.conrelid = 'public.trading_settings'::regclass
                    and c.conname = 'trading_settings_binance_futures_fixed_margin_ck'
                    and position(
                      'binance_futures_allocation_usdt >= (40)'
                      in pg_get_constraintdef(c.oid)
                    ) > 0
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'guard_order_position_venue_v760'
                    and position(
                      'FUTURES_ENTRY_MARGIN_BELOW_40_USDT'
                      in pg_get_functiondef(p.oid)
                    ) > 0
                );
            ")"
            if [ "${ready}" = "t" ]; then
              echo "40-USDT futures entry policy is ready"
              exit 0
            fi
            echo "Waiting for 40-USDT futures entry policy (${attempt}/40)"
            sleep 15
          done
          echo "::error::40-USDT futures entry policy was not ready before Edge deployment"
          exit 1

      - name: Wait for production Regime Router v3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            ready="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select
                (
                  select count(*) = 1
                  from public.p10_regime_router_validations
                  where router_revision = 'P10-PRODUCTION-REGIME-ROUTER-v3'
                    and validation_status = 'REJECTED_NO_ROBUST_EDGE'
                    and research_job_id is not null
                    and validation_metrics->>'research_job_link_status' = 'EXACT_UNIQUE_JOB_MATCH'
                    and validation_metrics->>'no_robust_edge_found' = 'true'
                    and validation_metrics->'robust_candidates' = '[]'::jsonb
                )
                and (
                  select count(*) = 5 and count(*) filter (where entry_enabled) = 2
                  from public.p10_regime_router_lanes
                  where router_revision = 'P10-PRODUCTION-REGIME-ROUTER-v3'
                )
                and not exists (
                  select 1
                  from public.p10_regime_router_lanes
                  where router_revision = 'P10-PRODUCTION-REGIME-ROUTER-v3'
                    and router_state in ('RANGE_UP_CYCLE', 'BEAR_REBOUND', 'BEAR_REBREAK')
                    and entry_enabled
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'claim_p10_signal'
                    and position('P10-PRODUCTION-REGIME-ROUTER-v3' in pg_get_functiondef(p.oid)) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
                and exists (
                  select 1
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname = 'resolve_p10_production_regime_route_v3'
                    and position('NO_TRADE' in pg_get_functiondef(p.oid)) > 0
                    and position('MISSING_MARKET_V5_15M_AND_COMPLETED_5M_CONFIRMATION' in pg_get_functiondef(p.oid)) > 0
                    and not has_function_privilege('anon', p.oid, 'EXECUTE')
                    and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
                    and has_function_privilege('service_role', p.oid, 'EXECUTE')
                );
            ")" || ready="f"
            if [ "${ready}" = "t" ]; then
              echo "Production Regime Router v3 is ready"
              exit 0
            fi
            echo "Waiting for production Regime Router v3 (${attempt}/40)"
            sleep 15
          done
          echo "::error::Production Regime Router v3 was not ready before Edge deployment"
          exit 1

      - name: Deploy market executor and producers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Consumer/executor first: no producer can emit a newly executable revision
          # before the exact whitelist and exit-risk handling are live.
          for fn in market-autotrader market-regime-observer market-v2-signal market-scanner; do
            supabase functions deploy "$fn" --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          done
