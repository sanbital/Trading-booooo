name: Deploy market-autotrader v7.1.7

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/_shared/lob/**"
      - "scripts/apply_v715_runtime_hotfix.py"
      - "scripts/apply_v716_target_balance_hotfix.py"
      - "scripts/apply_v717_final_exit_policy.py"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/_shared/lob/**"
      - "scripts/apply_v715_runtime_hotfix.py"
      - "scripts/apply_v716_target_balance_hotfix.py"
      - "scripts/apply_v717_final_exit_policy.py"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-market-autotrader-v717
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build and validate v7.1.7 deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v715_runtime_hotfix.py
          python3 scripts/apply_v716_target_balance_hotfix.py
          python3 scripts/apply_v717_final_exit_policy.py
          deno fmt \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/exit.ts
          grep -q 'const VERSION = "7.1.7-FINAL-EXIT-POLICY";' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXIT_BLOCKED_MIN_HOLD' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'POSITIVE_NET_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'HARD_STOP_MINUS_3_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'lob_soft_exit_history' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'guardedNetReturnPct <= -3' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'TARGET_NET_GUARD_BLOCKED' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'time_in_force: "FOK"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXCHANGE_BALANCE_ZERO_RECONCILED' \
            supabase/functions/market-autotrader/index.ts
          deno check supabase/functions/market-autotrader/index.ts

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build exact v7.1.7 production artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v715_runtime_hotfix.py
          python3 scripts/apply_v716_target_balance_hotfix.py
          python3 scripts/apply_v717_final_exit_policy.py
          deno fmt \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/_shared/lob/exit.ts
          deno check supabase/functions/market-autotrader/index.ts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy market-autotrader v7.1.7
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          supabase functions deploy market-autotrader \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

# deployment trigger: 2026-08-01 13:25 KST v7.1.7 final exit policy
# pull-request validation trigger: 2026-08-01 13:31 KST
