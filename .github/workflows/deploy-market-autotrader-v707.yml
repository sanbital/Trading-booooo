name: Deploy pre-breakout burst strategy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/20260802151000_prebreakout_burst_entry_exit_policy.sql"
      - "supabase/migrations/20260810010000_binance_futures_lane_v760.sql"
      - "supabase/migrations/20260810133000_protected_trailing_exit_v761.sql"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/20260810010000_binance_futures_lane_v760.sql"
      - "supabase/migrations/20260810133000_protected_trailing_exit_v761.sql"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prebreakout-burst
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate strategy invariants
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/_shared/lob/minute-entry-gate.ts \
            supabase/functions/_shared/lob/minute-entry-market.ts \
            supabase/functions/_shared/lob/minute-entry-gate.test.ts \
            supabase/functions/_shared/lob/types.ts \
            supabase/functions/_shared/lob/entry.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/market-autotrader/manual-position-import.ts \
            supabase/functions/market-autotrader/manual-position-import.test.ts \
            supabase/functions/market-autotrader/spot-exit-policy.ts \
            supabase/functions/market-autotrader/spot-exit-policy.test.ts \
            supabase/functions/market-autotrader/split-stop-policy.test.ts \
            supabase/functions/market-autotrader/futures-exit-policy.ts \
            supabase/functions/market-autotrader/futures-exit-policy.test.ts \
            supabase/functions/market-autotrader/futures-lane.test.ts
          deno test supabase/functions/_shared/lob/minute-entry-gate.test.ts
          deno test supabase/functions/market-autotrader/manual-position-import.test.ts
          deno test \
            supabase/functions/market-autotrader/spot-exit-policy.test.ts \
            supabase/functions/market-autotrader/split-stop-policy.test.ts
          deno test supabase/functions/market-autotrader/futures-exit-policy.test.ts
          deno test --allow-read supabase/functions/market-autotrader/futures-lane.test.ts
          deno check supabase/functions/market-scanner/index.ts
          deno check supabase/functions/market-autotrader/index.ts
          engine_version="$(sed -n 's/.*export const ENGINE_VERSION = "\([^"]*\)".*/\1/p' \
            supabase/functions/market-scanner/engine.ts)"
          test -n "$engine_version"
          grep -q "const VERSION = \"${engine_version}\";" \
            supabase/functions/market-autotrader/index.ts
          grep -q "const VERSION = \"${engine_version}\";" gateway/server.mjs
          gate_version="$(sed -n 's/.*MINUTE_ENTRY_GATE_VERSION = "\([^"]*\)".*/\1/p' \
            supabase/functions/_shared/lob/minute-entry-gate.ts)"
          test -n "$gate_version"
          grep -q "$gate_version" supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'M1_UPPER_BAND_NOT_TOUCHED' supabase/functions/_shared/lob/minute-entry-gate.ts
          grep -q 'BUY_PRESSURE_NOT_CONFIRMED' supabase/functions/_shared/lob/entry.ts
          grep -q 'const DEFAULT_DYNAMIC_OBSERVATION_MS = 15_000' supabase/functions/market-scanner/index.ts
          grep -q 'SPOT-PROTECTED-TRAIL-TP5-SL4-FLOOR3-TRAIL1P5-V1' supabase/functions/market-autotrader/index.ts
          grep -q 'spotSplitExitDecision' supabase/functions/market-autotrader/index.ts
          grep -q 'first_stop_loss_pct: -4' supabase/functions/market-autotrader/index.ts
          grep -q 'residual_profit_floor_pct: 3' supabase/functions/market-autotrader/index.ts
          grep -q 'residual_trailing_drawdown_pct: 1.5' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "RESIDUAL_PROTECTED_TRAIL_EXIT"' supabase/functions/market-autotrader/index.ts
          ! grep -q '"RECOVERY_NET_POSITIVE_EXIT"' supabase/functions/market-autotrader/index.ts
          ! grep -q 'halfHoldRecoveryExitDecision' supabase/functions/market-autotrader/index.ts
          ! grep -q 'hard_stop_return_pct: -2' supabase/functions/market-autotrader/index.ts
          ! grep -q 'hard_stop_after_seconds: 180' supabase/functions/market-autotrader/index.ts
          ! grep -q 'stop_bps: 300' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_UPPER_REENTRY_CONFIRMED' supabase/functions/market-autotrader/index.ts
          grep -q 'BB_RECLAIM_FAILED' supabase/functions/market-autotrader/index.ts
          grep -q 'ORDERBOOK_COLLAPSE' supabase/functions/market-autotrader/index.ts
          grep -q '7.6.0-BINANCE-FUTURES' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES-PROTECTED-TRAIL-ROE15-SL12-FLOOR9-TRAIL4P5-V1' supabase/functions/market-autotrader/index.ts
          grep -q 'decision.reason === "FUTURES_RESIDUAL_PROTECTED_TRAIL_EXIT"' supabase/functions/market-autotrader/index.ts
          grep -q 'FUTURES_MIN_ENTRY_MARGIN_USDT = 50' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualProfitFloorRoePct: 9' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'residualTrailingDrawdownRoePct: 4.5' \
            supabase/functions/market-autotrader/futures-exit-policy.ts
          grep -q 'SPOT_POLICY_TRIGGERS_NOT_ISOLATED_FROM_FUTURES' \
            supabase/migrations/20260810010000_binance_futures_lane_v760.sql
          grep -q 'drop trigger if exists zzzzzzz_trading_positions_spot_split_stop_v762' \
            supabase/migrations/20260810133000_protected_trailing_exit_v761.sql
          ! grep -q 'const exp1ArmWidthsBps' supabase/functions/market-autotrader/index.ts

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
      - name: Wait for v7.6 database schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          test -n "${SUPABASE_DB_URL}"
          for attempt in $(seq 1 40); do
            ready="$(psql "${SUPABASE_DB_URL}" -At --set=ON_ERROR_STOP=1 -c "
              select
                exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_settings'
                    and column_name = 'binance_futures_enabled'
                )
                and exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'trading_positions'
                    and column_name = 'leverage'
                )
                and exists (
                  select 1 from public.trading_ops_invariants
                  where id = 1
                    and canonical_engine_revision = '7.6.0-BINANCE-FUTURES'
                );
            ")"
            if [ "${ready}" = "t" ]; then
              echo "v7.6 database schema is ready"
              exit 0
            fi
            echo "Waiting for v7.6 database schema (${attempt}/40)"
            sleep 15
          done
          echo "::error::v7.6 database schema was not ready before Edge Function deployment"
          exit 1
      - name: Deploy scanner and autotrader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for fn in market-scanner market-autotrader; do
            supabase functions deploy "$fn" --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
          done
