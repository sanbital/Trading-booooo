name: Deploy executable-net integrity v7.2.3
# v7.2.3 is canonical source. No runtime patch chain may rewrite the validated artifact.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/**"
      - "gateway/**"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/**"
      - "gateway/**"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-executable-net-integrity-v723
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate canonical v7.2.3 deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/executable-exit.ts \
            supabase/functions/market-autotrader/entry-integrity.ts \
            supabase/functions/market-autotrader/heartbeat.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/_shared/lob/entry.ts \
            gateway/server.mjs
          grep -q 'const VERSION = "7.2.3-EXECUTABLE-NET-INTEGRITY";' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'ENGINE_VERSION = "7.2.3-EXECUTABLE-NET-INTEGRITY"' \
            supabase/functions/market-scanner/engine.ts
          grep -q 'const VERSION = "7.2.3-EXECUTABLE-NET-INTEGRITY";' gateway/server.mjs
          grep -q 'quoteExecutableNetExit' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'time_in_force: "FOK"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'failed_gate_count' \
            supabase/functions/market-autotrader/entry-integrity.ts
          grep -q 'NEGATIVE_TRADE_PRESSURE' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'SPOOF_WARNING' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'REWARD_RISK_FAILED' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'buildTradingHeartbeatPatch' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'ENGINE_VERSION_MISMATCH' gateway/server.mjs
          grep -q 'LOB_PREORDER_RECHECK_BLOCK' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'PREORDER_SUPPORT_EVAPORATION_CONFIRMED' \
            supabase/functions/_shared/lob/preorder.ts
          grep -q 'BID_SPOOF_CONFIRMED_BY_WEAK_FLOW' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'SUPPORT_BREAKDOWN_RISK' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'const EXTENDED_PER_MARKET_OBSERVATION_MS = 60_000;' \
            supabase/functions/market-scanner/index.ts
          grep -q 'lob:pre-180-target' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXIT_BLOCKED_PRE180_POLICY' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'EXIT_BLOCKED_MIN_HOLD' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'POSITIVE_NET_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'HARD_STOP_MINUS_2_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'HARD_STOP_MINUS_3_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'lob_soft_exit_history' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'lob_post180_recovery_shadow' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'LOB_POST180_SHADOW_SOFT_EXIT' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'mode: "SHADOW_ONLY"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'post180FailedReclaims >= 2' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'guardedNetReturnPct <= -2' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'guardedNetReturnPct <= -3' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'TARGET_NET_GUARD_BLOCKED' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'time_in_force: "FOK"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXCHANGE_BALANCE_ZERO_RECONCILED' \
            supabase/functions/market-autotrader/index.ts
          deno test --allow-env --allow-read \
            supabase/functions/_shared/lob/entry-risk.test.ts \
            supabase/functions/_shared/lob/preorder.test.ts \
            supabase/functions/market-autotrader/executable-exit.test.ts \
            supabase/functions/market-autotrader/entry-integrity.test.ts \
            supabase/functions/market-autotrader/heartbeat.test.ts \
            supabase/functions/market-autotrader/entry-admission.test.ts \
            supabase/functions/market-autotrader/core.test.ts
          node --check gateway/server.mjs
          node --test gateway/server.test.mjs
          deno check \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify exact canonical v7.2.3 production artifact
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-autotrader/executable-exit.ts \
            supabase/functions/market-autotrader/entry-integrity.ts \
            supabase/functions/market-autotrader/heartbeat.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-scanner/engine.ts \
            supabase/functions/_shared/lob/entry.ts \
            gateway/server.mjs
          deno check \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy scanner and autotrader v7.2.3
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          for fn in market-scanner market-autotrader; do
            supabase functions deploy "$fn" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --no-verify-jwt \
              --use-api
          done

# deployment trigger: 2026-08-01 13:25 KST v7.1.7 final exit policy
# pull-request validation trigger: 2026-08-01 13:54 KST
# recovery redeploy: 2026-08-01T06:13Z
# v7.1.8: allow protected targets and qualified LOB reversals before 180 seconds
# v7.1.9: preserve positive-net exit and collect post-180 recovery shadow outcomes
# v7.2.0: tighten the post-180 executable-net hard stop from -3% to -2%
# v7.2.3: executable full-depth FOK net exit, strict entry integrity, partial heartbeat writes
