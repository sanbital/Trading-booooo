name: Deploy LOB entry risk gates v7.2.2
# Base source stays 7.1.4-VOLATILITY-AWARE-EXIT; ordered runtime patches produce v7.2.2.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/lob/**"
      - "scripts/apply_v715_runtime_hotfix.py"
      - "scripts/apply_v716_target_balance_hotfix.py"
      - "scripts/fix_v716_patch_compat.py"
      - "scripts/fix_v717_patch_compat.py"
      - "scripts/apply_v717_final_exit_policy.py"
      - "scripts/apply_v718_pre180_exit_policy.py"
      - "scripts/apply_v719_post180_recovery_shadow.py"
      - "scripts/apply_v720_post180_minus2_hard_stop.py"
      - "scripts/apply_v722_lob_entry_risk_gates.py"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/functions/market-autotrader/**"
      - "supabase/functions/market-scanner/**"
      - "supabase/functions/_shared/lob/**"
      - "scripts/apply_v715_runtime_hotfix.py"
      - "scripts/apply_v716_target_balance_hotfix.py"
      - "scripts/fix_v716_patch_compat.py"
      - "scripts/fix_v717_patch_compat.py"
      - "scripts/apply_v717_final_exit_policy.py"
      - "scripts/apply_v718_pre180_exit_policy.py"
      - "scripts/apply_v719_post180_recovery_shadow.py"
      - "scripts/apply_v720_post180_minus2_hard_stop.py"
      - "scripts/apply_v722_lob_entry_risk_gates.py"
      - ".github/workflows/deploy-market-autotrader-v707.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lob-entry-risk-gates-v722
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build and validate v7.2.2 deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v715_runtime_hotfix.py
          python3 scripts/fix_v716_patch_compat.py
          python3 scripts/apply_v716_target_balance_hotfix.py
          python3 scripts/fix_v717_patch_compat.py
          python3 scripts/apply_v717_final_exit_policy.py
          python3 scripts/apply_v718_pre180_exit_policy.py
          python3 scripts/apply_v719_post180_recovery_shadow.py
          python3 scripts/apply_v720_post180_minus2_hard_stop.py
          python3 scripts/apply_v722_lob_entry_risk_gates.py
          deno fmt \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/_shared/lob/exit.ts
          grep -q 'const VERSION = "7.2.2-LOB-ENTRY-RISK-GATES";' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'LOB_PREORDER_RECHECK_BLOCK' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'PREORDER_SUPPORT_EVAPORATION_CONFIRMED' \
            supabase/functions/_shared/lob/preorder.ts
          grep -q 'BID_SPOOF_CONFIRMED_BY_WEAK_FLOW' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'SUPPORT_BREAKDOWN_RISK' \
            supabase/functions/_shared/lob/entry.ts
          grep -q 'const EXTENDED_PER_MARKET_OBSERVATION_MS = 60_000;' \
            supabase/functions/market-scanner/index.ts
          grep -q 'lob:pre-180-target' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXIT_BLOCKED_PRE180_POLICY' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'EXIT_BLOCKED_MIN_HOLD' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'POSITIVE_NET_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'HARD_STOP_MINUS_2_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'HARD_STOP_MINUS_3_AFTER_180S' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'lob_soft_exit_history' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'lob_post180_recovery_shadow' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'LOB_POST180_SHADOW_SOFT_EXIT' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'mode: "SHADOW_ONLY"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'post180FailedReclaims >= 2' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'guardedNetReturnPct <= -2' \
            supabase/functions/market-autotrader/index.ts
          ! grep -q 'guardedNetReturnPct <= -3' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'TARGET_NET_GUARD_BLOCKED' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'time_in_force: "FOK"' \
            supabase/functions/market-autotrader/index.ts
          grep -q 'EXCHANGE_BALANCE_ZERO_RECONCILED' \
            supabase/functions/market-autotrader/index.ts
          deno test --allow-env --allow-read \
            supabase/functions/_shared/lob/entry-risk.test.ts \
            supabase/functions/_shared/lob/preorder.test.ts \
            supabase/functions/market-autotrader/entry-admission.test.ts \
            supabase/functions/market-autotrader/core.test.ts
          deno check \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build exact v7.2.2 production artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v715_runtime_hotfix.py
          python3 scripts/fix_v716_patch_compat.py
          python3 scripts/apply_v716_target_balance_hotfix.py
          python3 scripts/fix_v717_patch_compat.py
          python3 scripts/apply_v717_final_exit_policy.py
          python3 scripts/apply_v718_pre180_exit_policy.py
          python3 scripts/apply_v719_post180_recovery_shadow.py
          python3 scripts/apply_v720_post180_minus2_hard_stop.py
          python3 scripts/apply_v722_lob_entry_risk_gates.py
          deno fmt \
            supabase/functions/market-autotrader/index.ts \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/_shared/lob/exit.ts
          deno check \
            supabase/functions/market-scanner/index.ts \
            supabase/functions/market-autotrader/index.ts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Deploy scanner and autotrader v7.2.2
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          for fn in market-scanner market-autotrader; do
            supabase functions deploy "$fn" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --no-verify-jwt \
              --use-api
          done

# deployment trigger: 2026-08-01 13:25 KST v7.1.7 final exit policy
# pull-request validation trigger: 2026-08-01 13:54 KST
# recovery redeploy: 2026-08-01T06:13Z
# v7.1.8: allow protected targets and qualified LOB reversals before 180 seconds
# v7.1.9: preserve positive-net exit and collect post-180 recovery shadow outcomes
# v7.2.0: tighten the post-180 executable-net hard stop from -3% to -2%
# v7.2.2: narrow spoof/support entry gates, 10s thin-book extension, dual pre-order recheck
