primary_region = "cdg"

# Dedicated Binance order gateway (Paris/cdg).
# The Upbit gateway (gateway/fly.toml, nrt) keeps SCHEDULER_ENABLED=true and remains the
# only scheduler. This machine is order-execution only for Binance, so SCHEDULER_ENABLED=false
# to avoid double-triggering the autotrader scan/monitor cycles.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SCHEDULER_ENABLED = "false"
  BINANCE_FUTURES_STREAM_READS = "true"
  # Actual venue ban observed 2026-10-04 00:41 UTC; retain it across this repair.
  BINANCE_FUTURES_REST_BLOCK_UNTIL_MS = "1791075179872"
  AUTO_SCAN_INTERVAL_SECONDS = "12"
  AUTO_MONITOR_INTERVAL_SECONDS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
